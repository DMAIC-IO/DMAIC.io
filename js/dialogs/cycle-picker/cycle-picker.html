<div class="cycle-picker__content" x-data="cyclePicker">
  <p x-text="t('pickerIntro')"></p>
  <fieldset class="cycle-picker">
    <template x-for="c in model.cycles" :key="c.id">
      <label class="cycle-picker__option">
        <input type="radio" name="cycle" :value="c.id" x-model="model.selected" @change="model.selectCycle(c.id)">
        <span class="cycle-picker__body">
          <span class="cycle-picker__name" x-text="c.name"></span>
          <span class="cycle-picker__short" x-text="c.short"></span>
          <span class="cycle-picker__desc" x-text="c.description"></span>
        </span>
      </label>
    </template>
  </fieldset>
  <div class="cycle-picker__scenarios" x-show="model.hasScenarios">
    <div class="cycle-picker__scenarios-title" x-text="scenarioLabel"></div>
    <template x-for="s in model.scenarioOptions" :key="s.id">
      <label class="cycle-picker__scenario">
        <input type="radio" name="scenario" :value="s.id" x-model="model.scenarioId">
        <span class="cycle-picker__scenario-title" x-text="s.title"></span>
        <span class="cycle-picker__scenario-desc" x-text="s.description"></span>
      </label>
    </template>
  </div>
</div>
