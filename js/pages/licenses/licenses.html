<div class="licenses-panel" x-data="licenses">
  <p class="licenses-panel__subtitle" x-text="t('subtitle')"></p>
  <table class="licenses-panel__table">
    <tbody>
      <template x-for="(lib, i) in libs" :key="lib.name + ':' + i">
        <tr class="licenses-panel__row">
          <td class="licenses-panel__name" x-text="lib.name"></td>
          <td class="licenses-panel__version" x-text="lib.versionLabel"></td>
          <td class="licenses-panel__license">
            <span class="licenses-panel__badge" x-text="lib.license"></span>
          </td>
          <td class="licenses-panel__link">
            <a :href="lib.url" target="_blank" rel="noopener noreferrer"
              x-text="t('view')"></a>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
  <p class="licenses-panel__full-text">
    <a href="THIRD-PARTY-LICENSES.txt" target="_blank" rel="noopener noreferrer"
      x-text="t('fullText')"></a>
  </p>
</div>
