<section class="dashboard-area__inner" x-data="dashboard">
  <header class="dashboard-area__header">
    <h2 class="dashboard-area__title">
      <span x-text="title()"></span>
      <span class="dashboard-area__project-name" data-ref="project-name" x-text="projectName()"></span>
    </h2>
    <div class="dashboard-area__toolbar">
      <button type="button" class="btn btn--sm btn--ghost" data-ref="export-png-btn" title="PNG">
        <span class="icon icon--sm" data-icon="format.png" aria-hidden="true"></span>
        PNG
      </button>
      <button type="button" class="btn btn--sm btn--ghost" data-ref="export-svg-btn" title="SVG">
        <span class="icon icon--sm" data-icon="format.svg" aria-hidden="true"></span>
        SVG
      </button>
      <button type="button" class="btn btn--sm" data-ref="add-btn" x-text="addLabel()"></button>
    </div>
  </header>
  <div class="dashboard-grid" data-ref="grid"></div>
</section>
