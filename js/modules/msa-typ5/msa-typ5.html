<div class="module-msa-typ5 dmike-split" x-data="msaTyp5">
  <div class="dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sections.feature')"></div>

    <fieldset class="field-radios field-radios--inline">
      <legend data-help-key="modules.msa-typ5.types.Params.type" x-text="t('labels.type')"></legend>
      <template x-for="o in typeOptions()" :key="o">
        <label>
          <input type="radio" name="msa5-type" :value="o"
                 :checked="model.params.type === o" @input="setParam('type', o)" @change="runAnalysis()">
          <span x-text="optionLabel('type', o)"></span>
        </label>
      </template>
    </fieldset>

    <fieldset class="field-radios field-radios--inline" :class="weightsHiddenClass()">
      <legend data-help-key="modules.msa-typ5.types.Params.weights" x-text="t('labels.weights')"></legend>
      <template x-for="o in weightsOptions()" :key="o">
        <label>
          <input type="radio" name="msa5-weights" :value="o"
                 :checked="model.params.weights === o" @input="setParam('weights', o)" @change="runAnalysis()">
          <span x-text="optionLabel('weights', o)"></span>
        </label>
      </template>
    </fieldset>

    <div class="dmike-split__section-title" x-text="t('sections.dataSource')"></div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ5.types.Params.layout" x-text="t('labels.layout')"></label>
      <select class="field" data-ref="sel-layout"
              :value="model.params.layout" @input="setParam('layout', $event.target.value)" @change="runAnalysis()">
        <template x-for="o in layoutOptions()" :key="o">
          <option :value="o" :selected="o === model.params.layout" x-text="optionLabel('layout', o)"></option>
        </template>
      </select>
    </div>
    <div class="field-group">
      <label data-help-key="modules.msa-typ5.actions.setColumn.help" x-text="t('labels.partColumn')"></label>
      <div data-ref="col-part-wrap"></div>
    </div>
    <div class="field-group" x-show="model.params.layout !== 'wide'">
      <label data-help-key="modules.msa-typ5.actions.setColumn.help" x-text="t('labels.appraiserColumn')"></label>
      <div data-ref="col-appraiser-wrap"></div>
    </div>
    <div class="field-group" x-show="model.params.layout !== 'wide'">
      <label data-help-key="modules.msa-typ5.actions.setColumn.help" x-text="t('labels.ratingColumn')"></label>
      <div data-ref="col-rating-wrap"></div>
    </div>
    <div class="field-group" x-show="model.params.layout === 'wide'">
      <label x-text="t('labels.ratingColumns')"></label>
      <div data-ref="col-ratings-wrap"></div>
      <div class="msa-typ5__levels-hint" x-text="t('wideHint')"></div>
    </div>
    <div class="field-group" x-show="model.params.layout === 'wide'">
      <label data-help-key="modules.msa-typ5.types.Params.trials" for="msa5-trials" x-text="t('labels.trials')"></label>
      <input id="msa5-trials" class="field" type="number" min="1" step="1" data-ref="inp-trials"
             :value="model.params.trials" @input="setParam('trials', $event.target.value)" @change="runAnalysis()">
    </div>
    <div class="field-group">
      <label data-help-key="modules.msa-typ5.actions.setColumn.help" x-text="t('labels.referenceColumn')"></label>
      <div data-ref="col-reference-wrap"></div>
    </div>
    <div class="field-group" x-show="model.params.layout !== 'wide'">
      <label data-help-key="modules.msa-typ5.actions.setColumn.help" x-text="t('labels.replicateColumn')"></label>
      <div data-ref="col-replicate-wrap"></div>
    </div>

    <div class="dmike-split__section-title" x-text="t('labels.detectedLevels')"></div>
    <div class="msa-typ5__levels" data-ref="levels-panel">
      <template x-if="!detectedLevels().length">
        <span class="msa-typ5__levels-hint">—</span>
      </template>
      <template x-if="model.params.type === 'binary' && detectedLevels().length">
        <span class="msa-typ5__level msa-typ5__level--pos" title="i.O.">i.O. = <span x-text="binaryPositive()"></span></span>
      </template>
      <template x-if="model.params.type === 'binary' && detectedLevels().length">
        <span class="msa-typ5__level msa-typ5__level--neg" title="n.i.O.">n.i.O. = <span x-text="binaryNegative()"></span></span>
      </template>
      <template x-if="model.params.type === 'binary' && detectedLevels().length">
        <button type="button" data-help-key="modules.msa-typ5.types.Params.positiveLevel" class="dmike-btn dmike-btn--secondary msa-typ5__swap"
                data-ref="btn-swap" @click="swapPositive()"
                x-text="t('labels.positiveSwap')"></button>
      </template>
      <template x-if="model.params.type !== 'binary' && detectedLevels().length">
        <template x-for="(lvl, i) in detectedLevels()" :key="lvl + ':' + i">
          <span class="msa-typ5__level" x-text="lvl"></span>
        </template>
      </template>
      <template x-if="model.params.type === 'binary' && detectedLevels().length">
        <div class="msa-typ5__levels-hint" data-ref="positive-hint" x-text="t('positiveHint')"></div>
      </template>
      <template x-if="model.params.type === 'ordinal' && detectedLevels().length">
        <div class="msa-typ5__levels-hint" x-text="t('ordinalHint')"></div>
      </template>
    </div>

    <div class="dmike-split__section-title" x-text="t('sections.evaluation')"></div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ5.types.Params.ruleSet" x-text="t('labels.ruleSet')"></label>
      <select class="field" data-ref="sel-ruleset"
              :value="model.params.ruleSet" @input="setParam('ruleSet', $event.target.value)" @change="runAnalysis()">
        <template x-for="o in ruleSetOptions()" :key="o">
          <option :value="o" :selected="o === model.params.ruleSet" x-text="optionLabel('ruleSet', o)"></option>
        </template>
      </select>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ5.types.Params.alpha" x-text="t('labels.alpha')"></label>
      <select class="field" data-ref="sel-alpha"
              :value="model.params.alpha" @input="setParam('alpha', $event.target.value)" @change="runAnalysis()">
        <template x-for="a in alphaOptions()" :key="a">
          <option :value="a" :selected="a === model.params.alpha" x-text="a"></option>
        </template>
      </select>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ5.types.Meta.referenceSource" x-text="t('labels.referenceSource')"></label>
      <output class="msa-typ5__ref-source" data-ref="ref-source" x-text="referenceSourceLabel()"></output>
    </div>
  </div>

  <main class="dmike-split__output" data-ref="output">
    <template x-if="!result || !result.verdict">
      <div class="module-msa-typ5__empty" x-text="emptyStateText()"></div>
    </template>

    <template x-if="result && result.verdict">
      <div>
        <!-- Verdikt-Header (generisches .dmike-infobox aus css/components.css;
             KEIN Punkt vorne per Design-Regel — Farbe alleine über Card-
             Border + Label-Schrift, siehe Kommentar in components.css).
             Der `.msa-typ5__interp`-Slot ist typ5-spezifisch (volle Zeile,
             flex-basis: 100 %) und trägt den narrativen Interpretationstext. -->
        <div class="dmike-infobox" :class="verdictClass(result.verdict.level)">
          <span data-help-key="modules.msa-typ5.types.Verdict.level" class="dmike-infobox__label" x-text="verdictLabel(result.verdict.level)"></span>
          <span class="dmike-infobox__detail" x-text="verdictSubline()"></span>
          <span class="msa-typ5__interp" x-text="interpretationText()"></span>
        </div>

        <!-- Warnungen -->
        <template x-for="(w, wi) in warningEntries()" :key="wi">
          <div class="msa-typ5__warn" x-text="w"></div>
        </template>

        <!-- KPI-Strip -->
        <div class="dmike-kpi-strip">
          <div class="dmike-kpi" :class="fleissKappaClass()">
            <div data-help-key="modules.msa-typ5.types.BetweenAppraisers.fleissKappa" class="dmike-kpi-label" x-text="t('kpi.fleissKappa')"></div>
            <div class="dmike-kpi-value" x-text="fmt(fleissKappa(), 3)"></div>
            <div class="dmike-kpi-sub" x-text="fleissMethod()"></div>
          </div>
          <div class="dmike-kpi">
            <div data-help-key="modules.msa-typ5.types.AppraiserStats.repeatability" class="dmike-kpi-label" x-text="t('kpi.repeatability')"></div>
            <div class="dmike-kpi-value" x-text="fmtPct(meanRepeatability())"></div>
          </div>
          <div class="dmike-kpi">
            <div data-help-key="modules.msa-typ5.types.VsReference.effectiveness" class="dmike-kpi-label" x-text="t('kpi.effectiveness')"></div>
            <div class="dmike-kpi-value" x-text="fmtPct(meanEffectiveness())"></div>
          </div>
          <div class="dmike-kpi">
            <div :data-help-key="kappaVsRefHelp()" class="dmike-kpi-label" x-text="t('kpi.kappaVsRef')"></div>
            <div class="dmike-kpi-value" x-text="fmt(meanKappaVsRef(), 3)"></div>
          </div>
          <div class="dmike-kpi">
            <div data-help-key="modules.msa-typ5.types.Overall.betweenAppraisers" class="dmike-kpi-label" x-text="t('kpi.overallBetween')"></div>
            <div class="dmike-kpi-value" x-text="overallBetweenRate()"></div>
            <div class="dmike-kpi-sub" x-text="overallBetweenSub()"></div>
          </div>
          <template x-if="hasOverallVsRef()">
            <div class="dmike-kpi">
              <div data-help-key="modules.msa-typ5.types.Overall.allVsReference" class="dmike-kpi-label" x-text="t('kpi.overallVsRef')"></div>
              <div class="dmike-kpi-value" x-text="overallVsRefRate()"></div>
              <div class="dmike-kpi-sub" x-text="overallVsRefSub()"></div>
            </div>
          </template>
        </div>

        <!-- Urteilskriterien: eine Zeile je Kriterium der gewählten Regel;
             die ausschlaggebende Zeile ist hervorgehoben. -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('criteria.title')"></span></div>
        <table class="dmike-table msa-typ5__criteria" data-ref="verdict-criteria">
          <thead><tr>
            <th><span data-help-key="modules.msa-typ5.types.Criterion.id" x-text="t('criteria.criterion')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.Criterion.value" x-text="t('criteria.value')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.Criterion.appraiser" x-text="t('criteria.appraiser')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.Limits.good" x-text="t('criteria.limitGood')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.Limits.marginal" x-text="t('criteria.limitMarginal')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.Criterion.level" x-text="t('criteria.status')"></span></th>
          </tr></thead>
          <tbody>
            <template x-for="row in criteriaRows()" :key="row.key">
              <tr :class="row.rowClass">
                <td x-text="row.label"></td>
                <td x-text="row.value"></td>
                <td x-text="row.appraiser"></td>
                <td x-text="row.good"></td>
                <td x-text="row.marginal"></td>
                <td><span class="msa-typ5__ampel" :class="row.ampelClass"></span> <span x-text="row.status"></span></td>
              </tr>
            </template>
          </tbody>
        </table>
        <template x-if="hasReferenceNote()">
          <div class="msa-typ5__hint" data-ref="verdict-note" x-text="referenceNoteText()"></div>
        </template>

        <!-- Prüfer-Tabelle -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('table.appraiser')"></span></div>
        <table class="dmike-table msa-typ5__table">
          <thead><tr>
            <th><span data-help-key="modules.msa-typ5.types.Result.perAppraiser" x-text="t('table.appraiser')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.AppraiserStats.repeatability" x-text="t('table.repeatability')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.VsReference.effectiveness" x-text="t('table.effectiveness')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.VsReference.missRate" x-text="t('table.missRate')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.VsReference.falseAlarmRate" x-text="t('table.falseAlarmRate')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.VsReference.biasRate" x-text="t('table.biasRate')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.AppraiserStats.withinKappa" x-text="t('table.withinKappa')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.FleissKappa.p" x-text="t('table.p')"></span></th>
          </tr></thead>
          <tbody>
            <template x-for="row in perAppraiserRows()" :key="row.id">
              <tr>
                <td x-text="row.id"></td>
                <td x-text="row.repeatability"></td>
                <td x-text="row.effectiveness"></td>
                <td x-text="row.missRate"></td>
                <td x-text="row.falseAlarmRate"></td>
                <td x-text="row.biasRate"></td>
                <td x-text="row.within"></td>
                <td data-col="p" x-text="row.withinP"></td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- Prüferpaar-Tabelle -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="pairTableTitle()"></span></div>
        <table class="dmike-table msa-typ5__table">
          <thead><tr>
            <th><span data-help-key="modules.msa-typ5.types.BetweenAppraisers.pairwiseCohenKappa" x-text="t('table.pair')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PairKappa.kappa" x-text="t('table.cohenKappa')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PairKappa.ci95" x-text="t('table.ci95')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PairKappa.z" x-text="t('table.z')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PairKappa.p" x-text="t('table.p')"></span></th>
            <th x-text="t('table.verdict')"></th>
          </tr></thead>
          <tbody>
            <template x-for="(row, i) in pairRows()" :key="row.pair + ':' + i">
              <tr>
                <td x-text="row.pairLabel"></td>
                <td x-text="row.kappa"></td>
                <td x-text="row.ci95"></td>
                <td data-col="z" x-text="row.z"></td>
                <td data-col="p" x-text="row.p"></td>
                <td><span class="msa-typ5__ampel" :class="row.ampelClass"></span></td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- κ vs. Referenz (nur wenn Referenz vorhanden) -->
        <template x-if="vsRefRows().length">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('table.vsReference')"></span></div>
            <table class="dmike-table msa-typ5__table">
              <thead><tr>
                <th><span data-help-key="modules.msa-typ5.types.AppraiserStats.vsReference" x-text="t('table.appraiser')"></span></th>
                <th><span :data-help-key="kappaVsRefHelp()" x-text="vsRefKappaHeader()"></span></th>
                <th><span :data-help-key="vsRefHelp('ci95')" x-text="t('table.ci95')"></span></th>
                <th><span :data-help-key="vsRefHelp('z')" x-text="t('table.z')"></span></th>
                <th><span :data-help-key="vsRefHelp('p')" x-text="t('table.p')"></span></th>
                <th x-text="t('table.verdict')"></th>
              </tr></thead>
              <tbody>
                <template x-for="row in vsRefRows()" :key="row.id">
                  <tr>
                    <td x-text="row.id"></td>
                    <td x-text="row.kappa"></td>
                    <td x-text="row.ci95"></td>
                    <td data-col="z" x-text="row.z"></td>
                    <td data-col="p" x-text="row.p"></td>
                    <td><span class="msa-typ5__ampel" :class="row.ampelClass"></span></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>


        <!-- Fehlerdetails, Teile-Sicht: welche Teile sind strittig.
             Die Engine liefert `perPart` bereits nach Problemgrad sortiert. -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('table.perPart')"></span></div>
        <label data-help-anchor="box" data-help-key="modules.msa-typ5.types.PartRow.isDisputed" class="msa-typ5__filter">
          <input type="checkbox" x-model="onlyDisputed">
          <span x-text="t('table.onlyDisputed')"></span>
        </label>
        <template x-if="!hasDisputedParts()">
          <div class="msa-typ5__hint" x-text="t('table.noDisputes')"></div>
        </template>
        <table class="dmike-table msa-typ5__table msa-typ5__table--per-part">
          <thead><tr>
            <th><span data-help-key="modules.msa-typ5.types.PartRow.part" x-text="t('table.part')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PartRow.reference" x-text="t('table.reference')"></span></th>
            <template x-for="(a, i) in partAppraisers()" :key="a + ':' + i">
              <th x-text="a"></th>
            </template>
            <th><span data-help-key="modules.msa-typ5.types.PartRow.vsRefErrors" x-text="t('table.vsRefErrors')"></span></th>
            <th><span data-help-key="modules.msa-typ5.types.PartRow.mixedAppraisers" x-text="t('table.mixedAppraisers')"></span></th>
          </tr></thead>
          <tbody>
            <template x-for="(row, j) in perPartRows()" :key="row.part + ':' + j">
              <tr :class="row.rowClass">
                <td x-text="row.part"></td>
                <td x-text="row.reference"></td>
                <template x-for="(c, i) in row.ratings" :key="c.appraiser + ':' + i">
                  <td :class="c.cellClass" x-text="c.text"></td>
                </template>
                <td x-text="row.vsRefErrors"></td>
                <td x-text="row.mixedAppraisers"></td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- Fehlerdetails, Prüfer-Sicht: wer irrt in welche Richtung.
             Eine Zeile je Verwechslungsart, plus „gemischt" für in sich
             uneinheitliche Wiederholungen. -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('table.disagreement')"></span></div>
        <template x-if="!disagreementRows().length">
          <div class="msa-typ5__hint" x-text="t('table.noDisagreement')"></div>
        </template>
        <template x-if="disagreementRows().length">
          <table class="dmike-table msa-typ5__table msa-typ5__table--disagreement">
            <thead><tr>
              <th><span data-help-key="modules.msa-typ5.types.Result.disagreement" x-text="t('table.appraiser')"></span></th>
              <th><span data-help-key="modules.msa-typ5.types.Disagreement.confusionPairs" x-text="t('table.kind')"></span></th>
              <th><span data-help-key="modules.msa-typ5.types.ConfusionPair.count" x-text="t('table.count')"></span></th>
              <th><span data-help-key="modules.msa-typ5.types.ConfusionPair.parts" x-text="t('table.parts')"></span></th>
            </tr></thead>
            <tbody>
              <template x-for="row in disagreementRows()" :key="row.key">
                <tr :class="row.rowClass">
                  <td x-text="row.appraiser"></td>
                  <td x-text="row.kind"></td>
                  <td x-text="row.count"></td>
                  <td x-text="row.parts"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>

        <!-- κ-Bar Chart -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.kappaBar')"></span></div>
        <div class="msa-typ5__chart" data-ref="chart-kappa-bar"></div>

        <!-- Effektivitäts-Bar -->
        <template x-if="hasEffectivenessChart()">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.effectivenessBar')"></span></div>
            <div class="msa-typ5__chart" data-ref="chart-eff-bar"></div>
          </div>
        </template>

        <!-- SDT-Scatter (nur binär mit Referenz) -->
        <template x-if="hasSdtChart()">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.sdtScatter')"></span></div>
            <div class="msa-typ5__chart" data-ref="chart-sdt"></div>
          </div>
        </template>

        <!-- Messverlaufsdiagramm — nur bei numerisch kodierten Bewertungen
             sinnvoll; bei nominalen Klassen wäre die Y-Achse irreführend.
             Zeilen-Hosts werden imperativ erzeugt (Anzahl datenabhängig). -->
        <template x-if="hasGageRunChart()">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.gageRun')"></span></div>
            <div class="msa-typ5__gage-run" data-ref="chart-gage-run"></div>
          </div>
        </template>

        <!-- Confusion-Heatmap-Grid (Zellen + Charts imperativ befüllt) -->
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.confusion')"></span></div>
        <div class="msa-typ5__heatmap-grid" data-ref="chart-heatmaps"></div>
      </div>
    </template>
  </main>
</div>
