<template x-if="empty">
  <p class="dashboard-area__empty" x-text="empty"></p>
</template>
<template x-if="!empty">
  <div class="dashboard-kano">
    <div class="dashboard-fmea__bar">
      <template x-for="seg in segments">
        <div class="dashboard-fmea__bar-seg" :data-cat="seg.key" :style="seg.style" :title="seg.title"></div>
      </template>
    </div>
    <div class="dashboard-fmea__legend">
      <template x-for="l in legend">
        <span class="dashboard-fmea__legend-item" :data-cat="l.key"><span class="dashboard-fmea__legend-dot" :style="l.dot"></span><span x-text="l.text"></span></span>
      </template>
    </div>
    <div class="dashboard-kano__totals">
      <template x-for="s in totals">
        <div class="dashboard-spc__stat">
          <span class="dashboard-spc__stat-label" :title="s.label" x-text="s.label"></span>
          <span class="dashboard-spc__stat-value" x-text="s.value"></span>
        </div>
      </template>
    </div>
    <template x-if="warn">
      <p class="dashboard-kano__warn" x-text="warn"></p>
    </template>
    <template x-if="chart">
      <div class="dashboard-area__plot dashboard-kano__plot" x-widget="scatter-chart" x-widget-config="chart"></div>
    </template>
  </div>
</template>
