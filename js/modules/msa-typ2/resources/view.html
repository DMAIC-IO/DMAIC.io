<div class="module-msa-typ2 dmike-split dmike-split--input-lg" x-data="msaTyp2">
  <!-- data-help-key="" an Spalten-Hosts und Auswahlfeldern ist gewollt: die Hilfe hängt an der Beschriftung daneben, der automatische Schlüssel ergäbe doppelte Fragezeichen. -->
  <div class="dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionColumns')"></div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ2.fields.part.help" x-text="t('partColumn')"></label>
      <div data-ref="col-part-wrap" data-help-key="" x-field="model.part"></div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ2.fields.operator.help" x-text="t('operatorColumn')"></label>
      <div data-ref="col-operator-wrap" data-help-key="" x-field="model.operator"></div>
      <div class="field-hint" x-text="t('operatorHint')"></div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ2.fields.measurement.help" x-text="t('measurementColumn')"></label>
      <div data-ref="col-measurement-wrap" data-help-key="" x-field="model.measurement"></div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionParams')"></div>

    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.msa-typ2.fields.lsl.help" x-text="t('lsl')"></label>
        <input class="field field--num" data-ref="inp-lsl" data-help-key=""
               placeholder="24.900" x-field="model.lsl">
      </div>
      <div class="field-group">
        <label data-help-key="modules.msa-typ2.fields.usl.help" x-text="t('usl')"></label>
        <input class="field field--num" data-ref="inp-usl" data-help-key=""
               placeholder="25.100" x-field="model.usl">
      </div>
    </div>
    <span class="msa-typ2__field-error msa-typ2__field-error--grid" data-ref="limits-error" x-text="fieldError('model.lsl') || fieldError('model.usl')"></span>

    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.msa-typ2.fields.alpha.help" x-text="t('alphaLabel')"></label>
        <input class="field field--num" data-ref="inp-alpha" data-help-key=""
               step="0.001" x-field="model.alpha">
        <span class="msa-typ2__field-error" data-ref="alpha-error" x-text="fieldError('model.alpha')"></span>
      </div>
      <div class="field-group">
        <label data-help-key="modules.msa-typ2.fields.k.help" x-text="t('kLabel')"></label>
        <select class="field" data-ref="inp-k" data-help-key="" x-field="model.k">
          <option value="6" x-text="kOption6"></option>
          <option value="5.15" x-text="kOption515"></option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ2.fields.verdictBasis.help" x-text="t('verdictBasisLabel')"></label>
      <select class="field" data-ref="inp-verdict-basis" data-help-key="" x-field="model.verdictBasis">
        <option value="auto" x-text="t('verdictBasisAuto')"></option>
        <option value="tolerance" x-text="t('verdictBasisTolerance')"></option>
        <option value="studyVar" x-text="t('verdictBasisStudyVar')"></option>
      </select>
    </div>
    <div class="field-group">
      <label data-help-key="modules.msa-typ2.fields.sigmaHist.help" x-text="t('sigmaHistLabel')"></label>
      <input class="field field--num" data-ref="inp-sigma-hist" data-help-key=""
             x-field="model.sigmaHist">
      <span class="msa-typ2__field-error" data-ref="sigma-hist-error" x-text="fieldError('model.sigmaHist')"></span>
    </div>

    <div class="field-error" data-ref="error-box" x-text="analysisMessage"></div>
  </div>

  <div class="dmike-split__output">
    <div data-ref="results">
      <template x-if="result">
        <div>
          <template x-for="(w, i) in warnings" :key="w + ':' + i">
            <div class="msa-typ2__warning" :data-warning="w" x-text="t(w)"></div>
          </template>

          <div class="dmike-infobox" :class="statusClass">
            <span class="msa-typ2__type-badge" :data-mode="result.mode" x-text="typeLabel"></span>
            <span class="dmike-infobox__label" data-help-key="modules.msa-typ2.types.Result.grrStatus" x-text="statusLabel"></span>
            <span class="dmike-infobox__detail" x-text="statusDetail"></span>
          </div>

          <div class="dmike-kpi-strip">
            <div class="dmike-kpi" :class="grrKpiClass('studyVar')">
              <div class="dmike-kpi-label" data-help-key="modules.msa-typ2.types.VarComp.grr">%GRR (<span x-text="t('studyVar')"></span>)
                <span x-widget="algo-lab-link" x-widget-algo-id="'grr'"></span>
              </div>
              <div class="dmike-kpi-value"><span x-text="grrStudyVarText"></span> %</div>
              <div class="dmike-kpi-sub" x-text="grrKpiSub('studyVar')"></div>
            </div>
            <template x-if="varCompHasTol">
              <div class="dmike-kpi" :class="grrKpiClass('tolerance')">
                <div class="dmike-kpi-label" data-help-key="modules.msa-typ2.types.VarCompEntry.pctTolerance">%GRR (<span x-text="t('tolerance')"></span>)</div>
                <div class="dmike-kpi-value"><span x-text="grrToleranceText"></span> %</div>
                <div class="dmike-kpi-sub" x-text="grrKpiSub('tolerance')"></div>
              </div>
            </template>
            <div class="dmike-kpi" :class="ndcClass">
              <div class="dmike-kpi-label" data-help-key="modules.msa-typ2.types.Result.ndc">ndc</div>
              <div class="dmike-kpi-value" x-text="result.ndc"></div>
              <div class="dmike-kpi-sub" x-text="ndcSub"></div>
            </div>
            <div class="dmike-kpi">
              <div class="dmike-kpi-label" data-help-key="modules.msa-typ2.types.VarComp.repeatability">%EV (<span x-text="t('repeatability')"></span>)</div>
              <div class="dmike-kpi-value"><span x-text="evText"></span> %</div>
              <div class="dmike-kpi-sub" x-text="t('ofStudyVar')"></div>
            </div>
            <template x-if="isTyp2">
              <div class="dmike-kpi">
                <div class="dmike-kpi-label" data-help-key="modules.msa-typ2.types.VarComp.reproducibility">%AV (<span x-text="t('reproducibility')"></span>)</div>
                <div class="dmike-kpi-value"><span x-text="avText"></span> %</div>
                <div class="dmike-kpi-sub" x-text="t('ofStudyVar')"></div>
              </div>
            </template>
          </div>

          <!-- ANOVA table -->
          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('anovaTitle')"></span></div>
          <div class="msa-typ2__stats-panel">
            <table class="dmike-table msa-typ2__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.msa-typ2.types.Result.anova" x-text="t('anovaSource')"></span></th>
                <th><span data-help-key="modules.msa-typ2.types.AnovaRow.ss">SS</span></th><th><span data-help-key="modules.msa-typ2.types.AnovaRow.df">df</span></th><th><span data-help-key="modules.msa-typ2.types.AnovaRow.ms">MS</span></th><th><span data-help-key="modules.msa-typ2.types.AnovaRow.f">F</span></th><th><span class="context-help-anchor--overlay" data-help-key="modules.msa-typ2.types.AnovaRow.pValue">p</span></th>
              </tr></thead>
              <tbody>
                <template x-for="row in anovaRows" :key="row.key">
                  <tr :class="row.totalClass">
                    <td x-text="row.label"></td>
                    <td x-text="row.ss"></td>
                    <td x-text="row.df"></td>
                    <td x-text="row.ms"></td>
                    <td x-text="row.f"></td>
                    <td x-text="row.p"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Variance components table -->
          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('varCompTitle')"></span></div>
          <div class="msa-typ2__stats-panel">
            <table class="dmike-table msa-typ2__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.msa-typ2.types.Result.varComp" x-text="t('anovaSource')"></span></th>
                <th><span data-help-key="modules.msa-typ2.types.VarCompEntry.variance">σ²</span></th><th><span data-help-key="modules.msa-typ2.types.VarCompEntry.sigma">σ</span></th>
                <th><span data-help-key="modules.msa-typ2.types.VarCompEntry.studyVar" x-text="t('studyVarK')"></span></th>
                <th><span data-help-key="modules.msa-typ2.types.VarCompEntry.pctContribution">%<span x-text="t('contribution')"></span></span></th>
                <th><span data-help-key="modules.msa-typ2.types.VarCompEntry.pctStudyVar">%<span x-text="t('studyVar')"></span></span></th>
                <template x-if="varCompHasTol">
                  <th><span class="context-help-anchor--overlay" data-help-key="modules.msa-typ2.types.VarCompEntry.pctTolerance">%<span x-text="t('tolerance')"></span></span></th>
                </template>
                <template x-if="hasProcess">
                  <th><span class="context-help-anchor--overlay" data-help-key="modules.msa-typ2.types.VarCompEntry.pctProcess">%<span x-text="t('process')"></span></span></th>
                </template>
              </tr></thead>
              <tbody>
                <template x-for="row in varCompRows" :key="row.key">
                  <tr :class="row.totalClass">
                    <td x-text="row.label"></td>
                    <td x-text="row.variance"></td>
                    <td x-text="row.sigma"></td>
                    <td x-text="row.studyVar"></td>
                    <td x-text="row.pctContribution"></td>
                    <td x-text="row.pctStudyVar"></td>
                    <template x-if="varCompHasTol">
                      <td x-text="row.pctTolerance"></td>
                    </template>
                    <template x-if="hasProcess">
                      <td x-text="row.pctProcess"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="msa-typ2__var-note">ndc = <span x-text="result.ndc"></span></div>
          </div>

          <!-- Charts -->
          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartComponentsTitle')"></span></div>
          <div class="msa-typ2__chart-plot" data-ref="chart-components"
               x-widget="bar-chart" x-widget-config="componentsChart"
               x-widget-value="model.componentsEdits" x-widget-legacy-edit-key="'components'"></div>

          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartByPartTitle')"></span></div>
          <div class="msa-typ2__chart-plot" data-ref="chart-by-part"
               x-widget="scatter-chart" x-widget-config="byPartChart"
               x-widget-value="model.byPartEdits" x-widget-legacy-edit-key="'by-part'"></div>

          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartGageRunTitle')"></span></div>
          <div class="msa-typ2__gage-run" data-ref="chart-gage-run">
            <template x-for="(strip, i) in runStrips" :key="strip.key">
              <div class="msa-typ2__gage-run-row" :data-strip="i"
                   x-widget="gage-run-chart"
                   x-widget-config="strip.config"
                   x-widget-value="model.runStripEdits[i]"
                   x-widget-legacy-edit-key="strip.legacyEditKey"></div>
            </template>
          </div>

          <template x-if="isTyp2">
            <div>
              <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartByOperatorTitle')"></span></div>
              <div class="msa-typ2__chart-plot" data-ref="chart-by-operator"
                   x-widget="boxplot-chart" x-widget-config="byOperatorChart"
                   x-widget-value="model.byOperatorEdits" x-widget-legacy-edit-key="'by-operator'"></div>

              <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartInteractionTitle')"></span></div>
              <div class="msa-typ2__chart-plot" data-ref="chart-interaction"
                   x-widget="scatter-chart" x-widget-config="interactionChart"
                   x-widget-value="model.interactionEdits" x-widget-legacy-edit-key="'interaction'"></div>
            </div>
          </template>

          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartXbarTitle')"></span></div>
          <div class="msa-typ2__chart-plot" data-ref="chart-xbar"
               x-widget="scatter-chart" x-widget-config="xbarChart"
               x-widget-value="model.xbarEdits" x-widget-legacy-edit-key="'xbar'"></div>

          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('chartRTitle')"></span></div>
          <div class="msa-typ2__chart-plot" data-ref="chart-r"
               x-widget="scatter-chart" x-widget-config="rChart"
               x-widget-value="model.rEdits" x-widget-legacy-edit-key="'r'"></div>

          <!-- Interpretation -->
          <div class="dmike-split__output-section msa-typ2__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('interpretTitle')"></span></div>
          <div class="msa-typ2__interpretation">
            <p><span class="msa-typ2__tag msa-typ2__tag--pass">%GRR &lt; 10 %</span> <span x-text="t('interpPass')"></span></p>
            <p><span class="msa-typ2__tag msa-typ2__tag--warn">10 % ≤ %GRR &lt; 30 %</span> <span x-text="t('interpWarn')"></span></p>
            <p><span class="msa-typ2__tag msa-typ2__tag--fail">%GRR ≥ 30 %</span> <span x-text="t('interpFail')"></span></p>
            <p><span class="msa-typ2__tag msa-typ2__tag--pass">ndc ≥ 5</span> <span x-text="t('interpNdcPass')"></span></p>
            <p><span class="msa-typ2__tag msa-typ2__tag--fail">ndc &lt; 5</span> <span x-text="t('interpNdcFail')"></span></p>
            <template x-if="result.interactionPooled">
              <p class="msa-typ2__note" x-text="t('interactionPooledNote')"></p>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
