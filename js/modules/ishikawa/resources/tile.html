<div class="ishikawa-tile">
<template x-if="empty">
  <p class="dashboard-area__empty" x-text="t('tileEmpty')"></p>
</template>
<template x-if="problem">
  <div class="dashboard-charter__problem" style="margin-bottom:8px;font-size:var(--font-size-sm);opacity:0.8" x-text="problem"></div>
</template>
<template x-if="!empty">
  <div class="dashboard-fmea__summary">
    <template x-for="s in summary">
      <span><span x-text="s.label"></span><strong x-text="s.value"></strong></span>
    </template>
  </div>
</template>
<template x-if="segments.length">
  <div class="dashboard-fmea__bar">
    <template x-for="seg in segments">
      <div class="dashboard-fmea__bar-seg" :style="seg.style" :title="seg.title"></div>
    </template>
  </div>
</template>
<template x-if="legend">
  <div class="dashboard-fmea__legend">
    <template x-for="l in legend">
      <span class="dashboard-fmea__legend-item"><span class="dashboard-fmea__legend-dot" :style="l.dot"></span><span x-text="l.text"></span></span>
    </template>
  </div>
</template>
<template x-if="statusLegend">
  <div class="dashboard-fmea__legend" style="margin-top:4px">
    <template x-for="l in statusLegend">
      <span class="dashboard-fmea__legend-item"><span class="dashboard-fmea__legend-dot" :style="l.dot"></span><span x-text="l.text"></span></span>
    </template>
  </div>
</template>
<template x-if="topLabel">
  <div class="dashboard-fmea__top-label" x-text="topLabel"></div>
</template>
<template x-if="topLabel">
  <ol class="dashboard-fmea__top-list">
    <template x-for="t in top">
      <li class="dashboard-fmea__top-item">
        <span class="dashboard-fmea__top-desc" x-text="t.name"></span>
        <span class="dashboard-fmea__top-rpn" :style="t.style" x-text="t.score"></span>
      </li>
    </template>
  </ol>
</template>
</div>
