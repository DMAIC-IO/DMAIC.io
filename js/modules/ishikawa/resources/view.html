<section class="module-container ishikawa" x-data="ishikawa">
  <div class="module-container__body">
    <div class="dmike-tabs" role="tablist" x-tablist x-set="state.tab">
      <button class="dmike-tab" type="button" role="tab" value="problem" data-tab="problem" :class="tabClass('problem')" x-text="t('tabProblem')"></button>
      <button class="dmike-tab" type="button" role="tab" value="facts" data-tab="facts" :class="tabClass('facts')" x-text="t('tabFacts')"></button>
      <button class="dmike-tab" type="button" role="tab" value="hypotheses" data-tab="hypotheses" :class="tabClass('hypotheses')" x-text="t('tabHypotheses')"></button>
      <button class="dmike-tab" type="button" role="tab" value="experiments" data-tab="experiments" :class="tabClass('experiments')" x-text="t('tabExperiments')"></button>
    </div>

    <!-- ─── PROBLEM TAB ─────────────────────────────────────── -->
    <template x-if="state.tab === 'problem'">
    <div class="ishikawa__problem-tab">
      <div class="ishikawa__problem-statement">
        <label data-help-key="modules.ishikawa.fields.problem.help" class="ishikawa__panel-label" x-text="t('problemStatement')"></label>
        <textarea class="ishikawa__problem-textarea" data-ref="problemInput"
                  rows="3" :placeholder="t('problemPlaceholder')" x-model="model.problem"></textarea>
      </div>

      <template x-for="scope in scopes" :key="scope">
        <div class="ishikawa__img-gallery" :class="'ishikawa__img-gallery--' + galleryModifier(scope)"
             x-file-drop="addImages" data-file-drop-multiple data-file-drop-accept="image/*" :data-arg-scope="scope" :data-img-gallery="scope">
          <div class="ishikawa__img-gallery-header">
            <div>
              <label data-help-key="modules.ishikawa.fields.images.help" class="ishikawa__panel-label" x-text="galleryLabel(scope)"></label>
              <p class="ishikawa__img-hint" x-text="galleryHint(scope)"></p>
            </div>
            <button type="button" class="btn btn--sm btn--primary ishikawa__img-upload-btn" data-file-drop-open :data-img-upload="scope" x-text="'+ ' + t('uploadImages')"></button>
          </div>
          <div class="ishikawa__img-grid">
            <template x-if="galleryEmpty(scope)">
              <div class="ishikawa__img-empty" x-text="t('noImages')"></div>
            </template>
            <template x-for="img in model.images[scope]" :key="img.id">
              <figure class="ishikawa__img-card" :data-img-id="img.id" :data-img-kind="scope">
                <button class="ishikawa__img-thumb" type="button" :data-img-open="img.id" :data-img-kind="scope"
                        :aria-label="t('openImage')" @click="openLightbox(scope, img.id)">
                  <img :src="img.dataUrl" :alt="img.caption" />
                </button>
                <input type="text" class="ishikawa__img-caption" :placeholder="t('captionPlaceholder')"
                       :data-img-caption="img.id" :data-img-kind="scope" x-model="img.caption" />
                <div class="ishikawa__img-meta">
                  <span class="ishikawa__img-size" x-text="imageSize(img)"></span>
                  <button class="ishikawa__img-del" type="button" :data-img-del="img.id" :data-img-kind="scope" data-help-key=""
                          :title="t('common.delete')" x-command="removeImage" :data-arg-scope="scope" :data-arg-id="img.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </div>
              </figure>
            </template>
          </div>
        </div>
      </template>
    </div>
    </template>

    <!-- ─── FACTS TAB ───────────────────────────────────────── -->
    <template x-if="state.tab === 'facts'">
    <div class="ishikawa__experiments">
      <div class="ishikawa__toolbar" style="margin-bottom:var(--spacing-sm)">
        <button type="button" data-help-key="modules.ishikawa.actions.addFact.help" class="btn btn--sm btn--primary" data-ref="addFactBtn" x-command="addFact" x-text="'+ ' + t('fact')"></button>
        <div class="ishikawa__toolbar-spacer"></div>
      </div>
      <template x-if="model.facts.length === 0">
        <div class="ishikawa__exp-empty" x-text="t('noFacts')"></div>
      </template>
      <template x-if="model.facts.length > 0">
        <div class="dmike-table-wrap">
          <datalist id="ishikawa-fact-owner-list">
            <template x-for="n in ownerNames" :key="n"><option :value="n"></option></template>
          </datalist>
          <table class="dmike-table dmike-table--sticky dmike-table--head-mono dmike-table--draggable ishikawa__table ishikawa__exp-table">
            <thead>
              <tr>
                <th class="dmike-table__grip-col"></th>
                <th class="ishikawa__col-nr">#</th>
                <th class="ishikawa__col-fact-name"><span data-help-key="modules.ishikawa.fields.facts.name.help" x-text="t('factName')"></span></th>
                <th class="ishikawa__col-desc"><span data-help-key="modules.ishikawa.fields.facts.description.help" x-text="t('factDescription')"></span></th>
                <th class="ishikawa__col-date"><span data-help-key="modules.ishikawa.fields.facts.date.help" x-text="t('factDate')"></span></th>
                <th class="ishikawa__col-resp"><span data-help-key="modules.ishikawa.fields.facts.owner.help" x-text="t('factOwner')"></span></th>
                <th class="ishikawa__col-actions"></th>
              </tr>
            </thead>
            <tbody data-reorder-group="facts" data-reorder-closed :data-reorder-group-label="t('tabFacts')">
              <template x-for="(f, idx) in model.facts" :key="f.id">
                <tr :data-fid="f.id" :data-id="f.id" :data-reorder-index="idx" :class="previewClass('facts', f.id)">
                  <td class="dmike-table__grip-col">
                    <button class="dmike-table__grip ishikawa__grip--fact" type="button" :data-grip="f.id"
                            :aria-label="t('common.reorder')"></button>
                  </td>
                  <td class="ishikawa__col-nr"><span class="ishikawa__nr-text" x-text="idx + 1"></span></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-title-input" type="text" :placeholder="t('factNamePlaceholder')" :data-fact-name="f.id" x-model="f.name" /></td>
                  <td><textarea class="field field--sm field--ghost ishikawa__exp-desc-input" rows="1" :placeholder="t('factDescPlaceholder')" :data-fact-desc="f.id" x-model="f.description"></textarea></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-date-input" :data-fact-date="f.id" data-help-key="" x-field="f.date" /></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-resp-input" type="text" :placeholder="t('factOwnerPlaceholder')" list="ishikawa-fact-owner-list" :data-fact-owner="f.id" x-model="f.owner" /></td>
                  <td><div class="ishikawa__row-actions">
                    <button type="button" class="btn btn--icon-sm btn--danger" :title="t('common.delete')" :data-fact-del="f.id" data-help-key=""
                            x-command="removeFact" :data-arg-fact-id="f.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                  </div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
    </template>

    <!-- ─── HYPOTHESES TAB ──────────────────────────────────── -->
    <template x-if="state.tab === 'hypotheses'">
    <div>
      <!-- Experts -->
      <div class="ishikawa__experts-row">
        <div class="ishikawa__expert-panel">
          <div class="ishikawa__expert-header">
            <label data-help-key="modules.ishikawa.fields.experts.help" class="ishikawa__panel-label" style="margin:0" x-text="t('expertTeam')"></label>
            <form class="ishikawa__expert-add-form" x-command-form="addExpert" data-help-key="">
              <input type="text" class="field field--inline ishikawa__expert-name-input" data-ref="expertNameInput" data-help-key=""
                     :placeholder="t('expertPlaceholder')" x-param="name" />
              <button type="submit" data-help-key="modules.ishikawa.actions.addExpert.help" class="btn btn--sm btn--primary" data-ref="addExpertBtn" x-text="'+ ' + t('addExpert')"></button>
            </form>
          </div>
          <div class="ishikawa__expert-tags">
            <template x-if="model.experts.length === 0">
              <span class="ishikawa__no-items" x-text="t('noExperts')"></span>
            </template>
            <template x-for="e in model.experts" :key="e.id">
              <span class="ishikawa__expert-tag">
                <span class="ishikawa__expert-ini" :data-expert-ini-for="e.id" :style="'background:' + e.color" x-text="ini(e.name)"></span>
                <input type="text" class="ishikawa__expert-name-edit" :data-expert-name-id="e.id"
                       :value="e.name" spellcheck="false"
                       @keydown="expertEditKey(e.id, $event)" @blur="commitExpertRename(e.id, $event)" />
                <button type="button" class="ishikawa__expert-rm" :data-expert-id="e.id" :title="t('common.remove')" data-help-key=""
                        data-confirm-delete x-command="removeExpert" :data-arg-expert-id="e.id"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
              </span>
            </template>
          </div>
        </div>
      </div>

      <!-- Diff banner -->
      <div class="ishikawa__diff-banner" :class="diffBannerClass" data-ref="diffBanner">
        <template x-if="diff">
          <div style="display:contents">
            <div class="ishikawa__diff-title" x-text="t('compareWith')"></div>
            <div class="ishikawa__diff-stats">
              <span class="ishikawa__diff-stat"><span class="ishikawa__diff-val ishikawa__diff-val--new" x-text="diffNewText"></span></span>
              <span class="ishikawa__diff-stat"><span class="ishikawa__diff-val ishikawa__diff-val--del" x-text="diffRemovedText"></span></span>
              <span class="ishikawa__diff-stat"><span class="ishikawa__diff-val ishikawa__diff-val--chg" x-text="diffChangedText"></span></span>
              <span class="ishikawa__diff-stat ishikawa__diff-label" style="color:var(--color-text-tertiary)" x-text="compareLabel"></span>
            </div>
            <button type="button" data-help-key="modules.ishikawa.actions.closeCompare.help" class="ishikawa__diff-close" data-ref="diffCloseBtn" x-command="closeCompare">
              <span x-text="t('endCompare')"></span>
              <span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span>
            </button>
          </div>
        </template>
      </div>

      <!-- Toolbar -->
      <div class="ishikawa__toolbar" style="margin-bottom:var(--spacing-sm)">
        <button type="button" data-help-key="modules.ishikawa.actions.addRow.help" class="btn btn--sm btn--primary" data-ref="addRowBtn" @click="addRowAndFocus()" x-text="'+ ' + t('hypothesis')"></button>
        <button type="button" class="btn btn--sm" data-ref="expandAllBtn" @click="expandAll()" x-text="t('expandAll')"></button>
        <button type="button" class="btn btn--sm" data-ref="collapseAllBtn" @click="collapseAll()" x-text="t('collapseAll')"></button>
        <div class="ishikawa__toolbar-spacer"></div>
        <div class="ishikawa__filter-group" role="radiogroup" x-set="state.filter" data-help-key="">
          <button type="button" role="radio" value="" data-help-key="modules.ishikawa.actions.setFilter.help" class="ishikawa__filter-chip" :class="state.filter === '' ? 'ishikawa__filter-chip--active' : ''"
                  data-filter="all">
            <span x-text="t('filterAll')"></span> <span class="ishikawa__filter-chip-count" x-text="'(' + model.rows.length + ')'"></span>
          </button>
          <template x-for="c in cats" :key="c">
            <button type="button" role="radio" :value="c" class="ishikawa__filter-chip" :class="state.filter === c ? 'ishikawa__filter-chip--active' : ''"
                    :data-filter="c" :style="catStripe(c)">
              <span x-text="catLabel(c)"></span> <span class="ishikawa__filter-chip-count" x-text="'(' + catCount(c) + ')'"></span>
            </button>
          </template>
          <button type="button" data-help-key="modules.ishikawa.actions.setCategoryLabels.help" class="ishikawa__cat-rename-btn" data-ref="renameCatsBtn"
                  :title="t('renameCatsTitle')" :aria-label="t('renameCatsTitle')" x-dialog="catRename" :data-dialog-title="t('renameCatsTitle')">
            <span class="icon icon--sm" data-icon="action.edit" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="dmike-table-wrap">
        <table class="dmike-table dmike-table--sticky dmike-table--head-mono dmike-table--draggable ishikawa__table ishikawa__table--tree">
          <thead>
            <tr>
              <th class="dmike-table__grip-col"></th>
              <th class="ishikawa__col-nr">#</th>
              <th class="ishikawa__col-cat"><span data-help-key="modules.ishikawa.fields.rows.category.help" x-text="t('category')"></span></th>
              <th class="ishikawa__col-name"><span data-help-key="modules.ishikawa.fields.rows.name.help" x-text="t('colName')"></span></th>
              <th><span data-help-key="modules.ishikawa.fields.rows.description.help" x-text="t('colDescription')"></span></th>
              <template x-for="e in model.experts" :key="e.id">
                <th class="ishikawa__col-expert">
                  <div class="ishikawa__exp-col-head">
                    <div class="ishikawa__exp-ini" :style="'background:' + e.color" x-text="ini(e.name)"></div>
                    <div class="ishikawa__exp-nm" :title="e.name" x-text="e.name"></div>
                  </div>
                </th>
              </template>
              <th class="ishikawa__col-score"><span data-help-key="modules.ishikawa.fields.rows.avgScore.help" x-text="t('avgScore')"></span></th>
              <th class="ishikawa__col-status"><span data-help-key="modules.ishikawa.fields.rows.status.help" x-text="t('statusHeader')"></span></th>
              <th class="ishikawa__col-actions"></th>
            </tr>
          </thead>
          <tbody data-reorder-group="causes" data-reorder-closed :data-reorder-group-label="t('hypotheses')">
            <template x-if="visibleRows.length === 0">
              <tr class="ishikawa__empty-row"><td :colspan="emptyColspan" x-text="emptyMessage"></td></tr>
            </template>
            <template x-for="(vr, idx) in visibleRows" :key="vr.row.id">
              <tr :data-id="vr.row.id" :data-reorder-index="idx" :class="rowClass(vr)">
                <td class="dmike-table__grip-col">
                  <button class="dmike-table__grip ishikawa__grip--tree" type="button" :data-grip="vr.row.id"
                          :aria-label="t('common.reorder')"></button>
                </td>
                <td class="ishikawa__col-nr" :style="'--ishikawa-depth:' + vr.depth">
                  <div class="ishikawa__nr-cell">
                    <template x-if="vr.hasKids">
                      <button type="button" class="btn btn--icon-sm ishikawa__toggle-btn" :data-toggle="vr.row.id" @click="toggleCollapse(vr.row.id)" :title="toggleTitle(vr)" :aria-label="toggleTitle(vr)"><span class="icon icon--sm" :data-icon="toggleIcon(vr)" aria-hidden="true"></span></button>
                    </template>
                    <span class="ishikawa__nr-text" x-text="vr.num"></span>
                  </div>
                </td>
                <!-- Category cell: inherited (depth>0) or selectable (root) -->
                <template x-if="vr.depth > 0">
                  <td>
                    <div class="ishikawa__cat-inherited" :style="catStripe(vr.effCat)" x-text="vr.effCat ? catLabel(vr.effCat) : ''"></div>
                  </td>
                </template>
                <template x-if="vr.depth === 0">
                  <td>
                    <select class="field field--sm ishikawa__cat-select" :data-row-cat="vr.row.id" :style="catStripe(vr.effCat)" x-model="vr.row.category">
                      <option value="" x-text="categoryPlaceholder(vr)" :selected="!vr.row.category"></option>
                      <template x-for="c in cats" :key="c"><option :value="c" x-text="catLabel(c)" :selected="c === vr.row.category"></option></template>
                    </select>
                  </td>
                </template>
                <td><input class="field field--sm field--ghost ishikawa__name-input" :class="isNameDup(vr.row) ? 'ishikawa__name-input--dup' : ''" type="text"
                           :placeholder="t('namePlaceholder')" :data-row-name="vr.row.id" x-model="vr.row.name" /></td>
                <td><div class="ishikawa__hypo-cell">
                  <input class="field field--sm field--ghost ishikawa__desc-input" type="text" :placeholder="descPlaceholder(vr)" :data-row-desc="vr.row.id" x-model="vr.row.description" />
                </div></td>
                <template x-for="e in model.experts" :key="e.id">
                  <td class="ishikawa__col-expert">
                    <input type="number" class="field field--sm ishikawa__rating-input" min="0" max="9"
                           :class="ratingClass(vr.row.ratings[e.id])"
                           :value="ratingVal(vr.row, e.id)" placeholder="–"
                           :data-rating-row="vr.row.id" :data-rating-exp="e.id"
                           @focus="$event.target.select()" @keydown="ratingKeydown($event)" @change="ratingChanged(vr.row.id, e.id, $event)" />
                  </td>
                </template>
                <td class="ishikawa__col-score">
                  <template x-if="vr.score === null">
                    <span class="ishikawa__score-badge">–</span>
                  </template>
                  <template x-if="vr.score !== null">
                    <div class="ishikawa__score-bar-wrap">
                      <span class="ishikawa__score-badge" :class="scoreClass(vr.score)" x-text="num(vr.score, 1)"></span>
                      <div class="ishikawa__score-bar-track"><div class="ishikawa__score-bar-fill" :class="scoreBarClass(vr.score)" :style="scoreBarStyle(vr.score)"></div></div>
                      <template x-if="scoreDelta(vr)">
                        <span class="ishikawa__score-delta" :class="deltaClass(scoreDelta(vr))" x-text="deltaText(scoreDelta(vr))"></span>
                      </template>
                    </div>
                  </template>
                </td>
                <td><select class="field field--sm ishikawa__status-select" :class="statusClass(vr.row.status)" :data-row-status="vr.row.id" x-model="vr.row.status">
                  <option value="open" x-text="t('status.open')"></option>
                  <option value="testing" x-text="t('status.testing')"></option>
                  <option value="confirmed" x-text="t('status.confirmed')"></option>
                  <option value="rejected" x-text="t('status.rejected')"></option>
                </select></td>
                <td><div class="ishikawa__row-actions">
                  <button type="button" class="btn btn--icon-sm" :title="t('addSub')" :data-add-sub="vr.row.id" @click="addSubAndFocus(vr.row.id)">+</button>
                  <button type="button" class="btn btn--icon-sm" :title="t('duplicate')" :data-dupe="vr.row.id" data-help-key=""
                          x-command="duplicateRow" :data-arg-row-id="vr.row.id">⎘</button>
                  <button type="button" class="btn btn--icon-sm" :class="linkExpClass(vr.row)" data-help-key="modules.ishikawa.actions.setCauseExperiments.help"
                          :title="linkExpTitle(vr.row)" :aria-label="linkExpTitle(vr.row)" :data-link-exp="vr.row.id" @click="openExpLink(vr.row.id)">
                    <span class="icon icon--sm" data-icon="action.experiment" aria-hidden="true"></span>
                    <template x-if="linkedExpCount(vr.row) > 0">
                      <span class="ishikawa__exp-link-badge" x-text="linkedExpCount(vr.row)"></span>
                    </template>
                  </button>
                  <button type="button" class="btn btn--icon-sm btn--danger" :title="t('common.delete')" :data-del-row="vr.row.id" data-help-key=""
                          data-confirm-delete x-command="removeRow" :data-arg-row-id="vr.row.id"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
                </div></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pareto -->
      <div class="ishikawa__pareto-panel">
        <div class="ishikawa__pareto-header">
          <label data-help-key="modules.ishikawa.actions.setParetoSource.help" class="ishikawa__panel-label" x-text="t('paretoTitle')"></label>
          <select class="ishikawa__pareto-select" data-ref="paretoSelect" :value="paretoSourceValue" @change="paretoSourceChanged($event)">
            <option value="current" x-text="t('paretoCurrent')" :selected="paretoSourceValue === 'current'"></option>
            <template x-for="s in model.snapshots" :key="s.id"><option :value="'snap-' + s.id" x-text="s.name" :selected="paretoSourceValue === 'snap-' + s.id"></option></template>
          </select>
        </div>
        <div class="ishikawa__pareto-body">
          <template x-if="paretoEmpty"><div class="ishikawa__trend-empty" x-text="t('paretoNoData')"></div></template>
          <div class="ishikawa__pareto-canvas-wrap" data-ref="paretoContent" x-widget="pareto-chart" x-widget-config="paretoChart" x-widget-value="model.paretoEdits"></div>
        </div>
      </div>

      <!-- Summary -->
      <div class="ishikawa__summary-bar">
        <div class="ishikawa__summary-card">
          <div data-help-key="modules.ishikawa.fields.rows.help" class="ishikawa__s-label" x-text="t('hypotheses')"></div>
          <div class="ishikawa__s-value"><span x-text="model.rows.length"></span> <span style="font-size:var(--font-size-xs);font-weight:400;color:var(--color-text-tertiary)" x-text="summaryBreakdown"></span></div>
          <div class="ishikawa__cat-bar">
            <template x-for="c in cats" :key="c">
              <template x-if="catBarPct(c) > 0"><div :style="catBarStyle(c)"></div></template>
            </template>
          </div>
        </div>
        <div class="ishikawa__summary-card"><div class="ishikawa__s-label" x-text="t('expertTeam')"></div><div class="ishikawa__s-value" x-text="model.experts.length"></div></div>
        <div class="ishikawa__summary-card"><div class="ishikawa__s-label" x-text="t('highestAvg')"></div><div class="ishikawa__s-value" style="color:var(--color-accent)" x-text="topScore"></div></div>
        <div class="ishikawa__summary-card"><div class="ishikawa__s-label" x-text="t('status.confirmed')"></div><div class="ishikawa__s-value" style="color:var(--ishikawa-green)" x-text="confirmedCount"></div></div>
        <div class="ishikawa__summary-card"><div class="ishikawa__s-label" x-text="t('snapshots')"></div><div class="ishikawa__s-value" x-text="model.snapshots.length"></div></div>
      </div>

      <!-- Snapshots -->
      <div class="ishikawa__snapshot-panel">
        <label data-help-key="modules.ishikawa.fields.snapshots.help" class="ishikawa__panel-label" x-text="t('snapshots')"></label>
        <div class="ishikawa__snapshot-inner">
          <form class="ishikawa__snapshot-save" x-command-form="saveSnapshot" data-help-key="">
            <input type="text" class="field field--inline ishikawa__snapshot-name-input" data-ref="snapNameInput" data-help-key=""
                   :placeholder="t('snapNamePlaceholder')" x-param="name" />
            <button type="submit" data-help-key="modules.ishikawa.actions.saveSnapshot.help" class="btn btn--sm btn--primary" data-ref="saveSnapBtn" x-text="t('saveSnapshot')"></button>
            <button type="button" class="btn btn--sm" data-ref="trendBtn" @click="toggleTrend()" x-text="t('trend')"></button>
          </form>
          <div class="ishikawa__snapshot-list">
            <div class="ishikawa__snap-items">
              <template x-if="model.snapshots.length === 0">
                <span class="ishikawa__no-items" x-text="t('noSnapshots')"></span>
              </template>
              <template x-for="s in model.snapshots" :key="s.id">
                <div class="ishikawa__snap-item" :class="snapClass(s)"
                     :data-snap-id="s.id" :title="t('snapClickHint')"
                     @click="snapClick(s.id, $event)" @dblclick="loadFromList(s.id)">
                  <span class="ishikawa__snap-date" x-text="snapDate(s)"></span>
                  <span class="ishikawa__snap-name" x-text="s.name"></span>
                  <span class="ishikawa__snap-badge" x-text="snapBadge(s)"></span>
                  <button type="button" class="ishikawa__snap-del" :data-snap-del="s.id" :title="t('common.delete')" data-help-key=""
                          data-confirm-delete x-command="removeSnapshot" :data-arg-snapshot-id="s.id"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Trend panel -->
      <div class="ishikawa__trend-panel" :class="state.trendVisible ? 'ishikawa__trend-panel--visible' : ''" data-ref="trendPanel">
        <div class="ishikawa__trend-inner">
          <div class="ishikawa__trend-header">
            <h3 x-text="t('trendTitle')"></h3>
            <button type="button" class="ishikawa__trend-close" data-ref="trendCloseBtn" :title="t('common.close')" @click="closeTrend()"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
          </div>
          <template x-if="trendEmptyMsg"><div class="ishikawa__trend-empty" x-text="trendEmptyMsg"></div></template>
          <div class="ishikawa__trend-body" data-ref="trendContent" x-widget="trend-chart" x-widget-config="trendChart" x-widget-value="state.trendEdits"></div>
        </div>
      </div>
    </div>
    </template>

    <!-- ─── EXPERIMENTS TAB ─────────────────────────────────── -->
    <template x-if="state.tab === 'experiments'">
    <div class="ishikawa__experiments">
      <div class="ishikawa__toolbar" style="margin-bottom:var(--spacing-sm)">
        <button type="button" data-help-key="modules.ishikawa.actions.addExperiment.help" class="btn btn--sm btn--primary" data-ref="addExperimentBtn" x-command="addExperiment" x-text="'+ ' + t('experiment')"></button>
        <div class="ishikawa__toolbar-spacer"></div>
      </div>
      <template x-if="model.experiments.length === 0">
        <div class="ishikawa__exp-empty" x-text="t('noExperiments')"></div>
      </template>
      <template x-if="model.experiments.length > 0">
        <div class="dmike-table-wrap">
          <datalist id="ishikawa-resp-list">
            <template x-for="n in ownerNames" :key="n"><option :value="n"></option></template>
          </datalist>
          <table class="dmike-table dmike-table--sticky dmike-table--head-mono dmike-table--draggable ishikawa__table ishikawa__exp-table">
            <thead>
              <tr>
                <th class="dmike-table__grip-col"></th>
                <th class="ishikawa__col-nr">#</th>
                <th class="ishikawa__col-exp-title"><span data-help-key="modules.ishikawa.fields.experiments.title.help" x-text="t('experimentTitle')"></span></th>
                <th class="ishikawa__col-desc"><span data-help-key="modules.ishikawa.fields.experiments.description.help" x-text="t('experimentDescription')"></span></th>
                <th class="ishikawa__col-resp"><span data-help-key="modules.ishikawa.fields.experiments.responsible.help" x-text="t('responsible')"></span></th>
                <th class="ishikawa__col-exp-status"><span data-help-key="modules.ishikawa.fields.experiments.status.help" x-text="t('statusHeader')"></span></th>
                <th class="ishikawa__col-date"><span data-help-key="modules.ishikawa.fields.experiments.startDate.help" x-text="t('startDate')"></span></th>
                <th class="ishikawa__col-date"><span data-help-key="modules.ishikawa.fields.experiments.endDate.help" x-text="t('endDate')"></span></th>
                <th class="ishikawa__col-money"><span class="context-help-anchor--overlay" data-help-key="modules.ishikawa.fields.experiments.costMoney.help" x-text="t('costMoney')"></span></th>
                <th class="ishikawa__col-hours"><span class="context-help-anchor--overlay" data-help-key="modules.ishikawa.fields.experiments.costHours.help" x-text="t('costHours')"></span></th>
                <th class="ishikawa__col-hyp-link"><span data-help-key="modules.ishikawa.actions.setExperimentHypotheses.help" x-text="t('linkedHypotheses')"></span></th>
                <th class="ishikawa__col-actions"></th>
              </tr>
            </thead>
            <tbody data-reorder-group="experiments" data-reorder-closed :data-reorder-group-label="t('tabExperiments')">
              <template x-for="(x, idx) in model.experiments" :key="x.id">
                <tr :data-xid="x.id" :data-id="x.id" :data-reorder-index="idx" :class="previewClass('experiments', x.id)">
                  <td class="dmike-table__grip-col">
                    <button class="dmike-table__grip ishikawa__grip--exp" type="button" :data-grip="x.id"
                            :aria-label="t('common.reorder')"></button>
                  </td>
                  <td class="ishikawa__col-nr"><span class="ishikawa__nr-text" x-text="idx + 1"></span></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-title-input" type="text" :placeholder="t('experimentTitlePlaceholder')" :data-xp-title="x.id" x-model="x.title" /></td>
                  <td><textarea class="field field--sm field--ghost ishikawa__exp-desc-input" rows="1" :placeholder="t('experimentDescPlaceholder')" :data-xp-desc="x.id" x-model="x.description"></textarea></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-resp-input" type="text" :placeholder="t('responsiblePlaceholder')" list="ishikawa-resp-list" :data-xp-resp="x.id" x-model="x.responsible" /></td>
                  <td><select class="field field--sm ishikawa__exp-status-select" :class="expStatusClass(x)" :data-xp-status="x.id" data-help-key="" x-field="x.status">
                    <option value="planned" x-text="t('expStatus.planned')"></option>
                    <option value="running" x-text="t('expStatus.running')"></option>
                    <option value="done" x-text="t('expStatus.done')"></option>
                    <option value="cancelled" x-text="t('expStatus.cancelled')"></option>
                  </select></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-date-input" :data-xp-start="x.id" data-help-key="" x-field="x.startDate" /></td>
                  <td><input class="field field--sm field--ghost ishikawa__exp-date-input" :data-xp-end="x.id" data-help-key="" x-field="x.endDate" /></td>
                  <td><input class="field field--sm field--ghost field--num ishikawa__exp-num-input" placeholder="0" :data-xp-money="x.id" data-help-key="" x-field="x.costMoney" /></td>
                  <td><input class="field field--sm field--ghost field--num ishikawa__exp-num-input" placeholder="0" :data-xp-hours="x.id" data-help-key="" x-field="x.costHours" /></td>
                  <td><button type="button" class="btn btn--sm ishikawa__exp-link-btn" :data-xp-link="x.id" data-help-key=""
                              x-dialog="hypLink" :data-arg-experiment-id="x.id" :data-dialog-title="t('chooseHypotheses')" x-text="expLinkText(x)"></button></td>
                  <td><div class="ishikawa__row-actions">
                    <button type="button" class="btn btn--icon-sm btn--danger" :title="t('common.delete')" :data-xp-del="x.id" data-help-key=""
                            data-confirm-delete x-command="removeExperiment" :data-arg-experiment-id="x.id"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
                  </div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <div class="ishikawa__gantt-panel">
        <label class="ishikawa__panel-label" data-help-key="modules.ishikawa.fields.ganttChart.help" x-text="t('ganttTitle')"></label>
        <template x-if="ganttEmptyMsg"><div class="ishikawa__gantt-empty" x-text="ganttEmptyMsg"></div></template>
        <div class="ishikawa__gantt-canvas" data-ref="ganttCanvas" :style="ganttHostStyle" x-widget="gantt-chart" x-widget-config="ganttChart"></div>
      </div>
      <div class="ishikawa__gantt-panel">
        <label class="ishikawa__panel-label" data-help-key="modules.ishikawa.fields.costChart.help" x-text="t('costChartTitle')"></label>
        <template x-if="costEmptyMsg"><div class="ishikawa__gantt-empty" x-text="costEmptyMsg"></div></template>
        <div class="ishikawa__gantt-canvas" data-ref="costChartCanvas" :style="costHostStyle" x-widget="cumulative-cost-chart" x-widget-config="costChart"></div>
      </div>
      <div class="ishikawa__gantt-panel">
        <label class="ishikawa__panel-label" data-help-key="modules.ishikawa.fields.costRateChart.help" x-text="t('costRateChartTitle')"></label>
        <template x-if="costRateEmptyMsg"><div class="ishikawa__gantt-empty" x-text="costRateEmptyMsg"></div></template>
        <div class="ishikawa__gantt-canvas" data-ref="costRateChartCanvas" :style="costHostStyle" x-widget="cumulative-cost-chart" x-widget-config="costRateChart"></div>
      </div>
    </div>
    </template>

  </div>

  <!-- ─── LIGHTBOX AND FORMS (hidden home; lent to the shared dialog, restored on close) ─── -->
  <div class="ishikawa__modal-forms" hidden>
    <div class="ishikawa__img-lightbox" x-ref="lightbox">
      <img :src="lightboxImage.dataUrl" :alt="lightboxImage.caption" />
      <!-- x-show, not x-if: the node lives in the dialog while open, outside the Alpine root, where a fresh x-if clone is never initialised -->
      <p class="ishikawa__img-lightbox-caption" x-show="lightboxImage.caption" x-text="lightboxImage.caption"></p>
    </div>

    <!-- Category rename form (lent to the shared dialog by x-dialog) -->
    <form class="ishikawa__cat-rename" x-ref="catRename" x-command-form="setCategoryLabels" data-command-form-schema="catRename">
      <p class="ishikawa__cat-rename-hint" x-text="t('renameCatsHint')"></p>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-man)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.man')"></span>
        <input type="text" class="field" data-cat-key="man" x-param="man" data-help-key="" :placeholder="t('cat.man')" maxlength="40" />
      </div>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-machine)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.machine')"></span>
        <input type="text" class="field" data-cat-key="machine" x-param="machine" data-help-key="" :placeholder="t('cat.machine')" maxlength="40" />
      </div>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-environment)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.environment')"></span>
        <input type="text" class="field" data-cat-key="environment" x-param="environment" data-help-key="" :placeholder="t('cat.environment')" maxlength="40" />
      </div>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-material)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.material')"></span>
        <input type="text" class="field" data-cat-key="material" x-param="material" data-help-key="" :placeholder="t('cat.material')" maxlength="40" />
      </div>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-measurement)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.measurement')"></span>
        <input type="text" class="field" data-cat-key="measurement" x-param="measurement" data-help-key="" :placeholder="t('cat.measurement')" maxlength="40" />
      </div>
      <div class="ishikawa__cat-rename-row">
        <span class="ishikawa__cat-rename-swatch" style="background:var(--ishikawa-cat-method)"></span>
        <span class="ishikawa__cat-rename-default" x-text="t('cat.method')"></span>
        <input type="text" class="field" data-cat-key="method" x-param="method" data-help-key="" :placeholder="t('cat.method')" maxlength="40" />
      </div>
    </form>

    <!-- Link experiments to one cause (opened from a cause row) -->
    <form class="ishikawa__hyp-pick" x-ref="expLink" x-command-form="setCauseExperiments">
      <p class="ishikawa__hyp-pick-hint" x-text="expLinkHint"></p>
      <div class="ishikawa__hyp-pick-list" x-param="experimentIds">
        <!-- x-show, not x-if: this node is lent to the dialog, where an x-if clone would never initialise -->
        <div class="ishikawa__no-items" x-show="expLinkItems.length === 0" x-text="t('noExperimentsToLink')"></div>
        <template x-for="it in expLinkItems" :key="it.id">
          <label class="ishikawa__hyp-pick-row">
            <input type="checkbox" :value="it.id" :data-exp-id="it.id" />
            <span class="ishikawa__hyp-pick-num" x-text="'#' + it.num"></span>
            <span class="ishikawa__hyp-pick-name" x-text="it.label"></span>
            <span class="ishikawa__hyp-pick-cat" x-show="it.dateRange" x-text="it.dateRange"></span>
            <span class="ishikawa__exp-link-status" :class="'ishikawa__expstatus-' + it.status" x-text="it.statusLabel"></span>
          </label>
        </template>
      </div>
    </form>

    <!-- Choose the causes of one experiment (opened from an experiment row) -->
    <form class="ishikawa__hyp-pick" x-ref="hypLink" x-command-form="setExperimentHypotheses">
      <p class="ishikawa__hyp-pick-hint" x-text="t('chooseHypothesesHint')"></p>
      <div class="ishikawa__hyp-pick-list" x-param="hypothesisIds">
        <!-- x-show, not x-if: this node is lent to the dialog, where an x-if clone would never initialise -->
        <div class="ishikawa__no-items" x-show="hypLinkItems.length === 0" x-text="t('noCategoryHyp')"></div>
        <template x-for="r in hypLinkItems" :key="r.stableId">
          <label class="ishikawa__hyp-pick-row">
            <input type="checkbox" :value="r.stableId" :data-stable-id="r.stableId" />
            <span class="ishikawa__hyp-pick-num" x-text="r.num"></span>
            <span class="ishikawa__hyp-pick-swatch" x-show="r.cat" :style="'background:' + catColor(r.cat)"></span>
            <span class="ishikawa__hyp-pick-name" x-text="r.name"></span>
            <span class="ishikawa__hyp-pick-cat" x-show="r.cat" x-text="r.cat ? catLabel(r.cat) : ''"></span>
          </label>
        </template>
      </div>
    </form>
  </div>
</section>
