<div class="module-msa-typ4 dmike-split dmike-split--input-lg" x-data="msaTyp4">
  <div class="dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sections.feature')"></div>

    <div class="field-row">
      <div class="field-group field-group--major">
        <label data-help-key="modules.msa-typ4.types.Params.name" x-text="t('labels.name')"></label>
        <input type="text" class="field" data-ref="inp-name"
               :value="model.params.name" @input="setParam('name', $event.target.value)">
      </div>
      <div class="field-group field-group--minor">
        <label data-help-key="modules.msa-typ4.types.Params.unit" x-text="t('labels.unit')"></label>
        <input type="text" class="field" data-ref="inp-unit"
               placeholder="mm"
               :value="model.params.unit" @input="setParam('unit', $event.target.value)">
      </div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sections.dataSource')"></div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ4.actions.setColumn.help" x-text="t('labels.referenceColumn')"></label>
      <div data-ref="picker-ref"></div>
    </div>
    <div class="field-group">
      <label data-help-key="modules.msa-typ4.actions.setColumn.help" x-text="t('labels.measuredColumn')"></label>
      <div data-ref="picker-meas"></div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sections.evaluation')"></div>

    <fieldset class="field-radios field-radios--inline">
      <legend data-help-key="modules.msa-typ4.types.Params.norm" x-text="t('labels.norm')"></legend>
      <template x-for="o in normOptions()" :key="o.value">
        <label>
          <input type="radio" name="msa4-norm" :value="o.value"
                 :checked="model.params.norm === o.value" @input="setParam('norm', o.value)" @change="runAnalysis()">
          <span x-text="o.label"></span>
        </label>
      </template>
    </fieldset>

    <fieldset class="field-radios field-radios--inline">
      <legend data-help-key="modules.msa-typ4.types.Params.pvMode" x-text="t('labels.pvMode')"></legend>
      <template x-for="o in pvOptions()" :key="o.value">
        <label>
          <input type="radio" name="msa4-pv" :value="o.value"
                 :checked="model.params.pvMode === o.value" @input="setParam('pvMode', o.value)" @change="runAnalysis()">
          <span x-text="o.label"></span>
        </label>
      </template>
    </fieldset>

    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.msa-typ4.types.Params.tolerance.LSL" x-text="t('labels.lsl')"></label>
        <input type="text" class="field field--num" data-ref="inp-lsl" inputmode="decimal"
               placeholder="0.000"
               :value="model.params.tolerance.LSL"
               @input="setParam('tolerance.LSL', $event.target.value)" @change="runAnalysis()">
      </div>
      <div class="field-group">
        <label data-help-key="modules.msa-typ4.types.Params.tolerance.USL" x-text="t('labels.usl')"></label>
        <input type="text" class="field field--num" data-ref="inp-usl" inputmode="decimal"
               placeholder="0.000"
               :value="model.params.tolerance.USL"
               @input="setParam('tolerance.USL', $event.target.value)" @change="runAnalysis()">
      </div>
    </div>

    <div class="field-group" data-ref="group-sigma"
         :class="{ 'msa-typ4__field--hidden': isTolerance() }">
      <label data-help-key="modules.msa-typ4.types.Params.sigmaP" x-text="t('labels.sigmaP')"></label>
      <input type="text" class="field field--num" data-ref="inp-sigma" inputmode="decimal"
             :value="model.params.sigmaP"
             @input="setParam('sigmaP', $event.target.value)" @change="runAnalysis()">
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ4.types.Params.alpha" x-text="t('labels.alpha')"></label>
      <select class="field" data-ref="sel-alpha"
              :value="model.params.alpha" @input="setParam('alpha', $event.target.value)" @change="runAnalysis()">
        <template x-for="a in alphaOptions()" :key="a">
          <option :value="a" :selected="a === model.params.alpha" x-text="a"></option>
        </template>
      </select>
    </div>

    <div class="field-error" data-ref="error-box" x-text="errorMsg"></div>
  </div>

  <div class="dmike-split__output">
    <div data-ref="results">
      <template x-if="!result">
        <div class="module-msa-typ4__empty" x-text="t('emptyState')"></div>
      </template>

      <template x-if="result">
        <div>
          <!-- KPI strip (norm-dependent) -->
          <div class="dmike-kpi-strip">
            <template x-for="tile in kpiTiles()" :key="tile.key">
              <div class="dmike-kpi" :class="tile.mod">
                <div class="dmike-kpi-label" :data-help-key="tile.help" x-text="tile.label"></div>
                <div class="dmike-kpi-value" x-text="tile.value"></div>
                <template x-if="tile.sub">
                  <div class="dmike-kpi-sub" x-text="tile.sub"></div>
                </template>
              </div>
            </template>
          </div>

          <!-- Interpretation (generisches .dmike-infobox aus css/components.css) -->
          <div class="dmike-infobox" :class="kpiModClass(currentVerdictColor())">
            <span class="dmike-infobox__detail" data-help-key="modules.msa-typ4.types.Result.interpretation" x-text="interpretationText()"></span>
          </div>

          <!-- Charts -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.linearity')"></span></div>
          <div class="msa-typ4__chart" data-ref="chart-linearity"></div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.percentBias')"></span></div>
          <div class="msa-typ4__chart" data-ref="chart-pctbias"></div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('charts.perReference')"></span></div>
          <div class="msa-typ4__chart" data-ref="chart-per-ref"></div>

          <details class="msa-typ4__residuals" data-ref="residuals-details">
            <summary x-text="t('charts.residuals')"></summary>
            <div class="msa-typ4__chart" data-ref="chart-residuals"></div>
          </details>

          <!-- Per-reference table -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sections.results')"></span></div>
          <table class="dmike-table msa-typ4__table">
            <thead>
              <tr>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.xRef" x-text="t('table.reference')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.n" x-text="t('table.n')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.mean" x-text="t('table.mean')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.bias" x-text="t('table.bias')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.percentBias" x-text="t('table.percentBias')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.tStat" x-text="t('table.tStat')"></span></th>
                <th><span data-help-key="modules.msa-typ4.types.ReferencePoint.pValue" x-text="t('table.pValue')"></span></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in tableRows()" :key="row.key">
                <tr :class="row.rowClass">
                  <td x-text="row.xRef"></td>
                  <td x-text="row.n"></td>
                  <td x-text="row.mean"></td>
                  <td x-text="row.bias"></td>
                  <td x-text="row.percentBias"></td>
                  <td x-text="row.tStat"></td>
                  <td x-text="row.pValue"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </div>
</div>
