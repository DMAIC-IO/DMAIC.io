<div class="module-container df" x-data="deploymentFlowchart" data-ref="root">
  <div class="module-container__body df__body">

    <!-- Lane sidebar: pick the active lane, rename and remove lanes -->
    <aside class="df__sidebar">
      <h4 class="df__sidebar-title" x-text="t('lanes')"></h4>
      <ul class="df__lane-list">
        <template x-for="lane in model.lanes" :key="lane.id">
          <li class="df__lane-item"
              :data-lane-id="lane.id">
            <template x-if="!isUnassigned(lane)">
              <input class="df__lane-name" type="text" x-model="lane.name"
                     :data-lane-id="lane.id"
                     :placeholder="t('unnamedLane')"
                     @click.stop>
            </template>
            <template x-if="isUnassigned(lane)">
              <span class="df__lane-name df__lane-name--fixed" x-text="t('unassigned')"></span>
            </template>
            <template x-if="!isUnassigned(lane)">
              <button class="df__lane-remove" @click.stop="removeLaneById(lane.id)"
                      :title="t('removeLane')" :aria-label="t('removeLane')">
                <span class="icon fc-remove-icon" data-icon="trash" aria-hidden="true"></span>
              </button>
            </template>
          </li>
        </template>
      </ul>
      <p class="df__sidebar-hint" x-text="t('laneHint')"></p>
    </aside>

    <!-- Lane canvas: the chain runs left to right (one column per step) and
         the lane is only the vertical position, so moving a step to another
         role is a pure up/down move that keeps its place in the chain. -->
    <div class="df__canvas fc-swimlanes" data-ref="flow"
         :style="'--fc-lane-count: ' + model.lanes.length">
      <template x-if="model.lanes.length === 0">
        <p class="df__empty-hint" x-text="t('emptyHint')"></p>
      </template>

      <div class="fc-swimlane-labels">
        <template x-for="lane in model.lanes" :key="'label-' + lane.id">
          <div class="df__band-label fc-swimlane-label"
               :data-lane-id="lane.id"
               x-text="laneLabel(lane)"></div>
        </template>
      </div>

      <template x-for="(step, idx) in model.steps" :key="step.id">
        <div class="df__col fc-swimlane-col"
             :data-step-id="step.id"
             @dragstart="stepDragStart(step.id, $event)"
             @dragend="stepDragEnd($event)">

          <template x-for="lane in model.lanes" :key="'slot-' + step.id + '-' + lane.id">
            <div class="df__slot fc-swimlane-slot"
                 :data-lane-id="lane.id"
                 @dragover.prevent
                 @drop.stop="dropOnLane(lane.id, $event)">
              <!-- Connector sits in the gap left of the card, so it stays at
                   the card's header height whichever lane the card is in. -->
              <template x-if="idx > 0 && step.laneId === lane.id">
                <div class="df__connector fc-connector fc-connector--clickable"
                     data-action="insert-step" :data-idx="idx"
                     @click="insertBefore(idx, lane.id)"
                     :title="t('insertHere')">
                  <span class="fc-connector__arrow">&raquo;</span>
                </div>
              </template>
              <template x-if="step.laneId === lane.id">
                <!-- Drop on a CARD reorders the chain; drop on the empty band
                     around it only re-assigns the lane. -->
                <div class="df__step fc-card"
                     @dragover.stop="stepDragOver(step.id, $event)"
                     @dragleave.stop="stepDragLeave(step.id, $event)"
                     @drop.stop="stepDrop(step.id, $event)">
                  <div class="df__step-header fc-card__header">
                    <span class="df__step-number fc-step-number" x-text="stepNum(idx)"
                          @mousedown="armStepDrag(step.id, $event)"></span>
                    <textarea class="df__step-title fc-card__title" x-model="step.title"
                              :placeholder="t('titlePlaceholder')"
                              @input="autoSize($event)"></textarea>
                    <div class="df__step-actions fc-card__actions">
                      <button class="df__delete fc-card__delete" @click="model.removeStep(step.id)"
                              :title="t('deleteStep')" :aria-label="t('deleteStep')">
                        <span class="icon" data-icon="trash" aria-hidden="true"></span>
                      </button>
                    </div>
                  </div>
                  <div class="df__step-body fc-card__body">
                    <textarea class="field field--ghost df__step-description fc-card__description"
                              :placeholder="t('descriptionPlaceholder')"
                              data-field="description" :data-step-id="step.id"
                              x-model="step.description"
                              @input="autoSize($event)"></textarea>
                  </div>
                  <!-- @include js/core/flowchart/substeps.part.html -->
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- Import picker form, mounted into the shared modal by _openImport().
       Hidden inside the module container via CSS; visible when borrowed
       into the modal body. -->
  <div x-ref="importForm" class="df__import-form" :data-selected="_importSelectedId">
    <p class="df__import-hint" x-text="t('importHint')"></p>
    <div class="df__import-list">
      <template x-for="opt in _importOptions" :key="opt.moduleId + '-' + opt.instanceId">
        <label class="df__import-option"
               :class="_importSelectedId === opt.instanceId ? 'df__import-option--selected' : ''"
               :data-instance-id="opt.instanceId"
               @click.stop="_pickImportOption(opt)">
          <input type="radio" name="df-import-pick"
                 :value="opt.instanceId"
                 :checked="_importSelectedId === opt.instanceId"
                 @click.stop="_pickImportOption(opt)">
          <span class="df__import-option-source" x-text="t('modules.' + opt.moduleId + '.name')"></span>
          <span class="df__import-option-title" x-text="opt.title"></span>
        </label>
      </template>
    </div>
  </div>
</div>
