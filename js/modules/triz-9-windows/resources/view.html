<section class="module-container triz-9w" x-data="triz9Windows">
  <div class="module-container__body triz-9w__body">
    <section class="triz-9w__topbar">
      <label data-help-key="modules.triz-9-windows.fields.systemTitle.help" class="triz-9w__title-label" :for="fieldId('title')" x-text="t('systemHeading')"></label>
      <input :id="fieldId('title')" class="field triz-9w__title-input" type="text"
        data-role="system-title"
        :placeholder="t('systemPlaceholder')"
        x-model="model.systemTitle">
    </section>

    <section class="triz-9w__grid" :aria-label="t('gridAriaLabel')">
      <div class="triz-9w__corner" :title="t('cornerTip')">
        <div class="triz-9w__corner-rows">
          <span data-help-key="modules.triz-9-windows.fields.rowLabels.help" x-text="t('axisRows')"></span>
          <span class="icon icon--sm icon--text" data-icon="nav.arrow-down" aria-hidden="true"></span>
        </div>
        <div class="triz-9w__corner-cols">
          <span data-help-key="modules.triz-9-windows.fields.colLabels.help" x-text="t('axisCols')"></span>
          <span class="icon icon--sm icon--text" data-icon="nav.arrow-right" aria-hidden="true"></span>
        </div>
      </div>

      <template x-for="(label, c) in model.colLabels" :key="c">
        <div class="triz-9w__col-head">
          <input class="field field--ghost triz-9w__axis-input triz-9w__col-input" type="text"
            data-role="col-label"
            :aria-label="colAxisAria(c)"
            :data-c="c"
            x-model="model.colLabels[c]"
            :placeholder="colPlaceholder(c)">
        </div>
      </template>

      <template x-for="(rowText, r) in model.rowLabels" :key="r">
        <div class="triz-9w__row">
          <div class="triz-9w__row-head">
            <input class="field field--ghost triz-9w__axis-input triz-9w__row-input" type="text"
              data-role="row-label"
              :aria-label="rowAxisAria(r)"
              :data-r="r"
              x-model="model.rowLabels[r]"
              :placeholder="rowPlaceholder(r)">
          </div>

          <template x-for="(cell, c) in model.cells[r]" :key="c">
            <div class="triz-9w__cell" :data-r="r" :data-c="c">
              <div class="triz-9w__cell-head">
                <span class="triz-9w__cell-coord-anchor" data-help-key="modules.triz-9-windows.fields.cells.help"><span class="triz-9w__cell-coord" :id="coordId(r, c)" x-text="coordText(r, c)"></span></span>

                <span class="triz-9w__upload" x-show="!hasImage(r, c)"
                  x-file-drop="uploadImage" data-file-drop-accept="image/*"
                  :data-arg-row="r" :data-arg-col="c">
                  <button type="button" class="btn btn--secondary btn--xs triz-9w__upload-btn" data-file-drop-open data-help-key=""
                    :title="t('addImage')">
                    <span class="icon icon--sm icon--text" data-icon="action.add" aria-hidden="true"></span>
                    <span x-text="t('addImage')"></span>
                  </button>
                </span>
              </div>

              <textarea class="field triz-9w__cell-text" rows="4" data-role="cell-text"
                :data-r="r" :data-c="c"
                :aria-labelledby="coordId(r, c)"
                :placeholder="t('cellPlaceholder')"
                x-model="model.cells[r][c].text"></textarea>

              <template x-if="cell.image"><div class="triz-9w__image-wrap">
                <button type="button" class="triz-9w__image-open" @click="enlarge(r, c)">
                  <img class="triz-9w__image" :src="cell.image"
                    :alt="imageAlt(r, c)" data-action="enlarge"
                    :data-r="r" :data-c="c">
                </button>
                <button class="triz-9w__image-clear" type="button" data-action="clear-image"
                  :data-r="r" :data-c="c"
                  :title="t('clearImage')" :aria-label="t('clearImage')"
                  data-help-key="" data-confirm-delete
                  x-command="clearImage" :data-arg-row="r" :data-arg-col="c"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
              </div></template>
            </div>
          </template>
        </div>
      </template>
    </section>

    <!-- Großansicht: hier verborgen, enlarge() leiht sie dem Dialogdienst -->
    <div class="triz-9w__modal-forms" hidden>
      <div class="triz-9w__enlarged" x-ref="enlargedView">
        <img :src="enlargedImageSrc" alt="">
      </div>
    </div>
  </div>
</section>
