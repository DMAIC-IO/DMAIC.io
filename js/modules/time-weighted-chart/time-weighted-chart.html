<div class="twc dmike-split" x-data="timeWeightedChart">
  <div class="twc__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionChartType')"></div>
    <div class="field-group">
      <label data-help-key="modules.time-weighted-chart.types.Params.chartTypeId" x-text="t('chartType')"></label>
      <select class="field" data-ref="chart-type" :value="model.chartTypeId" @change="setParam('chartTypeId', $event.target.value)">
        <template x-for="o in chartTypeOptions()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.chartTypeId" x-text="o.label"></option>
        </template>
      </select>
      <span class="field-hint" x-text="typeHint()"></span>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div class="field-group">
      <label data-help-key="modules.time-weighted-chart.actions.setColumn.help" x-text="t('dataColumn')"></label>
      <div data-ref="col-picker-wrap"></div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.time-weighted-chart.types.Params.baselineCount" x-text="t('baselineCount')"></label>
      <input type="number" class="field field--num" data-ref="baseline-count"
        :min="paramMin('baselineCount')" :step="paramStep('baselineCount')" :placeholder="t('baselineAll')"
        :value="paramValue('baselineCount')" @change="onParamInput('baselineCount', $event)">
      <span class="field-hint" x-text="t('baselineHint')"></span>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionEstimation')"></div>
    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.time-weighted-chart.types.Params.targetOverride" x-text="t('targetOverride')"></label>
        <input type="number" class="field field--num" data-ref="target-override"
          :step="paramStep('targetOverride')" :placeholder="t('targetAuto')"
          :value="paramValue('targetOverride')" @change="onParamInput('targetOverride', $event)">
      </div>
      <div class="field-group">
        <label data-help-key="modules.time-weighted-chart.types.Params.sigmaOverride" x-text="t('sigmaOverride')"></label>
        <input type="number" class="field field--num" data-ref="sigma-override"
          :min="paramMin('sigmaOverride')" :step="paramStep('sigmaOverride')" :placeholder="t('sigmaAuto')"
          :value="paramValue('sigmaOverride')" @change="onParamInput('sigmaOverride', $event)">
      </div>
    </div>
    <div class="field-group">
      <label data-help-key="modules.time-weighted-chart.types.Params.sigmaMethod" x-text="t('sigmaMethod')"></label>
      <select class="field" data-ref="sigma-method" :value="model.sigmaMethod" @change="setParam('sigmaMethod', $event.target.value)">
        <template x-for="o in sigmaMethodOptions()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.sigmaMethod" x-text="o.label"></option>
        </template>
      </select>
      <span class="field-hint" x-text="t('sigmaMethodHint')"></span>
    </div>

    <div class="dmike-split__section-title" x-text="sectionParamsLabel()"></div>

    <template x-if="isEwma()">
      <div class="twc__params">
        <div class="twc__param-note" x-text="t('paramNote_ewma')"></div>
        <div class="field-grid field-grid--2">
          <div class="field-group">
            <label data-help-key="modules.time-weighted-chart.types.Params.lambda" x-text="t('lambda')"></label>
            <input type="number" class="field field--num" data-ref="lambda"
              :value="paramValue('lambda')" @change="onParamInput('lambda', $event)"
              :min="paramMin('lambda')" :max="paramMax('lambda')" :step="paramStep('lambda')">
          </div>
          <div class="field-group">
            <label data-help-key="modules.time-weighted-chart.types.Params.L" x-text="t('L')"></label>
            <input type="number" class="field field--num" data-ref="L"
              :value="paramValue('L')" @change="onParamInput('L', $event)"
              :min="paramMin('L')" :max="paramMax('L')" :step="paramStep('L')">
          </div>
        </div>
      </div>
    </template>

    <template x-if="isCusum()">
      <div class="twc__params">
        <div class="twc__param-note" x-text="t('paramNote_cusum')"></div>
        <div class="field-grid field-grid--2">
          <div class="field-group">
            <label data-help-key="modules.time-weighted-chart.types.Params.kSigma" x-text="t('kSigma')"></label>
            <input type="number" class="field field--num" data-ref="kSigma"
              :value="paramValue('kSigma')" @change="onParamInput('kSigma', $event)"
              :min="paramMin('kSigma')" :max="paramMax('kSigma')" :step="paramStep('kSigma')">
          </div>
          <div class="field-group">
            <label data-help-key="modules.time-weighted-chart.types.Params.hSigma" x-text="t('hSigma')"></label>
            <input type="number" class="field field--num" data-ref="hSigma"
              :value="paramValue('hSigma')" @change="onParamInput('hSigma', $event)"
              :min="paramMin('hSigma')" :max="paramMax('hSigma')" :step="paramStep('hSigma')">
          </div>
        </div>
      </div>
    </template>

  </div>

  <div class="twc__output dmike-split__output">
    <div data-ref="stats-bar">
      <template x-if="kpiCells.length">
        <div class="dmike-kpi-strip">
          <template x-for="(c, i) in kpiCells" :key="i">
            <div class="dmike-kpi" :class="c.mod">
              <div class="dmike-kpi-value" x-text="c.value"></div>
              <div class="dmike-kpi-label" :data-help-key="c.help"><span x-text="c.label"></span><template x-if="c.labelHint"><span class="field-hint" x-text="' (' + c.labelHint + ')'"></span></template></div>
              <div class="dmike-kpi-sub" x-text="c.sub"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
    <div data-ref="charts-wrap">
      <template x-for="(cv, i) in chartViews" :key="cv.id">
        <div class="twc__chart-section">
          <div class="twc__chart-header">
            <span class="twc__chart-title" x-text="cv.title"></span>
            <span class="twc__badge" :class="cv.badgeClass">
              <span class="icon icon--sm icon--text" :data-icon="cv.badgeIcon" aria-hidden="true"></span>
              <span x-text="cv.badgeText"></span>
            </span>
          </div>
          <div class="twc__plot-wrap" :data-chart-host="cv.id"></div>
        </div>
      </template>
    </div>
  </div>
</div>
