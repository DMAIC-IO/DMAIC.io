<div class="pareto-module dmike-split dmike-split--input-sm" x-data="pareto">
  <div class="pareto-module__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div data-ref="picker-wrap"></div>

    <div class="pareto-module__options" data-ref="options-wrap">
      <template x-if="hasYRef">
        <label class="pareto-module__opt-row">
          <span data-help-key="modules.pareto.types.Params.aggregation" x-text="t('aggregation')"></span>
          <select data-action="set-agg" :value="model.chartConfig.aggregation" @change="setParam('aggregation', $event.target.value)">
            <template x-for="o in aggregationOptions()" :key="o.value">
              <option :value="o.value" :selected="o.value === model.chartConfig.aggregation" x-text="o.label"></option>
            </template>
          </select>
        </label>
      </template>
    </div>

    <div class="pareto-module__error" data-ref="error-box"></div>
  </div>

  <div class="pareto-module__output dmike-split__output">
    <div data-ref="placeholder" class="pareto-module__placeholder" x-text="t('placeholderPickX')"></div>
    <div class="pareto-module__chart-area" data-ref="chart-area" style="display:none">
      <div class="pareto-module__chart-wrap" data-ref="chart-wrap"></div>
      <div class="pareto-module__stats-panel" data-ref="stats-panel">
        <template x-if="statsShow">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
            <table class="dmike-table pareto-module__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.pareto.types.ParetoRow.name" x-text="t('statCategory')"></span></th>
                <th><span data-help-key="modules.pareto.types.ParetoRow.value" x-text="statsValueHeader"></span></th>
                <th><span data-help-key="modules.pareto.types.ParetoRow.cumPct" x-text="t('statCumPct')"></span></th>
              </tr></thead>
              <tbody>
                <template x-for="(r, i) in statsRows" :key="i">
                  <tr>
                    <td><span class="pareto-module__stats-color" :style="'background:' + r.color"></span><span x-text="' ' + r.name"></span></td>
                    <td x-text="r.value"></td>
                    <td x-text="r.cumPct"></td>
                  </tr>
                </template>
                <tr style="font-weight:600;border-top:2px solid var(--color-border-primary)">
                  <td x-text="t('statTotal')"></td>
                  <td x-text="statsTotal"></td>
                  <td x-text="statsTotalPct"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
