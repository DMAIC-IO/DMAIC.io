<div class="contour dmike-split" x-data="contourPlot">
  <aside class="contour__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionModel')"></div>
    <div class="field-group">
      <label data-help-key="modules.contour-plot.types.Params.modelType" x-text="t('modelType')"></label>
      <select data-ref="modelType" class="field" :value="model.modelType" @change="setParam('modelType', $event.target.value)">
        <template x-for="o in modelTypeOptions()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.modelType" x-text="o.label"></option>
        </template>
      </select>
    </div>

    <div data-ref="coeffSection" x-show="!isCustomModel()">
      <label class="contour__coeff-label" data-help-key="modules.contour-plot.fields.b.help" x-text="t('coeffLabel')"></label>
      <div class="contour__coeff-grid">
        <div class="field-group contour__field-sm"><label x-text="betaLabel(0)"></label><input type="number" class="field field--num" data-ref="b0" :value="model.b[0]" @change="onCoefficientInput(0, $event)"></div>
        <div class="field-group contour__field-sm"><label x-text="betaLabel(1)"></label><input type="number" class="field field--num" data-ref="b1" :value="model.b[1]" @change="onCoefficientInput(1, $event)"></div>
        <div class="field-group contour__field-sm"><label x-text="betaLabel(2)"></label><input type="number" class="field field--num" data-ref="b2" :value="model.b[2]" @change="onCoefficientInput(2, $event)"></div>
        <div class="field-group contour__field-sm"><label x-text="betaLabel(3)"></label><input type="number" class="field field--num" data-ref="b3" :value="model.b[3]" @change="onCoefficientInput(3, $event)"></div>
        <div class="field-group contour__field-sm"><label x-text="betaLabel(4)"></label><input type="number" class="field field--num" data-ref="b4" :value="model.b[4]" @change="onCoefficientInput(4, $event)"></div>
        <div class="field-group contour__field-sm"><label x-text="betaLabel(5)"></label><input type="number" class="field field--num" data-ref="b5" :value="model.b[5]" @change="onCoefficientInput(5, $event)"></div>
      </div>
    </div>

    <div data-ref="customSection" x-show="isCustomModel()">
      <div class="field-group">
        <label data-help-key="modules.contour-plot.types.Params.customFormula" x-text="t('customFormula')"></label>
        <textarea data-ref="customFormula" class="field contour__textarea" rows="2" :value="model.customFormula" @input="setParam('customFormula', $event.target.value)"></textarea>
        <p class="contour__formula-hint" x-text="t('formulaHint')"></p>
        <p class="contour__formula-error" role="alert" x-show="formulaError" x-text="formulaErrorText()"></p>
      </div>
    </div>

    <input type="hidden" data-ref="xLabel" :value="model.xLabel" @change="setParam('xLabel', $event.target.value)">
    <input type="hidden" data-ref="yLabel" :value="model.yLabel" @change="setParam('yLabel', $event.target.value)">
    <div class="dmike-split__section-title" x-text="t('sectionAxes')"></div>
    <div class="contour__row-2">
      <div class="field-group contour__field-sm"><label data-help-key="modules.contour-plot.types.Params.xMin">X min</label><input type="number" class="field field--num" data-ref="xMin" :value="model.xMin" @change="onAxisInput('xMin', $event)"></div>
      <div class="field-group contour__field-sm"><label data-help-key="modules.contour-plot.types.Params.xMax">X max</label><input type="number" class="field field--num" data-ref="xMax" :value="model.xMax" @change="onAxisInput('xMax', $event)"></div>
    </div>
    <div class="contour__row-2">
      <div class="field-group contour__field-sm"><label data-help-key="modules.contour-plot.types.Params.yMin">Y min</label><input type="number" class="field field--num" data-ref="yMin" :value="model.yMin" @change="onAxisInput('yMin', $event)"></div>
      <div class="field-group contour__field-sm"><label data-help-key="modules.contour-plot.types.Params.yMax">Y max</label><input type="number" class="field field--num" data-ref="yMax" :value="model.yMax" @change="onAxisInput('yMax', $event)"></div>
    </div>
    <div class="field-group"><label data-help-key="modules.contour-plot.types.Params.zLabel" x-text="t('zName')"></label><input type="text" class="field" data-ref="zLabel" :value="model.zLabel" @change="setParam('zLabel', $event.target.value)"></div>

    <div class="dmike-split__section-title" x-text="t('sectionDataSource')"></div>
    <div data-ref="picker-wrap"></div>
  </aside>

  <main class="contour__output dmike-split__output">
    <div class="contour__info-row" data-ref="infoRow" style="display:none">
      <div class="contour__info-card"><div class="contour__info-label" data-help-key="modules.contour-plot.types.Surface.zMin">Z Min</div><div class="contour__info-value" data-ref="infoZmin">–</div><div class="contour__info-sub" data-ref="infoZminPos"></div></div>
      <div class="contour__info-card"><div class="contour__info-label" data-help-key="modules.contour-plot.types.Surface.zMax">Z Max</div><div class="contour__info-value" data-ref="infoZmax">–</div><div class="contour__info-sub" data-ref="infoZmaxPos"></div></div>
      <div class="contour__info-card"><div class="contour__info-label" data-help-key="modules.contour-plot.types.Surface.range" x-text="t('range')"></div><div class="contour__info-value" data-ref="infoRange">–</div><div class="contour__info-sub" data-ref="infoRangeSub"></div></div>
      <div class="contour__info-card"><div class="contour__info-label" data-help-key="modules.contour-plot.types.Surface.optimum" x-text="t('optimum')"></div><div class="contour__info-value contour__info-value--opt" data-ref="infoOpt">–</div><div class="contour__info-sub" data-ref="infoOptPos"></div></div>
    </div>

    <div class="contour__placeholder" data-ref="placeholder"></div>

    <div class="contour__chart-area" data-ref="chart-area" style="display:none">
      <div class="contour__chart-card" data-ref="chart-card">
        <div class="contour__chart-main">
          <div class="contour__chart-wrap" data-ref="chart-wrap">
            <canvas data-ref="canvas"></canvas>
            <div class="dmike-chart-tooltip" data-ref="tooltip"
                 :class="tip.visible ? 'visible' : ''"
                 :style="'left:' + tip.left + 'px;top:' + tip.top + 'px'">
              <b x-text="xLabelText + ':'"></b> <span x-text="tip.x"></span><br>
              <b x-text="yLabelText + ':'"></b> <span x-text="tip.y"></span><br>
              <b x-text="zLabelText + ':'"></b> <span x-text="tip.z"></span>
            </div>
          </div>
          <div class="contour__legend" data-ref="legend" x-show="legendShow">
            <span class="contour__legend-title" x-text="legend.title"></span>
            <template x-for="(it, i) in legend.items" :key="i">
              <span class="contour__legend-item"><span class="contour__legend-swatch" :style="'background:' + it.color"></span><span x-text="it.value"></span></span>
            </template>
          </div>
        </div>
        <div class="contour__editor" data-ref="editor-panel">
          <div class="contour__editor-inner" data-ref="editor-inner"></div>
        </div>
      </div>
    </div>
  </main>
</div>
