<div class="resampling dmike-split" x-data="resampling">

  <!-- ─── Input (left) ─────────────────────────────────────────── -->
  <div class="resampling__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionMode')"></div>
    <div class="btn-group">
      <button type="button" class="btn--segment" data-ref="mode-one" data-mode="one"
        :class="isMode('one') ? 'btn--active' : ''" @click="setMode('one')" x-text="t('modeOne')"></button>
      <button type="button" class="btn--segment" data-ref="mode-two" data-mode="two"
        :class="isMode('two') ? 'btn--active' : ''" @click="setMode('two')" x-text="t('modeTwo')"></button>
      <button type="button" class="btn--segment" data-ref="mode-paired" data-mode="paired"
        :class="isMode('paired') ? 'btn--active' : ''" @click="setMode('paired')" x-text="t('modePaired')"></button>
      <button type="button" class="btn--segment" data-ref="mode-k" data-mode="k"
        :class="isMode('k') ? 'btn--active' : ''" @click="setMode('k')" x-text="t('modeK')"></button>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <template x-if="isMode('k')">
      <div class="field-group">
        <label x-text="t('kColumns')"></label>
        <div data-ref="picker-k-wrap"></div>
      </div>
    </template>
    <template x-if="!isMode('k')">
      <div class="resampling__contents">
        <div class="field-group">
          <label x-text="t(sampleLabelKey(1))"></label>
          <div data-ref="picker1-wrap"></div>
        </div>
        <template x-if="!isMode('one')">
          <div class="field-group">
            <label x-text="t(sampleLabelKey(2))"></label>
            <div data-ref="picker2-wrap"></div>
          </div>
        </template>
      </div>
    </template>

    <div class="dmike-split__section-title" x-text="t('sectionStatistic')"></div>
    <div class="field-group">
      <label x-text="t('statistic')"></label>
      <select class="field" data-ref="statistic" :value="model.statisticId" @change="onParamInput('statisticId', $event)">
        <template x-for="o in statisticChoices()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.statisticId" x-text="o.label"></option>
        </template>
      </select>
    </div>
    <div class="field-group" x-show="showTrim()">
      <label x-text="t('trim')"></label>
      <input type="number" class="field field--num" data-ref="trim" min="0" max="0.49" step="0.01" :value="model.statParams.trim" @change="onParamInput('statParams.trim', $event)">
    </div>
    <div class="field-group" x-show="showQuantileP()">
      <label x-text="t('quantileP')"></label>
      <input type="number" class="field field--num" data-ref="quantile-p" min="0" max="1" step="0.01" :value="model.statParams.p" @change="onParamInput('statParams.p', $event)">
    </div>
    <div class="field-row" x-show="showLimits()">
      <div class="field-group">
        <label x-text="t('lsl')"></label>
        <input type="text" class="field field--num" data-ref="lsl" :value="model.statParams.lsl" @input="onParamInput('statParams.lsl', $event)">
      </div>
      <div class="field-group">
        <label x-text="t('usl')"></label>
        <input type="text" class="field field--num" data-ref="usl" :value="model.statParams.usl" @input="onParamInput('statParams.usl', $event)">
      </div>
    </div>
    <div class="field-group" x-show="showContrast()">
      <label x-text="t('contrast')"></label>
      <select class="field" data-ref="contrast" :value="model.contrast" @change="onParamInput('contrast', $event)">
        <template x-for="o in contrastChoices()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.contrast" x-text="o.label"></option>
        </template>
      </select>
    </div>
    <div class="field-group" x-show="showDirection()">
      <label x-text="t('direction')"></label>
      <select class="field" data-ref="direction" :value="model.direction" @change="onParamInput('direction', $event)">
        <template x-for="o in directionChoices()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.direction" x-text="o.label"></option>
        </template>
      </select>
    </div>
    <div class="field-group" x-show="showTarget()">
      <label x-text="t('target')"></label>
      <input type="text" class="field field--num" data-ref="target" :placeholder="t('targetPh')" :value="model.target" @input="onParamInput('target', $event)">
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionSettings')"></div>
    <div class="field-row">
      <div class="field-group">
        <label x-text="t('B')"></label>
        <input type="number" class="field field--num" data-ref="b" min="1000" max="100000" step="1000" :value="model.B" @change="onParamInput('B', $event)">
      </div>
      <div class="field-group">
        <label x-text="t('confidence')"></label>
        <input type="number" class="field field--num" data-ref="confidence" min="0.5" max="0.999" step="0.01" :value="model.confidence" @change="onParamInput('confidence', $event)">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label x-text="t('seed')"></label>
        <input type="number" class="field field--num" data-ref="seed" min="0" step="1" :value="model.seed" @change="onParamInput('seed', $event)">
      </div>
      <button type="button" class="btn resampling__seed-roll" data-ref="seed-roll" :title="t('rollSeed')" :aria-label="t('rollSeed')" @click="rollSeed()">
        <span class="icon" data-icon="action.roll-seed" aria-hidden="true"></span>
      </button>
    </div>
    <div class="field-group">
      <label x-text="t('ciMethod')"></label>
      <select class="field" data-ref="ci-method" :value="model.ciMethod" @change="onParamInput('ciMethod', $event)">
        <template x-for="o in ciMethodChoices()" :key="o.value">
          <option :value="o.value" :selected="o.value === model.ciMethod" x-text="o.label"></option>
        </template>
      </select>
    </div>

    <p class="resampling__validation" data-ref="validation" x-show="showValidation()" x-text="validationKey ? t(validationKey) : ''"></p>

    <button type="button" class="dmike-btn-run" data-ref="compute" :disabled="!canCompute()" @click="compute()">
      <span class="icon icon--sm" data-icon="action.run" aria-hidden="true"></span>
      <span x-text="t('compute')"></span>
    </button>
    <div class="resampling__running" x-show="running">
      <progress class="resampling__progress" data-ref="progress" max="1" :value="progress"></progress>
      <button type="button" class="btn" data-ref="cancel" @click="cancel()" x-text="t('cancel')"></button>
    </div>
    <p class="resampling__error" data-ref="error" x-show="errorKey" x-text="errorKey ? t(errorKey) : ''"></p>
  </div>

  <!-- ─── Output (right) ───────────────────────────────────────── -->
  <div class="resampling__output dmike-split__output" data-ref="output" :data-run="runCount">

    <div class="resampling__placeholder" data-ref="placeholder" x-show="!view">
      <span class="icon icon--lg icon--empty-state" data-icon="status.no-data" aria-hidden="true"></span>
      <p x-text="t('placeholderText')"></p>
    </div>

    <p class="resampling__stale" data-ref="stale" x-show="view && stale" x-text="t('stale')"></p>

    <template x-if="view">
      <div class="resampling__contents">
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionResult')"></span></div>
        <p class="resampling__statement" data-ref="result-statement" x-show="statement.length" x-text="statementText()"></p>
        <table class="dmike-table dmike-table--head-mono resampling__result-table" data-ref="result-table">
          <thead>
            <tr>
              <th x-text="t('estimate')"></th>
              <th x-show="view.hasBoot" x-text="t('se')"></th>
              <th x-show="view.hasBoot" x-text="t('bias')"></th>
              <th x-show="view.hasBoot" x-text="t('interval') + ' (' + t(model.ciMethod === 'bca' ? 'ciBca' : 'ciPercentile') + ')'"></th>
              <th x-show="view.decisionKey" x-text="t('decision')"></th>
              <th x-show="view.hasTest" x-text="t('observedT')"></th>
              <th x-show="view.hasTest" x-text="t('pValue')"></th>
              <th x-show="view.hasTest" x-text="t('permutations')"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-ref="result-estimate" x-text="view.estimate"></td>
              <td x-show="view.hasBoot" data-ref="result-se" x-text="view.se"></td>
              <td x-show="view.hasBoot" data-ref="result-bias" x-text="view.bias"></td>
              <td x-show="view.hasBoot" data-ref="result-interval" x-text="view.interval"></td>
              <td x-show="view.decisionKey" data-ref="result-decision" x-text="view.decisionKey ? t(view.decisionKey) : ''"></td>
              <td x-show="view.hasTest" data-ref="result-observed" x-text="view.test ? view.test.observed : ''"></td>
              <td x-show="view.hasTest" data-ref="result-pvalue" x-text="view.test ? view.test.pValue : ''"></td>
              <td x-show="view.hasTest" data-ref="result-method" x-text="view.test ? t(view.test.methodKey) + ' · ' + view.test.permutations : ''"></td>
            </tr>
          </tbody>
        </table>
        <p class="resampling__note" data-ref="result-bca-fallback" x-show="view.bcaFallback" x-text="t('bcaFallback')"></p>
      </div>
    </template>

    <div class="dmike-split__output-section" x-show="view && view.hasBoot"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionBootChart')"></span></div>
    <div class="resampling__chart" data-ref="chart-boot" x-show="view && view.hasBoot"></div>
    <div class="dmike-split__output-section" x-show="view && view.hasTest"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionPermChart')"></span></div>
    <div class="resampling__chart" data-ref="chart-perm" x-show="view && view.hasTest"></div>

    <template x-if="view && view.isK">
      <div class="resampling__contents">
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionGroups')"></span></div>
        <table class="resampling__table" data-ref="groups-table">
          <thead><tr><th x-text="t('group')"></th><th>n</th><th x-text="t('estimate')"></th><th x-text="t('interval')"></th></tr></thead>
          <tbody>
            <template x-for="(g, idx) in view.groups" :key="idx">
              <tr><td x-text="g.label"></td><td x-text="g.n"></td><td x-text="g.estimate"></td><td x-text="g.interval"></td></tr>
            </template>
          </tbody>
        </table>
        <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionPosthoc')"></span></div>
        <table class="resampling__table" data-ref="posthoc-table">
          <thead><tr><th x-text="t('pair')"></th><th x-text="t('estimate')"></th><th x-text="t('interval')"></th><th x-text="t('pRaw')"></th><th x-text="t('pHolm')"></th><th x-text="t('pMethod')"></th></tr></thead>
          <tbody>
            <template x-for="(h, idx) in view.posthoc" :key="idx">
              <tr><td x-text="h.pair"></td><td x-text="h.contrast"></td><td x-text="h.interval"></td><td x-text="h.pRaw"></td><td x-text="h.pHolm"></td><td x-text="t(h.methodKey)"></td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>
</div>
