<div class="mosaic-module dmike-split dmike-split--input-sm" x-data="mosaic">
  <!-- data-help-key="" am Auswahl-Host ist gewollt: die Hilfe hängt an den Slots des Pickers (fields.datasets.*). -->
  <div class="mosaic-module__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div class="mosaic-module__picker" data-ref="picker-wrap" data-help-key="" x-field="model.datasets"></div>
  </div>

  <div class="mosaic-module__output dmike-split__output">
    <div data-ref="placeholder" class="mosaic-module__placeholder" x-show="!hasSeries" x-text="t('placeholderPickBoth')"></div>
    <template x-if="hasSeries">
      <div class="mosaic-module__chart-area" data-ref="chart-area">
        <div class="mosaic-module__chart-wrap" data-ref="chart-wrap" x-widget="mosaic-chart" x-widget-config="mosaicChart" x-widget-value="model.chart" x-widget-legacy-edit-key="legacyEditKey"></div>
        <div class="mosaic-module__stats-panel" data-ref="stats-panel">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
            <table class="dmike-table mosaic-module__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.mosaic.types.MosaicStats.categories" x-text="statsCorner"></span></th>
                <template x-for="(h, hi) in statsHeaders" :key="hi">
                  <th><span class="mosaic-module__stats-color" :style="swatchStyle(h)"></span><span x-text="h.name"></span></th>
                </template>
                <th><span data-help-key="modules.mosaic.types.MosaicStats.total" x-text="t('statTotal')"></span></th>
              </tr></thead>
              <tbody>
                <template x-for="(r, i) in statsRows" :key="i">
                  <tr>
                    <td x-text="r.label"></td>
                    <template x-for="(c, ci) in r.cells" :key="ci">
                      <td x-text="c"></td>
                    </template>
                    <td x-text="r.total"></td>
                  </tr>
                </template>
                <tr class="mosaic-module__stats-total">
                  <td x-text="t('statTotal')"></td>
                  <template x-for="(c, ci) in statsColTotals" :key="ci">
                    <td x-text="c"></td>
                  </template>
                  <td x-text="statsGrandTotal"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
