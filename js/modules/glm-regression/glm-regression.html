<div class="glm dmike-split" x-data="glmRegression">
  <!-- ─── Input (left) ─────────────────────────────────────────── -->
  <div class="glm__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <div class="field-group">
      <label data-help-key="modules.glm-regression.actions.setColumns.help" x-text="t('selectColumns')"></label>
      <div data-ref="picker-cols"></div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.glm-regression.actions.setColumn.help" x-text="t('columnY')"></label>
      <select class="field" data-ref="y-select" @change="onYChange($event)">
        <option value="" :selected="!model.yKey" x-text="t('selectYHint')"></option>
        <template x-for="opt in yOptions()" :key="opt.key">
          <option :value="opt.key" :selected="opt.key === model.yKey" x-text="opt.name"></option>
        </template>
      </select>
    </div>

    <div class="field-group">
      <label><span data-help-key="modules.glm-regression.actions.setColumn.help" x-text="t('columnTrials')"></span> <span class="dmike-hint" x-text="t('columnTrialsHint')"></span></label>
      <select class="field" data-ref="trials-select" @change="onTrialsChange($event)">
        <option value="" :selected="!model.trialsKey" x-text="t('trialsNone')"></option>
        <template x-for="opt in trialsOptions()" :key="opt.key">
          <option :value="opt.key" :selected="opt.key === model.trialsKey" x-text="opt.name"></option>
        </template>
      </select>
    </div>

    <div class="dmike-split__section-title"><span data-help-key="modules.glm-regression.types.Params.method" x-text="t('sectionMethod')"></span></div>

    <div class="glm__method-group" data-ref="method-group" @change="onMethodChange($event)">
      <template x-for="opt in methodOptions()" :key="opt.value">
        <label class="glm__method-option">
          <input type="radio" :name="methodRadioName()" :value="opt.value" :checked="model.method === opt.value">
          <span x-text="opt.label"></span>
        </label>
      </template>
    </div>

    <div class="glm__detect-info" :class="detectInfoClass()" data-ref="detect-info"><span data-help-key="modules.glm-regression.types.Result.autoReason" x-text="detectInfoText()"></span></div>

    <div class="dmike-split__section-title" x-text="t('sectionSettings')"></div>

    <div class="field-row">
      <div class="field-group field-group--grow">
        <label data-help-key="modules.glm-regression.types.Params.confLevel"><span x-text="t('confLevel')"></span> (%)</label>
        <input type="text" class="field field--num" data-ref="conf-level" inputmode="decimal"
          :value="confDisplay()" placeholder="95" @change="onConfChange($event)">
      </div>
      <div class="field-group field-group--grow">
        <label data-help-key="modules.glm-regression.types.Params.alpha"><span x-text="t('alphaRisk')"></span> (%)</label>
        <input type="text" class="field field--num" data-ref="alpha-level" inputmode="decimal"
          :value="alphaDisplay()" placeholder="5" @change="onAlphaChange($event)">
      </div>
    </div>

    <div class="glm__error" data-ref="error-box" :style="errorStyle()" x-text="errorText()"></div>
  </div>

  <!-- ─── Output (right) ───────────────────────────────────────── -->
  <div class="glm__output dmike-split__output">
    <div data-ref="results" :style="resultsStyle()">
      <template x-if="result">
        <div>
          <!-- Tabs -->
          <div class="glm__tabs dmike-tabs">
            <template x-for="tb in tabs()" :key="tb.id">
              <button class="dmike-tab" :class="tb.id === model.activeTab ? 'dmike-tab--active' : ''"
                data-action="tab" :data-tab="tb.id" @click="changeRoute(tb.id)" x-text="tb.label"></button>
            </template>
          </div>

          <!-- ── Tab: Model ── -->
          <div class="dmike-tab-content" :class="model.activeTab === 'model' ? 'dmike-tab-content--active' : ''"
            data-tab-content="model" x-show="model.activeTab === 'model'">

            <template x-for="(w, wi) in result.warnings" :key="wi">
              <div class="glm__warning" x-text="w"></div>
            </template>

            <div class="glm__model-actions">
              <button class="btn btn--primary" data-action="save-as-model" type="button" data-help-key="modules.glm-regression.actions.saveAsModel.help"
                :title="t('saveAsModelHint')" @click="saveAsModel()"
                x-text="model.savedModelId ? t('updateModel') : t('saveAsModel')"></button>
              <span class="glm__model-status" data-ref="model-status"
                x-text="model.savedModelId ? t('modelSaved') : ''"></span>
            </div>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('modelSummary')"></span></div>
            <div class="glm__quality-grid">
              <template x-for="item in result.summaryItems" :key="item.label">
                <div class="glm__quality-item">
                  <span class="glm__quality-label" :data-help-key="item.help" x-text="item.label"></span>
                  <span class="glm__quality-value">
                    <span x-text="item.value"></span>
                    <template x-if="item.swap">
                      <button class="btn btn--xs" data-action="swap-success" type="button" data-help-key="modules.glm-regression.actions.swapSuccess.help"
                        :title="t('swapSuccessTitle')" @click="swapSuccess()"
                        x-text="item.swap"></button>
                    </template>
                  </span>
                </div>
              </template>
            </div>

            <!-- KPI strip -->
            <div class="dmike-kpi-strip">
              <template x-for="kpi in result.kpis" :key="kpi.label">
                <div class="dmike-kpi" :class="kpi.mod">
                  <div class="dmike-kpi-value" x-text="kpi.value"></div>
                  <div class="dmike-kpi-label" :data-help-key="kpi.help" x-text="kpi.label"></div>
                </div>
              </template>
            </div>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('modelQuality')"></span></div>
            <div class="glm__quality-grid">
              <template x-for="item in result.qualityItems" :key="item.label">
                <div class="glm__quality-item">
                  <span class="glm__quality-label" :data-help-key="item.help" x-text="item.label"></span>
                  <span class="glm__quality-value" x-text="item.value"></span>
                </div>
              </template>
            </div>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.glm-regression.types.Result.equation" x-text="t('equation')"></span></div>
            <div class="glm__equation" x-text="result.equation"></div>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('coefTable')"></span></div>
            <table class="glm__coef-table">
              <thead><tr>
                <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.term" x-text="t('term')"></span></th>
                <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.estimate" x-text="t('coefficient')"></span></th>
                <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.se" x-text="t('common.sym.se')"></span></th>
                <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.z" x-text="t('common.sym.z')"></span></th>
                <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.p" x-text="t('pValue')"></span></th>
                <template x-if="result.ratioHeader">
                  <th><span data-help-key="modules.glm-regression.types.GlmCoefficient.ratio" x-text="result.ratioHeader"></span></th>
                </template>
                <th></th>
              </tr></thead>
              <tbody>
                <template x-for="row in result.coefRows" :key="row.term">
                  <tr>
                    <td x-text="row.term"></td>
                    <td x-text="row.coef"></td>
                    <td x-text="row.se"></td>
                    <td x-text="row.z"></td>
                    <td :class="row.pClass" x-text="row.p"></td>
                    <template x-if="result.ratioHeader">
                      <td x-text="row.ratio"></td>
                    </template>
                    <td :class="row.pClass" x-text="row.stars"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- ── Tab: Diagnostics ── -->
          <div class="dmike-tab-content" :class="model.activeTab === 'diagnostics' ? 'dmike-tab-content--active' : ''"
            data-tab-content="diagnostics" x-show="model.activeTab === 'diagnostics'">

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('residualsVsFitted')"></span></div>
            <div data-ref="chart-residuals" style="height:280px"></div>
            <template x-if="chartErr('residuals')">
              <div class="dmike-chart-error" x-text="chartErr('residuals')"></div>
            </template>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('qqTitle')"></span></div>
            <div data-ref="chart-qq" style="height:280px"></div>
            <template x-if="chartErr('qq')">
              <div class="dmike-chart-error" x-text="chartErr('qq')"></div>
            </template>

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('cooksTitle')"></span></div>
            <div data-ref="chart-cooks" style="height:250px"></div>
            <template x-if="chartErr('cooks')">
              <div class="dmike-chart-error" x-text="chartErr('cooks')"></div>
            </template>

            <template x-if="result.vifRows">
              <div>
                <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('common.sym.vif')"></span></div>
                <table class="glm__coef-table">
                  <thead><tr><th><span data-help-key="modules.glm-regression.types.GlmCoefficient.term" x-text="t('term')"></span></th><th><span data-help-key="modules.glm-regression.types.Result.vif" x-text="t('common.sym.vif')"></span></th><th></th></tr></thead>
                  <tbody>
                    <template x-for="row in result.vifRows" :key="row.term">
                      <tr>
                        <td data-help-key="modules.glm-regression.types.Result.vifTerms" x-text="row.term"></td>
                        <td x-text="row.vif"></td>
                        <td :class="row.warnClass">
                          <span class="icon icon--sm icon--text" data-icon="status.warning" aria-hidden="true" x-show="row.warnIcon"></span>
                          <span x-show="!row.warnIcon" x-text="row.warnText"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <template x-if="result.overdispersion">
              <div>
                <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('overdispersionTitle')"></span></div>
                <div class="glm__quality-grid">
                  <template x-for="item in result.overdispersion.items" :key="item.label">
                    <div class="glm__quality-item">
                      <span class="glm__quality-label" :data-help-key="item.help" x-text="item.label"></span>
                      <span class="glm__quality-value" x-text="item.value"></span>
                    </div>
                  </template>
                </div>
                <template x-if="result.overdispersion.hint">
                  <div class="glm__warning" x-text="result.overdispersion.hint"></div>
                </template>
              </div>
            </template>
          </div>

          <!-- ── Tab: ROC (binomial only) ── -->
          <template x-if="result.isBinomial">
            <div class="dmike-tab-content" :class="model.activeTab === 'roc' ? 'dmike-tab-content--active' : ''"
              data-tab-content="roc" x-show="model.activeTab === 'roc'">

              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('rocCurve')"></span></div>
              <div data-ref="chart-roc" style="height:320px"></div>
              <template x-if="chartErr('roc')">
                <div class="dmike-chart-error" x-text="chartErr('roc')"></div>
              </template>

              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('classificationTitle')"></span></div>

              <div class="glm__cutoff-row">
                <label data-help-key="modules.glm-regression.types.Params.cutoff" x-text="t('cutoff')"></label>
                <input type="range" min="0" max="1" step="0.01" :value="model.cutoff"
                  data-ref="cutoff-slider" @input="onCutoff($event)">
                <span class="glm__cutoff-value" data-ref="cutoff-display" x-text="cutoffDisplay()"></span>
              </div>

              <table class="glm__class-table">
                <thead>
                  <tr><th></th><th><span data-help-key="modules.glm-regression.types.Classification.cutoff"><span x-text="t('predicted')"></span> 1</span></th><th><span data-help-key="modules.glm-regression.types.Classification.cutoff"><span x-text="t('predicted')"></span> 0</span></th></tr>
                </thead>
                <tbody>
                  <tr><th><span data-help-key="modules.glm-regression.types.Classification.sensitivity"><span x-text="t('actual')"></span> 1</span></th><td class="glm__tp" x-text="classView().tp"></td><td class="glm__fn" x-text="classView().fn"></td></tr>
                  <tr><th><span data-help-key="modules.glm-regression.types.Classification.specificity"><span x-text="t('actual')"></span> 0</span></th><td class="glm__fp" x-text="classView().fp"></td><td class="glm__tn" x-text="classView().tn"></td></tr>
                </tbody>
              </table>

              <div class="glm__quality-grid" data-ref="class-metrics">
                <template x-for="item in classView().metrics" :key="item.label">
                  <div class="glm__quality-item">
                    <span class="glm__quality-label" :data-help-key="item.help" x-text="item.label"></span>
                    <span class="glm__quality-value" x-text="item.value"></span>
                  </div>
                </template>
              </div>

              <template x-if="result.aucText">
                <div class="glm__quality-grid">
                  <div class="glm__quality-item">
                    <span class="glm__quality-label" data-help-key="modules.glm-regression.types.Result.auc" x-text="t('common.sym.auc')"></span>
                    <span class="glm__quality-value" x-text="result.aucText"></span>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- ── Tab: Prediction ── -->
          <div class="dmike-tab-content" :class="model.activeTab === 'prediction' ? 'dmike-tab-content--active' : ''"
            data-tab-content="prediction" x-show="model.activeTab === 'prediction'">

            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('predictionTitle')"></span></div>

            <div class="glm__predict-inputs">
              <template x-for="term in predictionTerms()" :key="term.idx">
                <div class="glm__predict-row">
                  <label x-text="term.label"></label>
                  <input type="text" class="field field--num" :data-ref="'pred-x-' + term.idx"
                    inputmode="decimal" placeholder="0"
                    :value="predictInputs[term.label] ?? ''"
                    @input="setPredictInput(term.label, $event.target.value)">
                </div>
              </template>
            </div>

            <button class="btn btn--xs" data-action="predict" type="button" data-help-key="modules.glm-regression.actions.predict.help"
              @click="runPrediction()" x-text="t('predictCalc')"></button>
            <div class="glm__predict-result" data-ref="predict-result"
              :style="(predictResult || predictError) ? '' : 'display:none'">
              <template x-if="predictResult">
                <div>
                  <div><strong x-text="t('linearPredictor') + ':'"></strong> <span x-text="predictResult.linear"></span></div>
                  <div><strong x-text="predictResult.respLabel + ':'"></strong> <span x-text="predictResult.response"></span></div>
                  <div><strong x-text="predictResult.ciLabel"></strong> <span x-text="predictResult.ci"></span>
                    <template x-if="predictResult.ciHint">
                      <span class="dmike-hint" x-text="predictResult.ciHint"></span>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="predictError">
                <span x-text="predictError"></span>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
