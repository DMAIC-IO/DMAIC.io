<div class="doe dmike-split dmike-split--input-lg" x-data="doePlanner">
  <div class="doe__input dmike-split__input">

    <!-- Project (EVOP) toggle -->
    <label class="doe__project-toggle" data-help-key="modules.doe-planner.actions.evop.setProjectMode.help">
      <input type="checkbox" class="doe__project-check" x-model="model.projectMode" @change="evop.setProjectMode(model.projectMode)" />
      <span x-text="t('projectMode')"></span>
    </label>

    <!-- Project bar (EVOP) -->
    <template x-if="model.projectMode">
      <div class="doe__project-bar">
        <div class="doe__project-name-row">
          <label class="doe__name-label" data-help-key="modules.doe-planner.actions.evop.setProjectName.help" x-text="t('projectName')"></label>
          <input type="text" class="field doe__project-name-input"
                 x-model="model.projectName" @change="evop.setProjectName(model.projectName)"
                 :placeholder="t('projectNamePlaceholder')" />
        </div>

        <!-- Timeline -->
        <template x-if="model.projectPhases.length > 0">
          <div class="doe__timeline">
            <h4 class="doe__timeline-title" data-help-key="modules.doe-planner.types.DoeEvop.phases" x-text="t('phaseHistory')"></h4>
            <div class="doe__timeline-track">
              <template x-for="(ph, idx) in model.projectPhases" :key="idx">
                <button class="doe__timeline-item" :class="evop.timelineItemClass(idx)" :data-phase-idx="idx" type="button" @click="evop.viewPhase(idx)">
                  <span class="doe__timeline-num" x-text="ph.cycleNumber"></span>
                  <span class="doe__timeline-label" x-text="evop.phaseLabel(ph)"></span>
                  <template x-if="evop.phaseDecIcon(ph)">
                    <span class="doe__timeline-dec icon icon--sm" :data-icon="evop.phaseDecIcon(ph)" aria-hidden="true"></span>
                  </template>
                </button>
              </template>
              <template x-if="evop.canStartNewPhase()">
                <button class="doe__timeline-item doe__timeline-item--new doe__new-phase-btn" data-help-key="modules.doe-planner.actions.evop.newPhase.help" type="button" @click="evop.newPhase()">
                  <span class="doe__timeline-num">+</span>
                  <span class="doe__timeline-label" x-text="t('newPhase')"></span>
                </button>
              </template>
            </div>
          </div>
        </template>

        <!-- EVOP summary -->
        <template x-if="evop.evopSummary()">
          <div class="doe__evop-summary">
            <h4 class="doe__evop-title" data-help-key="modules.doe-planner.types.DoeEvop.summary" x-text="t('evopEffectTable')"></h4>
            <div class="doe__evop-meta">
              <span x-text="t('evopCycles', { n: evop.evopSummary().cycleCount })"></span>
              <span x-text="t('evopTotalRuns', { n: evop.evopSummary().totalRuns })"></span>
              <span x-text="evop.evopMeanLabel()"></span>
            </div>
            <table class="doe__evop-table">
              <thead><tr>
                <th data-help-key="modules.doe-planner.columns.term" x-text="t('term')"></th>
                <th data-help-key="modules.doe-planner.columns.effect" x-text="t('effect')"></th>
                <th data-help-key="modules.doe-planner.columns.evopErrorLimit" x-text="t('evopErrorLimit')"></th>
                <th data-help-key="modules.doe-planner.columns.evopSignificant" x-text="t('evopSignificant')"></th>
              </tr></thead>
              <tbody>
                <template x-for="(e, ei) in evop.evopSummary().effects" :key="ei">
                  <tr :class="e.significant ? 'doe__evop-sig' : ''">
                    <td x-text="e.term"></td>
                    <td x-text="fmt4(e.cumulativeEffect)"></td>
                    <td x-text="evop.evopErrorLimit(e)"></td>
                    <td x-text="e.significant ? '★' : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="evop.evopSummary().bestPointDescription">
              <div class="doe__evop-best">
                <span class="doe__evop-best-label" x-text="t('evopBestPoint') + ':'"></span>
                <code x-text="evop.evopSummary().bestPointDescription"></code>
              </div>
            </template>
            <div class="doe__evop-recommendation" :class="'doe__evop-rec--' + evop.evopSummary().overallRecommendation"
                 x-text="t('evopRec_' + evop.evopSummary().overallRecommendation)"></div>
          </div>
        </template>
      </div>
    </template>

    <!-- Name bar -->
    <div class="doe__name-bar">
      <label class="doe__name-label" data-help-key="modules.doe-planner.actions.setDoeName.help" x-text="model.projectMode ? t('phaseName') : t('doeName')"></label>
      <input type="text" class="field doe__name-input"
             x-model="model.doeName" @change="setDoeName(model.doeName)"
             :placeholder="t('doeNamePlaceholder')" />
    </div>

    <!-- ── Factors section ────────────────────────────────────── -->
    <div class="dmike-split__section-title" data-help-key="modules.doe-planner.fields.factors.help" x-text="t('stepFactors')"></div>
    <div class="doe__factors-list">
      <template x-for="(f, fi) in model.factors" :key="f.id">
        <div class="doe__factor-row" :data-factor-id="f.id" :data-factor-kind="factors.factorKind(f)">
          <div class="doe__factor-top">
            <span class="doe__factor-letter" x-text="factors.factorLetter(fi)"></span>
            <input type="text" class="field doe__factor-name" :data-factor-id="f.id"
                   :class="factors.factorNameClass(f)" :title="factors.factorNameTitle(f)"
                   x-model.lazy="f.name" @change="factors.setFactorName(f.id, f.name)"
                   :placeholder="t('factorNamePlaceholder')" />
            <input type="text" class="field doe__factor-unit doe__factor-unit--narrow" :data-factor-id="f.id"
                   x-model.lazy="f.unit" @change="factors.setFactorUnit(f.id, f.unit)"
                   :placeholder="t('factorUnitPlaceholder')"
                   :disabled="factors.isCategorical(f)" :title="factors.factorUnitTitle(f)" />
            <select class="field doe__factor-kind" :data-factor-id="f.id"
                    :title="t('factorKindLabel')"
                    x-model="f.kind" @change="factors.setFactorKind(f.id, f.kind)">
              <option value="continuous" x-text="t('factorKindContinuous')"></option>
              <option value="categorical" x-text="t('factorKindCategorical')"></option>
            </select>
            <button class="doe__factor-remove-btn" type="button" :data-factor-id="f.id"
                    :title="t('removeFactor')" @click="factors.removeFactor(f.id)">&#10005;</button>
          </div>
          <div class="doe__levels-row">
            <button class="doe__insert-level-btn" type="button"
                    :data-factor-id="f.id" data-insert-at="0"
                    :title="t('insertLevel')" @click="factors.insertLevel(f.id, 0)">+</button>
            <template x-for="(val, li) in f.levels" :key="li">
              <div class="doe__level-frag">
                <div class="doe__level-chip">
                  <span class="doe__level-num" x-text="li + 1"></span>
                  <input type="text" class="field doe__factor-level-input"
                         :data-factor-id="f.id" :data-level-idx="li"
                         x-model.lazy="f.levels[li]" @change="factors.setLevel(f.id, li, f.levels[li])"
                         :placeholder="factors.levelPlaceholder(f)" />
                  <template x-if="f.levels.length > 2">
                    <button class="doe__remove-level-btn" type="button"
                            :data-factor-id="f.id" :data-level-idx="li"
                            :title="t('removeLevel')" @click="factors.removeLevel(f.id, li)">&#10005;</button>
                  </template>
                </div>
                <button class="doe__insert-level-btn" type="button"
                        :data-factor-id="f.id" :data-insert-at="li + 1"
                        :title="t('insertLevel')" @click="factors.insertLevel(f.id, li + 1)">+</button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
    <button class="btn btn--sm doe__add-factor-btn" data-help-key="modules.doe-planner.actions.factors.addFactor.help" type="button" @click="factors.addFactor()"><span x-text="'+ ' + t('addFactor')"></span></button>

    <!-- ── Responses section ──────────────────────────────────── -->
    <div class="dmike-split__section-title" data-help-key="modules.doe-planner.fields.responses.help" x-text="t('stepResponses')"></div>
    <div class="doe__responses-list">
      <template x-for="(r, ri) in model.responses" :key="ri">
        <div class="doe__response-row" :data-response-idx="ri">
          <div class="doe__response-top">
            <span class="doe__response-letter" x-text="factors.responseLetter(ri)"></span>
            <input type="text" class="field doe__response-name" :data-idx="ri"
                   x-model.lazy="r.name" @change="factors.setResponseName(ri, r.name)"
                   :placeholder="t('responseNamePlaceholder')" />
            <input type="text" class="field doe__response-unit doe__factor-unit--narrow" :data-idx="ri"
                   x-model.lazy="r.unit" @change="factors.setResponseUnit(ri, r.unit)"
                   :placeholder="t('responseUnitPlaceholder')" />
            <template x-if="model.responses.length > 1">
              <button class="doe__response-remove-btn" type="button" :data-idx="ri"
                      :title="t('removeResponse')" @click="factors.removeResponse(ri)">&#10005;</button>
            </template>
          </div>
        </div>
      </template>
    </div>
    <button class="btn btn--sm doe__add-response-btn" data-help-key="modules.doe-planner.actions.factors.addResponse.help" type="button" @click="factors.addResponse()"><span x-text="'+ ' + t('addResponse')"></span></button>

    <!-- ── Design section ─────────────────────────────────────── -->
    <div class="dmike-split__section-title" data-help-key="modules.doe-planner.actions.design.selectDesignType.help" x-text="t('stepDesignType')"></div>

    <!-- Recommendation -->
    <template x-if="design.recommendation()">
      <div class="doe__recommendation">
        <span class="doe__recommendation-icon">&#10024;</span>
        <span class="doe__recommendation-text" x-text="design.recommendationText()"></span>
        <button class="doe__recommendation-btn" data-help-key="modules.doe-planner.actions.design.applyRecommendation.help" :data-rec-type="design.recommendation()" type="button"
                @click="design.applyRecommendation()" x-text="t('design_' + design.recommendation())"></button>
      </div>
    </template>

    <div class="doe__design-options">
      <template x-for="dt in design.designTypes" :key="dt.key">
        <button class="doe__design-opt"
                :class="design.designOptClass(dt)" :data-type="dt.key" type="button"
                :disabled="design.designOptDisabled(dt)" :title="design.designOptTip(dt)"
                @click="design.selectDesignType(dt.key)">
          <span class="doe__design-opt-label" x-text="t('design_' + dt.key)"></span>
          <!-- Formula: full/frac carry HTML superscripts (cannot live in x-text);
               full also collapses to a "n×m×…" product for mixed-level factors. -->
          <template x-if="dt.key === 'full' && !design.fullIsProduct()">
            <span class="doe__design-opt-desc">2<sup>k</sup></span>
          </template>
          <template x-if="dt.key === 'full' && design.fullIsProduct()">
            <span class="doe__design-opt-desc" x-text="design.fullProductFormula()"></span>
          </template>
          <template x-if="dt.key === 'frac'">
            <span class="doe__design-opt-desc">2<sup>(k&minus;p)</sup></span>
          </template>
          <template x-if="dt.key !== 'full' && dt.key !== 'frac'">
            <span class="doe__design-opt-desc" x-text="dt.formula"></span>
          </template>
        </button>
      </template>
    </div>

    <!-- Resolution table (frac) -->
    <template x-if="model.designType === 'frac'">
      <div class="doe__sub-panel">
        <div class="dmike-split__section-title" data-help-key="modules.doe-planner.actions.design.selectResolution.help" x-text="t('resTableTitle')"></div>
        <div class="doe__res-info" x-text="design.resInfoText()"></div>
        <div class="doe__res-table-wrap">
          <table class="doe__res-table">
            <thead>
              <tr>
                <th class="doe__res-corner" x-text="t('runs')"></th>
                <th :colspan="design.kRange.length" style="text-align:center;letter-spacing:2px" x-text="t('factorsHeader')"></th>
              </tr>
              <tr>
                <th class="doe__res-corner"></th>
                <template x-for="k in design.kRange" :key="k">
                  <th :class="k === model.factors.length ? 'doe__res-col--active' : 'doe__res-col--inactive'" x-text="k"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="nRuns in design.allRuns" :key="nRuns">
                <tr>
                  <td class="doe__res-run-label" x-text="nRuns"></td>
                  <template x-for="k in design.kRange" :key="k">
                    <td>
                      <span class="doe__res-cell"
                            :class="design.resCellClass(k, nRuns)"
                            :data-k="design.resCellData(k, nRuns, 'k')"
                            :data-runs="design.resCellData(k, nRuns, 'runs')"
                            :data-res="design.resCellData(k, nRuns, 'res')"
                            :data-p="design.resCellData(k, nRuns, 'p')"
                            @click="design.resCellClick(k, nRuns)"
                            x-text="design.resCellLabel(k, nRuns)"></span>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <!-- Alias detail -->
        <template x-if="design.resAliasDetail()">
          <div class="doe__res-alias-detail">
            <span class="doe__res-alias-detail-title" x-text="t('aliasDetailTitle')"></span>
            <template x-if="design.resAliasDetail().generators.length">
              <div class="doe__res-alias-section">
                <span class="doe__res-alias-label" x-text="t('generators') + ':'"></span>
                <template x-for="(g, gi) in design.resAliasDetail().generators" :key="gi">
                  <code class="doe__res-alias-code" x-text="g"></code>
                </template>
              </div>
            </template>
            <template x-if="design.resAliasDetail().defining.length">
              <div class="doe__res-alias-section">
                <span class="doe__res-alias-label" x-text="t('definingRelation') + ':'"></span>
                <template x-for="(w, wi) in design.resAliasDetail().defining" :key="wi">
                  <code class="doe__res-alias-code" x-text="w"></code>
                </template>
              </div>
            </template>
            <template x-if="design.resAliasDetail().aliases.length">
              <table class="doe__res-alias-table">
                <thead><tr><th data-help-key="modules.doe-planner.columns.term" x-text="t('term')"></th><th data-help-key="modules.doe-planner.columns.aliasedWith" x-text="t('aliasedWith')"></th></tr></thead>
                <tbody>
                  <template x-for="(a, ai) in design.resAliasDetail().aliases" :key="ai">
                    <tr>
                      <td><code x-text="a.term"></code></td>
                      <td x-text="a.aliasedWith"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </div>
        </template>
        <!-- Legend -->
        <div class="doe__res-legend">
          <span class="doe__res-legend-title" x-text="t('resLegendTitle')"></span>
          <dl class="doe__res-legend-list">
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-full" x-text="t('resFull')"></span></dt><dd x-text="t('resLegendFull')"></dd></div>
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-vii">VII</span></dt><dd x-text="t('resLegendVII')"></dd></div>
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-vi">VI</span></dt><dd x-text="t('resLegendVI')"></dd></div>
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-v">V</span></dt><dd x-text="t('resLegendV')"></dd></div>
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-iv">IV</span></dt><dd x-text="t('resLegendIV')"></dd></div>
            <div class="doe__res-legend-item"><dt><span class="doe__res-cell doe__res-iii">III</span></dt><dd x-text="t('resLegendIII')"></dd></div>
          </dl>
        </div>
      </div>
    </template>

    <!-- PB table -->
    <template x-if="model.designType === 'pb'">
      <div class="doe__sub-panel">
        <div class="dmike-split__section-title" data-help-key="modules.doe-planner.actions.design.selectPB.help" x-text="t('pbTitle')"></div>
        <div class="doe__pb-info" x-text="design.pbInfoText()"></div>
        <table class="doe__pb-table">
          <thead><tr><th></th><th x-text="t('factors')"></th><th x-text="t('runs')"></th></tr></thead>
          <tbody>
            <template x-for="(d, di) in design.pbDesigns" :key="di">
              <tr class="doe__pb-row" :class="model.selectedPBIdx === di ? 'doe__pb-row--selected' : ''" :data-idx="di" @click="design.selectPB(di)">
                <td><span class="doe__pb-radio"></span></td>
                <td x-text="d.label"></td>
                <td x-text="d.runs"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>

    <!-- BB info -->
    <template x-if="model.designType === 'bb'">
      <div class="doe__sub-panel">
        <div class="dmike-split__section-title" x-text="t('bbTitle')"></div>
        <div class="doe__bb-info-body">
          <template x-if="design.bbAvailable()">
            <p class="doe__bb-detail" x-text="design.bbDetailText()"></p>
          </template>
          <template x-if="!design.bbAvailable()">
            <p class="doe__bb-warning" x-text="design.bbWarningText()"></p>
          </template>
        </div>
      </div>
    </template>

    <!-- Taguchi selector -->
    <template x-if="model.designType === 'taguchi'">
      <div class="doe__sub-panel">
        <div class="dmike-split__section-title" data-help-key="modules.doe-planner.actions.design.selectTaguchi.help" x-text="t('taguchiTitle')"></div>
        <div class="doe__taguchi-info" x-text="design.taguchiInfoText()"></div>
        <template x-if="design.taguchiCandidatesList().length > 0">
          <table class="doe__taguchi-table">
            <thead><tr>
              <th></th>
              <th x-text="t('taguchiArray')"></th>
              <th x-text="t('runs')"></th>
              <th x-text="'max. ' + t('factors')"></th>
            </tr></thead>
            <tbody>
              <template x-for="(oa, i) in design.taguchiCandidatesList()" :key="oa.name + ':' + i">
                <tr class="doe__taguchi-row" :class="design.taguchiSelected() === oa.name ? 'doe__taguchi-row--selected' : ''" :data-oa="oa.name" @click="design.selectTaguchi(oa.name)">
                  <td><span class="doe__taguchi-radio"></span></td>
                  <td><strong x-text="oa.name"></strong></td>
                  <td x-text="oa.runs"></td>
                  <td x-text="oa.maxFactors"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <template x-if="design.taguchiCandidatesList().length === 0">
          <p class="doe__taguchi-warning" x-text="t('taguchiNotAvailable', { k: model.factors.length, levels: design.taguchiFirstLevels() })"></p>
        </template>
      </div>
    </template>

    <!-- Optimal options -->
    <template x-if="model.isOptimalType()">
      <div class="doe__sub-panel">
        <div class="dmike-split__section-title" x-text="t('optimalTitle')"></div>
        <div class="doe__optimal-info" x-text="t('optimalInfo_' + model.designType)"></div>
        <div class="field-group">
          <label class="doe__input-label" data-help-key="modules.doe-planner.actions.optimal.setOptimalRuns.help" x-text="optimal.optimalRunsLabel()"></label>
          <input type="number" class="field doe__optimal-runs-input" :min="optimal.optimalMinNew()" max="200"
                 :value="model.options.optimalRuns || optimal.optimalMinNew()" @change="optimal.optimalRunsChanged($event)" />
          <span class="doe__optimal-hint" x-text="optimal.optimalRunsHint()"></span>
        </div>

        <!-- Term list -->
        <template x-if="model.factors.length >= 1">
          <div class="doe__term-list-wrap">
            <div class="doe__term-list-label" data-help-key="modules.doe-planner.actions.optimal.setTerm.help" x-text="t('modelTerms')"></div>
            <div class="doe__term-list-hint" x-text="t('modelTermsHintHier')"></div>
            <div class="doe__term-list">
              <template x-for="(g, gi) in optimal.termGroups()" :key="gi">
                <div class="doe__term-group" :class="optimal.termGroupExpanded(gi, g) ? 'doe__term-group--open' : ''" :data-group-idx="gi">
                  <button type="button" class="doe__term-group-header" :data-group-idx="gi" @click="optimal.toggleTermGroup(gi)">
                    <span class="doe__term-group-arrow" x-text="optimal.termGroupExpanded(gi, g) ? '▾' : '▸'"></span>
                    <span class="doe__term-group-title" x-text="optimal.termGroupTitle(g)"></span>
                    <span class="doe__term-group-count" x-text="optimal.termGroupCount(g)"></span>
                  </button>
                  <div class="doe__term-group-body">
                    <template x-if="optimal.termGroupExpanded(gi, g)">
                      <div class="doe__term-group-items">
                        <template x-for="id in g.ids" :key="id">
                          <label class="doe__term-chip" :class="optimal.termChipClass(g, id)">
                            <input type="checkbox" class="doe__term-check"
                                   :data-term-id="id" :checked="optimal.termActive(id)"
                                   :disabled="g.kind === 'main'" @change="optimal.toggleTerm(id, $event)" />
                            <span x-text="optimal.termLabel(id)"></span>
                          </label>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Forbidden vertices -->
        <div class="doe__forbidden-block">
          <div class="doe__forbidden-title" data-help-key="modules.doe-planner.actions.optimal.addForbiddenVertex.help" x-text="t('forbiddenTitle')"></div>
          <div class="doe__forbidden-hint" x-text="t('forbiddenHint')"></div>
          <ul class="doe__forbidden-list">
            <template x-if="optimal.forbiddenList().length === 0">
              <li class="doe__forbidden-empty" x-text="t('forbiddenEmpty')"></li>
            </template>
            <template x-for="(rule, ri) in optimal.forbiddenList()" :key="ri">
              <li class="doe__forbidden-row" :data-rule-idx="ri">
                <span class="doe__forbidden-rule" x-text="optimal.forbiddenRuleText(rule)"></span>
                <button type="button" class="doe__forbidden-remove-btn"
                        :data-rule-idx="ri" :title="t('forbiddenRemoveTitle')"
                        @click="optimal.removeForbiddenVertex(ri)">&#10005;</button>
              </li>
            </template>
          </ul>
          <div class="doe__forbidden-add" :data-factor-count="model.factors.length">
            <template x-for="(f, fi) in model.factors" :key="f.id">
              <label class="doe__forbidden-factor">
                <span class="doe__forbidden-factor-name" x-text="optimal.factorDisplayName(f, fi)"></span>
                <select class="doe__forbidden-input" :data-factor-idx="fi">
                  <option value="" x-text="t('forbiddenAny')"></option>
                  <template x-for="(lv, li) in f.levels" :key="li">
                    <option :value="optimal.forbiddenCoded(f, li)" x-text="lv"></option>
                  </template>
                </select>
              </label>
            </template>
            <button type="button" class="btn btn--secondary doe__forbidden-add-btn"
                    @click="optimal.addForbiddenFromInputs()" x-text="t('forbiddenAddBtn')"></button>
          </div>
        </div>

        <template x-if="!optimal.optimalRunsValid()">
          <div class="doe__optimal-warning" x-text="optimal.optimalTooFewText()"></div>
        </template>

        <!-- Source worksheet picker -->
        <div class="doe__source-section">
          <div class="doe__source-label" data-help-key="modules.doe-planner.actions.optimal.setSourceWorksheet.help" x-text="t('sourceTitle')"></div>
          <div class="doe__source-hint" x-text="t('sourceHint')"></div>
          <select class="field doe__source-select" @change="optimal.sourceWorksheetChanged($event)">
            <option value="" :selected="!model.sourceWorksheet" x-text="t('sourceNone')"></option>
            <template x-for="(s, i) in optimal.sourceWorksheetOptions()" :key="s.key + ':' + i">
              <option :value="s.key" :selected="s.key === optimal.sourceWorksheetKey()" x-text="s.label"></option>
            </template>
          </select>
          <template x-if="optimal.sourceMappingStatus()">
            <div :class="optimal.sourceMappingStatus().ok ? 'doe__source-mapping-ok' : 'doe__source-mapping-error'"
                 x-text="optimal.sourceMappingStatus().text"></div>
          </template>
        </div>
      </div>
    </template>

    <!-- Design parameters -->
    <div class="dmike-split__section-title" data-help-key="modules.doe-planner.fields.options.help" x-text="t('stepParameters')"></div>
    <div class="doe__param-group">
      <div class="field-checks">
        <label class="field-check">
          <input type="checkbox" class="doe__randomize-check" x-model="model.options.randomize" @change="design.setRandomize(model.options.randomize)" />
          <span data-help-key="modules.doe-planner.tipRandomize" x-text="t('optRandomize')"></span>
        </label>
        <template x-if="design.showCenterPointsOption()">
          <label class="field-check">
            <input type="checkbox" class="doe__center-check" x-model="model.options.centerPoints" @change="design.setCenterPoints(model.options.centerPoints)" />
            <span data-help-key="modules.doe-planner.tipCenterPoints" x-text="t('optCenterPoints')"></span>
          </label>
        </template>
      </div>
      <div class="doe__replicates-row">
        <label class="doe__input-label" data-help-key="modules.doe-planner.tipReplicates" x-text="t('optReplicates')"></label>
        <input type="number" class="field doe__replicates-input" min="1" max="10"
               :value="model.options.replicates || 1" @change="design.replicatesChanged($event)" />
      </div>
    </div>

    <template x-if="model.designType === 'bb'">
      <div class="field-group">
        <label class="doe__input-label" data-help-key="modules.doe-planner.actions.design.setBbCenterPoints.help" x-text="t('bbCenterPoints')"></label>
        <input type="number" class="field doe__bb-cp-input" min="1" max="10"
               :value="model.options.bbCenterPoints" @change="design.bbCpChanged($event)" />
      </div>
    </template>

    <template x-if="model.designType === 'ccd'">
      <div class="doe__ccd-params">
        <div class="field-group">
          <label class="doe__input-label" data-help-key="modules.doe-planner.actions.design.setAlphaType.help" x-text="t('alphaType')"></label>
          <select class="field doe__alpha-type-select" x-model="model.options.alphaType" @change="design.setAlphaType(model.options.alphaType)">
            <option value="rotatable" x-text="t('alphaRotatable')"></option>
            <option value="face-centered" x-text="t('alphaFaceCentered')"></option>
            <option value="spherical" x-text="t('alphaSpherical')"></option>
          </select>
        </div>
        <div class="field-group">
          <label class="doe__input-label" data-help-key="modules.doe-planner.actions.design.setCcdCenterPoints.help" x-text="t('ccdCenterPoints')"></label>
          <input type="number" class="field doe__ccd-cp-input" min="1" max="10"
                 :value="model.options.ccdCenterPoints" @change="design.ccdCpChanged($event)" />
        </div>
      </div>
    </template>

    <!-- Design summary -->
    <div class="doe__summary-card">
      <div class="doe__summary-item"><span x-text="t('factors') + ': '"></span><strong x-text="model.factors.length"></strong></div>
      <div class="doe__summary-item"><span data-help-key="modules.doe-planner.types.DoeSummary.runs" x-text="t('runs') + ': '"></span><strong x-text="evaluation.summaryRuns()"></strong></div>
      <div class="doe__summary-item"><span data-help-key="modules.doe-planner.types.DoeSummary.resolution" x-text="t('resolution') + ': '"></span><strong x-text="evaluation.summaryRes()"></strong></div>
      <div class="doe__summary-item"><span x-text="t('responses') + ': '"></span><strong x-text="model.responses.length"></strong></div>
      <template x-if="model.design">
        <div class="doe__summary-item"><span class="doe__generated-badge" data-help-key="modules.doe-planner.types.DoeSummary.generatedRuns" x-text="'✓ ' + t('generated', { runs: evaluation.summaryGeneratedRuns() })"></span></div>
      </template>
      <template x-if="!model.design">
        <div class="doe__summary-item doe__summary-item--pending" data-help-key="modules.doe-planner.fields.valid.help" x-text="evaluation.configValid() ? t('configReady') : t('configIncomplete')"></div>
      </template>
    </div>
  </div>

  <!-- ════ Output (right) panel ════════════════════════════════ -->
  <div class="doe__output dmike-split__output">

    <!-- Placeholder when no design + invalid config -->
    <template x-if="!model.design && !evaluation.configValid()">
      <div class="doe__placeholder">
        <p data-help-key="modules.doe-planner.fields.invalidReason.help" x-text="t('configureLeft')"></p>
      </div>
    </template>

    <template x-if="model.design">
      <div class="doe__output-content">
        <div class="dmike-split__output-section-header">
          <span class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('stepResults')"></span></span>
        </div>

        <!-- Stale state -->
        <template x-if="runs.staleness() === 'stale'">
          <div class="doe__stale-banner">
            <div class="doe__stale-text" data-help-key="modules.doe-planner.types.DoeWorksheet.stale" x-text="t('worksheetStaleWarning')"></div>
            <div class="doe__stale-actions">
              <button class="btn btn--primary doe__datasheet-recreate-btn" type="button" @click="runs.createDatasheet()" x-text="t('worksheetRecreate')"></button>
              <button class="btn btn--secondary doe__open-old-worksheet-btn" type="button" @click="runs.openLinkedWorksheet()" x-text="t('worksheetOpenOld')"></button>
            </div>
          </div>
        </template>

        <!-- Bound state -->
        <template x-if="runs.staleness() === 'bound'">
          <div class="doe__bound-region">
            <div class="doe__results-status">
              <div class="doe__results-bar">
                <div class="doe__results-bar-fill" :style="'width:' + runs.boundPct() + '%'"></div>
              </div>
              <span class="doe__results-text" data-help-key="modules.doe-planner.types.DoeWorksheet.filled" x-text="runs.boundProgressText()"></span>
            </div>
            <div class="doe__datasheet-link-row">
              <button class="btn btn--secondary doe__open-worksheet-btn" data-help-key="modules.doe-planner.types.DoeWorksheet.instanceId" type="button" @click="runs.openLinkedWorksheet()">
                <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span>
                <span x-text="t('worksheetOpen')"></span>
              </button>
            </div>
            <template x-if="runs.boundComplete()">
              <div class="doe__transfer-section">
                <button class="btn btn--primary doe__transfer-regression-btn" data-help-key="modules.doe-planner.actions.analysis.transferToRegression.help" type="button" @click="analysis.transferToRegression()">
                  <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span>
                  <span x-text="t('transferToRegression')"></span>
                </button>
              </div>
            </template>
            <template x-if="evop.showPhaseDecision()">
              <div class="doe__phase-decision">
                <div class="doe__phase-decision-title" data-help-key="modules.doe-planner.actions.evop.completePhase.help" x-text="t('decisionTitle')"></div>
                <div class="doe__phase-decision-hint" x-text="t('decisionDesc')"></div>
                <div class="doe__phase-decision-actions">
                  <button class="btn btn--primary doe__phase-decision-btn" type="button" data-decision="recenter"
                          @click="evop.confirmCompletePhase('recenter')" x-text="t('decisionRecenter')"></button>
                  <button class="btn btn--secondary doe__phase-decision-btn" type="button" data-decision="repeat"
                          @click="evop.confirmCompletePhase('repeat')" x-text="t('decisionRepeat')"></button>
                  <button class="btn btn--secondary doe__phase-decision-btn" type="button" data-decision="stop"
                          @click="evop.confirmCompletePhase('stop')" x-text="t('decisionStop')"></button>
                </div>
              </div>
            </template>
            <template x-if="model.isOptimalType()">
              <div class="doe__augment-section">
                <div class="doe__augment-title" x-text="t('augmentSectionTitle')"></div>
                <div class="doe__augment-hint" x-text="t('augmentHint')"></div>
                <div class="doe__augment-row">
                  <label class="doe__input-label" data-help-key="modules.doe-planner.actions.optimal.augment.help" for="doe-augment-runs" x-text="t('augmentLabel')"></label>
                  <input type="number" id="doe-augment-runs" class="field doe__augment-runs-input"
                         min="1" max="200" step="1" value="4" />
                  <button class="btn btn--primary doe__augment-btn" type="button" @click="optimal.clickAugment()" x-text="t('augmentButton')"></button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Unbound state -->
        <template x-if="runs.staleness() === 'unbound'">
          <div class="doe__datasheet-create-row">
            <button class="btn btn--primary doe__datasheet-create-btn" data-help-key="modules.doe-planner.actions.runs.createDatasheet.help" type="button" @click="runs.createDatasheet()" x-text="t('worksheetCreate')"></button>
            <span class="doe__datasheet-create-hint" x-text="t('worksheetCreateHint')"></span>
          </div>
        </template>

        <!-- Design preview (unbound + stale) -->
        <template x-if="runs.showPreview()">
          <div class="doe__preview-wrap">
            <div class="doe__preview-label" data-help-key="modules.doe-planner.actions.runs.setRunValue.help" x-text="t('previewLabel')"></div>
            <div class="doe__preview-hint" data-help-key="modules.doe-planner.fields.runs.help" x-text="t('previewHint')"></div>
            <template x-if="model.previewDirty">
              <div class="doe__preview-stale-note" x-text="t('previewStaleNote')"></div>
            </template>
            <div class="doe__preview-grid" data-ref="preview-grid"></div>
          </div>
        </template>

        <!-- Evaluation summary -->
        <template x-if="model.evaluation">
          <div class="doe__eval-region">
            <div class="dmike-split__output-section-header">
              <span class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('stepEvaluate')"></span></span>
            </div>
            <div class="doe__eval-compact">
              <div class="doe__eval-detail">
                <!-- Efficiency -->
                <div class="doe__eval-section">
                  <h4 class="doe__eval-heading" data-help-key="modules.doe-planner.types.DoeEvaluation.efficiency" x-text="t('efficiencyTitle')"></h4>
                  <div class="dmike-kpi-strip">
                    <template x-for="(c, ci) in evaluation.effCards()" :key="ci">
                      <div class="dmike-kpi" :class="c.cls">
                        <div class="dmike-kpi-label">
                          <span :data-help-key="c.helpKey" x-text="c.label"></span>
                          <button class="doe__algo-link" :data-algo-id="c.algoId" type="button" @click="evaluation.algoNavigate(c.algoId, $event)">
                            <span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span>
                          </button>
                        </div>
                        <div class="dmike-kpi-value" x-text="c.value"></div>
                        <div class="doe__eff-bar"><div class="doe__eff-bar-fill" :class="c.cls" :style="'width:' + c.barWidth + '%'"></div></div>
                      </div>
                    </template>
                    <div class="dmike-kpi">
                      <div class="dmike-kpi-label" data-help-key="modules.doe-planner.tipCondNum" x-text="t('condNum')"></div>
                      <div class="dmike-kpi-value" x-text="evaluation.condNumValue()"></div>
                    </div>
                    <div class="dmike-kpi">
                      <div class="dmike-kpi-label" data-help-key="modules.doe-planner.tipMaxLev" x-text="t('maxLeverage')"></div>
                      <div class="dmike-kpi-value" x-text="evaluation.maxLeverageValue()"></div>
                    </div>
                  </div>
                </div>

                <!-- VIF -->
                <template x-if="evaluation.hasVif()">
                  <div class="doe__eval-section">
                    <h4 class="doe__eval-heading">
                      <span data-help-key="modules.doe-planner.tipVIF" x-text="t('vifTitle')"></span>
                      <button class="doe__algo-link" data-algo-id="vif" type="button" @click="evaluation.algoNavigate('vif', $event)">
                        <span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span>
                      </button>
                    </h4>
                    <div class="doe__vif-tables">
                      <template x-if="evaluation.vifMain().length">
                        <table class="doe__vif-table">
                          <thead><tr><th x-text="t('mainEffects')"></th><th>VIF</th></tr></thead>
                          <tbody>
                            <template x-for="(v, vi) in evaluation.vifMain()" :key="vi">
                              <tr :class="evaluation.vifRating(v.vif)"><td x-text="v.term"></td><td x-text="fmt2(v.vif)"></td></tr>
                            </template>
                          </tbody>
                        </table>
                      </template>
                      <template x-if="evaluation.vifInter().length">
                        <table class="doe__vif-table">
                          <thead><tr><th x-text="t('interactions')"></th><th>VIF</th></tr></thead>
                          <tbody>
                            <template x-for="(v, vi) in evaluation.vifInter()" :key="vi">
                              <tr :class="evaluation.vifRating(v.vif)"><td x-text="v.term"></td><td x-text="fmt2(v.vif)"></td></tr>
                            </template>
                          </tbody>
                        </table>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Alias structure -->
                <template x-if="evaluation.hasAlias()">
                  <div class="doe__eval-section">
                    <h4 class="doe__eval-heading">
                      <span data-help-key="modules.doe-planner.tipAlias" x-text="t('aliasTitle')"></span>
                    </h4>
                    <template x-if="evaluation.aliasGenerators().length">
                      <div class="doe__alias-gens">
                        <span class="doe__alias-gen-label" x-text="t('generators') + ':'"></span>
                        <template x-for="(g, gi) in evaluation.aliasGenerators()" :key="gi">
                          <code class="doe__alias-gen" x-text="g"></code>
                        </template>
                      </div>
                    </template>
                    <template x-if="evaluation.aliasRows().length">
                      <table class="doe__alias-table">
                        <thead><tr><th data-help-key="modules.doe-planner.columns.term" x-text="t('term')"></th><th data-help-key="modules.doe-planner.columns.aliasedWith" x-text="t('aliasedWith')"></th></tr></thead>
                        <tbody>
                          <template x-for="(a, ai) in evaluation.aliasRows()" :key="ai">
                            <tr>
                              <td><code x-text="a.term"></code></td>
                              <td x-text="a.aliasedWith"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </template>
                    <template x-if="!evaluation.aliasRows().length">
                      <p class="doe__eval-note" x-text="t('noAliases')"></p>
                    </template>
                  </div>
                </template>

                <!-- Power -->
                <template x-if="evaluation.hasPower()">
                  <div class="doe__eval-section">
                    <h4 class="doe__eval-heading">
                      <span data-help-key="modules.doe-planner.tipPower" x-text="t('powerTitle')"></span>
                    </h4>
                    <p class="doe__eval-note" x-text="evaluation.powerDescText()"></p>
                    <p class="doe__eval-note" x-show="evaluation.powerSaturated()" x-text="t('powerSaturated')"></p>
                    <table class="doe__power-table">
                      <thead><tr><th data-help-key="modules.doe-planner.columns.effectSize" x-text="t('effectSize')"></th><th data-help-key="modules.doe-planner.columns.power" x-text="t('power')"></th><th></th></tr></thead>
                      <tbody>
                        <template x-for="(row, pi) in evaluation.powerRows()" :key="pi">
                          <tr :class="evaluation.powerRating(row.power)">
                            <td x-text="row.effectSize"></td>
                            <td x-text="evaluation.powerPct(row.power)"></td>
                            <td><div class="doe__power-bar"><div class="doe__power-bar-fill" :style="'width:' + evaluation.powerBarWidth(row.power) + '%'"></div></div></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- Dispersion analysis -->
        <template x-if="analysis.dispersion()">
          <div class="doe__dispersion-region">
            <div class="dmike-split__output-section-header">
              <span class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('dispersionSection')"></span></span>
            </div>
            <div class="doe__eval-detail">
              <div class="doe__eval-section">
                <h4 class="doe__eval-heading">
                  <span data-help-key="modules.doe-planner.tipDispersion" x-text="t('dispersionTitle')"></span>
                </h4>
                <template x-if="analysis.dispersion().noReplicates">
                  <p class="doe__eval-note" x-text="t('dispersionNoReplicates')"></p>
                </template>
                <template x-if="!analysis.dispersion().noReplicates">
                  <div class="doe__dispersion-body">
                    <p class="doe__eval-note" x-text="analysis.dispersionLeadText()"></p>
                    <table class="doe__alias-table doe__dispersion-table">
                      <thead>
                        <tr>
                          <th data-help-key="modules.doe-planner.columns.dispersionPoint" x-text="t('dispersionPoint')"></th>
                          <th data-help-key="modules.doe-planner.columns.dispersionN">n</th>
                          <th data-help-key="modules.doe-planner.columns.dispersionMean" x-text="t('dispersionMean')"></th>
                          <th data-help-key="modules.doe-planner.columns.dispersionS">s</th>
                          <th data-help-key="modules.doe-planner.columns.dispersionVar">s&sup2;</th>
                          <th data-help-key="modules.doe-planner.columns.dispersionLnVar">ln(s&sup2;)</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(g, gi) in analysis.dispersion().groups" :key="gi">
                          <tr>
                            <td x-text="g.point"></td>
                            <td x-text="g.n"></td>
                            <td x-text="fmt4(g.mean)"></td>
                            <td x-text="fmt4(g.sd)"></td>
                            <td x-text="fmt6(g.variance)"></td>
                            <td x-text="g.lnVariance != null ? fmt4(g.lnVariance) : '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="analysis.dispersion().zeroVarPoints > 0">
                      <p class="doe__eval-note" x-text="t('dispersionZeroVar', { n: analysis.dispersion().zeroVarPoints })"></p>
                    </template>
                    <div class="doe__dispersion-models">
                      <template x-for="(m, mi) in analysis.dispersionModels()" :key="mi">
                        <div class="doe__dispersion-model">
                          <h5 class="doe__dispersion-model-title" x-text="m.title"></h5>
                          <template x-if="!m.fitted">
                            <p class="doe__eval-note" x-text="t('dispersionModelNotFitted')"></p>
                          </template>
                          <template x-if="m.fitted">
                            <div class="doe__dispersion-model-body">
                              <p class="doe__eval-note" x-text="m.r2Text"></p>
                              <table class="doe__alias-table doe__dispersion-coef-table">
                                <thead>
                                  <tr>
                                    <th data-help-key="modules.doe-planner.columns.term" x-text="t('term')"></th>
                                    <th data-help-key="modules.doe-planner.columns.coefficient" x-text="t('coefficient')"></th>
                                    <th data-help-key="modules.doe-planner.columns.effect" x-text="t('effect')"></th>
                                    <th data-help-key="modules.doe-planner.columns.pValue">p</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template x-for="(c, ci) in m.rows" :key="ci">
                                    <tr :class="c.significant ? 'doe__dispersion-sig' : ''">
                                      <td x-text="c.term"></td>
                                      <td x-text="fmt4(c.coefficient)"></td>
                                      <td x-text="fmt4(c.effect)"></td>
                                      <td x-text="fmt4(c.p)"></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                    <!-- Conclusion -->
                    <template x-if="analysis.dispersionConclusion()">
                      <div class="doe__dispersion-conclusion" :class="analysis.dispersionConclusion().cls">
                        <strong x-text="t('dispersionConclusion') + ':'"></strong>
                        <template x-if="analysis.dispersionConclusion().none">
                          <span x-text="' ' + t('dispersionConclusionNone')"></span>
                        </template>
                        <template x-if="!analysis.dispersionConclusion().none">
                          <ul>
                            <template x-for="(item, ii) in analysis.dispersionConclusion().items" :key="ii">
                              <li x-text="item"></li>
                            </template>
                          </ul>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>
