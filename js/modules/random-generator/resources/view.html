<div class="module-random-generator dmike-split dmike-split--input-sm" x-data="randomGenerator">
  <aside class="rg-sidebar dmike-split__input" data-ref="sidebar" role="radiogroup" x-set="model.currentDist"
         data-help-key="modules.random-generator.fields.currentDist.help">
    <template x-for="cat in categories" :key="cat.key">
      <div class="rg-sidebar__section">
        <div class="rg-sidebar__title" x-text="t(cat.key)"></div>
        <template x-for="distKey in cat.dists" :key="distKey">
          <button type="button" role="radio" :class="distBtnClass(distKey)" :value="distKey" :data-dist="distKey"
                  data-help-key="" x-text="distName(distKey)"></button>
        </template>
      </div>
    </template>
    <div class="rg-sidebar__section">
      <div class="rg-sidebar__title" x-text="t('catAttributive')"></div>
      <button type="button" role="radio" :class="distBtnClass(attrKey)" value="attributive" data-dist="attributive"
              data-help-key="" x-text="t('distAttributive')"></button>
    </div>
  </aside>

  <main class="rg-main dmike-split__output" data-ref="main">

    <!-- Leer (keine Verteilung gewählt) -->
    <template x-if="!model.currentDist">
      <div class="rg-main__empty"></div>
    </template>

              <div class="field-group rg-control-group">
                <label data-help-key="modules.random-generator.fields.params.mvnormal.sigma2.help" x-text="t('dist.mvnormal.sigma2.label')"></label>
                <input class="field field--num" data-ref="param-sigma2" x-field="model.params.mvnormal.sigma2">
                <span class="rg-field-error" x-text="fieldError('model.params.mvnormal.sigma2')"></span>
              </div>
              <div class="field-group rg-control-group">
                <label data-help-key="modules.random-generator.fields.params.mvnormal.rho.help" x-text="t('dist.mvnormal.rho.label')"></label>
                <input class="field field--num" data-ref="param-rho" x-field="model.params.mvnormal.rho">
                <span class="rg-field-error" x-text="fieldError('model.params.mvnormal.rho')"></span>
              </div>
            </div>
          </template>
          <div class="field-group rg-control-group">
            <label data-help-key="modules.random-generator.fields.count.help" x-text="t('count')"></label>
            <input class="field field--num" data-ref="count" x-field="model.count">
            <span class="rg-field-error" x-text="fieldError('model.count')"></span>
          </div>
          <div class="field-group rg-control-group">
            <label data-help-key="modules.random-generator.fields.seed.help" x-text="t('seed')"></label>
            <input class="field field--num" data-ref="seed" placeholder="42" x-field="model.seed">
            <span class="rg-field-error" x-text="fieldError('model.seed')"></span>
          </div>
        </div>

        <p class="rg-error" data-ref="error" x-show="errorText" x-text="errorText"></p>

        <div class="rg-action-bar" x-show="hasResults">
          <span class="rg-export-group" x-async-task="toWorksheet">
            <span class="rg-target-wrap" data-help-key="modules.random-generator.asyncTasks.toWorksheet.params.target">
              <span class="col-picker col-picker--single">
                <select class="field col-picker__select rg-target__select" data-ref="target" x-model="state.target">
                  <option value="" x-text="targetPlaceholder"></option>
                  <option value="__create_worksheet__" x-text="newWorksheetLabel"></option>
                  <template x-for="g in targetGroups" :key="g.key">
                    <optgroup :label="g.label">
                      <template x-for="o in g.options" :key="o.value">
                        <option :value="o.value" x-text="o.label"></option>
                      </template>
                    </optgroup>
                  </template>
                </select>
              </span>
            </span>
            <button class="btn btn--secondary" type="button" data-ref="send" data-help-key="modules.random-generator.asyncTasks.toWorksheet.help"
                    :disabled="asyncTasks.toWorksheet.running" @click="sendToWorksheet()">
              <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span>
              <span x-text="t('toWorksheet')"></span>
            </button>
          </span>
        </div>

        <div data-ref="stats">
          <template x-if="hasResults">
            <div class="dmike-kpi-strip">
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.n"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.n" x-text="t('statN')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.mean"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.mean" x-text="t('statMean')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.sd"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.sd" x-text="t('statStd')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.median"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.median" x-text="t('statMedian')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.min"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.min" x-text="t('statMin')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.max"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.max" x-text="t('statMax')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.skewness"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.skewness" x-text="t('statSkewness')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.kurtosis"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.kurtosis" x-text="t('statKurtosis')"></div></div>
            </div>
          </template>
        </div>

        <div class="rg-histogram" data-ref="chart" x-show="hasResults" x-widget="histogram-chart" x-widget-config="histogramChart"
             x-widget-value="model.histogramEdits" x-widget-legacy-edit-key="legacyHistogramKey"></div>

        <div data-ref="data">
          <template x-if="hasResults">
            <div class="rg-data">
              <div class="rg-data__header">
                <div class="rg-data__title" x-text="t('generatedData')"></div>
                <div class="rg-data__count" x-text="dataCount"></div>
              </div>
              <div class="rg-data__grid">
                <div class="rg-data__values">
                  <template x-for="(v, i) in shownValues" :key="i">
                    <span x-text="v"></span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ── Attributiv ─────────────────────────────────────── -->
    <template x-if="isAttributive">
      <div>
        <div class="rg-dist-title" x-text="title"></div>
        <div class="rg-dist-formula" x-text="formula"></div>

        <div class="rg-attr-wrap">
          <div class="rg-attr-section">
            <div class="rg-attr-head">
              <div class="rg-attr-head__label" data-help-key="modules.random-generator.fields.attributes.name.help" x-text="t('attrName')"></div>
              <div class="rg-attr-head__label" data-help-key="modules.random-generator.fields.attributes.weight.help" x-text="t('attrWeight')"></div>
              <div></div>
            </div>
            <div class="rg-attr-list" data-ref="attr-list">
              <template x-for="(a, i) in model.attributes" :key="a.id">
                <div class="rg-attr-row" :style="attrRowStyle(i)">
                  <input type="text" class="field rg-attr-row__name" :data-i="i" data-f="name" :placeholder="t('attrName')" x-model="a.name">
                  <input class="field field--num rg-attr-row__weight" :data-i="i" data-f="weight" x-field="a.weight">
                  <button class="rg-attr-row__remove" type="button" :data-i="i" :title="t('removeAttribute')" :aria-label="t('removeAttribute')"
                          x-command="removeAttribute" :data-arg-attr-id="a.id" data-confirm-delete data-help-key="" x-text="removeGlyph"></button>
                </div>
              </template>
            </div>
            <button class="rg-attr-add" type="button" data-ref="attr-add" data-help-key="modules.random-generator.actions.addAttribute.help" x-command="addAttribute">
              <span x-text="addLabel"></span>
            </button>
          </div>
          <div class="rg-attr-section rg-attr-section--prob">
            <div class="rg-attr-head">
              <div class="rg-attr-head__label" x-text="t('probability')"></div>
            </div>
            <div class="rg-attr-prob__bars" data-ref="attr-prob">
              <template x-for="(bar, i) in probBars" :key="i">
                <div class="rg-attr-prob__bar" :title="bar.title">
                  <div class="rg-attr-prob__bar-fill" :style="bar.style"></div>
                  <div class="rg-attr-prob__bar-label" x-text="bar.label"></div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="rg-controls rg-controls--attr">
          <div class="field-group rg-control-group">
            <label data-help-key="modules.random-generator.fields.attrCount.help" x-text="t('count')"></label>
            <input class="field field--num" data-ref="count" x-field="model.attrCount">
            <span class="rg-field-error" x-text="fieldError('model.attrCount')"></span>
          </div>
          <div class="field-group rg-control-group">
            <label data-help-key="modules.random-generator.fields.attrSeed.help" x-text="t('seed')"></label>
            <input class="field field--num" data-ref="seed" placeholder="42" x-field="model.attrSeed">
            <span class="rg-field-error" x-text="fieldError('model.attrSeed')"></span>
          </div>
        </div>

        <p class="rg-error" data-ref="error" x-show="errorText" x-text="errorText"></p>

        <div class="rg-action-bar" x-show="hasResults">
          <span class="rg-export-group" x-async-task="toWorksheet">
            <span class="rg-target-wrap" data-help-key="modules.random-generator.asyncTasks.toWorksheet.params.target">
              <span class="col-picker col-picker--single">
                <select class="field col-picker__select rg-target__select" data-ref="target" x-model="state.target">
                  <option value="" x-text="targetPlaceholder"></option>
                  <option value="__create_worksheet__" x-text="newWorksheetLabel"></option>
                  <template x-for="g in targetGroups" :key="g.key">
                    <optgroup :label="g.label">
                      <template x-for="o in g.options" :key="o.value">
                        <option :value="o.value" x-text="o.label"></option>
                      </template>
                    </optgroup>
                  </template>
                </select>
              </span>
            </span>
            <button class="btn btn--secondary" type="button" data-ref="send" data-help-key="modules.random-generator.asyncTasks.toWorksheet.help"
                    :disabled="asyncTasks.toWorksheet.running" @click="sendToWorksheet()">
              <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span>
              <span x-text="t('toWorksheet')"></span>
            </button>
          </span>
        </div>

        <div data-ref="stats">
          <template x-if="hasResults">
            <div class="dmike-kpi-strip">
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.n"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.n" x-text="t('statN')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.categories"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.frequency" x-text="t('catCount')"></div></div>
              <div class="dmike-kpi"><div class="dmike-kpi-value" x-text="stats.mostFrequent"></div><div class="dmike-kpi-label" data-help-key="modules.random-generator.types.Generated.frequency" x-text="t('mostFrequent')"></div></div>
            </div>
          </template>
        </div>

        <div class="rg-histogram" data-ref="chart" x-show="hasResults" x-widget="pareto-chart" x-widget-config="paretoChart"
             x-widget-value="model.paretoEdits" x-widget-legacy-edit-key="legacyParetoKey"></div>

        <div class="rg-attr-freq" data-ref="attr-freq">
          <template x-if="freqRows.length">
            <div>
              <div class="rg-freq-header"><span data-help-key="modules.random-generator.types.FrequencyRow.share" x-text="t('frequency')"></span></div>
              <div class="rg-freq-list">
                <template x-for="row in freqRows" :key="row.name">
                  <div class="rg-freq-row">
                    <div class="rg-freq-row__swatch" :style="row.swatchStyle"></div>
                    <div class="rg-freq-row__name" x-text="row.name"></div>
                    <div class="rg-freq-row__count" x-text="row.count"></div>
                    <div class="rg-freq-row__pct" x-text="row.pct"></div>
                    <div class="rg-freq-row__bar">
                      <div class="rg-freq-row__bar-fill" :style="row.barStyle"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <div data-ref="data">
          <template x-if="hasResults">
            <div class="rg-data">
              <div class="rg-data__header">
                <div class="rg-data__title" x-text="t('generatedData')"></div>
                <div class="rg-data__count" x-text="dataCount"></div>
              </div>
              <div class="rg-data__grid">
                <div class="rg-attr-chips">
                  <template x-for="(chip, i) in chips" :key="i">
                    <span class="rg-attr-chip" :style="chip.style" x-text="chip.value"></span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

  </main>
</div>
