<div class="smpsize dmike-split" x-data="sampleSize">
  <div class="smpsize__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionCategory')"></div>
    <div class="btn-group smpsize__toggle-row" data-help-key="modules.sample-size.types.Params.category">
      <button class="btn--segment smpsize__toggle-btn"
              :class="catActiveClass('variance')"
              data-cat="variance"
              @click="setCategory('variance')"
              x-text="catVarianceLabel()"></button>
      <button class="btn--segment smpsize__toggle-btn"
              :class="catActiveClass('mean')"
              data-cat="mean"
              @click="setCategory('mean')"
              x-text="catMeanLabel()"></button>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionTestType')"></div>
    <div class="btn-group smpsize__toggle-row" data-help-key="modules.sample-size.types.Params.testType">
      <button class="btn--segment smpsize__toggle-btn"
              :class="typeActiveClass('one')"
              data-type="one"
              @click="setTestType('one')"
              x-text="t('oneSample')"></button>
      <button class="btn--segment smpsize__toggle-btn"
              :class="typeActiveClass('two')"
              data-type="two"
              @click="setTestType('two')"
              x-text="t('twoSample')"></button>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionEffect')"></div>

    <!-- Variance inputs: one-sample (sigma0 + sigmaAlt) -->
    <template x-if="isVar() && !isTwoSample()">
      <div class="field-row">
        <div class="field-group field-group--grow">
          <label data-help-key="modules.sample-size.types.Params.sigma0" x-text="hypothesizedStdLabel()"></label>
          <input type="number" data-ref="sigma0" class="field field--num" min="0"
                 :value="model.sigma0"
                 :placeholder="t('sigma0Placeholder')"
                 @input="setParam('sigma0', $event.target.value)">
        </div>
        <div class="field-group field-group--grow">
          <label data-help-key="modules.sample-size.types.Params.sigmaAlt" x-text="expectedStdLabel()"></label>
          <input type="number" data-ref="sigma-alt" class="field field--num" min="0"
                 :value="model.sigmaAlt"
                 :placeholder="t('sigmaAltPlaceholder')"
                 @input="setParam('sigmaAlt', $event.target.value)">
        </div>
      </div>
    </template>

    <!-- Variance inputs: two-sample (ratio) -->
    <template x-if="isVar() && isTwoSample()">
      <div class="field-group">
        <label data-help-key="modules.sample-size.types.Params.ratio" x-text="varianceRatioLabel()"></label>
        <input type="number" data-ref="ratio" class="field field--num" min="0"
               :value="model.ratio"
               :placeholder="t('ratioPlaceholder')"
                 @input="setParam('ratio', $event.target.value)">
      </div>
    </template>

    <!-- Mean inputs (one or two sample) -->
    <template x-if="!isVar()">
      <div class="field-row">
        <div class="field-group field-group--major">
          <label data-help-key="modules.sample-size.types.Params.delta" x-text="meanDifferenceLabel()"></label>
          <input type="number" data-ref="delta" class="field field--num" min="0"
                 :value="model.delta"
                 :placeholder="t('deltaPlaceholder')"
                 @input="setParam('delta', $event.target.value)">
        </div>
        <div class="field-group field-group--minor">
          <label data-help-key="modules.sample-size.types.Params.sigma" x-text="stdDevLabel()"></label>
          <input type="number" data-ref="sigma" class="field field--num" min="0"
                 :value="model.sigma"
                 :placeholder="t('sigmaPlaceholder')"
                 @input="setParam('sigma', $event.target.value)">
        </div>
      </div>
    </template>

    <div class="dmike-split__section-title" x-text="t('sectionParams')"></div>
    <div class="field-row">
      <div class="field-group field-group--major">
        <label data-help-key="modules.sample-size.types.Params.direction" x-text="t('direction')"></label>
        <select data-ref="direction" class="field" :value="model.direction"
                @change="setParam('direction', $event.target.value)">
          <template x-for="o in directionOptions()" :key="o.value">
            <option :value="o.value" :selected="o.value === model.direction" x-text="o.label"></option>
          </template>
        </select>
      </div>
      <div class="field-group field-group--minor">
        <label data-help-key="modules.sample-size.types.Params.alpha">&#945;</label>
        <input type="number" data-ref="alpha" class="field field--num" min="0.0001" max="0.5"
               :value="model.alpha"
               @input="alphaChanged($event)" @change="alphaChanged($event)">
      </div>
    </div>
    <div class="field-group">
      <label data-help-key="modules.sample-size.types.Params.power" x-text="targetPowerLabel()"></label>
      <input type="number" data-ref="power" class="field field--num" min="0.5" max="0.9999"
             :value="model.power"
             @input="powerChanged($event)">
    </div>

    <div class="field-error" data-ref="error-box"></div>
  </div>

  <div class="smpsize__output dmike-split__output">
    <div class="smpsize__placeholder" data-ref="placeholder"></div>
    <div data-ref="results" style="display:none">
      <template x-if="resultShow">
        <div>
          <div class="dmike-split__output-section smpsize__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionResult')"></span></div>
          <div class="smpsize__summary">
            <strong><span data-help-key="modules.sample-size.types.Result.nRequired" x-text="summaryStrong"></span></strong>
            <p x-text="summaryText"></p>
          </div>

          <div class="dmike-kpi-strip">
            <template x-for="(c, i) in kpiCells" :key="i">
              <div class="dmike-kpi" :class="c.mod">
                <div class="dmike-kpi-value" x-text="c.value"></div>
                <div class="dmike-kpi-label" :data-help-key="c.help" x-text="c.label"></div>
              </div>
            </template>
          </div>

          <div class="dmike-split__output-section smpsize__output-section">
            <span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span>
            <span x-text="t('sectionCurve')"></span>
            <button class="smpsize__algo-link" :data-algo-id="curveAlgoId" :title="t('common.algoLabTitle')" @click="openAlgoLab($event)"><span class="icon icon--sm" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
          </div>
          <div data-ref="power-chart" style="height:320px"></div>
        </div>
      </template>
    </div>
  </div>
</div>
