<div class="module-msa-typ1 dmike-split dmike-split--input-lg" x-data="msaTyp1">
  <div class="dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionParams')"></div>

    <div class="field-row">
      <div class="field-group field-group--major">
        <label data-help-key="modules.msa-typ1.types.Params.name" x-text="t('featureName')"></label>
        <input type="text" class="field" data-ref="inp-name"
               :placeholder="t('featureNamePh')"
               :value="model.params.name" @input="setParam('name', $event.target.value)">
      </div>
      <div class="field-group field-group--minor">
        <label data-help-key="modules.msa-typ1.types.Params.unit" x-text="t('unit')"></label>
        <input type="text" class="field" data-ref="inp-unit"
               placeholder="mm"
               :value="model.params.unit" @input="setParam('unit', $event.target.value)">
      </div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ1.types.Params.ref" x-text="t('refValue')"></label>
      <input type="text" class="field field--num" data-ref="inp-ref"
             placeholder="50.000" inputmode="decimal"
             :value="model.params.ref" @input="setParam('ref', $event.target.value)" @change="runAnalysis()">
    </div>

    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.msa-typ1.types.Params.lsl" x-text="t('lsl')"></label>
        <input type="text" class="field field--num" data-ref="inp-lsl"
               placeholder="49.950" inputmode="decimal"
               :value="model.params.lsl" @input="setParam('lsl', $event.target.value)" @change="runAnalysis()">
      </div>
      <div class="field-group">
        <label data-help-key="modules.msa-typ1.types.Params.usl" x-text="t('usl')"></label>
        <input type="text" class="field field--num" data-ref="inp-usl"
               placeholder="50.050" inputmode="decimal"
               :value="model.params.usl" @input="setParam('usl', $event.target.value)" @change="runAnalysis()">
      </div>
    </div>

    <div class="field-grid field-grid--2">
      <div class="field-group">
        <label data-help-key="modules.msa-typ1.types.Params.k1" x-text="t('k1Label')"></label>
        <select class="field" data-ref="inp-k1" :value="model.params.k1" @input="setParam('k1', $event.target.value)" @change="runAnalysis()">
          <template x-for="o in k1Options()" :key="o.value">
            <option :value="o.value" :selected="o.value === model.params.k1" x-text="o.label"></option>
          </template>
        </select>
      </div>
      <div class="field-group">
        <label data-help-key="modules.msa-typ1.types.Params.k2" x-text="t('k2Label')"></label>
        <select class="field" data-ref="inp-k2" :value="model.params.k2" @input="setParam('k2', $event.target.value)" @change="runAnalysis()">
          <template x-for="o in k2Options()" :key="o.value">
            <option :value="o.value" :selected="o.value === model.params.k2" x-text="o.label"></option>
          </template>
        </select>
      </div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionValues')"></div>

    <div class="field-group">
      <label data-help-key="modules.msa-typ1.actions.setColumn.help" x-text="t('columnSelectLabel')"></label>
      <div data-ref="col-picker-wrap"></div>
    </div>

    <div class="field-error" data-ref="error-box" x-text="errorMsg"></div>
  </div>

  <div class="dmike-split__output">
    <div data-ref="results">
      <template x-if="result">
        <div>
          <!-- Status bar (generisches dmike-infobox aus css/components.css). -->
          <div class="dmike-infobox" :class="kpiModClass(result.overall)">
            <span class="dmike-infobox__label" data-help-key="modules.msa-typ1.types.Result.overall" x-text="statusLabel(result)"></span>
            <span class="dmike-infobox__detail">— <span x-text="featureName()"></span> — n = <span x-text="result.n"></span></span>
          </div>

          <!-- KPI strip -->
          <div class="dmike-kpi-strip">
            <template x-if="isTwoSided()">
              <div class="dmike-kpi" :class="kpiModClass(result.cgStatus)">
                <div class="dmike-kpi-label" data-help-key="modules.msa-typ1.types.Result.Cg">Cg (<span x-text="t('repeatability')"></span>)
                  <button class="msa-typ1__algo-link" data-algo-id="cg" title="Algorithm Lab" @click="algoNavigate('cg', $event)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                </div>
                <div class="dmike-kpi-value" x-text="fmtOpt(result.Cg)"></div>
                <div class="dmike-kpi-sub"><span x-text="t('threshold')"></span>: ≥ 1.33 · <span x-text="badgeLabel(result.cgStatus)"></span></div>
              </div>
            </template>
            <template x-if="isTwoSided()">
              <div class="dmike-kpi" :class="kpiModClass(result.cgkStatus)">
                <div class="dmike-kpi-label" data-help-key="modules.msa-typ1.types.Result.Cgk">Cgk (<span x-text="t('withBias')"></span>)
                  <button class="msa-typ1__algo-link" data-algo-id="cgk" title="Algorithm Lab" @click="algoNavigate('cgk', $event)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                </div>
                <div class="dmike-kpi-value" x-text="fmtOpt(result.Cgk)"></div>
                <div class="dmike-kpi-sub"><span x-text="t('threshold')"></span>: ≥ 1.33 · <span x-text="badgeLabel(result.cgkStatus)"></span></div>
              </div>
            </template>
            <div class="dmike-kpi">
              <div class="dmike-kpi-label" data-help-key="modules.msa-typ1.types.Result.bias" x-text="t('biasLabel')"></div>
              <div class="dmike-kpi-value" x-text="fmt(result.bias)"></div>
              <div class="dmike-kpi-sub" data-help-key="modules.msa-typ1.types.Result.biasTest" x-text="biasTestText()"></div>
              <template x-if="isTwoSided()">
                <div class="dmike-kpi-sub" data-help-key="modules.msa-typ1.types.Result.biasPercent"><span x-text="fmt(result.biasPercent)"></span> % <span x-text="t('ofTolerance')"></span> · <span x-text="model.params.unit"></span></div>
              </template>
            </div>
            <div class="dmike-kpi">
              <div class="dmike-kpi-label" data-help-key="modules.msa-typ1.types.Result.sg" x-text="t('spreadSg')"></div>
              <div class="dmike-kpi-value" x-text="fmt(result.sg)"></div>
              <template x-if="isTwoSided()">
                <div>
                  <div class="dmike-kpi-sub" data-help-key="modules.msa-typ1.types.Result.varEv"><span x-text="t('varEv')"></span>: <span x-text="fmtOpt(result.varEv, 2)"></span> %</div>
                  <div class="dmike-kpi-sub" data-help-key="modules.msa-typ1.types.Result.varEvBias"><span x-text="t('varEvBias')"></span>: <span x-text="fmtOpt(result.varEvBias, 2)"></span> %</div>
                </div>
              </template>
            </div>
          </div>

          <!-- Stats table -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
          <div class="msa-typ1__stats-panel">
            <table class="dmike-table msa-typ1__stats-table">
              <thead><tr>
                <template x-for="(col, i) in statCols()" :key="col.label + ':' + i"><th><span :data-help-key="col.help" x-text="col.label"></span></th></template>
              </tr></thead>
              <tbody><tr>
                <template x-for="(col, i) in statCols()" :key="col.label + ':' + i"><td x-text="col.value"></td></template>
              </tr></tbody>
            </table>
          </div>

          <!-- Run chart -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('runChartTitle')"></span></div>
          <div class="msa-typ1__chart-plot" data-ref="chart-run"></div>

          <!-- Histogram -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('histTitle')"></span></div>
          <div class="msa-typ1__chart-plot" data-ref="chart-hist"></div>

          <!-- Interpretation (heading + block share one x-if: one-sided hides both, per spec) -->
          <template x-if="isTwoSided()">
            <div class="msa-typ1__formulas" data-ref="formulas-section">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('formulasTitle')"></span></div>
              <div class="msa-typ1__interpretation">
                <p><strong>Cg</strong> = (k₁ · T) / (2 · k₂ · sg) = (<span x-text="result.params.k1"></span> · <span x-text="fmt(result.T)"></span>) / (2 · <span x-text="result.params.k2"></span> · <span x-text="fmt(result.sg)"></span>) = <strong x-text="fmtOpt(result.Cg)"></strong></p>
                <p><strong>Cgk</strong> = (k₁ · T/2 − |x̄ − x<sub>ref</sub>|) / (k₂ · sg) = (<span x-text="fmt(result.params.k1 * result.T / 2)"></span> − <span x-text="fmt(abs(result.bias))"></span>) / (<span x-text="result.params.k2"></span> · <span x-text="fmt(result.sg)"></span>) = <strong x-text="fmtOpt(result.Cgk)"></strong></p>
                <p><strong x-text="t('varEv')"></strong> = 100 · k₁ / Cg = 100 · <span x-text="result.params.k1"></span> / <span x-text="fmtOpt(result.Cg)"></span> = <strong x-text="fmtOpt(result.varEv, 2)"></strong> %</p>
                <p><strong x-text="t('varEvBias')"></strong> = 100 · k₁ / Cgk = 100 · <span x-text="result.params.k1"></span> / <span x-text="fmtOpt(result.Cgk)"></span> = <strong x-text="fmtOpt(result.varEvBias, 2)"></strong> %</p>
                <div style="height:12px"></div>
                <p><span class="msa-typ1__tag msa-typ1__tag--pass">Cg ≥ 1.33</span> <span x-text="t('interpCgPass')"></span></p>
                <p><span class="msa-typ1__tag msa-typ1__tag--pass">Cgk ≥ 1.33</span> <span x-text="t('interpCgkPass')"></span></p>
                <p><span class="msa-typ1__tag msa-typ1__tag--warn">1.00 ≤ <span x-text="t('value')"></span> &lt; 1.33</span> <span x-text="t('interpWarn')"></span></p>
                <p><span class="msa-typ1__tag msa-typ1__tag--fail"><span x-text="t('value')"></span> &lt; 1.00</span> <span x-text="t('interpFail')"></span></p>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
