<div class="hyptest dmike-split" x-data="hypothesisTest">

  <!-- data-help-key="" auf den Schaltflächen und Auswahl-Hosts ist gewollt: die Hilfe hängt an der Gruppe bzw. am Feldlabel, der automatische Schlüssel ergäbe doppelte Fragezeichen. -->
  <!-- ─── Input (left) ─────────────────────────────────────────── -->
  <div class="hyptest__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionCategory')"></div>
    <div class="btn-group hyptest__toggle-row" data-help-key="modules.hypothesis-test.actions.setCategory.help">
      <button class="btn--segment hyptest__toggle-btn" data-cat="variance"
        :class="activeClass('category', 'variance')"
        data-help-key="" x-command="setCategory" data-arg-category="variance">σ² <span x-text="t('catVariance')"></span></button>
      <button class="btn--segment hyptest__toggle-btn" data-cat="mean"
        :class="activeClass('category', 'mean')"
        data-help-key="" x-command="setCategory" data-arg-category="mean">μ <span x-text="t('catMean')"></span></button>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionTestType')"></div>
    <div class="btn-group hyptest__toggle-row" data-help-key="modules.hypothesis-test.actions.setTestType.help"
      :class="testTypeRowClass">
      <button class="btn--segment hyptest__toggle-btn" data-type="one"
        :class="activeClass('testType', 'one')"
        data-help-key="" x-command="setTestType" data-arg-test-type="one" x-text="t('oneSample')"></button>
      <button class="btn--segment hyptest__toggle-btn" data-type="two"
        :class="activeClass('testType', 'two')"
        data-help-key="" x-command="setTestType" data-arg-test-type="two" x-text="t('twoSample')"></button>
      <template x-if="model.category === 'mean'">
        <button class="btn--segment hyptest__toggle-btn" data-type="paired"
          :class="activeClass('testType', 'paired')"
          data-help-key="" x-command="setTestType" data-arg-test-type="paired" x-text="t('pairedSample')"></button>
      </template>
      <button class="btn--segment hyptest__toggle-btn" data-type="k"
        :class="activeClass('testType', 'k')"
        data-help-key="" x-command="setTestType" data-arg-test-type="k" x-text="t('kSample')"></button>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <template x-if="model.testType === 'k'">
      <div class="field-group">
        <label data-help-key="modules.hypothesis-test.fields.colRefsK.help"
               x-text="t('kSampleColumns')"></label>
        <div class="hyptest__picker" data-help-key="" data-ref="picker-k-wrap" x-field="model.colRefsK"></div>
      </div>
    </template>

    <template x-if="model.testType !== 'k'">
      <div class="hyptest__contents">
        <div class="field-group">
          <label data-help-key="modules.hypothesis-test.fields.colRef1.help"
                 x-text="sample1Label"></label>
          <div class="hyptest__picker" data-help-key="" data-ref="picker1-wrap" x-field="model.colRef1"></div>
        </div>
        <template x-if="needsSecondColumn">
          <div class="field-group">
            <label data-help-key="modules.hypothesis-test.fields.colRef2.help"
                   x-text="sample2Label"></label>
            <div class="hyptest__picker" data-help-key="" data-ref="picker2-wrap" x-field="model.colRef2"></div>
          </div>
        </template>
        <template x-if="model.testType === 'paired'">
          <p class="field-hint" x-text="t('pairedDiffHint')"></p>
        </template>
      </div>
    </template>

    <!-- Target (one-sample only) -->
    <template x-if="model.testType === 'one'">
      <div class="hyptest__contents">
        <div class="dmike-split__section-title" x-text="targetTitle"></div>

        <template x-if="model.category === 'variance'">
          <div class="field-row">
            <div class="hyptest__field field-group field-group--major">
              <label data-help-key="modules.hypothesis-test.fields.targetType.help"
                     x-text="t('inputAs')"></label>
              <select data-ref="target-type" class="field" x-field="model.targetType">
                <option value="variance" x-text="t('asVariance')"></option>
                <option value="stddev" x-text="t('asStddev')"></option>
              </select>
            </div>
            <div class="hyptest__field field-group field-group--minor">
              <label data-help-key="modules.hypothesis-test.fields.targetValue.help">σ²₀</label>
              <input type="number" data-ref="target" class="field field--num"
                x-model="model.targetValue" :placeholder="t('targetVarPh')">
            </div>
          </div>
        </template>

        <template x-if="model.category === 'mean'">
          <div class="field-grid field-grid--3">
            <div class="field-group">
              <label data-help-key="modules.hypothesis-test.fields.targetValue.help">μ₀</label>
              <input type="number" data-ref="target" class="field field--num"
                x-model="model.targetValue" :placeholder="t('targetMeanPh')">
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Target (paired: hypothesized mean difference) -->
    <template x-if="model.testType === 'paired'">
      <div class="hyptest__contents">
        <div class="dmike-split__section-title" x-text="t('targetDiff')"></div>
        <div class="field-grid field-grid--3">
          <div class="field-group">
            <label data-help-key="modules.hypothesis-test.fields.targetValue.help">μ_d₀</label>
            <input type="number" data-ref="target" class="field field--num"
              x-model="model.targetValue" :placeholder="t('targetDiffPh')">
          </div>
        </div>
      </div>
    </template>

    <div class="dmike-split__section-title" x-text="t('sectionHypothesis')"></div>
    <div class="field-row">
      <template x-if="model.testType !== 'k'">
        <div class="hyptest__field field-group field-group--major">
          <label data-help-key="modules.hypothesis-test.fields.direction.help"
                 x-text="t('direction')"></label>
          <select data-ref="direction" class="field" x-field="model.direction">
            <option value="two-sided">≠ <span x-text="t('twoSided')"></span></option>
            <option value="greater">&gt; <span x-text="t('greater')"></span></option>
            <option value="less">&lt; <span x-text="t('less')"></span></option>
          </select>
        </div>
      </template>
      <div class="hyptest__field field-group field-group--minor">
        <label data-help-key="modules.hypothesis-test.fields.alpha.help">α</label>
        <input type="number" data-ref="alpha" class="field field--num"
          x-field="model.alpha" step="0.01">
      </div>
      <template x-if="model.testType !== 'k'">
        <div class="hyptest__field field-group field-group--minor">
          <label data-help-key="modules.hypothesis-test.fields.powerGoal.help"
                 x-text="t('powerGoal')"></label>
          <input type="number" data-ref="power-goal" class="field field--num"
            x-field="model.powerGoal" step="0.05">
        </div>
      </template>
    </div>
    <template x-if="showEqualVariances">
      <label class="field-check" data-help-anchor="box"
             data-help-key="modules.hypothesis-test.fields.equalVariances.help">
        <input type="checkbox" data-ref="equal-variances"
          x-model="model.equalVariances">
        <span x-text="equalVariancesLabel"></span>
      </label>
    </template>

    <div class="hyptest__hypothesis-preview field-row">
      <div class="hyptest__h-box">
        <span class="hyptest__h-label">H₀</span>
        <span class="hyptest__h-formula" x-text="previewH0"></span>
      </div>
      <div class="hyptest__h-box">
        <span class="hyptest__h-label">H₁</span>
        <span class="hyptest__h-formula" x-text="previewH1"></span>
      </div>
    </div>

    <div class="field-error" data-ref="error-box" x-text="errorText"></div>
  </div>

  <!-- ─── Output (right) ───────────────────────────────────────── -->
  <div class="hyptest__output dmike-split__output">

    <div class="hyptest__placeholder" data-ref="placeholder" x-show="!display">
      <span class="icon icon--lg icon--empty-state" data-icon="status.no-data" aria-hidden="true"></span>
      <p x-text="t('placeholderText')"></p>
    </div>

    <div data-ref="results" x-show="display">
      <template x-if="display">
        <div>
          <!-- ── Section 1: Normality ── -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionNormality')"></span></div>
          <!-- After the title: a leading <template> would cost the title its :first-child margin rule -->
          <template x-if="pairedNote">
            <p class="field-hint field-hint--warn" data-ref="paired-note" x-text="pairedNote"></p>
          </template>

          <!-- k-sample: grid of per-group cards; otherwise stacked S1/S2 cards -->
          <div :class="normLayoutClass">
            <template x-for="(card, j) in display.normCards" :key="card.label + ':' + j">
              <div class="hyptest__result-card">
                <div class="hyptest__card-header">
                  <span x-text="card.label"></span>
                  <span class="hyptest__badge" :class="card.badgeClass" x-text="card.badgeText"></span>
                </div>
                <table class="dmike-table">
                  <thead><tr>
                    <th><span data-help-key="modules.hypothesis-test.types.NormRow.name" x-text="t('colTest')"></span></th><th><span data-help-key="modules.hypothesis-test.types.NormRow.stat" x-text="t('statistic')"></span></th><th><span data-help-key="modules.hypothesis-test.types.NormRow.p" x-text="t('common.sym.p')"></span></th><th><span data-help-key="modules.hypothesis-test.types.NormRow.decisionText" x-text="t('decision')"></span></th>
                  </tr></thead>
                  <tbody>
                    <template x-for="(row, i) in card.rows" :key="row.name + ':' + i">
                      <tr>
                        <td>
                          <span x-text="row.name"></span>
                          <button class="hyptest__algo-link" :data-algo-id="row.algoId"
                            :title="t('common.algoLabTitle')" @click="algoNavigate(row.algoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                        </td>
                        <td x-text="row.stat"></td>
                        <td :class="row.pClass" x-text="row.p"></td>
                        <td>
                          <span class="icon icon--sm icon--text" :data-icon="row.decisionIcon" aria-hidden="true"></span>
                          <span x-text="row.decisionText"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="hyptest__metrics hyptest__metrics--sm">
                  <template x-for="(m, i) in card.metrics" :key="m.label + ':' + i">
                    <div class="hyptest__metric" :title="m.title">
                      <div class="hyptest__metric-label" x-text="m.label"></div>
                      <div class="hyptest__metric-value" x-text="m.value"></div>
                      <template x-if="m.ci">
                        <div class="hyptest__metric-ci" x-text="m.ci"></div>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Routing trail -->
          <div class="hyptest__route-card">
            <div class="hyptest__route-title"><span data-help-key="modules.hypothesis-test.types.Result.route" x-text="t('algoRouting')"></span></div>
            <div class="hyptest__route-trail">
              <span class="hyptest__trail-dot" :class="normalDotClass"></span>
              <span><span x-text="t('normalLabel')"></span>: <strong x-text="normalAnswer"></strong></span>
              <template x-if="display.varEquality">
                <span style="display:contents">
                  <span class="hyptest__trail-line"></span>
                  <span class="hyptest__trail-dot" :class="varTrailDotClass"></span>
                  <span><span x-text="varTrailLabel"></span>: <strong x-text="varTrailAnswer"></strong></span>
                </span>
              </template>
              <span class="hyptest__trail-line"></span>
              <span class="hyptest__trail-dot hyptest__trail-dot--info"></span>
              <span><span class="icon icon--sm icon--text" data-icon="nav.arrow-right" aria-hidden="true"></span> <strong>
                <span x-text="display.route.name"></span>
                <template x-if="display.route.algoId">
                  <button class="hyptest__algo-link" :data-algo-id="display.route.algoId"
                    :title="t('common.algoLabTitle')" @click="algoNavigate(display.route.algoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                </template>
              </strong></span>
            </div>
          </div>

          <!-- ── Section 2: Variance Equality (k samples; two-sample means take the user's assumption) ── -->
          <template x-if="display.varEquality && display.varEquality.metrics">
            <div class="hyptest__contents">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionVarEquality')"></span></div>
              <div class="hyptest__result-card">
                <div class="hyptest__metrics">
                  <template x-for="(m, i) in display.varEquality.metrics" :key="m.label + ':' + i">
                    <div class="hyptest__metric" :title="m.title">
                      <div class="hyptest__metric-label" x-text="m.label"></div>
                      <div class="hyptest__metric-value" :class="m.valueClass">
                        <span x-text="m.value"></span>
                        <template x-if="m.algoId">
                          <button class="hyptest__algo-link" :data-algo-id="m.algoId"
                            :title="t('common.algoLabTitle')" @click="algoNavigate(m.algoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="hyptest__decision" :class="varDecisionClass">
                  <strong x-text="varDecisionText"></strong>
                </div>
              </div>
            </div>
          </template>

          <!-- ── Section 3: Main Test Result ── -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionResult')"></span></div>
          <div class="hyptest__result-card">
            <div class="hyptest__hypothesis-preview hyptest__hypothesis-preview--sm field-row">
              <div class="hyptest__h-box" :class="display.main.h0Class" :title="display.main.h0Tip">
                <span class="hyptest__h-label">H₀</span>
                <span class="hyptest__h-formula" x-text="display.main.h0"></span>
              </div>
              <div class="hyptest__h-box" :class="display.main.h1Class" :title="display.main.h1Tip">
                <span class="hyptest__h-label">H₁</span>
                <span class="hyptest__h-formula" x-text="display.main.h1"></span>
              </div>
            </div>
            <div class="hyptest__metrics" data-ref="main-metrics">
              <template x-for="(m, i) in display.main.metrics" :key="m.label + ':' + i">
                <div class="hyptest__metric" :title="m.title">
                  <div class="hyptest__metric-label" x-text="m.label"></div>
                  <div class="hyptest__metric-value" :class="m.valueClass">
                    <span x-text="m.value"></span>
                    <template x-if="m.algoId">
                      <button class="hyptest__algo-link" :data-algo-id="m.algoId"
                        :title="t('common.algoLabTitle')" @click="algoNavigate(m.algoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
            <template x-if="display.main.ciNote">
              <div class="hyptest__decision hyptest__decision--warn" data-ref="ci-note" x-text="display.main.ciNote"></div>
            </template>

            <!-- ANOVA table (k-sample mean, ANOVA route) -->
            <template x-if="display.main.anovaRows">
              <table class="dmike-table">
                <thead><tr>
                  <th><span data-help-key="modules.hypothesis-test.types.AnovaRow.src" x-text="t('source')"></span></th><th><span data-help-key="modules.hypothesis-test.types.AnovaRow.ss" x-text="t('common.sym.ss')"></span></th><th><span data-help-key="modules.hypothesis-test.types.AnovaRow.df" x-text="t('common.sym.df')"></span></th><th><span data-help-key="modules.hypothesis-test.types.AnovaRow.ms" x-text="t('common.sym.ms')"></span></th><th><span data-help-key="modules.hypothesis-test.types.AnovaRow.f" x-text="t('common.sym.f')"></span></th><th><span data-help-key="modules.hypothesis-test.types.AnovaRow.p" x-text="t('common.sym.p')"></span></th>
                </tr></thead>
                <tbody>
                  <template x-for="(row, i) in display.main.anovaRows" :key="row.src + ':' + i">
                    <tr>
                      <td><strong x-show="row.bold" x-text="row.src"></strong><span x-show="!row.bold" x-text="row.src"></span></td>
                      <td><strong x-show="row.bold" x-text="row.ss"></strong><span x-show="!row.bold" x-text="row.ss"></span></td>
                      <td><strong x-show="row.bold" x-text="row.df"></strong><span x-show="!row.bold" x-text="row.df"></span></td>
                      <td x-text="row.ms"></td>
                      <td x-text="row.f"></td>
                      <td :class="row.pClass" x-text="row.p"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>

            <!-- Model summary (k-sample mean, Fisher / Welch route) -->
            <template x-if="display.main.modelSummary">
              <div class="hyptest__model-summary" data-ref="model-summary">
                <div class="hyptest__model-summary-title" x-text="t('modelSummary')"></div>
                <div class="hyptest__metrics">
                  <template x-for="(m, i) in display.main.modelSummary" :key="m.label + ':' + i">
                    <div class="hyptest__metric" :title="m.title">
                      <div class="hyptest__metric-label" x-text="m.label"></div>
                      <div class="hyptest__metric-value" x-text="m.value"></div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Group summary table (k-sample) -->
            <template x-if="display.main.groupRows">
              <table class="dmike-table">
                <thead><tr>
                  <th><span data-help-key="modules.hypothesis-test.types.GroupRow.name" x-text="t('group')"></span></th><th><span data-help-key="modules.hypothesis-test.types.GroupRow.n" x-text="t('common.sym.n')"></span></th><th><span data-help-key="modules.hypothesis-test.types.GroupRow.mean" x-text="t('common.sym.xbar')"></span></th><th><span data-help-key="modules.hypothesis-test.types.GroupRow.variance" x-text="t('common.sym.s2')"></span></th>
                  <template x-if="display.main.showCi">
                    <th :title="t('tipGroupCi')"><span data-help-key="modules.hypothesis-test.types.GroupRow.ci" x-text="display.main.ciHeader"></span></th>
                  </template>
                  <template x-if="display.main.showCld">
                    <th :title="t('groupingHint')"><span data-help-key="modules.hypothesis-test.types.GroupRow.letters" x-text="t('groupingLabel')"></span></th>
                  </template>
                </tr></thead>
                <tbody>
                  <template x-for="(row, i) in display.main.groupRows" :key="row.name + ':' + i">
                    <tr>
                      <td x-text="row.name"></td>
                      <td x-text="row.n"></td>
                      <td x-text="row.mean"></td>
                      <td x-text="row.variance"></td>
                      <template x-if="display.main.showCi">
                        <td class="hyptest__group-ci" x-text="row.ci"></td>
                      </template>
                      <template x-if="display.main.showCld">
                        <td><strong class="hyptest__cld-letters" x-text="row.letters"></strong></td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </div>

          <!-- ── Section 3b: Rank test as secondary result (non-normal, n ≥ 20 per group) ── -->
          <template x-if="display.secondary">
            <div class="hyptest__contents">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="display.secondary.title"></span></div>
              <div class="hyptest__result-card" data-ref="secondary-result">
                <div class="hyptest__metrics">
                  <template x-for="(m, i) in display.secondary.metrics" :key="m.label + ':' + i">
                    <div class="hyptest__metric" :title="m.title">
                      <div class="hyptest__metric-label" x-text="m.label"></div>
                      <div class="hyptest__metric-value" :class="m.valueClass">
                        <span x-text="m.value"></span>
                        <template x-if="m.algoId">
                          <button class="hyptest__algo-link" :data-algo-id="m.algoId"
                            :title="t('common.algoLabTitle')" @click="algoNavigate(m.algoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="hyptest__decision hyptest__decision--warn" x-text="display.secondary.note"></div>
              </div>
            </div>
          </template>

          <!-- ── Section 4: Power Analysis (non-k) ── -->
          <template x-if="display.power">
            <div class="hyptest__contents">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionPower')"></span></div>
              <div class="hyptest__result-card">
                <div class="hyptest__decision" :class="display.power.goalBoxClass">
                  <strong><span x-text="t('powerGoal')"></span>: <span x-text="display.power.goalPct"></span>%</strong>
                  <p data-help-key="modules.hypothesis-test.types.PowerInfo.requiredLine" x-text="display.power.requiredLine"></p>
                </div>
                <div class="hyptest__metrics">
                  <template x-for="(m, i) in display.power.metrics" :key="m.label + ':' + i">
                    <div class="hyptest__metric" :title="m.title">
                      <div class="hyptest__metric-label" x-text="m.label"></div>
                      <div class="hyptest__metric-value" :class="m.valueClass" x-text="m.value"></div>
                    </div>
                  </template>
                </div>
                <template x-if="display.power.note">
                  <div class="hyptest__decision hyptest__decision--warn hyptest__power-note" data-ref="power-note" x-text="display.power.note"></div>
                </template>
              </div>
            </div>
          </template>

          <!-- ── Section 5: Pairwise post-hoc (k ≥ 3) ── -->
          <template x-if="display.pairwise">
            <div class="hyptest__contents">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.hypothesis-test.types.PairwiseCell.text" x-text="t('sectionPairwise')"></span></div>
              <div class="hyptest__result-card">
                <div class="hyptest__pairwise-meta">
                  <span x-text="t('pairwiseMethod')"></span>: <strong>
                    <span x-text="display.pairwise.methodName"></span>
                    <template x-if="display.pairwise.methodAlgoId">
                      <button class="hyptest__algo-link" :data-algo-id="display.pairwise.methodAlgoId"
                        :title="t('common.algoLabTitle')" @click="algoNavigate(display.pairwise.methodAlgoId)"><span class="icon icon--sm icon--text" data-icon="nav.algorithm-lab" aria-hidden="true"></span></button>
                    </template>
                  </strong>
                  · <span x-text="display.pairwise.hint"></span>
                </div>
                <table class="dmike-table hyptest__pairwise">
                  <thead><tr>
                    <th></th>
                    <template x-for="(h, i) in display.pairwise.headers" :key="h + ':' + i"><th x-text="h"></th></template>
                  </tr></thead>
                  <tbody>
                    <template x-for="(row, j) in display.pairwise.rows" :key="row.head + ':' + j">
                      <tr>
                        <th x-text="row.head"></th>
                        <template x-for="(cell, i) in row.cells" :key="cell.key + ':' + i">
                          <td :class="cell.cls" :title="cell.title">
                            <span class="hyptest__pairwise-p" x-text="cell.text"></span>
                            <template x-if="cell.ci">
                              <span class="hyptest__pairwise-ci" x-text="cell.ci"></span>
                            </template>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="hyptest__pairwise-legend">
                  <span class="hyptest__pairwise-swatch hyptest__pairwise-equal"></span>
                  <span x-text="t('pairwiseEqual')"></span> (p_adj ≥ <span x-text="model.alpha"></span>)
                  <span class="hyptest__pairwise-swatch hyptest__pairwise-diff"></span>
                  <span x-text="t('pairwiseDifferent')"></span> (p_adj &lt; <span x-text="model.alpha"></span>)
                </div>
                <div class="hyptest__cld-hint">
                  <span x-text="t('groupingHint')"></span> (<span x-text="t('groupingLabel')"></span>:
                  <strong x-text="display.pairwise.lettersJoined"></strong>)
                </div>
              </div>
            </div>
          </template>

          <!-- ── Section 6: Residual plots (Fisher / Welch ANOVA) ── -->
          <template x-if="display.residualPlot">
            <div class="hyptest__contents">
              <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('sectionResiduals')"></span></div>
              <div class="hyptest__residuals">
                <div class="hyptest__residual-chart" data-ref="chart-resid-fits" x-chart="residFitted"></div>
                <div class="hyptest__residual-chart" data-ref="chart-resid-normal" x-chart="residProb"></div>
                <div class="hyptest__residual-chart" data-ref="chart-resid-hist" x-chart="residHist"></div>
                <div class="hyptest__residual-chart" data-ref="chart-resid-order" x-chart="residOrder"></div>
              </div>
            </div>
          </template>

        </div>
      </template>
    </div>
  </div>
</div>
