<section class="module-container module-todo" x-data="todo">
  <div class="todo__toolbar">
    <span class="todo__counter" x-text="filteredCount() + ' / ' + model.items.length"></span>
    <div class="todo__filter-group">
      <span class="todo__filter-label" x-text="t('filter') + ':'"></span>
      <select class="field todo__filter-select" data-filter="status" x-model="model.filterStatus">
        <option value="all" x-text="t('allStatuses')"></option>
        <template x-for="s in statuses">
          <option :value="s" x-text="statusName(s)"></option>
        </template>
      </select>
      <select class="field todo__filter-select" data-filter="owner" x-model="model.filterOwner">
        <option value="all" x-text="t('allOwners')"></option>
        <template x-for="o in owners()">
          <option :value="o" x-text="o"></option>
        </template>
      </select>
      <input type="text" class="field todo__search" data-filter="search"
             x-model="model.search" :placeholder="t('searchPlaceholder')">
    </div>
  </div>

  <div class="dmike-table-wrap todo__table-wrap">
    <div class="todo__empty" x-show="model.items.length === 0" x-text="t('emptyState')"></div>
    <div class="todo__empty" x-show="model.items.length > 0 && filteredCount() === 0" x-text="t('noMatch')"></div>

    <table class="dmike-table dmike-table--sticky todo__table" x-show="filteredCount() > 0">
      <thead>
        <tr>
          <th class="todo__col-check"></th>
          <th class="todo__col-text" data-sort="text" @click="sortBy('text')">
            <span class="context-help-anchor--overlay" data-help-key="modules.todo.actions.setTodoText.help" x-text="t('colText')"></span>
            <span class="todo__sort-arrow icon icon--sm" :class="sortArrowClass('text')" :data-icon="sortArrowIcon('text')" aria-hidden="true"></span>
          </th>
          <th class="todo__col-owner" data-sort="owner" @click="sortBy('owner')">
            <span class="context-help-anchor--overlay" data-help-key="modules.todo.actions.setTodoOwner.help" x-text="t('colOwner')"></span>
            <span class="todo__sort-arrow icon icon--sm" :class="sortArrowClass('owner')" :data-icon="sortArrowIcon('owner')" aria-hidden="true"></span>
          </th>
          <th class="todo__col-due" data-sort="due" @click="sortBy('due')">
            <span class="context-help-anchor--overlay" data-help-key="modules.todo.actions.setTodoDue.help" x-text="t('colDue')"></span>
            <span class="todo__sort-arrow icon icon--sm" :class="sortArrowClass('due')" :data-icon="sortArrowIcon('due')" aria-hidden="true"></span>
          </th>
          <th class="todo__col-status" data-sort="status" @click="sortBy('status')">
            <span class="context-help-anchor--overlay" data-help-key="modules.todo.actions.setTodoStatus.help" x-text="t('colStatus')"></span>
            <span class="todo__sort-arrow icon icon--sm" :class="sortArrowClass('status')" :data-icon="sortArrowIcon('status')" aria-hidden="true"></span>
          </th>
          <template x-if="hasCalendar">
            <th class="todo__col-cal" :title="t('showInCalendar')">
              <span data-help-key="modules.todo.actions.setTodoCalendar.help"><span class="icon icon--sm" data-icon="action.calendar" aria-hidden="true"></span><span class="dmike-sr-only" x-text="t('showInCalendar')"></span></span>
            </th>
          </template>
          <th class="todo__col-actions"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in filteredItems()" :key="item.id">
          <tr class="todo__row dmike-del-btn-host" :class="rowClass(item)" :data-id="item.id">
            <td class="todo__col-check">
              <input type="checkbox" class="todo__check" data-action="toggle"
                     :checked="item.status === 'done'"
                     @change="toggleDone(item)">
            </td>
            <td class="todo__cell-text">
              <!-- Parität: dieselbe Senke wie `setTodoText` der Agentenfläche.
                   Ein `x-model` am Eintrag schriebe am Setter vorbei. -->
              <input type="text" class="field field--sm field--ghost todo__inline-input" data-field="text"
                     :value="item.text" @input="setTodoText(item.id, $event.target.value)"
                     :placeholder="t('textPlaceholder')">
            </td>
            <td>
              <!-- Parität: dieselbe Senke wie `setTodoOwner`. -->
              <input type="text" class="field field--sm field--ghost todo__inline-input" data-field="owner"
                     :value="item.owner" @input="setTodoOwner(item.id, $event.target.value)"
                     :placeholder="t('ownerPlaceholder')">
            </td>
            <td class="todo__cell-due">
              <!-- Parität: dieselbe Senke wie `setTodoDue`. `@change` statt
                   `@input`, weil ein Datumsfeld erst beim Abschluss einen
                   lesbaren Wert hat. -->
              <input type="date" class="field field--sm field--ghost todo__inline-date" data-field="due"
                     :value="item.due" @change="setTodoDue(item.id, $event.target.value)">
            </td>
            <td>
              <!-- Parität: dieselbe Senke wie `setTodoStatus`. -->
              <select class="field field--sm todo__inline-select" data-field="status"
                      @change="setTodoStatus(item.id, $event.target.value)">
                <template x-for="s in statuses">
                  <option :value="s" :selected="item.status === s" x-text="statusName(s)"></option>
                </template>
              </select>
            </td>
            <template x-if="hasCalendar">
              <td class="todo__col-cal">
                <button class="todo__cal-btn" :class="{ 'todo__cal-btn--active': item.cal }"
                        data-action="cal" :title="t('showInCalendar')" :aria-label="t('showInCalendar')"
                        @click="toggleCal(item)"><span class="icon icon--sm" data-icon="action.calendar" aria-hidden="true"></span></button>
              </td>
            </template>
            <td>
              <button class="dmike-del-btn" type="button" data-action="delete"
                      :title="t('delete')" @click="deleteTodo(item)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</section>
