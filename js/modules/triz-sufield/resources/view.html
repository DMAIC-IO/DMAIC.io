<section class="module-container triz-sf" x-data="trizSufield">
  <div class="module-container__body triz-sf__body">

    <!-- ── Model: inputs + SVG ── -->
    <section class="triz-sf__model">
      <div class="triz-sf__inputs">
        <div class="triz-sf__field">
          <label data-help-key="modules.triz-sufield.fields.s1.help" class="triz-sf__label" :for="fieldId('s1')" x-text="t('s1Label')"></label>
          <input class="field" type="text" data-role="s1" :id="fieldId('s1')"
            x-model="model.s1"
            :placeholder="t('s1Placeholder')">
        </div>
        <div class="triz-sf__field">
          <label data-help-key="modules.triz-sufield.fields.s2.help" class="triz-sf__label" :for="fieldId('s2')" x-text="t('s2Label')"></label>
          <input class="field" type="text" data-role="s2" :id="fieldId('s2')"
            x-model="model.s2"
            :placeholder="t('s2Placeholder')">
        </div>
        <div class="triz-sf__field">
          <label data-help-key="modules.triz-sufield.fields.field.help" class="triz-sf__label" :for="fieldId('field')" x-text="t('fieldLabel')"></label>
          <select class="field" data-role="field" data-help-key="" :id="fieldId('field')" x-field="model.field">
            <option value="" x-text="t('selectPlaceholder')"></option>
            <template x-for="f in fieldTypes" :key="f">
              <option :value="f" x-text="fieldOptionLabel(f)"></option>
            </template>
          </select>
        </div>
        <div class="triz-sf__field">
          <label data-help-key="modules.triz-sufield.fields.link.help" class="triz-sf__label" :for="fieldId('link')" x-text="t('linkLabel')"></label>
          <select class="field" data-role="link" data-help-key="" :id="fieldId('link')" x-field="model.link">
            <option value="" x-text="t('selectPlaceholder')"></option>
            <template x-for="l in linkTypes" :key="l">
              <option :value="l" x-text="linkOptionLabel(l)"></option>
            </template>
          </select>
        </div>
      </div>

      <div class="triz-sf__diagram-wrap">
        <svg class="triz-sf__diagram" viewBox="0 0 320 200"
          xmlns="http://www.w3.org/2000/svg" role="img"
          :aria-label="t('diagramAria')"
          :class="edgeClass">
          <defs>
            <marker :id="fieldId('arrow')" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path class="triz-sf__arrow-head" d="M0,0 L10,5 L0,10 z"/>
            </marker>
          </defs>
          <!-- bottom edge -->
          <line class="triz-sf__edge" x1="60" y1="160" x2="260" y2="160" stroke-width="2.5"
            :stroke-dasharray="dashArray"
            :marker-end="markerEnd"/>
          <!-- side edges -->
          <line x1="160" y1="30" x2="60" y2="160" stroke="var(--color-border-primary)" stroke-width="1.5"
            :stroke-dasharray="sideDash"/>
          <line x1="160" y1="30" x2="260" y2="160" stroke="var(--color-border-primary)" stroke-width="1.5"
            :stroke-dasharray="sideDash"/>
          <!-- nodes -->
          <g class="triz-sf__diag-node">
            <circle cx="160" cy="30" r="22" fill="var(--color-bg-secondary)" stroke="var(--color-border-primary)"/>
            <text x="160" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="var(--color-text-primary)">F</text>
          </g>
          <text x="160" y="14" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" x-text="fieldLabel"></text>
          <g class="triz-sf__diag-node">
            <circle cx="60" cy="160" r="22" fill="var(--color-bg-secondary)" stroke="var(--color-border-primary)"/>
            <text x="60" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-text-primary)">S1</text>
          </g>
          <text x="60" y="195" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" x-text="s1Text"></text>
          <g class="triz-sf__diag-node">
            <circle cx="260" cy="160" r="22" fill="var(--color-bg-secondary)" stroke="var(--color-border-primary)"/>
            <text x="260" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-text-primary)">S2</text>
          </g>
          <text x="260" y="195" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" x-text="s2Text"></text>
        </svg>
      </div>
    </section>

    <!-- ── Diagnosis ── -->
    <section class="triz-sf__diagnosis">
      <div class="triz-sf__diagnosis-text">
        <strong data-help-key="modules.triz-sufield.fields.diagnosis.help" x-text="t('diagnosisLabel')"></strong>:
        <span data-help-key="modules.triz-sufield.types.Diagnosis.situation" x-text="situationText"></span>
        <span class="triz-sf__diagnosis-classes">
          <span data-help-key="modules.triz-sufield.types.Diagnosis.suggestedClasses" x-text="suggestedClassesLabel"></span>
          <template x-for="c in suggestedClassList" :key="c">
            <code x-text="c"></code>
          </template>
        </span>
      </div>
      <textarea class="field triz-sf__problem-note" rows="2" data-role="problem-note"
        x-model="model.problemNote"
        :aria-label="t('problemNoteLabel')"
        :placeholder="t('problemNotePlaceholder')"></textarea>
    </section>

    <!-- ── Filter ── -->
    <section class="triz-sf__filter" role="radiogroup" x-set="model.filterMode" data-help-key="" :aria-label="t('filterAria')">
      <label class="triz-sf__filter-label">
        <input type="radio" value="auto" data-role="filter">
        <span x-text="t('filterAuto')"></span>
      </label>
      <label data-help-anchor="box" data-help-key="modules.triz-sufield.fields.filterMode.help" class="triz-sf__filter-label">
        <input type="radio" value="all" data-role="filter">
        <span x-text="t('filterAll')"></span>
      </label>
    </section>

    <!-- ── Standards ── -->
    <section class="triz-sf__standards">
      <template x-for="group in standardClasses" :key="group.cls">
        <details class="triz-sf__class"
          x-show="isClassVisible(group.cls)"
          :data-class="group.cls"
          :open="isClassOpen(group.cls)"
          @toggle="classToggled(group.cls, $event)">
          <summary class="triz-sf__class-head">
            <span class="icon icon--sm" :data-icon="classIcon(group.cls)" aria-hidden="true"></span>
            <span class="triz-sf__class-num" x-text="group.cls"></span>
            <span data-help-key="modules.triz-sufield.fields.expandedClasses.help" class="triz-sf__class-title" x-text="className(group.cls)"></span>
            <span class="triz-sf__class-count" x-text="classCountText(group)"></span>
          </summary>
          <p data-help-key="modules.triz-sufield.fields.standards.help" class="triz-sf__class-desc" x-text="classDesc(group.cls)"></p>
          <ul class="triz-sf__standard-list">
            <template x-for="s in group.standards" :key="s.id">
              <li class="triz-sf__standard"
                :class="standardClass(s)"
                :data-id="s.id">
                <details>
                  <summary class="triz-sf__standard-head">
                    <span class="triz-sf__standard-id" x-text="s.id"></span>
                    <span class="triz-sf__standard-title" :id="stdTitleId(s)" x-text="stdTitle(s)"></span>
                    <span class="triz-sf__standard-pin icon icon--sm" data-icon="status.selected" x-show="isSelected(s)" aria-hidden="true"></span>
                  </summary>
                  <p class="triz-sf__standard-desc" x-text="stdDesc(s)"></p>
                  <p class="triz-sf__standard-trigger"><em x-text="t('triggerLead')"></em>: <span x-text="stdTrigger(s)"></span></p>
                  <p class="triz-sf__standard-example"><em x-text="t('exampleLead')"></em>: <span x-text="stdExample(s)"></span></p>
                  <textarea class="field triz-sf__standard-note" rows="2" data-role="standard-note"
                    :data-id="s.id"
                    :aria-labelledby="stdTitleId(s)"
                    :placeholder="t('standardNotePlaceholder')"
                    x-model="model.notes[s.id]"></textarea>
                  <label data-help-key="modules.triz-sufield.fields.selected.help" class="triz-sf__standard-select">
                    <input type="checkbox" data-role="standard-select"
                      :data-id="s.id"
                      :checked="isSelected(s)"
                      @change="selectChanged(s, $event)">
                    <span x-text="t('considered')"></span>
                  </label>
                </details>
              </li>
            </template>
          </ul>
        </details>
      </template>
    </section>

  </div>
</section>
