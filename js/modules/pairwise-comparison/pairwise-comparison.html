<section class="module-container pairwise" x-data="pairwiseComparison" @keydown.window="compareKey($event)">
  <div class="module-container__body">
    <div class="dmike-tabs" role="tablist" x-tablist data-help-key="modules.pairwise-comparison.actions.setViewPhase.help">
      <button class="dmike-tab" type="button" role="tab" data-tab="input" :class="tabClass(0)" :disabled="isTabLocked(0)"
        :aria-selected="model.viewPhase === 'input' ? 'true' : 'false'" :tabindex="model.viewPhase === 'input' ? 0 : -1"
        @mousedown="preventFocus($event)" @click="goToTab('input')">
        <span class="dmike-tab__num">01</span><span x-text="t('tabInput')"></span>
      </button>
      <button class="dmike-tab" type="button" role="tab" data-tab="compare" :class="tabClass(1)" :disabled="isTabLocked(1)"
        :aria-selected="model.viewPhase === 'compare' ? 'true' : 'false'" :tabindex="model.viewPhase === 'compare' ? 0 : -1"
        @mousedown="preventFocus($event)" @click="goToTab('compare')">
        <span class="dmike-tab__num">02</span><span x-text="t('tabCompare')"></span>
      </button>
      <button class="dmike-tab" type="button" role="tab" data-tab="results" :class="tabClass(2)" :disabled="isTabLocked(2)"
        :aria-selected="model.viewPhase === 'results' ? 'true' : 'false'" :tabindex="model.viewPhase === 'results' ? 0 : -1"
        @mousedown="preventFocus($event)" @click="goToTab('results')">
        <span class="dmike-tab__num">03</span><span x-text="t('tabResults')"></span>
      </button>
    </div>

    <div class="pairwise__content" :class="contentClass()" data-ref="content">

      <!-- INPUT PHASE -->
      <template x-if="model.viewPhase === 'input'">
        <div class="pairwise__section">
          <div class="pairwise__section-label" x-text="t('addSectionLabel')"></div>
          <div class="pairwise__input-row">
            <input type="text" class="field pairwise__input" data-ref="criterionInput"
              x-model="inputValue"
              :placeholder="t('criterionPlaceholder')"
              maxlength="60"
              :disabled="atMax()"
              @keydown.enter.prevent="addCriterionFromInput()">
            <button class="pairwise__btn pairwise__btn--accent" type="button"
              data-help-key="modules.pairwise-comparison.actions.addCriterion.help"
              data-action="add" :disabled="atMax()" @click="addCriterionFromInput()"
              x-text="addBtnLabel()"></button>
          </div>
          <div class="pairwise__chips">
            <template x-for="(c, i) in model.criteria">
              <span class="pairwise__chip" :key="c">
                <span class="pairwise__chip-num" x-text="chipNum(i)"></span>
                <span class="pairwise__chip-label" x-text="c"></span>
                <button class="pairwise__chip-remove" type="button"
                  data-action="remove" :data-idx="i"
                  :title="t('removeCriterion')" :aria-label="t('removeCriterion')"
                  @click="removeCriterion(i)">×</button>
              </span>
            </template>
          </div>
          <template x-if="model.criteria.length === 0">
            <div class="pairwise__empty">
              <strong x-text="t('emptyTitle')"></strong>
              <span x-text="emptyHintText()"></span>
            </div>
          </template>
          <template x-if="atMax()">
            <div class="pairwise__hint" x-text="maxReachedText()"></div>
          </template>
          <button class="pairwise__btn pairwise__btn--start" type="button"
            data-help-key="modules.pairwise-comparison.actions.startComparison.help"
            data-action="start" :disabled="model.criteria.length < 3"
            @click="startComparison()">
            <span x-text="startLabel()"></span>
            <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true" x-show="isStartReady()"></span>
          </button>
        </div>
      </template>

      <!-- COMPARE PHASE -->
      <template x-if="model.viewPhase === 'compare'">
        <div>
          <div class="pairwise__progress">
            <div class="pairwise__progress-bar">
              <div class="pairwise__progress-fill" :style="progressStyle()"></div>
            </div>
            <div class="pairwise__progress-text" x-text="progressText()"></div>
          </div>
          <div class="pairwise__card">
            <div class="pairwise__vs-label" x-text="t('vsPrompt')"></div>
            <div class="pairwise__vs">
              <button class="pairwise__vs-option" type="button" data-action="choose" data-help-key="modules.pairwise-comparison.actions.chooseLeft.help" @click="chooseLeft()">
                <span class="pairwise__vs-hotkey"><span class="icon icon--sm" data-icon="nav.arrow-left" aria-hidden="true"></span></span>
                <span class="pairwise__vs-name" x-text="leftName()"></span>
              </button>
              <div class="pairwise__vs-divider">vs</div>
              <button class="pairwise__vs-option" type="button" data-action="choose" data-help-key="modules.pairwise-comparison.actions.chooseRight.help" @click="chooseRight()">
                <span class="pairwise__vs-hotkey"><span class="icon icon--sm" data-icon="nav.arrow-right" aria-hidden="true"></span></span>
                <span class="pairwise__vs-name" x-text="rightName()"></span>
              </button>
            </div>
            <button class="pairwise__vs-tie" type="button" data-action="tie" data-help-key="modules.pairwise-comparison.actions.tieCurrent.help" @click="tieCurrent()">
              <span class="pairwise__vs-hotkey">␣</span>
              <span x-text="tieLabel()"></span>
            </button>
          </div>
          <div class="pairwise__compare-actions">
            <button class="pairwise__btn pairwise__btn--outline" type="button"
              data-action="back-to-input" data-help-key="modules.pairwise-comparison.actions.setViewPhase.help" @click="backToInput()">
              <span class="icon icon--sm icon--text" data-icon="nav.back" aria-hidden="true"></span><span x-text="backLabel()"></span>
            </button>
          </div>
        </div>
      </template>

      <!-- RESULTS PHASE -->
      <template x-if="model.viewPhase === 'results'">
        <div>
          <template x-if="model.criteria.length === 0">
            <div class="pairwise__empty"><strong x-text="t('noResults')"></strong></div>
          </template>
          <template x-if="model.criteria.length > 0">
            <div>
              <div class="pairwise__results-grid">
                <div class="pairwise__results-col">
                  <div class="pairwise__section-label"><span data-help-key="modules.pairwise-comparison.types.Result.ranking" x-text="t('rankingLabel')"></span></div>
                  <ol class="pairwise__rank-list">
                    <template x-for="(r, pos) in model.ranked">
                      <li class="pairwise__rank-item" :key="r.idx"
                        :class="medalClass(pos)" :style="rankDelay(pos)">
                        <span class="pairwise__rank-pos" x-text="pos + 1"></span>
                        <span class="pairwise__rank-name" x-text="r.name"></span>
                        <span class="pairwise__rank-bar-wrap">
                          <span class="pairwise__rank-bar" :style="rankBarStyle(r.score)"></span>
                        </span>
                        <span class="pairwise__rank-score" data-help-key="modules.pairwise-comparison.types.RankEntry.score" x-text="rankScore(r.score)"></span>
                      </li>
                    </template>
                  </ol>
                </div>
                <div class="pairwise__results-col">
                  <div class="pairwise__section-label"><span data-help-key="modules.pairwise-comparison.types.Result.scores" x-text="t('matrixLabel')"></span></div>
                  <div class="pairwise__matrix-wrap">
                    <table class="pairwise__matrix">
                      <thead>
                        <tr>
                          <th class="pairwise__matrix-corner"></th>
                          <template x-for="(c, j) in model.criteria">
                            <th class="pairwise__matrix-col-header" :key="j">
                              <span class="pairwise__matrix-col-header-content" x-text="c"></span>
                            </th>
                          </template>
                          <th class="pairwise__matrix-col-header pairwise__matrix-col-header--sum">
                            <span class="pairwise__matrix-col-header-content" data-help-key="modules.pairwise-comparison.types.Result.scores" x-text="t('common.sym.sum')"></span>
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(rowName, i) in model.criteria">
                          <tr :key="i">
                            <th class="pairwise__matrix-row-label" x-text="rowName"></th>
                            <template x-for="(colName, j) in model.criteria">
                              <td class="pairwise__matrix-cell" :key="j"
                                :class="matrixCellClass(i, j)"
                                :data-i="i" :data-j="j"
                                :title="cellTitle(i, j)"
                                @click="cellClick(i, j)"
                                x-text="matrixCellText(i, j)"></td>
                            </template>
                            <td class="pairwise__matrix-cell pairwise__matrix-cell--sum"
                              x-text="scoreFmt(i)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <div class="pairwise__matrix-hint">
                    <span x-text="t('matrixHint')"></span>
                    <span class="pairwise__matrix-legend">
                      <span class="pairwise__dot pairwise__dot--win"></span>
                      <span x-text="legendWinText()"></span>
                    </span>
                    <span class="pairwise__matrix-legend">
                      <span class="pairwise__dot pairwise__dot--tie"></span>
                      <span x-text="legendTieText()"></span>
                    </span>
                    <span class="pairwise__matrix-legend">
                      <span class="pairwise__dot pairwise__dot--lose"></span>
                      <span x-text="legendLoseText()"></span>
                    </span>
                  </div>
                </div>
              </div>
              <div class="pairwise__actions">
                <button class="pairwise__btn pairwise__btn--outline" type="button"
                  data-action="export-csv" @click="exportCSV()">
                  <span class="icon icon--sm icon--text" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportCSV')"></span>
                </button>
                <button class="pairwise__btn pairwise__btn--outline" type="button"
                  data-action="export-json" @click="exportJSON()">
                  <span class="icon icon--sm icon--text" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportJSON')"></span>
                </button>
                <button class="pairwise__btn pairwise__btn--outline" type="button"
                  data-action="copy-results" @click="copyResults()">
                  <span class="pairwise__nav-arrow">⎘ </span><span x-text="t('copyResults')"></span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>

    </div>
  </div>
</section>
