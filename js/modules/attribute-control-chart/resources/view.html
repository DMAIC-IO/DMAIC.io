<div class="attr-cc dmike-split" x-data="attributeControlChart">
  <div class="attr-cc__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionChartType')"></div>
    <div class="field-group">
      <label data-help-key="modules.attribute-control-chart.fields.chartTypeId.help" x-text="t('chartType')"></label>
      <select class="field" data-ref="chart-type" data-help-key="" x-field="model.chartTypeId">
        <option value="p" x-text="t('type_p')"></option>
        <option value="np" x-text="t('type_np')"></option>
        <option value="c" x-text="t('type_c')"></option>
        <option value="u" x-text="t('type_u')"></option>
      </select>
      <span class="field-hint" x-text="typeHint"></span>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <div class="field-group">
      <label data-help-key="modules.attribute-control-chart.fields.defectsRef.help" x-text="t('defectsColumn')"></label>
      <div class="attr-cc__picker" data-help-key="" data-ref="defects-picker" x-field="model.defectsRef"></div>
    </div>

    <div class="field-group" data-ref="size-row" x-show="requiresSampleSize">
      <label data-help-key="modules.attribute-control-chart.fields.sizeRef.help" x-text="t('sizeColumn')"></label>
      <div class="attr-cc__picker" data-help-key="" data-ref="size-picker" x-field="model.sizeRef"></div>
      <span class="field-hint" x-text="t('sizeHint')"></span>
    </div>

    <div class="field-group" data-ref="constn-row" x-show="requiresConstantN">
      <label data-help-key="modules.attribute-control-chart.fields.constantN.help" x-text="t('constantN')"></label>
      <input class="field field--num" data-ref="constant-n" data-help-key="" x-field="model.constantN">
      <span class="field-hint" x-text="t('constantNHint')"></span>
    </div>

    <div class="field-group">
      <label data-help-key="modules.attribute-control-chart.fields.baselineCount.help" x-text="t('baselineCount')"></label>
      <input class="field field--num" data-ref="baseline-count" data-help-key="" :placeholder="t('baselineAll')" x-field="model.baselineCount">
      <span class="field-hint" x-text="t('baselineHint')"></span>
    </div>

    <div class="dmike-split__section-title attr-cc__collapsible" data-ref="nelson-toggle"
      :class="nelsonToggleClass" @click="toggleNelson()">
      <span data-help-key="modules.attribute-control-chart.fields.enabledRules.help" x-text="t('sectionNelson')"></span>
      <span class="attr-cc__chevron icon icon--sm" :data-icon="nelsonChevron" aria-hidden="true"></span>
    </div>
    <div class="field-checks" data-ref="nelson-panel" :class="nelsonPanelClass">
      <template x-for="rule in nelsonRules" :key="rule.id">
        <label class="field-check">
          <input type="checkbox" :data-rule="rule.id" :checked="ruleOn(rule)" @change="ruleChanged(rule, $event)">
          <span>
            <strong x-text="ruleShort(rule)"></strong><br>
            <span class="field-check__desc" x-text="ruleDesc(rule)"></span>
          </span>
        </label>
      </template>
    </div>

  </div>

  <div class="attr-cc__output dmike-split__output">
    <div data-ref="stats-bar">
      <template x-if="kpis">
        <div class="dmike-kpi-strip">
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="kpis.cl"></div>
            <div class="dmike-kpi-label" data-help-key="modules.attribute-control-chart.types.Result.cl" x-text="t('statCL')"></div>
            <div class="dmike-kpi-sub" x-text="centerFor"></div>
          </div>
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="kpis.uclMean"></div>
            <div class="dmike-kpi-label" data-help-key="modules.attribute-control-chart.types.Result.ucl" x-text="kpis.limitsLabel"></div>
            <div class="dmike-kpi-sub">
              <span x-text="kpis.lclMean"></span>
              <span class="attr-cc__var-warning" x-show="kpis.variableLimits" x-text="t('variableLimits')"></span>
            </div>
          </div>
          <div class="dmike-kpi" :class="violationKpiClass">
            <div class="dmike-kpi-value" x-text="kpis.violationCount"></div>
            <div class="dmike-kpi-label" data-help-key="modules.attribute-control-chart.types.Result.signals" x-text="t('statViolations')"></div>
            <div class="dmike-kpi-sub" x-text="validText"></div>
          </div>
        </div>
      </template>
    </div>

    <div data-ref="charts-wrap">
      <template x-if="kpis">
        <div class="attr-cc__chart-section">
          <div class="attr-cc__chart-header">
            <span class="attr-cc__chart-title" x-text="chartTitle"></span>
            <span class="attr-cc__badge" :class="badge.cls">
              <span class="icon icon--sm icon--text" :data-icon="badge.icon" aria-hidden="true"></span>
              <span x-text="badge.text"></span>
            </span>
          </div>
          <div class="attr-cc__plot-wrap" data-ref="plot" x-chart="controlChart"></div>
        </div>
      </template>
    </div>

    <div data-ref="violations-wrap">
      <template x-if="showNoViolations">
        <div class="attr-cc__no-violations" x-text="t('noViolations')"></div>
      </template>
      <template x-if="showViolations">
        <div class="attr-cc__violations-panel">
          <div class="attr-cc__violations-header" x-text="violationsHeader"></div>
          <div class="attr-cc__violations-list">
            <template x-for="row in violationRows" :key="row.key">
              <div class="attr-cc__violation-row">
                <span class="attr-cc__v-idx" x-text="row.idx"></span>
                <span class="attr-cc__v-rule" x-text="row.rule"></span>
                <span class="attr-cc__v-desc" x-text="row.desc"></span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
