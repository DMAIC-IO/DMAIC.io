<template x-if="empty">
  <p class="dashboard-area__empty" x-text="empty"></p>
</template>
<template x-if="!empty">
  <div class="dashboard-attr-spc">
    <div class="dashboard-spc__header">
      <span class="dashboard-spc__type dashboard-attr-spc__type" data-help-key="modules.attribute-control-chart.fields.chartTypeId.help" x-text="type"></span>
      <span class="dashboard-attr-spc__badge" :class="badgeModifier" x-text="badge"></span>
    </div>
    <div class="dashboard-spc__metrics">
      <div class="dashboard-spc__metric" :class="metric.modifier">
        <span class="dashboard-spc__metric-value" x-text="metric.value"></span>
        <span class="dashboard-spc__metric-label" data-help-key="modules.attribute-control-chart.types.Result.signals" x-text="metric.label"></span>
        <span class="dashboard-spc__metric-sub" x-text="metric.sub"></span>
      </div>
    </div>
    <div class="dashboard-spc__stats dashboard-attr-spc__stats">
      <div class="dashboard-spc__stat">
        <span class="dashboard-spc__stat-label" data-help-key="modules.attribute-control-chart.types.Result.cl">CL</span>
        <span class="dashboard-spc__stat-value" x-text="clText"></span>
      </div>
      <div class="dashboard-spc__stat">
        <span class="dashboard-spc__stat-label" data-help-key="modules.attribute-control-chart.types.Result.ucl" x-text="uclLabel"></span>
        <span class="dashboard-spc__stat-value" x-text="uclText"></span>
      </div>
      <div class="dashboard-spc__stat">
        <span class="dashboard-spc__stat-label" data-help-key="modules.attribute-control-chart.types.Result.lcl" x-text="lclLabel"></span>
        <span class="dashboard-spc__stat-value" x-text="lclText"></span>
      </div>
    </div>
    <template x-if="chart">
      <div class="dashboard-area__plot dashboard-attr-spc__plot" x-widget="control-chart" x-widget-config="chart"></div>
    </template>
  </div>
</template>
