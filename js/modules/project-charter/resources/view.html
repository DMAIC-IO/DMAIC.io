<section class="module-container project-charter" x-data="projectCharter">
  <div class="module-container__body">

    <!-- Problembeschreibung -->
    <section class="pc__section pc__problem-section">
      <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.project-charter.fields.problemStatement.help" x-text="t('problemStatement')"></span></div>
      <div class="pc__problem" data-help-key="" x-field="model.problemStatement"
        :aria-label="t('problemStatement')" :placeholder="t('problemPlaceholder')"></div>
    </section>

    <!-- Ziele -->
    <section class="pc__section pc__goals-section">
      <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.project-charter.fields.goals.help" x-text="t('goals')"></span></div>

      <template x-if="model.goals.length === 0">
        <p class="pc__no-goals" x-text="t('noGoals')"></p>
      </template>

      <template x-if="model.goals.length > 0">
        <div class="pc__goals-table-wrap">
          <table class="dmike-table dmike-table--draggable pc__goals-table">
            <thead>
              <tr>
                <th class="dmike-table__grip-col"></th>
                <th class="pc__col-nr" :aria-label="t('reorder')">#</th>
                <th class="pc__col-description"><span data-help-key="modules.project-charter.fields.goals.description.help" x-text="t('goalDescription')"></span></th>
                <th class="pc__col-date"><span data-help-key="modules.project-charter.fields.goals.targetDate.help" x-text="t('goalTargetDate')"></span></th>
                <th class="pc__col-metric"><span data-help-key="modules.project-charter.fields.goals.metric.help" x-text="t('goalMetric')"></span></th>
                <th class="pc__col-target"><span data-help-key="modules.project-charter.fields.goals.targetValue.help" x-text="t('goalTargetValue')"></span></th>
                <th class="pc__col-zeg" :title="t('goalAchievementFull')"><span data-help-key="modules.project-charter.fields.goals.achievementLevel.help" x-text="t('goalAchievement')"></span></th>
                <th class="pc__col-del" :aria-label="t('deleteGoal')"></th>
              </tr>
            </thead>
            <tbody data-reorder-group="goals" data-reorder-closed :data-reorder-group-label="t('goals')">
              <template x-for="(g, gi) in model.goals" :key="g.id">
                <tr class="pc__goal-row" :data-id="g.id" :data-reorder-index="gi" :class="goalPreviewClass(g.id)"
                  @click.outside="cancelRemoveGoal(g.id)">
                  <td class="dmike-table__grip-col">
                    <button class="dmike-table__grip pc__goal-grip" type="button" :aria-label="t('common.reorder')"></button>
                  </td>
                  <td class="pc__col-nr" x-text="gi + 1"></td>
                  <td class="pc__col-description">
                    <textarea class="field field--sm field--ghost pc__cell-input pc__cell-textarea" rows="1"
                      data-field="description" :placeholder="t('goalDescription')" :aria-label="t('goalDescription')"
                      x-model="g.description"></textarea>
                  </td>
                  <td class="pc__col-date">
                    <input class="field field--sm field--ghost pc__cell-input" type="date"
                      data-field="targetDate" :class="isPast(g) ? 'pc__date--past' : ''"
                      :aria-label="t('goalTargetDate')" :title="isPast(g) ? t('dateInPast') : ''"
                      x-model="g.targetDate">
                  </td>
                  <td class="pc__col-metric">
                    <input class="field field--sm field--ghost pc__cell-input" type="text"
                      data-field="metric" :placeholder="t('goalMetric')" :aria-label="t('goalMetric')"
                      x-model="g.metric">
                  </td>
                  <td class="pc__col-target">
                    <input class="field field--sm field--ghost pc__cell-input" type="text"
                      data-field="targetValue" :placeholder="t('goalTargetValue')" :aria-label="t('goalTargetValue')"
                      x-model="g.targetValue">
                  </td>
                  <td class="pc__col-zeg">
                    <div class="pc__zeg-wrap" :class="zegClass(g)">
                      <input class="field field--sm field--ghost pc__zeg-input" type="number" min="0" max="100" data-field="achievementLevel" data-help-key=""
                        :aria-label="t('goalAchievementFull')" :title="t('goalAchievementTooltip')"
                        @change="clampLevel($event)" x-field="g.achievementLevel">
                      <div class="pc__zeg-bar-track">
                        <div class="pc__zeg-bar-fill" :style="zegWidth(g)"></div>
                      </div>
                      <template x-if="isDone(g)">
                        <span class="pc__zeg-done" :aria-label="t('goalAchieved')" role="img"><span class="icon icon--sm" data-icon="status.ok" aria-hidden="true"></span></span>
                      </template>
                    </div>
                  </td>
                  <td class="pc__col-del">
                    <button class="btn btn--icon pc__del-btn" type="button"
                      :class="isConfirming(g.id) ? 'btn--danger' : 'btn--ghost'"
                      :title="isConfirming(g.id) ? t('deleteGoalConfirm') : t('deleteGoal')"
                      :aria-label="isConfirming(g.id) ? t('deleteGoalConfirm') : t('deleteGoal')"
                      data-confirm-delete="off" @click="askRemoveGoal(g.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true" x-show="!isConfirming(g.id)"></span><span x-show="isConfirming(g.id)" x-text="t('deleteGoalConfirm')"></span></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>

      <button class="btn btn--secondary btn--sm pc__add-btn" type="button" data-help-key="modules.project-charter.actions.addGoal.help"
        @click="addGoalAndFocus()" x-text="t('addGoalLabel')"></button>
    </section>

    <!-- Organigramm -->
    <section class="pc__section pc__org-section" :style="styleVars">
      <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.project-charter.fields.orgChart.help" x-text="t('orgChart')"></span></div>
      <div class="pc__org-toolbar">
        <button class="btn btn--primary btn--sm pc__org-add-btn" type="button" data-help-key="modules.project-charter.actions.addOrgNode.help"
          x-dialog="addNodeForm" :data-dialog-title="t('orgNew')" x-text="t('orgNewLabel')"></button>
        <button class="btn btn--sm pc__org-layout-btn" type="button" data-help-key="modules.project-charter.actions.fitOrg.help"
          @click="fit()" x-text="t('orgLayout')"></button>
      </div>
      <div class="pc__org-card" data-ref="orgCard">
        <div class="pc__org-wrap" data-ref="orgWrap" :class="wrapClass" :style="wrapStyle"
          @pointerdown="onPointerDown($event)" @pointermove="onPointerMove($event)" @pointerup="onPointerUp()"
          @pointercancel="onPointerUp()" @pointerleave="onPointerUp()" @wheel="onWheel($event)">
          <div class="pc__org-canvas" data-ref="orgCanvas" data-org-root :style="canvasStyle">
            <div class="pc__org-lines" data-ref="orgLines" x-widget="node-links" x-widget-config="orgLinks"></div>
            <template x-for="n in layout.nodes" :key="n.id">
              <div class="pc__org-node" tabindex="0" :data-id="n.id" :data-parent-id="n.pid" :data-child-count="n.childCount"
                :class="nodeClass(n)" :style="nodeStyle(n)" :aria-label="n.title">
                <div class="pc__org-dot-t"></div>
                <div class="pc__org-node-title" x-text="n.title"></div>
                <template x-if="n.desc">
                  <div class="pc__org-node-desc" x-text="n.desc"></div>
                </template>
                <div class="pc__org-node-bar">
                  <button class="pc__org-node-btn" type="button" data-action="add" data-help-key=""
                    @pointerdown.stop @keydown.enter.stop @keydown.space.stop
                    x-dialog="addNodeForm" :data-arg-parent-id="n.id" :data-dialog-title="t('addChildTo', { name: n.title })"
                    :title="t('addChild')" :aria-label="t('addChild')"><span class="icon pc__org-node-ico" data-icon="action.add" aria-hidden="true"></span></button>
                  <button class="pc__org-node-btn" type="button" data-action="edit" data-help-key=""
                    @pointerdown.stop @keydown.enter.stop @keydown.space.stop
                    x-dialog="editNodeForm" :data-arg-id="n.id" :data-dialog-title="t('editNode')"
                    :title="t('editNode')" :aria-label="t('editNode')"><span class="icon pc__org-node-ico" data-icon="action.edit" aria-hidden="true"></span></button>
                  <template x-if="n.childCount > 0">
                    <button class="pc__org-node-btn" type="button" data-action="toggle"
                      @pointerdown.stop @keydown.enter.stop @keydown.space.stop @click="toggleCollapse(n.id)"
                      :title="collapseTitle(n)" :aria-label="collapseTitle(n)" :aria-expanded="n.collapsed ? 'false' : 'true'"><span class="icon pc__org-node-ico" :data-icon="n.collapsed ? 'nav.expand-down' : 'nav.collapse-up'" aria-hidden="true"></span><span x-show="n.collapsed" x-text="n.childCount"></span></button>
                  </template>
                  <button class="pc__org-node-btn pc__org-node-btn--del" type="button" data-action="del" data-help-key=""
                    @pointerdown.stop @keydown.enter.stop @keydown.space.stop
                    x-command="removeOrgNode" :data-arg-id="n.id"
                    :title="t('common.delete')" :aria-label="t('common.delete')"><span class="icon pc__org-node-ico" data-icon="action.delete" aria-hidden="true"></span></button>
                </div>
                <div class="pc__org-dot-b"></div>
              </div>
            </template>
            <div class="pc__org-drop-line" :style="dropStyle"></div>
          </div>
          <div class="pc__org-empty" data-ref="orgEmpty" :class="model.orgChart.length ? 'pc__org-empty--hidden' : ''">
            <p x-text="t('noOrgChart')"></p>
          </div>
          <div class="dmike-chart-modebar pc__org-modebar">
            <button class="dmike-chart-modebar-btn" type="button" data-action="zoom"
              :title="t('zoomIn')" :aria-label="t('zoomIn')" @click="zoomIn()"><span class="icon" data-icon="action.zoom-in" aria-hidden="true"></span></button>
            <button class="dmike-chart-modebar-btn" type="button" data-action="reset"
              :title="t('fit')" :aria-label="t('fit')" @click="fit()"><span class="icon" data-icon="action.reset" aria-hidden="true"></span></button>
            <div class="dmike-chart-modebar-sep"></div>
            <button class="dmike-chart-modebar-btn" type="button" data-action="editor" :class="state.editorOpen ? 'active' : ''"
              :title="t('editor.toggle')" :aria-label="t('editor.toggle')" :aria-pressed="state.editorOpen ? 'true' : 'false'"
              @click="toggleEditor()"><span class="icon" data-icon="action.edit" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="pc__org-editor" data-ref="orgEditor" :class="state.editorOpen ? 'pc__org-editor--open' : ''">
          <div class="pc__org-editor-inner" data-ref="orgEditorInner">
            <div class="pc__org-editor-title"><span data-help-key="modules.project-charter.fields.orgStyle.help" x-text="t('editor.title')"></span></div>
            <div class="dmike-chart-ed-section">
              <div class="dmike-chart-ed-section-title" x-text="t('editor.nodeAppearance')"></div>
              <div class="dmike-chart-ed-color-pair">
                <label data-help-key="modules.project-charter.fields.orgStyle.nodeBg.help" x-text="t('editor.bgColor')"></label>
                <button class="dmike-chart-ed-color-swatch" type="button" data-style-key="nodeBg" :style="swatchStyle('nodeBg')"
                  :title="t('colorPick')" :aria-label="t('editor.bgColor')" @click="openColor('nodeBg', $event)"></button>
              </div>
              <div class="dmike-chart-ed-color-pair">
                <label data-help-key="modules.project-charter.fields.orgStyle.nodeBorderColor.help" x-text="t('editor.borderColor')"></label>
                <button class="dmike-chart-ed-color-swatch" type="button" data-style-key="nodeBorderColor" :style="swatchStyle('nodeBorderColor')"
                  :title="t('colorPick')" :aria-label="t('editor.borderColor')" @click="openColor('nodeBorderColor', $event)"></button>
              </div>
              <div class="dmike-chart-ed-inline-row">
                <label data-help-key="modules.project-charter.fields.orgStyle.nodeBorderStyle.help" x-text="t('editor.borderStyle')"></label>
                <select data-style-key="nodeBorderStyle" data-help-key="" :aria-label="t('editor.borderStyle')" x-field="model.orgStyle.nodeBorderStyle">
                  <option value="solid" x-text="t('editor.solid')"></option>
                  <option value="dashed" x-text="t('editor.dashed')"></option>
                  <option value="dotted" x-text="t('editor.dotted')"></option>
                </select>
              </div>
              <div class="dmike-chart-ed-inline-row">
                <label data-help-key="modules.project-charter.fields.orgStyle.nodeBorderWidth.help" x-text="t('editor.borderWidth')"></label>
                <input type="number" data-style-key="nodeBorderWidth" data-help-key="" :aria-label="t('editor.borderWidth')" x-field="model.orgStyle.nodeBorderWidth">
              </div>
            </div>
            <div class="dmike-chart-ed-section">
              <div class="dmike-chart-ed-section-title" x-text="t('editor.connectorLines')"></div>
              <div class="dmike-chart-ed-color-pair">
                <label data-help-key="modules.project-charter.fields.orgStyle.lineColor.help" x-text="t('editor.lineColor')"></label>
                <button class="dmike-chart-ed-color-swatch" type="button" data-style-key="lineColor" :style="swatchStyle('lineColor')"
                  :title="t('colorPick')" :aria-label="t('editor.lineColor')" @click="openColor('lineColor', $event)"></button>
              </div>
              <div class="dmike-chart-ed-inline-row">
                <label data-help-key="modules.project-charter.fields.orgStyle.lineStyle.help" x-text="t('editor.lineStyle')"></label>
                <select data-style-key="lineStyle" data-help-key="" :aria-label="t('editor.lineStyle')" x-field="model.orgStyle.lineStyle">
                  <option value="solid" x-text="t('editor.solid')"></option>
                  <option value="dashed" x-text="t('editor.dashed')"></option>
                  <option value="dotted" x-text="t('editor.dotted')"></option>
                </select>
              </div>
              <div class="dmike-chart-ed-inline-row">
                <label data-help-key="modules.project-charter.fields.orgStyle.lineWidth.help" x-text="t('editor.lineWidth')"></label>
                <input type="number" data-style-key="lineWidth" data-help-key="" :aria-label="t('editor.lineWidth')" x-field="model.orgStyle.lineWidth">
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- Formulare der Dialoge: liegen versteckt hier, der Dialog leiht sie aus und gibt sie beim Schließen zurück -->
  <div class="pc__modal-forms" hidden>
    <form class="pc__node-form" x-ref="addNodeForm" x-command-form="addOrgNode">
      <div class="field-group">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.addOrgNode.params.title" x-text="t('nodeTitle') + ' *'"></label>
        <input type="text" class="field" data-field="title" data-help-key="" maxlength="100" x-param="title" :placeholder="t('nodeTitle')">
      </div>
      <div class="field-group">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.addOrgNode.params.desc" x-text="t('nodeDescription')"></label>
        <textarea class="field" data-field="desc" data-help-key="" maxlength="300" x-param="desc" :placeholder="t('nodeDescription')"></textarea>
      </div>
    </form>

    <form class="pc__node-form" x-ref="editNodeForm" x-command-form="updateOrgNode">
      <div class="field-group">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.title" x-text="t('nodeTitle') + ' *'"></label>
        <input type="text" class="field" data-field="title" data-help-key="" maxlength="100" x-param="title">
      </div>
      <div class="field-group">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.desc" x-text="t('nodeDescription')"></label>
        <textarea class="field" data-field="desc" data-help-key="" maxlength="300" x-param="desc"></textarea>
      </div>
      <hr class="pc__org-form-sep">
      <div class="field-group field-group--inline">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.bg" x-text="t('editor.bgColor')"></label>
        <div class="pc__color-field">
          <button class="dmike-chart-ed-color-swatch" type="button" data-field="bg-swatch" :style="nodeSwatchStyle(form.bg, 'bg')"
            :title="t('colorPick')" :aria-label="t('colorPick')" @click="pickNodeColor('bg', $event)"></button>
          <input type="text" class="field field--sm" data-field="bg" data-help-key="" x-param="bg" :aria-label="t('editor.bgColor')" :placeholder="inheritLabel('nodeBg')">
        </div>
      </div>
      <div class="field-group field-group--inline">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.borderColor" x-text="t('editor.borderColor')"></label>
        <div class="pc__color-field">
          <button class="dmike-chart-ed-color-swatch" type="button" data-field="borderColor-swatch" :style="nodeSwatchStyle(form.borderColor, 'borderColor')"
            :title="t('colorPick')" :aria-label="t('colorPick')" @click="pickNodeColor('borderColor', $event)"></button>
          <input type="text" class="field field--sm" data-field="borderColor" data-help-key="" x-param="borderColor" :aria-label="t('editor.borderColor')" :placeholder="inheritLabel('nodeBorderColor')">
        </div>
      </div>
      <div class="field-group field-group--inline">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.borderStyle" x-text="t('editor.borderStyle')"></label>
        <select class="field" data-field="borderStyle" data-help-key="" x-param="borderStyle" :aria-label="t('editor.borderStyle')">
          <option value="" x-text="inheritLabel('nodeBorderStyle')"></option>
          <option value="dashed" x-text="t('editor.dashed')"></option>
          <option value="dotted" x-text="t('editor.dotted')"></option>
        </select>
      </div>
      <div class="field-group field-group--inline">
        <label class="pc__form-label" data-help-key="modules.project-charter.actions.updateOrgNode.params.borderWidth" x-text="t('editor.borderWidth')"></label>
        <div class="pc__width-field">
          <input type="number" class="field field--num" data-field="borderWidth" data-help-key="" min="0" max="8" step="1" x-param="borderWidth" :aria-label="t('editor.borderWidth')">
          <span class="pc__inherit-hint" data-field="borderWidth-hint" x-show="inheritsWidth(form.borderWidth)" x-text="inheritLabel('nodeBorderWidth')"></span>
        </div>
      </div>
    </form>
  </div>
</section>
