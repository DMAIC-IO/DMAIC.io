<section class="module-container fmea" x-data="fmea">
  <div class="module-container__body">

    <!-- ── Scale reference (kept in DOM; visibility via --visible class) ── -->
    <div class="fmea__scale-ref" :class="scaleVisible ? 'fmea__scale-ref--visible' : ''" data-ref="scale-ref">
      <div class="fmea__scale-toolbar">
        <button class="btn btn--sm btn--ghost" data-action="reset-scales" type="button" @click="resetScales()" x-text="t('resetScales')"></button>
      </div>

      <div data-ref="rpn-scales" x-show="!isAp()">
      <h3 x-text="t('scaleSeverity')"></h3>
      <table class="dmike-table dmike-table--head-mono">
        <thead><tr>
          <th x-text="t('scaleValue')"></th>
          <th x-text="t('scaleMeaning')"></th>
          <th x-text="t('scaleDescription')"></th>
        </tr></thead>
        <tbody>
          <tr><td>1</td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevNone" @blur="scaleEdited('sevNone', $event)" x-text="scaleText('sevNone')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevNoneDesc" @blur="scaleEdited('sevNoneDesc', $event)" x-text="scaleText('sevNoneDesc')"></td></tr>
          <tr><td>2–3</td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevLow" @blur="scaleEdited('sevLow', $event)" x-text="scaleText('sevLow')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevLowDesc" @blur="scaleEdited('sevLowDesc', $event)" x-text="scaleText('sevLowDesc')"></td></tr>
          <tr><td>4–6</td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevMod" @blur="scaleEdited('sevMod', $event)" x-text="scaleText('sevMod')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevModDesc" @blur="scaleEdited('sevModDesc', $event)" x-text="scaleText('sevModDesc')"></td></tr>
          <tr><td>7–8</td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevHigh" @blur="scaleEdited('sevHigh', $event)" x-text="scaleText('sevHigh')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevHighDesc" @blur="scaleEdited('sevHighDesc', $event)" x-text="scaleText('sevHighDesc')"></td></tr>
          <tr><td>9–10</td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevVHigh" @blur="scaleEdited('sevVHigh', $event)" x-text="scaleText('sevVHigh')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="sevVHighDesc" @blur="scaleEdited('sevVHighDesc', $event)" x-text="scaleText('sevVHighDesc')"></td></tr>
        </tbody>
      </table>

      <h3 x-text="t('scaleOccurrence')"></h3>
      <table class="dmike-table dmike-table--head-mono">
        <thead><tr>
          <th x-text="t('scaleValue')"></th>
          <th x-text="t('scaleProbability')"></th>
          <th x-text="t('scaleRate')"></th>
        </tr></thead>
        <tbody>
          <tr><td>1</td><td contenteditable="true" class="fmea__scale-editable" data-scale="occUnlikely" @blur="scaleEdited('occUnlikely', $event)" x-text="scaleText('occUnlikely')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="occUnlikelyRate" @blur="scaleEdited('occUnlikelyRate', $event)" x-text="scaleText('occUnlikelyRate')"></td></tr>
          <tr><td>2–3</td><td contenteditable="true" class="fmea__scale-editable" data-scale="occLow" @blur="scaleEdited('occLow', $event)" x-text="scaleText('occLow')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="occLowRate" @blur="scaleEdited('occLowRate', $event)" x-text="scaleText('occLowRate')"></td></tr>
          <tr><td>4–6</td><td contenteditable="true" class="fmea__scale-editable" data-scale="occMod" @blur="scaleEdited('occMod', $event)" x-text="scaleText('occMod')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="occModRate" @blur="scaleEdited('occModRate', $event)" x-text="scaleText('occModRate')"></td></tr>
          <tr><td>7–8</td><td contenteditable="true" class="fmea__scale-editable" data-scale="occHigh" @blur="scaleEdited('occHigh', $event)" x-text="scaleText('occHigh')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="occHighRate" @blur="scaleEdited('occHighRate', $event)" x-text="scaleText('occHighRate')"></td></tr>
          <tr><td>9–10</td><td contenteditable="true" class="fmea__scale-editable" data-scale="occVHigh" @blur="scaleEdited('occVHigh', $event)" x-text="scaleText('occVHigh')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="occVHighRate" @blur="scaleEdited('occVHighRate', $event)" x-text="scaleText('occVHighRate')"></td></tr>
        </tbody>
      </table>

      <h3 x-text="t('scaleDetection')"></h3>
      <table class="dmike-table dmike-table--head-mono">
        <thead><tr>
          <th x-text="t('scaleValue')"></th>
          <th x-text="t('scaleDetect')"></th>
          <th x-text="t('scaleDescription')"></th>
        </tr></thead>
        <tbody>
          <tr><td>1</td><td contenteditable="true" class="fmea__scale-editable" data-scale="detCertain" @blur="scaleEdited('detCertain', $event)" x-text="scaleText('detCertain')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="detCertainDesc" @blur="scaleEdited('detCertainDesc', $event)" x-text="scaleText('detCertainDesc')"></td></tr>
          <tr><td>2–3</td><td contenteditable="true" class="fmea__scale-editable" data-scale="detHigh" @blur="scaleEdited('detHigh', $event)" x-text="scaleText('detHigh')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="detHighDesc" @blur="scaleEdited('detHighDesc', $event)" x-text="scaleText('detHighDesc')"></td></tr>
          <tr><td>4–6</td><td contenteditable="true" class="fmea__scale-editable" data-scale="detMod" @blur="scaleEdited('detMod', $event)" x-text="scaleText('detMod')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="detModDesc" @blur="scaleEdited('detModDesc', $event)" x-text="scaleText('detModDesc')"></td></tr>
          <tr><td>7–8</td><td contenteditable="true" class="fmea__scale-editable" data-scale="detLow" @blur="scaleEdited('detLow', $event)" x-text="scaleText('detLow')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="detLowDesc" @blur="scaleEdited('detLowDesc', $event)" x-text="scaleText('detLowDesc')"></td></tr>
          <tr><td>9–10</td><td contenteditable="true" class="fmea__scale-editable" data-scale="detVLow" @blur="scaleEdited('detVLow', $event)" x-text="scaleText('detVLow')"></td><td contenteditable="true" class="fmea__scale-editable" data-scale="detVLowDesc" @blur="scaleEdited('detVLowDesc', $event)" x-text="scaleText('detVLowDesc')"></td></tr>
        </tbody>
      </table>

      <h3 x-text="t('rpnCategories')"></h3>
      <div class="fmea__legend-grid">
        <div class="fmea__legend-item"><div class="fmea__legend-dot fmea__legend-dot--low"></div> &lt; 50 <span x-text="t('catLow')"></span></div>
        <div class="fmea__legend-item"><div class="fmea__legend-dot fmea__legend-dot--medium"></div> 50–124 <span x-text="t('catMedium')"></span></div>
        <div class="fmea__legend-item"><div class="fmea__legend-dot fmea__legend-dot--high"></div> 125–200 <span x-text="t('catHigh')"></span></div>
        <div class="fmea__legend-item"><div class="fmea__legend-dot fmea__legend-dot--critical"></div> &gt; 200 <span x-text="t('catCritical')"></span></div>
      </div>
      </div>

      <div class="fmea__ap-scales" data-ref="ap-scales" x-show="isAp()">
        <template x-for="dim in apDims" :key="dim">
          <div>
            <h3 x-text="t(apDimTitle(dim))"></h3>
            <table class="dmike-table dmike-table--head-mono" :data-ap-scale="dim">
              <thead><tr>
                <th x-text="t('scaleValue')"></th>
                <th x-text="t('scaleMeaning')"></th>
                <th x-text="t('apScaleCriterion')"></th>
              </tr></thead>
              <tbody>
                <template x-for="row in apScaleRows(dim)" :key="row.key">
                  <tr>
                    <td x-text="row.value"></td>
                    <td contenteditable="true" class="fmea__scale-editable" :data-scale="row.meaningKey" @blur="scaleEdited(row.meaningKey, $event)" x-text="scaleText(row.meaningKey)"></td>
                    <td contenteditable="true" class="fmea__scale-editable" :data-scale="row.criterionKey" @blur="scaleEdited(row.criterionKey, $event)" x-text="scaleText(row.criterionKey)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <h3 x-text="t('apMatrixTitle')"></h3>
        <table class="dmike-table dmike-table--head-mono fmea__ap-matrix" data-ref="ap-matrix">
          <thead><tr>
            <th>S</th><th>O</th>
            <template x-for="d in apDBandLabels()" :key="d"><th x-text="'D ' + d"></th></template>
          </tr></thead>
          <tbody>
            <template x-for="row in apMatrixRows()" :key="row.key">
              <tr>
                <td x-text="row.s"></td>
                <td x-text="row.o"></td>
                <template x-for="cell in row.cells" :key="cell.key">
                  <td class="fmea__ap-cell" :class="'fmea__ap-cell--' + cell.cat" x-text="cell.ap"></td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── Settings: rating method + FMEA type ── -->
    <div class="fmea__settings" data-ref="settings">
      <div class="fmea__settings-group">
        <span class="fmea__settings-label" x-text="t('methodLabel')"></span>
        <div class="btn-group" role="group" :aria-label="t('methodLabel')">
          <button type="button" class="btn--segment" data-method="ap" :class="isAp() ? 'btn--active' : ''" :aria-pressed="isAp() ? 'true' : 'false'" @click="setMethod('ap')" x-text="t('methodAp')"></button>
          <button type="button" class="btn--segment" data-method="rpn" :class="isAp() ? '' : 'btn--active'" :aria-pressed="isAp() ? 'false' : 'true'" @click="setMethod('rpn')" x-text="t('methodRpn')"></button>
        </div>
      </div>
      <div class="fmea__settings-group" data-ref="fmea-type-switch" x-show="isAp()">
        <span class="fmea__settings-label" x-text="t('fmeaTypeLabel')"></span>
        <div class="btn-group" role="group" :aria-label="t('fmeaTypeLabel')">
          <button type="button" class="btn--segment" data-fmea-type="process" :class="isDesign() ? '' : 'btn--active'" :aria-pressed="isDesign() ? 'false' : 'true'" @click="setFmeaType('process')" x-text="t('fmeaTypeProcess')"></button>
          <button type="button" class="btn--segment" data-fmea-type="design" :class="isDesign() ? 'btn--active' : ''" :aria-pressed="isDesign() ? 'true' : 'false'" @click="setFmeaType('design')" x-text="t('fmeaTypeDesign')"></button>
        </div>
      </div>
    </div>

    <!-- ── Stats ── -->
    <div class="fmea__stats">
      <div class="fmea__stat-card">
        <div class="fmea__stat-icon fmea__stat-icon--total">Σ</div>
        <div><div class="fmea__stat-value" data-stat="total" x-text="stats().total"></div><div class="fmea__stat-label" x-text="t('statTotal')"></div></div>
      </div>
      <div class="fmea__stat-card" x-show="!isAp()">
        <div class="fmea__stat-icon fmea__stat-icon--critical"><span class="icon icon--sm" data-icon="severity.critical" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="critical" x-text="stats().critical"></div><div class="fmea__stat-label" x-text="t('statCritical')"></div></div>
      </div>
      <div class="fmea__stat-card">
        <div class="fmea__stat-icon fmea__stat-icon--high"><span class="icon icon--sm" data-icon="severity.high" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="high" x-text="stats().high"></div><div class="fmea__stat-label" x-text="t(isAp() ? 'statApHigh' : 'statHigh')"></div></div>
      </div>
      <div class="fmea__stat-card">
        <div class="fmea__stat-icon fmea__stat-icon--medium"><span class="icon icon--sm" data-icon="severity.medium" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="medium" x-text="stats().medium"></div><div class="fmea__stat-label" x-text="t(isAp() ? 'statApMedium' : 'statMedium')"></div></div>
      </div>
      <div class="fmea__stat-card">
        <div class="fmea__stat-icon fmea__stat-icon--low"><span class="icon icon--sm" data-icon="severity.low" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="low" x-text="stats().low"></div><div class="fmea__stat-label" x-text="t(isAp() ? 'statApLow' : 'statLow')"></div></div>
      </div>
      <div class="fmea__stat-card" x-show="isAp()">
        <div class="fmea__stat-icon fmea__stat-icon--neutral"><span class="icon icon--sm" data-icon="action.confirm" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="rated" x-text="statRated()"></div><div class="fmea__stat-label" x-text="t('statRated')"></div></div>
      </div>
      <div class="fmea__stat-card" x-show="!isAp()">
        <div class="fmea__stat-icon fmea__stat-icon--neutral">Ø</div>
        <div><div class="fmea__stat-value" data-stat="avg" x-text="statAvg()"></div><div class="fmea__stat-label" x-text="t('statAvg')"></div></div>
      </div>
      <div class="fmea__stat-card" x-show="!isAp()">
        <div class="fmea__stat-icon fmea__stat-icon--critical"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></div>
        <div><div class="fmea__stat-value" data-stat="max" x-text="statMax()"></div><div class="fmea__stat-label" x-text="t('statMax')"></div></div>
      </div>
    </div>

    <!-- ── Risk list ── -->
    <div class="fmea__risk-list" data-ref="risk-list">
      <template x-for="(risk, ri) in model.risks">
        <div class="fmea__risk-card" :key="risk.id" :class="cardClass(risk)" :data-risk-id="risk.id" :data-rpn="risk.rpn()" :data-ap="risk.ap() || ''" :data-proj-rpn="risk.projRpn()">
          <div class="fmea__risk-header">
            <span class="fmea__risk-number" data-action="toggle-collapse" :data-risk-id="risk.id" :title="t('collapseToggle')" @click="toggleCollapse(risk)">
              <span class="fmea__collapse-arrow icon icon--sm" :data-icon="risk.collapsed ? 'nav.expand-right' : 'nav.expand-down'" aria-hidden="true"></span> <span x-text="riskNum(ri)"></span>
            </span>
            <input class="fmea__risk-title" name="step" :placeholder="t('stepPlaceholder')" x-model="risk.step">
            <div class="fmea__rpn-header-group">
              <span class="fmea__rpn-badge" :class="badgeClass(risk)" data-rpn-badge x-text="badgeText(risk)"></span>
              <span class="fmea__secondary-rpn" data-secondary-rpn x-show="isAp()" x-text="rpnText(risk.rpn())"></span>
              <span class="fmea__rpn-arrow-sep icon icon--sm" data-icon="nav.arrow-right" aria-hidden="true"></span>
              <span class="fmea__rpn-badge fmea__rpn-badge--sm" :class="projBadgeClass(risk)" data-proj-rpn-badge x-text="projBadgeText(risk)"></span>
            </div>
            <button class="fmea__risk-delete" data-action="del-risk" :data-risk-id="risk.id" :title="t('common.delete')" :aria-label="t('common.delete')" @click="deleteRisk(risk.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
          </div>
          <div class="fmea__risk-body">
            <div class="fmea__fields-row">
              <div class="field-group">
                <label x-text="t('failureMode')"></label>
                <textarea class="field" name="failureMode" :placeholder="t('failureModePlaceholder')" x-model="risk.failureMode"></textarea>
              </div>
              <div class="field-group">
                <label x-text="t('effect')"></label>
                <textarea class="field" name="effect" :placeholder="t('effectPlaceholder')" x-model="risk.effect"></textarea>
              </div>
              <div class="field-group">
                <label x-text="t('cause')"></label>
                <textarea class="field" name="cause" :placeholder="t('causePlaceholder')" x-model="risk.cause"></textarea>
              </div>
            </div>
            <div class="fmea__fields-row fmea__fields-row--2">
              <div class="field-group">
                <label x-text="t('currentControls')"></label>
                <textarea class="field" name="control" :placeholder="t('controlPlaceholder')" x-model="risk.control"></textarea>
              </div>
              <div class="field-group">
                <label x-text="t('rating')"></label>
                <div class="fmea__sod-row">
                  <div class="fmea__sod-group"><label :title="t('tipS')">S</label>
                    <select class="field" name="sev" x-model="risk.sev">
                      <option value="">—</option>
                      <option value="1" :title="sevTitle(1)">1</option>
                      <option value="2" :title="sevTitle(2)">2</option>
                      <option value="3" :title="sevTitle(3)">3</option>
                      <option value="4" :title="sevTitle(4)">4</option>
                      <option value="5" :title="sevTitle(5)">5</option>
                      <option value="6" :title="sevTitle(6)">6</option>
                      <option value="7" :title="sevTitle(7)">7</option>
                      <option value="8" :title="sevTitle(8)">8</option>
                      <option value="9" :title="sevTitle(9)">9</option>
                      <option value="10" :title="sevTitle(10)">10</option>
                    </select>
                  </div>
                  <div class="fmea__sod-group"><label :title="t('tipO')">O</label>
                    <select class="field" name="occ" x-model="risk.occ">
                      <option value="">—</option>
                      <option value="1" :title="occTitle(1)">1</option>
                      <option value="2" :title="occTitle(2)">2</option>
                      <option value="3" :title="occTitle(3)">3</option>
                      <option value="4" :title="occTitle(4)">4</option>
                      <option value="5" :title="occTitle(5)">5</option>
                      <option value="6" :title="occTitle(6)">6</option>
                      <option value="7" :title="occTitle(7)">7</option>
                      <option value="8" :title="occTitle(8)">8</option>
                      <option value="9" :title="occTitle(9)">9</option>
                      <option value="10" :title="occTitle(10)">10</option>
                    </select>
                  </div>
                  <div class="fmea__sod-group"><label :title="t('tipD')">D</label>
                    <select class="field" name="det" x-model="risk.det">
                      <option value="">—</option>
                      <option value="1" :title="detTitle(1)">1</option>
                      <option value="2" :title="detTitle(2)">2</option>
                      <option value="3" :title="detTitle(3)">3</option>
                      <option value="4" :title="detTitle(4)">4</option>
                      <option value="5" :title="detTitle(5)">5</option>
                      <option value="6" :title="detTitle(6)">6</option>
                      <option value="7" :title="detTitle(7)">7</option>
                      <option value="8" :title="detTitle(8)">8</option>
                      <option value="9" :title="detTitle(9)">9</option>
                      <option value="10" :title="detTitle(10)">10</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <hr class="fmea__section-sep">
            <div class="fmea__section-title" x-text="t('actionsSection')"></div>
            <div class="fmea__actions-section">
              <table class="dmike-table fmea__action-table">
                <thead><tr>
                  <th style="width:28px"><span class="icon icon--sm" data-icon="action.confirm" aria-hidden="true"></span><span class="dmike-sr-only" x-text="t('done')"></span></th>
                  <th x-text="t('action')"></th>
                  <th style="width:110px" x-text="t('responsible')"></th>
                  <th style="width:105px" x-text="t('dueDate')"></th>
                  <th class="fmea__delta-cell" style="width:62px">ΔS</th>
                  <th class="fmea__delta-cell" style="width:62px">ΔO</th>
                  <th class="fmea__delta-cell" style="width:62px">ΔD</th>
                  <th style="width:28px"></th>
                </tr></thead>
                <tbody data-action-body>
                  <template x-for="(act, ai) in risk.actions">
                    <tr :key="act.id" :data-action-idx="ai">
                      <td style="text-align:center"><input type="checkbox" class="fmea__done-check" x-model="act.done"></td>
                      <td><textarea class="field field--sm" name="actionText" :placeholder="t('actionPlaceholder')" x-model="act.text"></textarea></td>
                      <td><input class="field field--sm" type="text" name="actionResp" :placeholder="t('actionResp')" x-model="act.resp"></td>
                      <td><input class="field field--sm" type="date" name="actionDate" x-model="act.date"></td>
                      <td class="fmea__delta-cell"><select class="field field--sm" name="deltaS" title="ΔS" x-model="act.deltaS">
                        <option value="0">0</option>
                        <option value="1">−1</option>
                        <option value="2">−2</option>
                        <option value="3">−3</option>
                        <option value="4">−4</option>
                        <option value="5">−5</option>
                        <option value="6">−6</option>
                        <option value="7">−7</option>
                        <option value="8">−8</option>
                        <option value="9">−9</option>
                      </select></td>
                      <td class="fmea__delta-cell"><select class="field field--sm" name="deltaO" title="ΔO" x-model="act.deltaO">
                        <option value="0">0</option>
                        <option value="1">−1</option>
                        <option value="2">−2</option>
                        <option value="3">−3</option>
                        <option value="4">−4</option>
                        <option value="5">−5</option>
                        <option value="6">−6</option>
                        <option value="7">−7</option>
                        <option value="8">−8</option>
                        <option value="9">−9</option>
                      </select></td>
                      <td class="fmea__delta-cell"><select class="field field--sm" name="deltaD" title="ΔD" x-model="act.deltaD">
                        <option value="0">0</option>
                        <option value="1">−1</option>
                        <option value="2">−2</option>
                        <option value="3">−3</option>
                        <option value="4">−4</option>
                        <option value="5">−5</option>
                        <option value="6">−6</option>
                        <option value="7">−7</option>
                        <option value="8">−8</option>
                        <option value="9">−9</option>
                      </select></td>
                      <td style="text-align:center"><button class="fmea__action-del-btn" data-action="del-action" :data-risk-id="risk.id" :data-action-idx="ai" :title="t('common.delete')" :aria-label="t('common.delete')" @click="deleteAction(risk, ai)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <button class="fmea__add-action-btn" data-action="add-action" :data-risk-id="risk.id" @click="addAction(risk)" x-text="addActionLabel()"></button>
            </div>
            <div class="fmea__projected-bar">
              <span class="fmea__proj-label" x-text="t('projectedLabel')"></span>
              <span class="fmea__proj-item">S: <strong data-proj-s x-text="projSDisp(risk)"></strong></span>
              <span class="fmea__proj-item">O: <strong data-proj-o x-text="projODisp(risk)"></strong></span>
              <span class="fmea__proj-item">D: <strong data-proj-d x-text="projDDisp(risk)"></strong></span>
              <span class="fmea__proj-arrow icon icon--sm" data-icon="nav.arrow-right" aria-hidden="true"></span>
              <span class="fmea__rpn-badge" :class="projBadgeClass(risk)" data-proj-rpn x-text="projValueText(risk)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>

  </div>

  <!-- ── Burndown popout (declarative; chart mounted imperatively into anchor) ── -->
  <template x-if="burndownOpen">
    <div class="dmike-chart-popout-overlay"
      @click.self="closeBurndown()"
      @keydown.escape.window="closeBurndown()"
      @mousemove.window="popoutDragMove($event)"
      @mouseup.window="popoutDragEnd()">
      <div class="dmike-chart-popout" :style="popoutStyle()">
        <div class="dmike-chart-popout-titlebar" @mousedown="popoutDragStart($event)">
          <span x-text="t('burndownTitle')"></span>
          <button class="dmike-chart-popout-close" type="button" :aria-label="t('common.close')" @click="closeBurndown()">
            <span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="dmike-chart-popout-body">
          <div data-ref="burndown-chart" style="width:100%;height:500px;resize:both;overflow:auto"></div>
        </div>
      </div>
    </div>
  </template>
</section>
