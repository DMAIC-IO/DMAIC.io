<template x-if="vm.empty">
  <p class="dashboard-area__empty" x-text="vm.empty"></p>
</template>
<template x-if="!vm.empty">
  <div class="dashboard-fmea__summary">
    <template x-for="s in vm.summary">
      <span :class="s.modifier"><span x-text="s.label"></span><strong :style="s.style" x-text="s.value"></strong></span>
    </template>
  </div>
</template>
<template x-if="!vm.empty">
  <div class="dashboard-fmea__bar">
    <template x-for="seg in vm.segments">
      <div class="dashboard-fmea__bar-seg" :style="seg.style" :title="seg.title"></div>
    </template>
  </div>
</template>
<template x-if="vm.legend">
  <div class="dashboard-fmea__legend">
    <template x-for="l in vm.legend">
      <span class="dashboard-fmea__legend-item"><span class="dashboard-fmea__legend-dot" :style="l.dot"></span><span x-text="l.text"></span></span>
    </template>
  </div>
</template>
<template x-if="vm.topLabel">
  <div class="dashboard-fmea__top-label" x-text="vm.topLabel"></div>
</template>
<template x-if="vm.topLabel">
  <ol class="dashboard-fmea__top-list">
    <template x-for="r in vm.top">
      <li class="dashboard-fmea__top-item">
        <span class="dashboard-fmea__top-desc" x-text="r.desc"></span>
        <template x-if="r.flag">
          <span class="dashboard-fmea__top-flag" x-text="r.flag"></span>
        </template>
        <span class="dashboard-fmea__top-rpn" :style="r.style" x-text="r.badge"></span>
      </li>
    </template>
  </ol>
</template>
