<div class="pie-chart dmike-split dmike-split--input-sm" x-data="pieChart">
  <!-- data-help-key="" am Auswahl-Host ist gewollt: die Hilfe hängt an den Slots des Pickers (fields.datasets.*). -->
  <div class="pie-chart__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div class="pie-chart__picker" data-ref="picker-wrap" data-help-key="" x-field="model.datasets"></div>
  </div>

  <div class="pie-chart__output dmike-split__output">
    <div data-ref="placeholder" x-show="!hasSlices"></div>
    <template x-if="hasSlices">
      <div class="pie-chart__chart-area" data-ref="chart-area">
        <div class="pie-chart__chart-wrap" data-ref="chart-wrap" x-widget="pie-chart" x-widget-config="pieChart" x-widget-value="model.chart" x-widget-legacy-edit-key="legacyEditKey"></div>
        <div class="pie-chart__stats-panel" data-ref="stats-panel">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
            <table class="dmike-table pie-chart__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.pie-chart.types.Slice.name" x-text="t('statName')"></span></th>
                <th><span data-help-key="modules.pie-chart.types.Slice.value" x-text="t('statValue')"></span></th>
                <th><span class="context-help-anchor--overlay" data-help-key="modules.pie-chart.types.Slice.share" x-text="t('statPercent')"></span></th>
              </tr></thead>
              <tbody>
                <template x-for="(r, i) in statsRows" :key="i">
                  <tr>
                    <td><span class="pie-chart__stats-color" :style="swatchStyle(r)"></span><span x-text="sliceLabel(r)"></span></td>
                    <td x-text="r.value"></td>
                    <td x-text="r.pct"></td>
                  </tr>
                </template>
                <tr class="pie-chart__stats-total">
                  <td x-text="t('statTotal')"></td>
                  <td x-text="statsTotal"></td>
                  <td x-text="statsTotalPct"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
