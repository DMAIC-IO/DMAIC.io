<div class="module-container data-import" x-data="dataImport">
  <!-- ── Empty state ───────────────────────────────────────────── -->
  <template x-if="!model.file">
    <div class="data-import__empty">
      <div class="data-import__dropzone" data-ref="dropzone" tabindex="0" role="button"
        :class="dragOver ? 'data-import__dropzone--over' : ''"
        @click="openPicker()"
        @keydown="onDropzoneKey($event)"
        @dragover="onDragOver($event)"
        @dragleave="onDragLeave()"
        @drop="onDrop($event)">
        <div class="data-import__dropzone-icon" aria-hidden="true">
          <span class="icon icon--lg icon--empty-state" data-icon="action.upload" aria-hidden="true"></span>
        </div>
        <div class="data-import__dropzone-title" x-text="t('dropHere')"></div>
        <div class="data-import__dropzone-hint" x-text="t('dropHint')"></div>
        <div class="data-import__dropzone-formats" x-text="t('supportedFormats')"></div>
      </div>
      <input type="file" data-ref="file-input" :accept="acceptAttr" hidden
        @change="onFileInput($event)">
    </div>
  </template>

  <!-- ── Loaded state ──────────────────────────────────────────── -->
  <template x-if="model.file">
    <div class="data-import__loaded"
      @dragover="onDragOver($event)"
      @dragleave="onDragLeave()"
      @drop="onDrop($event)">
      <div class="data-import__file-card">
        <div class="data-import__file-info">
          <div class="data-import__file-row">
            <span class="data-import__file-label" data-help-key="modules.data-import.types.ImportFile.name" x-text="t('fileName') + ':'"></span>
            <span class="data-import__file-value" x-text="fileName()"></span>
          </div>
          <div class="data-import__file-row">
            <span class="data-import__file-label" data-help-key="modules.data-import.types.ImportFile.formatId" x-text="t('fileType') + ':'"></span>
            <span class="data-import__file-value" x-text="formatLabel()"></span>
          </div>
          <div class="data-import__file-row">
            <span class="data-import__file-label" data-help-key="modules.data-import.types.ImportFile.size" x-text="t('fileSize') + ':'"></span>
            <span class="data-import__file-value" x-text="fileSizeText()"></span>
          </div>
        </div>
        <div class="data-import__file-actions">
          <button class="data-import__btn-secondary" data-action="replace" type="button"
            @click="openPicker()" x-text="t('replaceFile')"></button>
        </div>
      </div>

      <!-- CSV options -->
      <template x-if="isCsv()">
        <div class="data-import__options">
          <label class="data-import__option">
            <span class="data-import__option-label" data-help-key="modules.data-import.types.Params.csvOptions.preset" x-text="t('csv_preset')"></span>
            <select data-csv-opt="preset" @change="onCsvOpt('preset', $event)">
              <template x-for="o in presetOptions()" :key="o.value">
                <option :value="o.value" :selected="model.csvOptions.preset === o.value" x-text="o.label"></option>
              </template>
            </select>
          </label>
          <label class="data-import__option">
            <span class="data-import__option-label" data-help-key="modules.data-import.types.Params.csvOptions.delimiter" x-text="t('delimiter')"></span>
            <select data-csv-opt="delimiter" @change="onCsvOpt('delimiter', $event)">
              <template x-for="o in delimiterOptions()" :key="o.value">
                <option :value="o.value" :selected="model.csvOptions.delimiter === o.value" x-text="o.label"></option>
              </template>
            </select>
          </label>
          <label class="data-import__option" x-show="!isTextSource()">
            <span class="data-import__option-label" data-help-key="modules.data-import.types.Params.csvOptions.encoding" x-text="t('encoding')"></span>
            <select data-csv-opt="encoding" @change="onCsvOpt('encoding', $event)">
              <template x-for="o in csvEncodingOptions()" :key="o.value">
                <option :value="o.value" :selected="model.csvOptions.encoding === o.value" x-text="o.label"></option>
              </template>
            </select>
          </label>
          <label class="data-import__option">
            <span class="data-import__option-label" data-help-key="modules.data-import.types.Params.csvOptions.skipRows" x-text="t('csv_skipRows')"></span>
            <input type="number" min="0" step="1" data-csv-opt="skipRows" class="data-import__num-input"
              :value="model.csvOptions.skipRows" @change="onCsvOpt('skipRows', $event)">
          </label>
          <label class="data-import__option data-import__option--check" data-help-anchor="box" data-help-key="modules.data-import.types.Params.csvOptions.hasHeader">
            <input type="checkbox" data-csv-opt="hasHeader"
              :checked="model.csvOptions.hasHeader" @change="onCsvOpt('hasHeader', $event)">
            <span class="data-import__option-label" x-text="t('useFirstRowAsHeader')"></span>
          </label>
        </div>
      </template>

      <!-- XLSX options -->
      <template x-if="isXlsx()">
        <div class="data-import__options">
          <label class="data-import__option data-import__option--check" data-help-anchor="box" data-help-key="modules.data-import.types.Params.xlsxOptions.hasHeader">
            <input type="checkbox" data-xlsx-opt="hasHeader"
              :checked="model.xlsxOptions.hasHeader" @change="onXlsxOpt('hasHeader', $event)">
            <span class="data-import__option-label" x-text="t('useFirstRowAsHeader')"></span>
          </label>
        </div>
      </template>

      <!-- AQDEF options -->
      <template x-if="isAqdef()">
        <div class="data-import__options">
          <label class="data-import__option">
            <span class="data-import__option-label" data-help-key="modules.data-import.types.Params.aqdefOptions.encoding" x-text="t('encoding')"></span>
            <select data-aqdef-opt="encoding" @change="onAqdefOpt('encoding', $event)">
              <template x-for="o in aqdefEncodingOptions()" :key="o.value">
                <option :value="o.value" :selected="model.aqdefOptions.encoding === o.value" x-text="o.label"></option>
              </template>
            </select>
          </label>
        </div>
      </template>

      <!-- Result: busy / error / no-file / preview -->
      <template x-if="busy">
        <div class="data-import__status" x-text="t('parsing')"></div>
      </template>

      <template x-if="!busy && errorMsg">
        <div class="data-import__error">
          <strong x-text="t('parseError')"></strong>
          <div class="data-import__error-detail" x-text="errorMsg"></div>
        </div>
      </template>

      <template x-if="!busy && !errorMsg && !parsed">
        <div class="data-import__status" x-text="t('noFile')"></div>
      </template>

      <template x-if="!busy && !errorMsg && parsed">
        <div class="data-import__preview-block">
          <div class="data-import__preview-header">
            <span class="data-import__preview-title" x-text="t('preview')"></span>
            <span class="data-import__preview-meta" x-text="previewMeta()"></span>
          </div>

          <template x-if="hasMultipleSheets()">
            <div class="data-import__sheet-tabs" data-help-key="modules.data-import.actions.selectSheet.help">
              <template x-for="(tab, i) in sheetTabs" :key="i">
                <button class="data-import__sheet-tab" type="button"
                  :class="sheetTabClass(i)" :data-sheet-idx="i" @click="selectSheet(i)">
                  <span x-text="tab.name"></span>
                  <span class="data-import__sheet-tab-meta" x-text="tab.meta"></span>
                </button>
              </template>
            </div>
          </template>

          <template x-if="hasColumns()">
            <div class="data-import__preview-table-wrap">
              <table class="data-import__preview-table">
                <thead>
                  <tr>
                    <template x-for="(col, ci) in previewColumns" :key="ci">
                      <th>
                        <div class="data-import__col-name" x-text="col.name"></div>
                        <div class="data-import__col-type" x-text="col.typeLabel"></div>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, ri) in previewRows" :key="ri">
                    <tr>
                      <template x-for="(cell, ci) in row" :key="ci">
                        <td :class="cell.cls" x-text="cell.text"></td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!hasColumns()">
            <div class="data-import__status" x-text="t('noColumns')"></div>
          </template>

          <template x-if="hasColumns() && moreRowsCount() > 0">
            <div class="data-import__more" x-text="moreRowsText()"></div>
          </template>

          <div class="data-import__send-row">
            <button class="dmike-btn-run" data-action="send" type="button"
              data-help-key="modules.data-import.actions.sendToWorksheet.help"
              @click="onSend()">
              <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span>
              <span x-text="t('sendToWorksheet')"></span>
            </button>
          </div>
        </div>
      </template>

      <input type="file" data-ref="file-input" :accept="acceptAttr" hidden
        @change="onFileInput($event)">
    </div>
  </template>
</div>
