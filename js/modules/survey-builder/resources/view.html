<div class="module-container survey-builder" x-data="surveyBuilder">
  <div class="module-container__body survey-builder__body">
    <nav class="dmike-tabs survey-builder__tabs" data-ref="tabs" role="tablist" x-tablist x-set="model.tab" data-help-key="">
      <button class="dmike-tab" type="button" role="tab" value="draft" data-tab="draft" :class="tabClass('draft')" x-text="t('tabDraft')"></button>
      <button class="dmike-tab" type="button" role="tab" value="recipients" data-tab="recipients" :class="tabClass('recipients')" x-text="t('tabRecipients')"></button>
      <button class="dmike-tab" type="button" role="tab" value="results" data-tab="results" :class="tabClass('results')" x-text="t('tabResults')"></button>
    </nav>

    <section class="survey-builder__tab survey-builder__draft dmike-split dmike-split--input-lg" data-ref="draftTab" x-show="isTab('draft')">
      <div class="dmike-split__input">
        <div class="dmike-split__section-title" x-text="t('headerTitle')"></div>
        <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.title.help" x-text="t('fieldTitle')"></label>
        <input class="field" type="text" data-ref="title" x-model="model.survey.title">
        <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.intro.help" x-text="t('fieldIntro')"></label>
        <textarea class="field survey-builder__textarea" rows="3" data-ref="intro" x-model="model.survey.intro"></textarea>
        <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.contact.help" x-text="t('fieldContact')"></label>
        <input class="field" type="text" data-ref="contact" x-model="model.survey.contact">
        <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.lang.help" x-text="t('fieldLang')"></label>
        <select class="field" data-ref="lang" data-help-key="" x-field="model.survey.lang">
          <option value="de" x-text="t('langDe')"></option>
          <option value="en" x-text="t('langEn')"></option>
        </select>
        <label class="survey-builder__check">
          <input type="checkbox" data-ref="anonymous" x-model="model.survey.anonymous">
          <span data-help-key="modules.survey-builder.fields.survey.anonymous.help" x-text="t('fieldAnonymous')"></span>
        </label>

        <div class="dmike-split__section-title"><span data-help-key="modules.survey-builder.fields.survey.help" x-text="t('outlineTitle')"></span></div>
        <div class="survey-builder__outline" data-ref="outline" role="radiogroup" x-set="model.selectedQuestionId" data-help-key="">
          <template x-for="(sec, si) in model.survey.sections" :key="sec.id">
            <div class="survey-builder__section" :data-section-id="sec.id" :class="sectionClass(sec)">
              <div class="survey-builder__section-head">
                <input class="field survey-builder__section-title" type="text" data-field="sectionTitle"
                       x-model="sec.title" :placeholder="sectionPlaceholder(si)">
                <span class="survey-builder__badge survey-builder__badge--condition"
                      x-show="hasCondition(sec)" x-text="t('conditionBadge')"></span>
                <button class="btn btn--icon-sm" type="button" data-action="editSection" role="radio" value="" :title="t('edit')"
                        @click="selectSection(sec.id)"><span class="icon icon--sm" data-icon="action.edit" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm" type="button" data-action="moveSectionUp" :title="t('moveUp')" data-help-key=""
                        x-command="moveSection" :data-arg-section-id="sec.id" data-arg-direction="up"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm" type="button" data-action="moveSectionDown" :title="t('moveDown')" data-help-key=""
                        x-command="moveSection" :data-arg-section-id="sec.id" data-arg-direction="down"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteSection" :title="t('delete')" data-help-key=""
                        x-command="removeSection" :data-arg-section-id="sec.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
              </div>
              <ul class="survey-builder__questions">
                <template x-for="q in sec.questions" :key="q.id">
                  <li class="survey-builder__question" :data-question-id="q.id" :class="questionClass(q)">
                    <button class="survey-builder__question-select" type="button" data-action="selectQuestion" role="radio" :value="q.id" @click="questionClick()">
                      <span class="survey-builder__badge" x-text="typeLabel(q.type)"></span>
                      <span class="survey-builder__question-text" x-text="questionLabel(q)"></span>
                      <span class="survey-builder__required" x-show="q.required" x-text="t('requiredMark')"></span>
                      <span class="survey-builder__badge survey-builder__badge--condition"
                            x-show="hasCondition(q)" x-text="t('conditionBadge')"></span>
                    </button>
                    <button class="btn btn--icon-sm" type="button" data-action="moveQuestionUp" :title="t('moveUp')" data-help-key=""
                            x-command="moveQuestion" :data-arg-question-id="q.id" data-arg-direction="up"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                    <button class="btn btn--icon-sm" type="button" data-action="moveQuestionDown" :title="t('moveDown')" data-help-key=""
                            x-command="moveQuestion" :data-arg-question-id="q.id" data-arg-direction="down"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                    <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteQuestion" :title="t('delete')" data-help-key=""
                            x-command="removeQuestion" :data-arg-question-id="q.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                  </li>
                </template>
              </ul>
              <select class="field survey-builder__add-question" data-ref="addQuestion"
                      @change="addQuestionChosen(sec.id, $event)">
                <option value="" x-text="t('addQuestion')"></option>
                <option value="single" x-text="typeLabel('single')"></option>
                <option value="multi" x-text="typeLabel('multi')"></option>
                <option value="rating" x-text="typeLabel('rating')"></option>
                <option value="kano" x-text="typeLabel('kano')"></option>
                <option value="text" x-text="typeLabel('text')"></option>
                <option value="info" x-text="typeLabel('info')"></option>
              </select>
            </div>
          </template>
        </div>
        <button class="btn btn--sm" type="button" data-ref="addSection" data-help-key="modules.survey-builder.actions.addSection.help" x-command="addSection">
          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addSection')"></span>
        </button>

        <div class="dmike-split__section-title" x-text="t('propertiesTitle')"></div>
        <p class="survey-builder__hint" x-show="hasNoSelection" x-text="t('propertiesEmpty')"></p>

        <template x-for="sec in model.survey.sections" :key="sec.id">
          <div class="survey-builder__props-host">
            <template x-if="isSelectedSection(sec)">
              <div class="survey-builder__props" data-ref="sectionProps">
                <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.sections.title.help" x-text="t('fieldSectionTitle')"></label>
                <input class="field" type="text" data-ref="sectionTitle" x-model="sec.title">
                <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.sections.hint.help" x-text="t('fieldHint')"></label>
                <textarea class="field survey-builder__textarea" rows="2" data-ref="sectionHint" x-model="sec.hint"></textarea>
              </div>
            </template>
            <template x-for="q in sec.questions" :key="q.id">
              <div class="survey-builder__props-host">
                <template x-if="isSelectedQuestion(q)">
                  <div class="survey-builder__props" data-ref="questionProps">
                    <label class="survey-builder__label" data-help-key="modules.survey-builder.actions.changeQuestionType.help" x-text="t('fieldType')"></label>
                    <select class="field" data-ref="questionType" @change="typeChanged(q, $event)">
                      <option value="single" :selected="isType(q, 'single')" x-text="typeLabel('single')"></option>
                      <option value="multi" :selected="isType(q, 'multi')" x-text="typeLabel('multi')"></option>
                      <option value="rating" :selected="isType(q, 'rating')" x-text="typeLabel('rating')"></option>
                      <option value="kano" :selected="isType(q, 'kano')" x-text="typeLabel('kano')"></option>
                      <option value="text" :selected="isType(q, 'text')" x-text="typeLabel('text')"></option>
                      <option value="info" :selected="isType(q, 'info')" x-text="typeLabel('info')"></option>
                    </select>
                    <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.sections.questions.text.help" x-text="t('fieldText')"></label>
                    <textarea class="field survey-builder__textarea" rows="2" data-ref="questionText" x-model="q.text"></textarea>
                    <label class="survey-builder__label" data-help-key="modules.survey-builder.fields.survey.sections.questions.hint.help" x-text="t('fieldHint')"></label>
                    <input class="field" type="text" data-ref="questionHint" x-model="q.hint">
                    <label class="survey-builder__check" x-show="canBeRequired(q)">
                      <input type="checkbox" data-ref="questionRequired" x-model="q.required">
                      <span data-help-key="modules.survey-builder.fields.survey.sections.questions.required.help" x-text="t('fieldRequired')"></span>
                    </label>
                    <template x-if="hasFlag(q, 'other')">
                      <label class="survey-builder__check">
                        <input type="checkbox" data-flag="other" x-model="q.other">
                        <span data-help-key="modules.survey-builder.fields.survey.sections.questions.other.help" x-text="t('flagOther')"></span>
                      </label>
                    </template>
                    <template x-if="hasFlag(q, 'noAnswer')">
                      <label class="survey-builder__check">
                        <input type="checkbox" data-flag="noAnswer" x-model="q.noAnswer">
                        <span data-help-key="modules.survey-builder.fields.survey.sections.questions.noAnswer.help" x-text="t('flagNoAnswer')"></span>
                      </label>
                    </template>
                    <template x-if="hasFlag(q, 'importance')">
                      <label class="survey-builder__check">
                        <input type="checkbox" data-flag="importance" x-model="q.importance">
                        <span data-help-key="modules.survey-builder.fields.survey.sections.questions.importance.help" x-text="t('flagImportance')"></span>
                      </label>
                    </template>
                    <template x-if="hasFlag(q, 'multiline')">
                      <label class="survey-builder__check">
                        <input type="checkbox" data-flag="multiline" x-model="q.multiline">
                        <span data-help-key="modules.survey-builder.fields.survey.sections.questions.multiline.help" x-text="t('flagMultiline')"></span>
                      </label>
                    </template>

                    <template x-if="hasOptions(q)">
                      <div class="survey-builder__items" data-ref="items">
                        <div class="survey-builder__label"><span data-help-key="modules.survey-builder.fields.survey.sections.questions.options.help" x-text="t('itemsOptions')"></span></div>
                        <template x-for="item in q.options" :key="item.id">
                          <div class="survey-builder__item" :data-item-id="item.id">
                            <input class="field survey-builder__item-text" type="text" data-field="text" x-model="item.text">
                            <input class="field survey-builder__item-group" type="text" data-field="group"
                                   x-show="isMulti(q)" :placeholder="t('itemGroup')"
                                   :value="itemGroup(item)" @input="groupInput(q, item, $event)">
                            <button class="btn btn--icon-sm" type="button" data-action="moveItemUp" :title="t('moveUp')" data-help-key=""
                                    x-command="moveItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id" data-arg-direction="up"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                            <button class="btn btn--icon-sm" type="button" data-action="moveItemDown" :title="t('moveDown')" data-help-key=""
                                    x-command="moveItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id" data-arg-direction="down"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                            <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteItem" :title="t('delete')" data-help-key=""
                                    x-command="removeItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                          </div>
                        </template>
                        <button class="btn btn--sm" type="button" data-ref="addItem" data-help-key="modules.survey-builder.actions.addItem.help"
                                x-command="addItem" :data-arg-question-id="q.id">
                          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addItem')"></span>
                        </button>
                      </div>
                    </template>
                    <template x-if="hasRows(q)">
                      <div class="survey-builder__items" data-ref="items">
                        <div class="survey-builder__label"><span data-help-key="modules.survey-builder.fields.survey.sections.questions.rows.help" x-text="t('itemsRows')"></span></div>
                        <template x-for="item in q.rows" :key="item.id">
                          <div class="survey-builder__item" :data-item-id="item.id">
                            <input class="field survey-builder__item-text" type="text" data-field="text" x-model="item.text">
                            <button class="btn btn--icon-sm" type="button" data-action="moveItemUp" :title="t('moveUp')" data-help-key=""
                                    x-command="moveItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id" data-arg-direction="up"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                            <button class="btn btn--icon-sm" type="button" data-action="moveItemDown" :title="t('moveDown')" data-help-key=""
                                    x-command="moveItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id" data-arg-direction="down"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                            <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteItem" :title="t('delete')" data-help-key=""
                                    x-command="removeItem" :data-arg-question-id="q.id" :data-arg-item-id="item.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                          </div>
                        </template>
                        <button class="btn btn--sm" type="button" data-ref="addItem" data-help-key="modules.survey-builder.actions.addItem.help"
                                x-command="addItem" :data-arg-question-id="q.id">
                          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addItem')"></span>
                        </button>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <div class="survey-builder__conditions" data-ref="conditions" x-show="hasCondNode">
          <div class="dmike-split__section-title"><span data-help-key="modules.survey-builder.actions.setConditions.help" x-text="t('conditionsTitle')"></span></div>
          <p class="survey-builder__hint" x-show="!hasCondSources" x-text="t('conditionsNone')"></p>
          <div x-show="hasCondSources">
            <p class="survey-builder__hint" x-text="t('conditionsHint')"></p>
            <template x-for="c in state.conditionDraft" :key="c.key">
              <div class="survey-builder__condition" data-ref="condition">
                <select class="field" data-field="source" @change="setCondSource(c.key, $event)">
                  <option value="" :selected="hasNoCondSource(c)" x-text="t('conditionSource')"></option>
                  <template x-for="src in condSources" :key="src.id">
                    <option :value="src.id" :selected="isCondSource(c, src)" x-text="sourceLabel(src)"></option>
                  </template>
                </select>
                <div class="survey-builder__cond-options">
                  <template x-for="opt in condOptions(c.key)" :key="opt.id">
                    <label class="survey-builder__check">
                      <input type="checkbox" :value="opt.id" :checked="condOptionChecked(c.key, opt.id)"
                             @change="toggleCondOption(c.key, opt.id)">
                      <span x-text="optionText(opt)"></span>
                    </label>
                  </template>
                </div>
                <button class="btn btn--icon-sm btn--danger" type="button" data-action="removeCondition"
                        :title="t('removeCondition')" @click="removeCondition(c.key)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
              </div>
            </template>
            <button class="btn btn--sm" type="button" data-ref="addCondition" @click="addCondition()">
              <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addCondition')"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="dmike-split__output" data-ref="output">
        <div class="dmike-infobox dmike-infobox--warn" data-ref="warnings" x-show="hasWarnings">
          <strong x-text="t('warningsTitle')"></strong>
          <ul class="survey-builder__warnings">
            <template x-for="w in warnings" :key="w.key">
              <li x-text="w.text"></li>
            </template>
          </ul>
        </div>
        <div class="survey-builder__export">
          <button class="btn btn--primary btn--sm" type="button" data-ref="exportGeneral" data-help-key="modules.survey-builder.asyncTasks.buildSurveyFile.help" @click="exportGeneral()">
            <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportGeneral')"></span>
          </button>
          <span class="survey-builder__version" data-ref="versionLine" x-text="versionLine"></span>
        </div>
        <div class="dmike-split__output-section-header">
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('previewTitle')"></span></div>
        </div>
        <p class="survey-builder__hint" x-text="t('previewHint')"></p>
        <div class="survey-builder__preview" data-ref="preview"></div>
      </div>
    </section>

    <section class="survey-builder__tab survey-builder__page" data-ref="recipientsTab" x-show="isTab('recipients')">
      <div class="dmike-split__section-title"><span data-help-key="modules.survey-builder.fields.recipients.help" x-text="t('recipientsTitle')"></span></div>
      <div class="survey-builder__toolbar">
        <button class="btn btn--sm" type="button" data-ref="addRecipient" data-help-key="modules.survey-builder.actions.addRecipient.help" x-command="addRecipient">
          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addRecipient')"></span>
        </button>
        <span class="survey-builder__counts" data-ref="recipientCounts" x-text="countsLine"></span>
      </div>
      <div class="dmike-infobox dmike-infobox--info" data-ref="anonymousInfo"
           x-show="model.survey.anonymous" x-text="t('anonymousInfo')"></div>
      <p class="survey-builder__hint" data-ref="recipientsEmpty" x-show="!hasRecipients" x-text="t('recipientsEmpty')"></p>
      <div class="dmike-table-wrap" x-show="hasRecipients">
        <table class="dmike-table survey-builder__recipients" data-ref="recipients">
          <thead>
            <tr>
              <th><span data-help-key="modules.survey-builder.fields.recipients.name.help" x-text="t('colName')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.recipients.organisation.help" x-text="t('colOrganisation')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.recipients.group.help" x-text="t('colGroup')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.recipients.email.help" x-text="t('colEmail')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.recipients.note.help" x-text="t('colNote')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.answeredRecipientIds.help" x-text="t('colStatus')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.recipients.sentAt.help" x-text="t('colSent')"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in model.recipients" :key="r.id">
              <tr :data-recipient-id="r.id">
                <td><input class="field" type="text" data-field="name" x-model="r.name"></td>
                <td><input class="field" type="text" data-field="organisation" x-model="r.organisation"></td>
                <td><input class="field" type="text" data-field="group" x-model="r.group"></td>
                <td><input class="field" type="email" data-field="email" x-model="r.email"></td>
                <td><input class="field" type="text" data-field="note" x-model="r.note"></td>
                <td class="survey-builder__status" :class="recipientStatusClass(r.id)">
                  <span data-ref="status" x-text="recipientStatusLabel(r.id)"></span>
                  <span class="survey-builder__outdated" data-ref="outdated"
                        x-show="isOutdated(r.id)" x-text="outdatedHint(r)"></span>
                </td>
                <td class="survey-builder__nowrap" data-ref="sent" x-text="sentLabel(r)"></td>
                <td class="survey-builder__nowrap">
                  <button class="btn btn--sm" type="button" data-action="exportRecipient" data-help-key="" @click="exportForRecipient(r.id)">
                    <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportRecipient')"></span>
                  </button>
                  <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteRecipient" :title="t('delete')" data-help-key=""
                          x-command="removeRecipient" :data-arg-recipient-id="r.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="survey-builder__tab survey-builder__page" data-ref="resultsTab" x-show="isTab('results')">
      <div hidden x-ref="importDrop" data-ref="importDrop"
           x-file-drop="importFiles" data-file-drop-multiple data-file-drop-accept=".json,application/json"></div>

      <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.survey-builder.fields.responses.help" x-text="t('responsesTitle')"></span></div>
      <p class="survey-builder__hint" data-ref="responsesEmpty" x-show="!hasResponses" x-text="t('responsesEmpty')"></p>
      <div class="dmike-table-wrap" x-show="hasResponses">
        <table class="dmike-table survey-builder__responses" data-ref="responses">
          <thead>
            <tr>
              <th><span data-help-key="modules.survey-builder.fields.responses.submittedAt.help" x-text="t('colDate')"></span></th>
              <th><span data-help-key="modules.survey-builder.fields.responses.recipientId.help" x-text="t('colRespondent')"></span></th>
              <th></th>
            </tr>
          </thead>
          <template x-for="row in responseRows" :key="row.id">
            <tbody :data-response-id="row.id">
              <tr>
                <td class="survey-builder__nowrap" data-ref="date" x-text="row.date"></td>
                <td data-ref="who" x-text="row.who"></td>
                <td class="survey-builder__nowrap">
                  <button class="btn btn--icon-sm" type="button" data-action="toggleResponse" :title="t('showDetails')" data-help-key=""
                          @click="toggleResponse(row.id)"><span class="icon icon--sm" data-icon="action.show" aria-hidden="true"></span></button>
                  <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteResponse" :title="t('delete')" data-help-key=""
                          x-command="removeResponse" :data-arg-response-id="row.id"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </td>
              </tr>
              <tr data-ref="details" x-show="isResponseOpen(row.id)">
                <td colspan="3">
                  <dl class="survey-builder__details">
                    <template x-for="d in responseDetails(row.id)" :key="d.key">
                      <div class="survey-builder__detail">
                        <dt x-text="d.question"></dt>
                        <dd x-text="d.answer"></dd>
                      </div>
                    </template>
                  </dl>
                </td>
              </tr>
            </tbody>
          </template>
        </table>
      </div>

      <div class="dmike-split__output-section" x-show="hasResponses"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span data-help-key="modules.survey-builder.fields.results.help" x-text="t('evaluationTitle')"></span></div>
      <div data-ref="evaluation" x-show="hasResponses">
        <div class="survey-builder__toolbar">
          <label class="survey-builder__counts" data-help-key="modules.survey-builder.actions.setFilter.help" x-text="t('filterLabel')"></label>
          <select class="field" data-ref="filter" data-help-key="" @change="filterChanged($event)">
            <option value="" :selected="isFilterValue('')" x-text="t('filterAll')"></option>
            <template x-for="o in filterOptions" :key="o.value">
              <option :value="o.value" :selected="isFilterValue(o.value)" x-text="o.label"></option>
            </template>
          </select>
          <span class="survey-builder__counts" data-ref="nLine" x-text="nLine"></span>
          <button class="btn btn--sm" type="button" data-ref="takeToVoc" data-help-key="modules.survey-builder.asyncTasks.takeToVocTree.help"
                  :disabled="!hasVocSelection || isHandoverRunning('takeToVocTree')" @click="takeSelected()">
            <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('takeToVoc')"></span>
          </button>
          <button class="btn btn--sm" type="button" data-ref="toWorksheet" x-async-task="toWorksheet" x-async-task-start>
            <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('toWorksheet')"></span>
          </button>
        </div>

        <section class="survey-builder__summary" data-ref="summary">
          <div class="survey-builder__subtitle" x-text="t('report.rateTitle')"></div>
          <p class="survey-builder__counts" data-ref="rateLine" x-text="rateLine"></p>
          <p class="survey-builder__hint" data-ref="withoutRecipient" x-show="hasWithoutRecipient" x-text="withoutRecipientLine"></p>
          <div class="dmike-table-wrap" x-show="hasRateGroups">
            <table class="dmike-table survey-builder__stats" data-ref="rateGroups">
              <thead>
                <tr>
                  <th><span data-help-key="modules.survey-builder.fields.recipients.group.help" x-text="t('report.colGroup')"></span></th><th><span data-help-key="modules.survey-builder.types.ResponseRate.sent" x-text="t('report.colSent')"></span></th>
                  <th><span data-help-key="modules.survey-builder.types.ResponseRate.answered" x-text="t('report.colAnswered')"></span></th><th><span data-help-key="modules.survey-builder.types.ResponseRate.rate" x-text="t('report.colRate')"></span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="g in rateGroups" :key="g.key">
                  <tr><td x-text="g.group"></td><td x-text="g.sent"></td><td x-text="g.answered"></td><td x-text="g.rate"></td></tr>
                </template>
              </tbody>
            </table>
          </div>

          <div x-show="hasRanking">
            <div class="survey-builder__subtitle" x-text="t('report.topTitle')"></div>
            <table class="dmike-table survey-builder__stats" data-ref="ranking">
              <thead>
                <tr>
                  <th><span data-help-key="modules.survey-builder.types.RankingRow.text" x-text="t('report.colItem')"></span></th><th><span data-help-key="modules.survey-builder.types.RankingRow.n" x-text="t('report.colN')"></span></th>
                  <th><span data-help-key="modules.survey-builder.types.RankingRow.mean" x-text="t('report.colMean')"></span></th><th><span data-help-key="modules.survey-builder.types.RankingRow.topShare" x-text="t('report.colTop')"></span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in rankingRows" :key="r.key">
                  <tr>
                    <td data-ref="item" x-text="r.text"></td><td x-text="r.n"></td>
                    <td data-ref="mean" x-text="r.mean"></td><td x-text="r.top"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <button class="btn btn--sm survey-builder__more" type="button" data-ref="rankingToggle" data-help-key="" x-show="hasMoreRanking"
                    @click="toggleRanking()" x-text="rankingToggleLabel"></button>
          </div>

          <div x-show="hasKanoOverview">
            <div class="survey-builder__subtitle" x-text="t('report.kanoTitle')"></div>
            <div class="survey-builder__block-body" :class="sideClass(overviewCharts)">
            <table class="dmike-table survey-builder__stats" data-ref="kanoOverview">
              <thead>
                <tr>
                  <th><span data-help-key="modules.survey-builder.types.KanoRow.text" x-text="t('report.colItem')"></span></th><th><span data-help-key="modules.survey-builder.types.KanoRow.category" x-text="t('report.colCategory')"></span></th>
                  <th><span data-help-key="modules.survey-builder.types.KanoRow.cs" x-text="t('report.colBetter')"></span></th><th><span data-help-key="modules.survey-builder.types.KanoRow.ds" x-text="t('report.colWorse')"></span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="k in kanoOverviewRows" :key="k.key">
                  <tr>
                    <td data-ref="item" x-text="k.text"></td><td data-ref="category" x-text="k.category"></td>
                    <td x-text="k.cs"></td><td x-text="k.ds"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-for="cell in overviewCharts" :key="cell.key">
              <div class="survey-builder__chart-cell">
                <template x-if="cellIs(cell, 'scatter')"><div class="survey-builder__chart" :data-chart="cell.key" x-widget="scatter-chart" x-widget-config="cell.config"></div></template>
              </div>
            </template>
            </div>
          </div>

          <p class="survey-builder__counts" data-ref="freeText" x-text="freeTextLine"></p>
        </section>

        <div class="survey-builder__toolbar">
          <label class="survey-builder__counts" data-help-key="modules.survey-builder.actions.setGroupBy.help" x-text="t('groupByLabel')"></label>
          <select class="field" data-ref="groupBy" data-help-key="" @change="groupByChanged($event)">
            <option value="" :selected="isGroupBy('')" x-text="t('groupByNone')"></option>
            <template x-for="o in groupByOptions" :key="o.value">
              <option :value="o.value" :selected="isGroupBy(o.value)" x-text="o.label"></option>
            </template>
          </select>
          <label class="survey-builder__switch" data-ref="reportWithNamesLabel" x-show="canShowNames">
            <input type="checkbox" data-ref="reportWithNames" x-model="model.ui.reportWithNames">
            <span data-help-key="modules.survey-builder.fields.ui.reportWithNames.help" x-text="t('reportWithNames')"></span>
          </label>
        </div>

        <section class="survey-builder__groups" data-ref="groups" x-show="hasComparison">
          <div class="survey-builder__subtitle" x-text="groupsTitle"></div>
          <ul class="survey-builder__group-heads" data-ref="groupHeads">
            <template x-for="g in groupHeads" :key="g.id">
              <li x-text="g.label"></li>
            </template>
          </ul>
          <template x-for="part in comparisonParts" :key="part.key">
            <div class="survey-builder__group-part" :data-group-question-id="part.questionId">
              <h4 class="survey-builder__part-title" x-text="part.title"></h4>
              <div class="survey-builder__block-body" :class="sideClass(groupCharts(part))">
              <table class="dmike-table survey-builder__stats">
                <thead>
                  <tr>
                    <th></th>
                    <template x-for="g in groupHeads" :key="g.id">
                      <th x-text="g.label"></th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in part.rows" :key="row.key">
                    <tr :data-row-id="row.key" :class="rowClass(row)">
                      <td>
                        <span data-ref="label" x-text="row.label"></span>
                        <span class="survey-builder__hint" data-ref="note" x-text="row.note"></span>
                      </td>
                      <template x-for="c in row.cells" :key="c.key">
                        <td data-ref="cell" :class="cellClass(c)" x-text="c.text"></td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-for="cell in groupCharts(part)" :key="cell.key">
                <div class="survey-builder__chart-cell">
                  <template x-if="cellIs(cell, 'bar')"><div class="survey-builder__chart" :data-chart="cell.key" x-widget="bar-chart" x-widget-config="cell.config"></div></template>
                </div>
              </template>
              </div>
            </div>
          </template>
        </section>

        <div data-ref="blocks">
          <template x-for="b in blocks" :key="b.key">
            <article class="survey-builder__block" :data-question-id="b.key">
              <h3 class="survey-builder__block-title" x-text="b.title"></h3>
              <p class="survey-builder__counts" data-ref="blockN" x-text="b.nLine"></p>

              <template x-if="isChoice(b)">
                <div class="survey-builder__block-body" :class="sideClass(questionCharts(b))">
                  <div class="survey-builder__block-main">
                  <table class="dmike-table survey-builder__stats">
                    <thead><tr><th><span data-help-key="modules.survey-builder.types.OptionStat.text" x-text="t('colOption')"></span></th><th><span data-help-key="modules.survey-builder.types.OptionStat.count" x-text="t('colCount')"></span></th><th><span data-help-key="modules.survey-builder.types.OptionStat.share" x-text="t('colShare')"></span></th></tr></thead>
                    <tbody>
                      <template x-for="o in optionRows(b)" :key="o.id">
                        <tr :data-option-id="o.id">
                          <td data-ref="option" x-text="o.text"></td>
                          <td data-ref="count" x-text="o.count"></td>
                          <td data-ref="share" x-text="o.share"></td>
                        </tr>
                      </template>
                      <tr data-option-id="__other" x-show="hasOther(b)">
                        <td data-ref="option" x-text="t('answerOther')"></td>
                        <td data-ref="count" x-text="b.stats.otherCount"></td>
                        <td data-ref="share" x-text="otherShare(b)"></td>
                      </tr>
                    </tbody>
                  </table>
                  <div x-show="hasOtherTexts(b)">
                    <div class="survey-builder__subtitle" x-text="t('otherTitle')"></div>
                    <ul class="survey-builder__texts" data-ref="otherAnswers">
                      <template x-for="a in otherAnswers(b)" :key="a.key">
                        <li class="survey-builder__answer" :data-answer-key="a.key">
                          <input type="checkbox" data-ref="vocCheck" :checked="isVocSelected(a.key)" @change="toggleVoc(a.key)">
                          <span class="icon icon--sm survey-builder__taken" data-icon="status.ok" data-ref="vocTaken"
                                x-show="isVocTaken(a.key)" :title="t('vocTakenMark')"></span>
                          <span data-ref="answerText" x-text="a.text"></span>
                          <span class="survey-builder__hint" data-ref="answerName" x-show="hasName(a)" x-text="a.name"></span>
                        </li>
                      </template>
                    </ul>
                  </div>
                  </div>
                  <template x-for="cell in questionCharts(b)" :key="cell.key">
                    <div class="survey-builder__chart-cell">
                      <template x-if="cellIs(cell, 'bar')"><div class="survey-builder__chart" :data-chart="cell.key" x-widget="bar-chart" x-widget-config="cell.config"></div></template>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="blockIs(b, 'rating')">
                <div class="survey-builder__block-body" :class="sideClass(questionCharts(b))">
                  <table class="dmike-table survey-builder__stats">
                    <thead>
                      <tr>
                        <th><span data-help-key="modules.survey-builder.types.RatingStatRow.text" x-text="t('report.colItem')"></span></th><th><span data-help-key="modules.survey-builder.types.RatingStatRow.n" x-text="t('report.colN')"></span></th>
                        <th><span data-help-key="modules.survey-builder.types.RatingStatRow.mean" x-text="t('report.colMean')"></span></th><th><span data-help-key="modules.survey-builder.types.RatingStatRow.median" x-text="t('report.colMedian')"></span></th>
                        <th><span data-help-key="modules.survey-builder.types.RatingStatRow.dist" x-text="t('colDist')"></span></th><th><span data-help-key="modules.survey-builder.types.RatingStatRow.na" x-text="t('report.colNa')"></span></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in ratingRows(b)" :key="r.id">
                        <tr :data-row-id="r.id">
                          <td x-text="r.text"></td>
                          <td data-ref="n" x-text="r.n"></td>
                          <td data-ref="mean" x-text="r.mean"></td>
                          <td data-ref="median" x-text="r.median"></td>
                          <td class="survey-builder__nowrap" data-ref="dist" x-text="r.dist"></td>
                          <td data-ref="na" x-text="r.na"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <template x-for="cell in questionCharts(b)" :key="cell.key">
                    <div class="survey-builder__chart-cell">
                      <template x-if="cellIs(cell, 'bar')"><div class="survey-builder__chart" :data-chart="cell.key" x-widget="bar-chart" x-widget-config="cell.config"></div></template>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="blockIs(b, 'kano')">
                <div class="survey-builder__block-body" :class="sideClass(questionCharts(b))">
                  <div class="survey-builder__block-main">
                  <table class="dmike-table survey-builder__stats">
                    <thead>
                      <tr>
                        <th><span data-help-key="modules.survey-builder.types.KanoStatRow.text" x-text="t('report.colItem')"></span></th><th><span data-help-key="modules.survey-builder.types.KanoStatRow.category" x-text="t('report.colCategory')"></span></th>
                        <th><span data-help-key="modules.survey-builder.types.KanoStatRow.cs" x-text="t('report.colBetter')"></span></th><th><span data-help-key="modules.survey-builder.types.KanoStatRow.ds" x-text="t('report.colWorse')"></span></th>
                        <th><span data-help-key="modules.survey-builder.types.KanoStatRow.n" x-text="t('report.colN')"></span></th>
                        <th x-show="hasImportance(b)"><span data-help-key="modules.survey-builder.types.KanoStatRow.importanceMean" x-text="t('report.colImportance')"></span></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in kanoRows(b)" :key="r.id">
                        <tr :data-row-id="r.id">
                          <td x-text="r.text"></td>
                          <td data-ref="category" x-text="r.category"></td>
                          <td x-text="r.cs"></td>
                          <td x-text="r.ds"></td>
                          <td x-text="r.n"></td>
                          <td data-ref="importance" x-show="hasImportance(b)" x-text="r.importance"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="survey-builder__toolbar">
                    <label class="survey-builder__counts" data-help-key="modules.survey-builder.actions.setKanoTarget.help" x-text="t('kanoTarget')"></label>
                    <select class="field" data-ref="kanoTarget" data-help-key="" @change="kanoTargetChanged(b.key, $event)">
                      <option value="" :selected="isKanoTarget(b.key, '')" x-text="t('kanoNew')"></option>
                      <template x-for="o in kanoTargetOptions" :key="o.value">
                        <option :value="o.value" :selected="isKanoTarget(b.key, o.value)" x-text="o.label"></option>
                      </template>
                    </select>
                    <button class="btn btn--sm" type="button" data-action="handOverKano" data-help-key="modules.survey-builder.asyncTasks.handOverToKano.help"
                            :disabled="isHandoverRunning('handOverToKano')" @click="handOver(b.key)">
                      <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('handOverKano')"></span>
                    </button>
                  </div>
                  </div>
                  <template x-for="cell in questionCharts(b)" :key="cell.key">
                    <div class="survey-builder__chart-cell">
                      <template x-if="cellIs(cell, 'scatter')"><div class="survey-builder__chart" :data-chart="cell.key" x-widget="scatter-chart" x-widget-config="cell.config"></div></template>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="blockIs(b, 'text')">
                <div class="survey-builder__block-body">
                  <p class="survey-builder__hint" data-ref="textEmpty" x-show="!hasTextAnswers(b)" x-text="t('textEmpty')"></p>
                  <ul class="survey-builder__texts" data-ref="answers">
                    <template x-for="a in textAnswers(b)" :key="a.key">
                      <li class="survey-builder__answer" :data-answer-key="a.key">
                        <input type="checkbox" data-ref="vocCheck" :checked="isVocSelected(a.key)" @change="toggleVoc(a.key)">
                        <span class="icon icon--sm survey-builder__taken" data-icon="status.ok" data-ref="vocTaken"
                              x-show="isVocTaken(a.key)" :title="t('vocTakenMark')"></span>
                        <span data-ref="answerText" x-text="a.text"></span>
                        <span class="survey-builder__hint" data-ref="answerName" x-show="hasName(a)" x-text="a.name"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </article>
          </template>
        </div>
      </div>
    </section>
  </div>
</div>
