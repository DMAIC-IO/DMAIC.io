<div class="module-container survey-builder" x-data="surveyBuilder">
  <div class="module-container__body survey-builder__body">
    <nav class="dmike-tabs survey-builder__tabs" data-ref="tabs">
      <button class="dmike-tab" type="button" data-tab="draft" :class="tabClass('draft')"
              x-text="t('tabDraft')" @click="setTab('draft')"></button>
      <button class="dmike-tab" type="button" data-tab="recipients" :class="tabClass('recipients')"
              x-text="t('tabRecipients')" @click="setTab('recipients')"></button>
      <button class="dmike-tab" type="button" data-tab="results" :class="tabClass('results')"
              x-text="t('tabResults')" @click="setTab('results')"></button>
    </nav>

    <section class="survey-builder__tab dmike-split dmike-split--input-lg" data-ref="draftTab" x-show="isTab('draft')">
      <div class="dmike-split__input">
        <div class="dmike-split__section-title" x-text="t('headerTitle')"></div>
        <label class="survey-builder__label" x-text="t('fieldTitle')"></label>
        <input class="field" type="text" data-ref="title"
               :value="model.survey.title" @input="setHeaderFromEvent('title', $event)">
        <label class="survey-builder__label" x-text="t('fieldIntro')"></label>
        <textarea class="field survey-builder__textarea" rows="3" data-ref="intro"
                  :value="model.survey.intro" @input="setHeaderFromEvent('intro', $event)"></textarea>
        <label class="survey-builder__label" x-text="t('fieldContact')"></label>
        <input class="field" type="text" data-ref="contact"
               :value="model.survey.contact" @input="setHeaderFromEvent('contact', $event)">
        <label class="survey-builder__label" x-text="t('fieldLang')"></label>
        <select class="field" data-ref="lang" @change="setHeaderFromEvent('lang', $event)">
          <option value="de" :selected="model.survey.lang === 'de'" x-text="t('langDe')"></option>
          <option value="en" :selected="model.survey.lang === 'en'" x-text="t('langEn')"></option>
        </select>
        <label class="survey-builder__check">
          <input type="checkbox" data-ref="anonymous"
                 :checked="model.survey.anonymous" @change="setHeaderFromEvent('anonymous', $event)">
          <span x-text="t('fieldAnonymous')"></span>
        </label>

        <div class="dmike-split__section-title" x-text="t('outlineTitle')"></div>
        <div class="survey-builder__outline" data-ref="outline">
          <template x-for="(sec, si) in model.survey.sections" :key="sec.id">
            <div class="survey-builder__section" :data-section-id="sec.id" :class="sectionClass(sec.id)">
              <div class="survey-builder__section-head">
                <input class="field survey-builder__section-title" type="text" data-field="sectionTitle"
                       :value="sec.title" :placeholder="sectionPlaceholder(si)"
                       @input="updateSectionFromEvent(sec.id, 'title', $event)">
                <span class="survey-builder__badge survey-builder__badge--condition"
                      x-show="hasCondition(sec)" x-text="t('conditionBadge')"></span>
                <button class="btn btn--icon-sm" type="button" data-action="editSection" :title="t('edit')"
                        @click="selectSection(sec.id)"><span class="icon icon--sm" data-icon="action.edit" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm" type="button" data-action="moveSectionUp" :title="t('moveUp')"
                        @click="moveSectionUp(sec.id)"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm" type="button" data-action="moveSectionDown" :title="t('moveDown')"
                        @click="moveSectionDown(sec.id)"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteSection" :title="t('delete')"
                        @click="deleteSection(sec.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
              </div>
              <ul class="survey-builder__questions">
                <template x-for="q in sec.questions" :key="q.id">
                  <li class="survey-builder__question" :data-question-id="q.id" :class="questionClass(q.id)"
                      @click="selectQuestion(q.id)">
                    <span class="survey-builder__badge" x-text="typeLabel(q.type)"></span>
                    <span class="survey-builder__question-text" x-text="questionLabel(q)"></span>
                    <span class="survey-builder__required" x-show="q.required" x-text="t('requiredMark')"></span>
                    <span class="survey-builder__badge survey-builder__badge--condition"
                          x-show="hasCondition(q)" x-text="t('conditionBadge')"></span>
                    <button class="btn btn--icon-sm" type="button" data-action="moveQuestionUp" :title="t('moveUp')"
                            @click.stop="moveQuestionUp(q.id)"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                    <button class="btn btn--icon-sm" type="button" data-action="moveQuestionDown" :title="t('moveDown')"
                            @click.stop="moveQuestionDown(q.id)"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                    <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteQuestion" :title="t('delete')"
                            @click.stop="deleteQuestion(q.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                  </li>
                </template>
              </ul>
              <select class="field survey-builder__add-question" data-ref="addQuestion"
                      @change="addQuestionFromEvent(sec.id, $event)">
                <option value="" x-text="t('addQuestion')"></option>
                <template x-for="type in questionTypes" :key="type">
                  <option :value="type" x-text="typeLabel(type)"></option>
                </template>
              </select>
            </div>
          </template>
        </div>
        <button class="btn btn--sm" type="button" data-ref="addSection" @click="addSection()">
          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addSection')"></span>
        </button>

        <div class="dmike-split__section-title" x-text="t('propertiesTitle')"></div>
        <p class="survey-builder__hint" x-show="hasNoSelection()" x-text="t('propertiesEmpty')"></p>

        <template x-if="hasSelectedSection()">
          <div class="survey-builder__props" data-ref="sectionProps">
            <label class="survey-builder__label" x-text="t('fieldSectionTitle')"></label>
            <input class="field" type="text" data-ref="sectionTitle"
                   :value="sectionField('title')" @input="updateSelectedSectionFromEvent('title', $event)">
            <label class="survey-builder__label" x-text="t('fieldHint')"></label>
            <textarea class="field survey-builder__textarea" rows="2" data-ref="sectionHint"
                      :value="sectionField('hint')" @input="updateSelectedSectionFromEvent('hint', $event)"></textarea>
          </div>
        </template>

        <template x-if="hasSelectedQuestion()">
          <div class="survey-builder__props" data-ref="questionProps">
            <label class="survey-builder__label" x-text="t('fieldType')"></label>
            <select class="field" data-ref="questionType" @change="changeTypeFromEvent($event)">
              <template x-for="type in questionTypes" :key="type">
                <option :value="type" :selected="isSelectedType(type)" x-text="typeLabel(type)"></option>
              </template>
            </select>
            <label class="survey-builder__label" x-text="t('fieldText')"></label>
            <textarea class="field survey-builder__textarea" rows="2" data-ref="questionText"
                      :value="questionField('text')" @input="updateQuestionFromEvent('text', $event)"></textarea>
            <label class="survey-builder__label" x-text="t('fieldHint')"></label>
            <input class="field" type="text" data-ref="questionHint"
                   :value="questionField('hint')" @input="updateQuestionFromEvent('hint', $event)">
            <label class="survey-builder__check" x-show="canBeRequired()">
              <input type="checkbox" data-ref="questionRequired"
                     :checked="questionField('required')" @change="toggleFlag('required', $event)">
              <span x-text="t('fieldRequired')"></span>
            </label>
            <template x-for="f in flags()" :key="f">
              <label class="survey-builder__check">
                <input type="checkbox" :data-flag="f" :checked="hasFlag(f)" @change="toggleFlag(f, $event)">
                <span x-text="flagLabel(f)"></span>
              </label>
            </template>

            <div class="survey-builder__items" data-ref="items" x-show="hasItems()">
              <div class="survey-builder__label" x-text="itemsTitle()"></div>
              <template x-for="item in items()" :key="item.id">
                <div class="survey-builder__item" :data-item-id="item.id">
                  <input class="field survey-builder__item-text" type="text" data-field="text"
                         :value="item.text" @input="updateItemFromEvent(item.id, 'text', $event)">
                  <input class="field survey-builder__item-group" type="text" data-field="group"
                         x-show="isMulti()" :placeholder="t('itemGroup')"
                         :value="itemGroup(item)" @input="updateItemFromEvent(item.id, 'group', $event)">
                  <button class="btn btn--icon-sm" type="button" data-action="moveItemUp" :title="t('moveUp')"
                          @click="moveItemUp(item.id)"><span class="icon icon--sm" data-icon="nav.arrow-up" aria-hidden="true"></span></button>
                  <button class="btn btn--icon-sm" type="button" data-action="moveItemDown" :title="t('moveDown')"
                          @click="moveItemDown(item.id)"><span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span></button>
                  <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteItem" :title="t('delete')"
                          @click="deleteItem(item.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </div>
              </template>
              <button class="btn btn--sm" type="button" data-ref="addItem" @click="addItem()">
                <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addItem')"></span>
              </button>
            </div>
          </div>
        </template>

        <div class="survey-builder__conditions" data-ref="conditions" x-show="hasCondNode()">
          <div class="dmike-split__section-title" x-text="t('conditionsTitle')"></div>
          <p class="survey-builder__hint" x-show="!hasCondSources()" x-text="t('conditionsNone')"></p>
          <div x-show="hasCondSources()">
            <p class="survey-builder__hint" x-text="t('conditionsHint')"></p>
            <template x-for="c in condDraft" :key="c.key">
              <div class="survey-builder__condition" data-ref="condition">
                <select class="field" data-field="source" @change="setCondSource(c.key, $event)">
                  <option value="" :selected="!c.questionId" x-text="t('conditionSource')"></option>
                  <template x-for="src in condSources()" :key="src.id">
                    <option :value="src.id" :selected="src.id === c.questionId" x-text="sourceLabel(src)"></option>
                  </template>
                </select>
                <div class="survey-builder__cond-options">
                  <template x-for="opt in condOptions(c.key)" :key="opt.id">
                    <label class="survey-builder__check">
                      <input type="checkbox" :value="opt.id" :checked="condOptionChecked(c.key, opt.id)"
                             @change="toggleCondOption(c.key, opt.id)">
                      <span x-text="optionText(opt)"></span>
                    </label>
                  </template>
                </div>
                <button class="btn btn--icon-sm btn--danger" type="button" data-action="removeCondition"
                        :title="t('removeCondition')" @click="removeCondition(c.key)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
              </div>
            </template>
            <button class="btn btn--sm" type="button" data-ref="addCondition" @click="addCondition()">
              <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addCondition')"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="dmike-split__output" data-ref="output">
        <div class="dmike-infobox dmike-infobox--warn" data-ref="warnings" x-show="hasWarnings()">
          <strong x-text="t('warningsTitle')"></strong>
          <ul class="survey-builder__warnings">
            <template x-for="w in warnings()" :key="w.key">
              <li x-text="w.text"></li>
            </template>
          </ul>
        </div>
        <div class="survey-builder__export">
          <button class="btn btn--primary btn--sm" type="button" data-ref="exportGeneral" @click="exportGeneral()">
            <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportGeneral')"></span>
          </button>
          <span class="survey-builder__version" data-ref="versionLine" x-text="versionLine()"></span>
        </div>
        <div class="dmike-split__output-section-header">
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('previewTitle')"></span></div>
        </div>
        <p class="survey-builder__hint" x-text="t('previewHint')"></p>
        <div class="survey-builder__preview" data-ref="preview"></div>
      </div>
    </section>

    <section class="survey-builder__tab survey-builder__page" data-ref="recipientsTab" x-show="isTab('recipients')">
      <div class="dmike-split__section-title" x-text="t('recipientsTitle')"></div>
      <div class="survey-builder__toolbar">
        <button class="btn btn--sm" type="button" data-ref="addRecipient" @click="addRecipient()">
          <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span><span x-text="t('addRecipient')"></span>
        </button>
        <span class="survey-builder__counts" data-ref="recipientCounts" x-text="countsLine()"></span>
      </div>
      <div class="dmike-infobox dmike-infobox--info" data-ref="anonymousInfo"
           x-show="model.survey.anonymous" x-text="t('anonymousInfo')"></div>
      <p class="survey-builder__hint" x-show="!hasRecipients()" x-text="t('recipientsEmpty')"></p>
      <div class="dmike-table-wrap" x-show="hasRecipients()">
        <table class="dmike-table survey-builder__recipients" data-ref="recipients">
          <thead>
            <tr>
              <th x-text="t('colName')"></th>
              <th x-text="t('colOrganisation')"></th>
              <th x-text="t('colGroup')"></th>
              <th x-text="t('colEmail')"></th>
              <th x-text="t('colNote')"></th>
              <th x-text="t('colStatus')"></th>
              <th x-text="t('colSent')"></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in model.recipients" :key="r.id">
              <tr :data-recipient-id="r.id">
                <td><input class="field" type="text" data-field="name" :value="r.name"
                           @input="updateRecipientFromEvent(r.id, 'name', $event)"></td>
                <td><input class="field" type="text" data-field="organisation" :value="r.organisation"
                           @input="updateRecipientFromEvent(r.id, 'organisation', $event)"></td>
                <td><input class="field" type="text" data-field="group" :value="r.group"
                           @input="updateRecipientFromEvent(r.id, 'group', $event)"></td>
                <td><input class="field" type="email" data-field="email" :value="r.email"
                           @input="updateRecipientFromEvent(r.id, 'email', $event)"></td>
                <td><input class="field" type="text" data-field="note" :value="r.note"
                           @input="updateRecipientFromEvent(r.id, 'note', $event)"></td>
                <td>
                  <span data-ref="status" x-text="recipientStatusLabel(r.id)"></span>
                  <span class="survey-builder__outdated" data-ref="outdated"
                        x-show="isOutdated(r.id)" x-text="outdatedHint(r)"></span>
                </td>
                <td class="survey-builder__nowrap" data-ref="sent" x-text="sentLabel(r)"></td>
                <td class="survey-builder__nowrap">
                  <button class="btn btn--sm" type="button" data-action="exportRecipient" @click="exportForRecipient(r.id)">
                    <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportRecipient')"></span>
                  </button>
                  <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteRecipient" :title="t('delete')"
                          @click="deleteRecipient(r.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section class="survey-builder__tab survey-builder__page" data-ref="resultsTab" x-show="isTab('results')">
      <div class="dmike-split__section-title" x-text="t('importAnswers')"></div>
      <div class="survey-builder__dropzone" data-ref="dropzone"
           @dragover.prevent="onDragOver()" @drop.prevent="onDrop($event)">
        <button class="btn btn--sm" type="button" data-ref="importButton" @click="openImport()">
          <span class="icon icon--sm" data-icon="action.upload" aria-hidden="true"></span><span x-text="t('importAnswers')"></span>
        </button>
        <span class="survey-builder__hint" x-text="t('importHint')"></span>
        <input type="file" hidden multiple accept=".json,application/json" data-ref="importInput"
               @change="importFromEvent($event)">
      </div>
      <div x-show="hasImportLog()">
        <div class="survey-builder__subtitle" x-text="t('importLogTitle')"></div>
        <ul class="survey-builder__import-log" data-ref="importLog">
          <template x-for="entry in importLog" :key="entry.key">
            <li :class="importStatusClass(entry.status)">
              <span class="survey-builder__file" data-ref="fileName" x-text="entry.name"></span>
              <span data-ref="importStatus" x-text="importStatusLabel(entry.status)"></span>
              <span class="survey-builder__hint" data-ref="importNotes" x-text="noteLine(entry)"></span>
            </li>
          </template>
        </ul>
      </div>

      <div class="dmike-split__section-title" x-text="t('responsesTitle')"></div>
      <p class="survey-builder__hint" x-show="!hasResponses()" x-text="t('responsesEmpty')"></p>
      <div class="dmike-table-wrap" x-show="hasResponses()">
        <table class="dmike-table survey-builder__responses" data-ref="responses">
          <thead>
            <tr>
              <th x-text="t('colDate')"></th>
              <th x-text="t('colRespondent')"></th>
              <th></th>
            </tr>
          </thead>
          <template x-for="row in responseRows()" :key="row.id">
            <tbody :data-response-id="row.id">
              <tr>
                <td class="survey-builder__nowrap" data-ref="date" x-text="row.date"></td>
                <td data-ref="who" x-text="row.who"></td>
                <td class="survey-builder__nowrap">
                  <button class="btn btn--icon-sm" type="button" data-action="toggleResponse" :title="t('showDetails')"
                          @click="toggleResponse(row.id)"><span class="icon icon--sm" data-icon="action.show" aria-hidden="true"></span></button>
                  <button class="btn btn--icon-sm btn--danger" type="button" data-action="deleteResponse" :title="t('delete')"
                          @click="deleteResponse(row.id)"><span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span></button>
                </td>
              </tr>
              <tr data-ref="details" x-show="isResponseOpen(row.id)">
                <td colspan="3">
                  <dl class="survey-builder__details">
                    <template x-for="d in responseDetails(row.id)" :key="d.key">
                      <div class="survey-builder__detail">
                        <dt x-text="d.question"></dt>
                        <dd x-text="d.answer"></dd>
                      </div>
                    </template>
                  </dl>
                </td>
              </tr>
            </tbody>
          </template>
        </table>
      </div>

      <div data-ref="evaluation" x-show="hasResponses()">
        <div class="dmike-split__section-title" x-text="t('evaluationTitle')"></div>
        <div class="survey-builder__toolbar">
          <label class="survey-builder__counts" x-text="t('filterLabel')"></label>
          <select class="field" data-ref="filter" @change="setFilterFromEvent($event)">
            <option value="" :selected="isFilterValue('')" x-text="t('filterAll')"></option>
            <template x-for="o in filterOptions()" :key="o.value">
              <option :value="o.value" :selected="isFilterValue(o.value)" x-text="o.label"></option>
            </template>
          </select>
          <span class="survey-builder__counts" data-ref="nLine" x-text="nLine()"></span>
          <button class="btn btn--sm" type="button" data-ref="takeToVoc" :disabled="!hasVocSelection()" @click="takeToVocTree()">
            <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('takeToVoc')"></span>
          </button>
          <button class="btn btn--sm" type="button" data-ref="toWorksheet" @click="toWorksheet()">
            <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('toWorksheet')"></span>
          </button>
        </div>

        <section class="survey-builder__summary" data-ref="summary">
          <div class="survey-builder__subtitle" x-text="t('report.rateTitle')"></div>
          <p class="survey-builder__counts" data-ref="rateLine" x-text="rateLine()"></p>
          <p class="survey-builder__hint" data-ref="withoutRecipient" x-show="hasWithoutRecipient()" x-text="withoutRecipientLine()"></p>
          <div class="dmike-table-wrap" x-show="hasRateGroups()">
            <table class="dmike-table survey-builder__stats" data-ref="rateGroups">
              <thead>
                <tr>
                  <th x-text="t('report.colGroup')"></th><th x-text="t('report.colSent')"></th>
                  <th x-text="t('report.colAnswered')"></th><th x-text="t('report.colRate')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="g in rateGroups()" :key="g.key">
                  <tr><td x-text="g.group"></td><td x-text="g.sent"></td><td x-text="g.answered"></td><td x-text="g.rate"></td></tr>
                </template>
              </tbody>
            </table>
          </div>

          <div x-show="hasRanking()">
            <div class="survey-builder__subtitle" x-text="t('report.topTitle')"></div>
            <table class="dmike-table survey-builder__stats" data-ref="ranking">
              <thead>
                <tr>
                  <th x-text="t('report.colItem')"></th><th x-text="t('report.colN')"></th>
                  <th x-text="t('report.colMean')"></th><th x-text="t('report.colTop')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in rankingRows()" :key="r.key">
                  <tr>
                    <td data-ref="item" x-text="r.text"></td><td x-text="r.n"></td>
                    <td data-ref="mean" x-text="r.mean"></td><td x-text="r.top"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <button class="btn btn--sm" type="button" data-ref="rankingToggle" x-show="hasMoreRanking()"
                    @click="toggleRanking()" x-text="rankingToggleLabel()"></button>
          </div>

          <div x-show="hasKanoOverview()">
            <div class="survey-builder__subtitle" x-text="t('report.kanoTitle')"></div>
            <table class="dmike-table survey-builder__stats" data-ref="kanoOverview">
              <thead>
                <tr>
                  <th x-text="t('report.colItem')"></th><th x-text="t('report.colCategory')"></th>
                  <th x-text="t('report.colBetter')"></th><th x-text="t('report.colWorse')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="k in kanoOverviewRows()" :key="k.key">
                  <tr>
                    <td data-ref="item" x-text="k.text"></td><td data-ref="category" x-text="k.category"></td>
                    <td x-text="k.cs"></td><td x-text="k.ds"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="survey-builder__chart" data-chart="kano-overview"></div>
          </div>

          <p class="survey-builder__counts" data-ref="freeText" x-text="freeTextLine()"></p>
        </section>

        <div class="survey-builder__toolbar">
          <label class="survey-builder__counts" x-text="t('groupByLabel')"></label>
          <select class="field" data-ref="groupBy" @change="setGroupByFromEvent($event)">
            <option value="" :selected="isGroupBy('')" x-text="t('groupByNone')"></option>
            <template x-for="o in groupByOptions()" :key="o.value">
              <option :value="o.value" :selected="isGroupBy(o.value)" x-text="o.label"></option>
            </template>
          </select>
          <label class="survey-builder__switch" data-ref="reportWithNamesLabel" x-show="canShowNames()">
            <input type="checkbox" data-ref="reportWithNames" :checked="isReportWithNames()"
                   @change="setReportWithNamesFromEvent($event)">
            <span x-text="t('reportWithNames')"></span>
          </label>
          <button class="btn btn--sm" type="button" data-ref="exportReport" @click="exportReport()">
            <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span><span x-text="t('exportReport')"></span>
          </button>
        </div>

        <section class="survey-builder__groups" data-ref="groups" x-show="hasComparison()">
          <div class="survey-builder__subtitle" x-text="groupsTitle()"></div>
          <ul class="survey-builder__group-heads" data-ref="groupHeads">
            <template x-for="g in groupHeads()" :key="g.id">
              <li x-text="g.label"></li>
            </template>
          </ul>
          <template x-for="part in comparisonParts()" :key="part.key">
            <div class="survey-builder__group-part" :data-group-question-id="part.questionId">
              <h4 class="survey-builder__part-title" x-text="part.title"></h4>
              <table class="dmike-table survey-builder__stats">
                <thead>
                  <tr>
                    <th></th>
                    <template x-for="g in groupHeads()" :key="g.id">
                      <th x-text="g.label"></th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in part.rows" :key="row.key">
                    <tr :data-row-id="row.key" :class="rowClass(row)">
                      <td>
                        <span data-ref="label" x-text="row.label"></span>
                        <span class="survey-builder__hint" data-ref="note" x-text="row.note"></span>
                      </td>
                      <template x-for="c in row.cells" :key="c.key">
                        <td data-ref="cell" :class="cellClass(c)" x-text="c.text"></td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="survey-builder__chart" x-show="part.chart" :data-chart="chartKey('g', part.questionId)"></div>
            </div>
          </template>
        </section>
        <div data-ref="blocks">
          <template x-for="b in blocks()" :key="b.key">
            <article class="survey-builder__block" :data-question-id="b.question.id">
              <h3 class="survey-builder__block-title" x-text="b.title"></h3>
              <p class="survey-builder__counts" x-text="blockN(b)"></p>

              <template x-if="isChoice(b)">
                <div class="survey-builder__block-body">
                  <table class="dmike-table survey-builder__stats">
                    <thead><tr><th x-text="t('colOption')"></th><th x-text="t('colCount')"></th><th x-text="t('colShare')"></th></tr></thead>
                    <tbody>
                      <template x-for="o in b.stats.options" :key="o.id">
                        <tr :data-option-id="o.id">
                          <td data-ref="option" x-text="o.text"></td>
                          <td data-ref="count" x-text="o.count"></td>
                          <td data-ref="share" x-text="fmtPct(o.share)"></td>
                        </tr>
                      </template>
                      <tr data-option-id="__other" x-show="hasOther(b)">
                        <td data-ref="option" x-text="t('answerOther')"></td>
                        <td data-ref="count" x-text="b.stats.otherCount"></td>
                        <td data-ref="share" x-text="otherShare(b)"></td>
                      </tr>
                    </tbody>
                  </table>
                  <div x-show="hasOtherTexts(b)">
                    <div class="survey-builder__subtitle" x-text="t('otherTitle')"></div>
                    <ul class="survey-builder__texts">
                      <template x-for="o in b.stats.otherTexts" :key="o.responseId">
                        <li x-text="o.text"></li>
                      </template>
                    </ul>
                  </div>
                  <div class="survey-builder__chart" :data-chart="chartKey('q', b.question.id)"></div>
                </div>
              </template>

              <template x-if="isType(b, 'rating')">
                <div class="survey-builder__block-body">
                  <table class="dmike-table survey-builder__stats">
                    <thead>
                      <tr>
                        <th x-text="t('report.colItem')"></th><th x-text="t('report.colN')"></th>
                        <th x-text="t('report.colMean')"></th><th x-text="t('report.colMedian')"></th>
                        <th x-text="t('colDist')"></th><th x-text="t('report.colNa')"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in b.stats.rows" :key="r.id">
                        <tr :data-row-id="r.id">
                          <td x-text="r.text"></td>
                          <td data-ref="n" x-text="r.n"></td>
                          <td data-ref="mean" x-text="fmtNum(r.mean, 2)"></td>
                          <td data-ref="median" x-text="fmtNum(r.median, 1)"></td>
                          <td class="survey-builder__nowrap" data-ref="dist" x-text="distLabel(r)"></td>
                          <td data-ref="na" x-text="r.na"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="survey-builder__chart" :data-chart="chartKey('q', b.question.id)"></div>
                </div>
              </template>

              <template x-if="isType(b, 'kano')">
                <div class="survey-builder__block-body">
                  <table class="dmike-table survey-builder__stats">
                    <thead>
                      <tr>
                        <th x-text="t('report.colItem')"></th><th x-text="t('report.colCategory')"></th>
                        <th x-text="t('report.colBetter')"></th><th x-text="t('report.colWorse')"></th>
                        <th x-text="t('report.colN')"></th>
                        <th x-show="hasImportance(b)" x-text="t('report.colImportance')"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in b.stats.rows" :key="r.id">
                        <tr :data-row-id="r.id">
                          <td x-text="r.text"></td>
                          <td data-ref="category" x-text="catLabel(r.category)"></td>
                          <td x-text="fmtNum(r.cs, 2)"></td>
                          <td x-text="fmtNum(r.ds, 2)"></td>
                          <td x-text="r.n"></td>
                          <td data-ref="importance" x-show="hasImportance(b)" x-text="fmtNum(r.importanceMean, 1)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="survey-builder__toolbar">
                    <label class="survey-builder__counts" x-text="t('kanoTarget')"></label>
                    <select class="field" data-ref="kanoTarget" @change="setKanoTargetFromEvent(b.question.id, $event)">
                      <option value="" :selected="isKanoTarget(b.question.id, '')" x-text="t('kanoNew')"></option>
                      <template x-for="o in kanoTargetOptions()" :key="o.value">
                        <option :value="o.value" :selected="isKanoTarget(b.question.id, o.value)" x-text="o.label"></option>
                      </template>
                    </select>
                    <button class="btn btn--sm" type="button" data-action="handOverKano" @click="handOverToKano(b.question.id)">
                      <span class="icon icon--sm" data-icon="action.send-to" aria-hidden="true"></span><span x-text="t('handOverKano')"></span>
                    </button>
                  </div>
                  <div class="survey-builder__chart" :data-chart="chartKey('q', b.question.id)"></div>
                </div>
              </template>

              <template x-if="isType(b, 'text')">
                <div class="survey-builder__block-body">
                  <p class="survey-builder__hint" x-show="!hasTextAnswers(b)" x-text="t('textEmpty')"></p>
                  <ul class="survey-builder__texts" data-ref="answers">
                    <template x-for="a in textAnswers(b)" :key="a.key">
                      <li class="survey-builder__answer">
                        <input type="checkbox" data-ref="vocCheck" x-show="!isVocTaken(a.key)"
                               :checked="isVocSelected(a.key)" @change="toggleVoc(a.key)">
                        <span class="icon icon--sm survey-builder__taken" data-icon="status.ok" data-ref="vocTaken"
                              x-show="isVocTaken(a.key)" :title="t('vocTakenMark')"></span>
                        <span data-ref="answerText" x-text="a.text"></span>
                        <span class="survey-builder__hint" x-show="hasName(a)" x-text="a.name"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </article>
          </template>
        </div>
      </div>
    </section>
  </div>
</div>
