<div class="module-container of" x-data="opportunityFlowchart" data-ref="root">
  <div class="module-container__body">
    <div class="of__canvas">

      <!-- Column headers -->
      <div class="of__headers">
        <div class="of__header of__header--va"  x-text="t('headerVA')"></div>
        <div class="of__header of__header--nva" x-text="t('headerNVA')"></div>
      </div>

      <!-- Empty state -->
      <template x-if="model.steps.length === 0">
        <p class="of__empty-hint" x-text="t('emptyHint')"></p>
      </template>

      <!-- Chain of steps: one row per step, top-to-bottom in sequence order.
           Each row is a two-column grid; only the cell matching the step's
           `side` is filled, so a column switch never changes the index. -->
      <div class="of__flow" data-ref="flow">
        <template x-for="(step, idx) in model.steps" :key="step.id">
          <div class="of__row"
               :data-step-id="step.id"
               draggable="true"
               @dragstart="stepDragStart(step.id, $event)"
               @dragover="stepDragOver(step.id, $event)"
               @dragleave="stepDragLeave(step.id, $event)"
               @drop="stepDrop(step.id, $event)"
               @dragend="stepDragEnd($event)">

            <!-- Connector above this step: opens the "insert left / right" menu -->
            <template x-if="idx > 0">
              <div class="of__connector">
                <button class="of__insert-btn fc-connector fc-connector--clickable"
                        data-action="insert-step" :data-idx="idx"
                        @click="toggleInsertMenu(idx)"
                        :title="t('insertHere')">
                  <span class="fc-connector__arrow">&raquo;</span>
                </button>
                <template x-if="isInsertOpen(idx)">
                  <div class="of__insert-menu">
                    <button @click="insertAt(idx, 'va')"  x-text="t('insertVA')"></button>
                    <button @click="insertAt(idx, 'nva')" x-text="t('insertNVA')"></button>
                  </div>
                </template>
              </div>
            </template>

            <!-- VA cell (left) -->
            <div class="of__cell of__cell--va">
              <template x-if="isVA(step)">
                <div class="of__card of__card--va fc-card fc-card--accent">
                  <div class="of__card-header fc-card__header">
                    <span class="of__step-number fc-step-number" x-text="stepNum(idx)"></span>
                    <textarea class="of__step-title fc-card__title" x-model="step.title"
                              :placeholder="t('titlePlaceholder')"
                              @input="autoSize($event)"></textarea>
                    <div class="of__card-actions fc-card__actions">
                      <button class="of__side-toggle fc-card__delete" @click="toggleSide(step.id)"
                              :title="t('moveToNVA')">&rarr;</button>
                      <button class="of__delete fc-card__delete" @click="model.removeStep(step.id)"
                              :title="t('deleteStep')">×</button>
                    </div>
                  </div>
                  <div class="of__card-body fc-card__body">
                    <textarea class="field field--ghost of__step-description fc-card__description"
                              :placeholder="t('descriptionPlaceholder')"
                              data-field="description" :data-step-id="step.id"
                              x-model="step.description"
                              @input="autoSize($event)"></textarea>
                  </div>
                  <!-- @include js/core/flowchart/substeps.part.html -->
                </div>
              </template>
            </div>

            <!-- NVA cell (right) -->
            <div class="of__cell of__cell--nva">
              <template x-if="!isVA(step)">
                <div class="of__card of__card--nva fc-card fc-card--accent">
                  <div class="of__card-header fc-card__header">
                    <span class="of__step-number fc-step-number" x-text="stepNum(idx)"></span>
                    <textarea class="of__step-title fc-card__title" x-model="step.title"
                              :placeholder="t('titlePlaceholder')"
                              @input="autoSize($event)"></textarea>
                    <div class="of__card-actions fc-card__actions">
                      <button class="of__side-toggle fc-card__delete" @click="toggleSide(step.id)"
                              :title="t('moveToVA')">&larr;</button>
                      <button class="of__delete fc-card__delete" @click="model.removeStep(step.id)"
                              :title="t('deleteStep')">×</button>
                    </div>
                  </div>
                  <div class="of__card-body fc-card__body">
                    <textarea class="field field--ghost of__step-description fc-card__description"
                              :placeholder="t('descriptionPlaceholder')"
                              data-field="description" :data-step-id="step.id"
                              x-model="step.description"
                              @input="autoSize($event)"></textarea>
                  </div>
                  <!-- @include js/core/flowchart/substeps.part.html -->
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Import picker form, mounted into the shared modal by _openImport().
       Hidden inside the module container via CSS; visible when borrowed
       into the modal body (mirrors the Activity Flowchart picker). -->
  <div x-ref="importForm" class="of__import-form" :data-selected="_importSelectedId">
    <p class="of__import-hint" x-text="t('importHint')"></p>
    <div class="of__import-list">
      <template x-for="opt in _importOptions" :key="opt.moduleId + '-' + opt.instanceId">
        <label class="of__import-option"
               :class="_importSelectedId === opt.instanceId ? 'of__import-option--selected' : ''"
               :data-instance-id="opt.instanceId"
               @click.stop="_pickImportOption(opt)">
          <input type="radio" name="of-import-pick"
                 :value="opt.instanceId"
                 :checked="_importSelectedId === opt.instanceId"
                 @click.stop="_pickImportOption(opt)">
          <span class="of__import-option-source" x-text="t('modules.' + opt.moduleId + '.name')"></span>
          <span class="of__import-option-title" x-text="opt.title"></span>
        </label>
      </template>
    </div>
  </div>
</div>
