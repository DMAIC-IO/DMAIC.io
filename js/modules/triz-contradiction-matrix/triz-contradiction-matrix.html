<section class="module-container triz-cm" x-data="trizContradictionMatrix">
  <div class="module-container__body triz-cm__body">

    <section class="triz-cm__section">
      <h3 class="triz-cm__section-title" x-text="t('problemHeading')"></h3>
      <textarea class="field triz-cm__problem" rows="2" x-model="model.problemNote" :placeholder="t('problemPlaceholder')" :aria-label="t('problemHeading')"></textarea>
    </section>

    <section class="triz-cm__section triz-cm__selectors">
      <div class="triz-cm__selector">
        <label class="triz-cm__label triz-cm__label--improving">
          <span class="triz-cm__dot triz-cm__dot--improving"></span>
          <span x-text="t('improvingParameter')"></span>
        </label>
        <select class="field triz-cm__select" data-role="improving" @change="improvingChanged($event)">
          <option value="" x-text="t('selectPlaceholder')"></option>
          <template x-for="p in params">
            <option :key="p.id" :value="p.id" :selected="model.improving == p.id" x-text="optionText(p)"></option>
          </template>
        </select>
        <template x-if="model.improving"><p class="triz-cm__param-desc" x-text="paramDesc(model.improving)"></p></template>
      </div>

      <div class="triz-cm__selector">
        <label class="triz-cm__label triz-cm__label--worsening">
          <span class="triz-cm__dot triz-cm__dot--worsening"></span>
          <span x-text="t('worseningParameter')"></span>
        </label>
        <select class="field triz-cm__select" data-role="worsening" @change="worseningChanged($event)">
          <option value="" x-text="t('selectPlaceholder')"></option>
          <template x-for="p in params">
            <option :key="p.id" :value="p.id" :selected="model.worsening == p.id" x-text="optionText(p)"></option>
          </template>
        </select>
        <template x-if="model.worsening"><p class="triz-cm__param-desc" x-text="paramDesc(model.worsening)"></p></template>
      </div>

      <button class="btn btn--sm triz-cm__swap-btn" type="button" data-action="swap" @click="swapParams" :title="t('swap')" :aria-label="t('swap')">⇅</button>
    </section>

    <section class="triz-cm__section">
      <h3 class="triz-cm__section-title" x-text="t('recommendedHeading')"></h3>
      <template x-if="model.showHint"><p class="triz-cm__hint" x-text="t('hintSelectBoth')"></p></template>
      <template x-if="model.showWarn"><p class="triz-cm__warn" x-text="t('warnSameParameter')"></p></template>
      <template x-if="model.showNoContradiction"><p class="triz-cm__hint" x-text="t('noContradiction')"></p></template>
      <ol class="triz-cm__principles" x-show="model.showPrinciples">
        <template x-for="pr in model.principlesList">
          <li class="triz-cm__principle" :key="pr.id">
            <div class="triz-cm__principle-num" x-text="pr.id"></div>
            <div class="triz-cm__principle-body">
              <div class="triz-cm__principle-name" x-text="principleName(pr)"></div>
              <div class="triz-cm__principle-desc" x-text="principleDesc(pr)"></div>
            </div>
          </li>
        </template>
      </ol>
    </section>

    <section class="triz-cm__section">
      <button class="btn btn--sm triz-cm__matrix-toggle" type="button" data-action="toggle-matrix" @click="toggleMatrix" x-text="matrixToggleLabel()"></button>
      <template x-if="model.showMatrix"><div class="triz-cm__mx-wrap">
        <p class="triz-cm__mx-legend" x-text="t('matrixLegend')"></p>
        <table class="triz-cm__mx">
          <thead>
            <tr>
              <th class="triz-cm__mx-corner" :title="t('matrixCornerTip')">&uarr;/&darr;</th>
              <template x-for="(colP, j) in params">
                <th class="triz-cm__mx-col-head" :key="j" :class="colHeadClass(j, model.worsening)" :title="colHeadTitle(j)" x-text="colHeadLabel(j)"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, i) in matrix">
              <tr :key="i">
                <th class="triz-cm__mx-row-head" :class="rowHeadClass(i, model.improving)" :title="rowHeadTitle(i)" x-text="rowHeadLabel(i)"></th>
                <template x-for="(cell, j) in row">
                  <td class="triz-cm__mx-cell" :key="j" :class="mxCellClass(i, j, cell, model.improving, model.worsening)" :data-i-idx="paramId(i)" :data-j-idx="paramId(j)" :title="mxCellTitle(i, j, cell)" @click="mxCellClick($event)"><span x-text="mxCellContent(i, j, cell)"></span></td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div></template>
    </section>

  </div>
</section>
