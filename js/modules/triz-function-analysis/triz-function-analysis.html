<section class="module-container tfa" x-data="trizFunctionAnalysis">
  <div class="module-container__body tfa__body">

    <div class="dmike-tabs tfa__tabs">
      <template x-for="tab in TABS" :key="tab">
        <button type="button" class="dmike-tab" :class="tabClass(tab)"
          data-role="tab" :data-tab="tab" @click="setTab(tab)" x-text="tabLabel(tab)"></button>
      </template>
    </div>

    <!-- ── Tab: Components ── -->
    <div class="dmike-tab-content" :class="contentClass('components')"
      data-tab-content="components" x-show="model.activeTab === 'components'">
      <template x-for="kind in GROUPS" :key="kind">
        <section class="tfa__group" :data-group="kind">
          <h3 class="tfa__group-title" x-text="groupLabel(kind)"></h3>
          <template x-for="c in componentsOf(kind)" :key="c.id">
            <div class="tfa__row" data-role="component" :data-id="c.id">
              <input class="field tfa__name" type="text" data-role="component-name"
                :value="c.name" :placeholder="t('namePlaceholder')"
                @input="setName(c, $event)" @keydown.enter.prevent="addComponent(kind)" @blur="discardIfEmpty(c)">
              <input class="field tfa__note" type="text" data-role="component-note"
                :value="c.note" :placeholder="t('notePlaceholder')" @input="setNote(c, $event)">
              <select class="field tfa__kind" data-role="component-kind" @change="changeKind(c, $event)">
                <option value="target" :selected="c.kind === 'target'" x-text="t('kind.target')"></option>
                <option value="system" :selected="c.kind === 'system'" x-text="t('kind.system')"></option>
                <option value="supersystem" :selected="c.kind === 'supersystem'" x-text="t('kind.supersystem')"></option>
              </select>
              <button type="button" class="btn btn--sm" data-role="component-remove"
                :title="t('removeComponent')" :aria-label="t('removeComponent')" @click="removeComponent(c)">
                <span class="icon icon--sm" data-icon="action.delete"></span>
              </button>
            </div>
          </template>
          <button type="button" class="btn btn--sm tfa__add" data-role="component-add" :data-kind="kind"
            x-show="canAdd(kind)" @click="addComponent(kind)">
            <span class="icon icon--sm" data-icon="action.add"></span>
            <span x-text="t('addComponent')"></span>
          </button>
        </section>
      </template>
    </div>

    <!-- ── Tab: Interactions ── -->
    <div class="dmike-tab-content" :class="contentClass('interactions')"
      data-tab-content="interactions" x-show="model.activeTab === 'interactions'">
      <p class="tfa__hint" data-role="matrix-empty" x-show="model.components.length < 2" x-text="t('matrixEmpty')"></p>
      <div class="tfa__matrix-wrap" x-show="model.components.length >= 2">
        <table class="tfa__matrix" data-role="matrix">
          <thead>
            <tr>
              <th></th>
              <template x-for="c in matrixComponents()" :key="c.id">
                <th scope="col" :class="headClass(c)" x-text="c.name"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="(r, ri) in matrixComponents()" :key="r.id">
              <tr>
                <th scope="row" :class="headClass(r)" x-text="r.name"></th>
                <template x-for="(c, ci) in matrixComponents()" :key="c.id">
                  <td :class="cellClass(ri, ci)">
                    <button type="button" class="tfa__cell-btn" data-role="cell" :data-a="r.id" :data-b="c.id"
                      :data-state="cellState(r, c)" x-show="ci > ri" :aria-pressed="isTicked(r, c) ? 'true' : 'false'"
                      :title="cellTitle(r, c)" @click="toggleCell(r, c)">
                      <span class="icon icon--sm" data-icon="action.confirm" x-show="isTicked(r, c)"></span>
                      <span class="icon icon--sm tfa__cell-excluded" data-icon="action.close" x-show="isExcluded(r, c)"></span>
                    </button>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="tfa__hint" data-role="matrix-summary" x-text="matrixSummary()"></p>
      </div>
    </div>
    <!-- ── Tab: Function model ── -->
    <div class="dmike-tab-content" :class="contentClass('model')"
      data-tab-content="model" x-show="model.activeTab === 'model'">
      <div class="dmike-split dmike-split--input-lg tfa__split">
        <div class="dmike-split__input">
          <div class="dmike-split__section-title" x-text="t('openPairs')"></div>
          <div class="tfa__chips">
            <template x-for="p in openPairChips()" :key="p.key">
              <button type="button" class="tfa__chip" data-role="open-pair" @click="createFromPair(p)" x-text="p.label"></button>
            </template>
          </div>
          <p class="tfa__hint" x-show="openPairChips().length === 0" x-text="t('noOpenPairs')"></p>

          <div class="dmike-split__section-title" x-text="t('functions')"></div>
          <template x-for="fn in model.functions" :key="fn.id">
            <article class="tfa__fn" :class="fnClass(fn)" data-role="function" :data-id="fn.id" @click="selectFunction(fn.id)">
              <div class="tfa__fn-row">
                <span class="tfa__fn-end" data-role="fn-carrier" :title="t('carrier')" x-text="endName(fn.carrier)"></span>
                <input class="field" type="text" data-role="fn-verb" :aria-label="t('verb')"
                  :placeholder="t('verbPlaceholder')" :value="fn.verb" @input="setVerb(fn, $event)">
                <span class="tfa__fn-end" data-role="fn-object" :title="t('object')" x-text="endName(fn.object)"></span>
                <button type="button" class="btn btn--sm" data-role="fn-swap" :title="t('swapDirection')"
                  :aria-label="t('swapDirection')" @click.stop="swap(fn)">
                  <span class="icon icon--sm" data-icon="action.swap"></span>
                </button>
                <button type="button" class="btn btn--sm" data-role="fn-add-on-pair" :title="t('addOnPair')"
                  :aria-label="t('addOnPair')" x-show="isComplete(fn)" @click.stop="addOnPair(fn)">
                  <span class="icon icon--sm" data-icon="action.add"></span>
                </button>
                <button type="button" class="btn btn--sm" data-role="fn-remove" :title="t('removeFunction')"
                  :aria-label="t('removeFunction')" @click.stop="removeFunction(fn)">
                  <span class="icon icon--sm" data-icon="action.delete"></span>
                </button>
              </div>
              <div class="tfa__fn-row">
                <input class="field" type="text" data-role="fn-parameter" :aria-label="t('parameter')"
                  :placeholder="t('parameterPlaceholder')" :value="fn.parameter" @input="setParameter(fn, $event)">
                <select class="field" data-role="fn-type" @change="changeType(fn, $event)">
                  <option value="useful" :selected="fn.type === 'useful'" x-text="t('type.useful')"></option>
                  <option value="harmful" :selected="fn.type === 'harmful'" x-text="t('type.harmful')"></option>
                </select>
                <select class="field" data-role="fn-level" x-show="fn.type === 'useful'" @change="changeLevel(fn, $event)">
                  <option value="adequate" :selected="fn.level === 'adequate'" x-text="t('level.adequate')"></option>
                  <option value="insufficient" :selected="fn.level === 'insufficient'" x-text="t('level.insufficient')"></option>
                  <option value="excessive" :selected="fn.level === 'excessive'" x-text="t('level.excessive')"></option>
                </select>
                <span class="tfa__rank" data-role="fn-rank" x-show="rankLabel(fn)" x-text="rankLabel(fn)"></span>
              </div>
            </article>
          </template>
          <p class="tfa__hint" x-show="model.functions.length === 0" x-text="t('noFunctions')"></p>
        </div>

        <div class="dmike-split__output" data-role="diagram-pane">
          <div class="tfa__toolbar">
            <button type="button" class="btn btn--sm" data-role="reset-layout" @click="resetLayout()">
              <span class="icon icon--sm" data-icon="action.reset"></span>
              <span x-text="t('resetLayout')"></span>
            </button>
            <button type="button" class="btn btn--sm" data-role="export-png" @click="exportDiagram('png')">
              <span class="icon icon--sm" data-icon="action.download"></span>
              <span x-text="t('exportPng')"></span>
            </button>
            <button type="button" class="btn btn--sm" data-role="export-svg" @click="exportDiagram('svg')">
              <span class="icon icon--sm" data-icon="action.download"></span>
              <span x-text="t('exportSvg')"></span>
            </button>
          </div>
          <p class="tfa__hint" x-show="model.components.length === 0" x-text="t('diagramEmpty')"></p>
          <div class="tfa__stage">
            <div class="tfa__canvas" data-role="canvas" :style="canvasStyle()" x-effect="drawArrows()">
              <div class="tfa__arrows" data-ref="arrows"></div>
              <template x-for="c in model.components" :key="c.id">
                <div class="tfa__node" :class="nodeClass(c)" data-role="node" :data-id="c.id"
                  :style="nodeStyle(c)" :title="c.name" @pointerdown="startDrag(c, $event)"><span class="tfa__node-text" x-text="c.name"></span></div>
              </template>
            </div>
          </div>
          <ul class="tfa__legend">
            <li><span class="tfa__legend-line tfa__legend-line--solid"></span><span x-text="t('legend.solid')"></span></li>
            <li><span class="tfa__legend-line tfa__legend-line--dashed"></span><span x-text="t('legend.dashed')"></span></li>
            <li><span class="tfa__legend-line tfa__legend-line--bold"></span><span x-text="t('legend.bold')"></span></li>
            <li><span class="tfa__legend-line tfa__legend-line--wave"></span><span x-text="t('legend.wave')"></span></li>
          </ul>
        </div>
      </div>

      <section class="tfa__disadvantages" data-role="disadvantages">
        <h3 class="tfa__group-title" x-text="t('disadvantages')"></h3>
        <p class="tfa__hint" x-show="disadvantageGroups().length === 0" x-text="t('noDisadvantages')"></p>
        <template x-for="g in disadvantageGroups()" :key="g.kind">
          <div class="tfa__dis-group" :data-kind="g.kind">
            <h4 class="tfa__dis-title" x-text="g.title"></h4>
            <ul class="tfa__dis-list">
              <template x-for="d in g.items" :key="d.functionId">
                <li class="tfa__dis" data-role="disadvantage" :data-id="d.functionId" @click="select(d.functionId)">
                  <span x-text="d.carrier"></span> <strong x-text="d.verb"></strong> <span x-text="d.object"></span><span class="tfa__dis-param" x-text="paramText(d)"></span>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </section>
    </div>
  </div>
</section>
