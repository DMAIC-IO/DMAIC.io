<section class="module-container tfa" x-data="trizFunctionAnalysis">
  <div class="module-container__body tfa__body">

    <div class="dmike-tabs tfa__tabs">
      <template x-for="tab in TABS" :key="tab">
        <button type="button" class="dmike-tab" :class="tabClass(tab)"
          data-role="tab" :data-tab="tab" @click="setTab(tab)" x-text="tabLabel(tab)"></button>
      </template>
    </div>

    <!-- ── Tab: Components ── -->
    <div class="dmike-tab-content" :class="contentClass('components')"
      data-tab-content="components" x-show="model.activeTab === 'components'">
      <template x-for="kind in KINDS" :key="kind">
        <section class="tfa__group" :data-group="kind">
          <h3 class="tfa__group-title" x-text="groupLabel(kind)"></h3>
          <template x-for="c in componentsOf(kind)" :key="c.id">
            <div class="tfa__row" data-role="component" :data-id="c.id">
              <input class="field tfa__name" type="text" data-role="component-name"
                :value="c.name" :placeholder="t('namePlaceholder')"
                @input="setName(c, $event)" @keydown.enter.prevent="addComponent(kind)" @blur="discardIfEmpty(c)">
              <input class="field tfa__note" type="text" data-role="component-note"
                :value="c.note" :placeholder="t('notePlaceholder')" @input="setNote(c, $event)">
              <select class="field tfa__kind" data-role="component-kind" @change="changeKind(c, $event)">
                <option value="target" :selected="c.kind === 'target'" x-text="t('kind.target')"></option>
                <option value="system" :selected="c.kind === 'system'" x-text="t('kind.system')"></option>
                <option value="supersystem" :selected="c.kind === 'supersystem'" x-text="t('kind.supersystem')"></option>
              </select>
              <button type="button" class="btn btn--sm" data-role="component-remove"
                :title="t('removeComponent')" :aria-label="t('removeComponent')" @click="removeComponent(c)">
                <span class="icon icon--sm" data-icon="action.delete"></span>
              </button>
            </div>
          </template>
          <button type="button" class="btn btn--sm tfa__add" data-role="component-add" :data-kind="kind"
            x-show="canAdd(kind)" @click="addComponent(kind)">
            <span class="icon icon--sm" data-icon="action.add"></span>
            <span x-text="t('addComponent')"></span>
          </button>
        </section>
      </template>
    </div>

    <!-- ── Tab: Interactions ── -->
    <div class="dmike-tab-content" :class="contentClass('interactions')"
      data-tab-content="interactions" x-show="model.activeTab === 'interactions'">
      <p class="tfa__hint" data-role="matrix-empty" x-show="model.components.length < 2" x-text="t('matrixEmpty')"></p>
      <div class="tfa__matrix-wrap" x-show="model.components.length >= 2">
        <table class="tfa__matrix" data-role="matrix">
          <thead>
            <tr>
              <th></th>
              <template x-for="c in matrixComponents()" :key="c.id">
                <th scope="col" :class="headClass(c)" x-text="c.name"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="(r, ri) in matrixComponents()" :key="r.id">
              <tr>
                <th scope="row" :class="headClass(r)" x-text="r.name"></th>
                <template x-for="(c, ci) in matrixComponents()" :key="c.id">
                  <td :class="cellClass(ri, ci)">
                    <button type="button" class="tfa__cell-btn" data-role="cell" :data-a="r.id" :data-b="c.id"
                      x-show="ci > ri" :aria-pressed="isTicked(r, c) ? 'true' : 'false'" :title="cellTitle(r, c)"
                      @click="toggleCell(r, c)">
                      <span class="icon icon--sm" data-icon="action.confirm" x-show="isTicked(r, c)"></span>
                    </button>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="tfa__hint" data-role="matrix-summary" x-text="matrixSummary()"></p>
      </div>
    </div>
    <!-- TASK8_MODEL -->
  </div>
</section>
