<div class="histogram dmike-split dmike-split--input-sm" x-data="histogram">
  <div class="histogram__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <div data-ref="picker-wrap"></div>

    <div class="dmike-split__section-title" x-text="t('sectionBinning')"></div>
    <div class="histogram__options">
      <div class="field-group">
        <label x-text="t('binMode')"></label>
        <select class="field" data-ref="bin-mode" x-model="model.binMode" @change="binModeChanged()">
          <option value="auto" x-text="t('binAuto')"></option>
          <option value="manual" x-text="t('binManual')"></option>
        </select>
      </div>
      <div class="field-group" data-ref="bin-width-row" x-show="model.binMode === 'manual'">
        <label x-text="t('binWidth')"></label>
        <input type="number" class="field field--num" data-ref="bin-width" min="0.01"
               x-model="binWidthInput" :placeholder="t('binWidthAuto')" @change="binWidthChanged($event)">
      </div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionOptions')"></div>
    <div class="histogram__options">
      <div class="field-group">
        <label x-text="t('confLevel')"></label>
        <input type="number" class="field field--num" data-ref="conf-level" min="50" max="99.9"
               x-model="confLevelInput" @change="confLevelChanged($event)">
      </div>
    </div>

    <div class="histogram__error" data-ref="error-box"></div>
  </div>

  <div class="histogram__output dmike-split__output">
    <div class="histogram__placeholder" data-ref="placeholder"></div>
    <div class="histogram__chart-area" data-ref="chart-area" style="display:none">
      <div class="histogram__chart" data-ref="chart"></div>
      <div class="dmike-stats-panel" data-ref="stats-panel"></div>
    </div>
  </div>
</div>
