<div class="module-calculator" x-data="calculator">
  <div class="module-calculator__wrap">

    <div class="module-calculator__tabs">
      <button class="module-calculator__tab" :class="model.mode === 'sci' ? 'module-calculator__tab--active' : ''" data-mode="sci" @click="switchMode('sci')" x-text="t('modeSci')"></button>
      <button class="module-calculator__tab" :class="model.mode === 'stats' ? 'module-calculator__tab--active' : ''" data-mode="stats" @click="switchMode('stats')" x-text="t('modeStats')"></button>
      <button class="module-calculator__tab" :class="model.mode === 'sixsigma' ? 'module-calculator__tab--active' : ''" data-mode="sixsigma" @click="switchMode('sixsigma')" x-text="t('modeSixSigma')"></button>
    </div>

    <div class="module-calculator__display">
      <div class="module-calculator__expr" data-ref="expr" x-text="exprText"></div>
      <div class="module-calculator__result" data-ref="display" :class="isError ? 'module-calculator__result--error' : ''">
        <span class="icon icon--sm icon--text" :data-icon="resultIcon" aria-hidden="true" x-show="resultIcon"></span>
        <span x-text="resultText"></span>
      </div>
      <div class="module-calculator__info">
        <span data-ref="angle-mode" x-text="model.angleMode"></span>
        <span class="module-calculator__mem" data-ref="mem-ind" x-text="model.memory !== 0 ? 'M' : ''"></span>
      </div>
    </div>

    <!-- SCIENTIFIC -->
    <div data-panel="sci" :class="model.mode !== 'sci' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__grid module-calculator__grid--5col">
        <button class="module-calculator__key module-calculator__key--fn" data-fn="sin(" @click="inputFn('sin(')">sin</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="cos(" @click="inputFn('cos(')">cos</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="tan(" @click="inputFn('tan(')">tan</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="log(" @click="inputFn('log(')">log</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="ln(" @click="inputFn('ln(')">ln</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="asin(" @click="inputFn('asin(')">sin⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="acos(" @click="inputFn('acos(')">cos⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="atan(" @click="inputFn('atan(')">tan⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="sqrt(" @click="inputFn('sqrt(')">√</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="cbrt(" @click="inputFn('cbrt(')">∛</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="exp(" @click="inputFn('exp(')">eˣ</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="π" @click="inputText('π')">π</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="e" @click="inputText('e')">e</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="^" @click="inputText('^')">xʸ</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="fact(" @click="inputFn('fact(')">n!</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="(" @click="inputText('(')">(</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn=")" @click="inputText(')')">)</button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="toggle-angle" @click="toggleAngle()" x-text="t('degRad')"></button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="mem-store" @click="memStore()">MS</button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="mem-recall" @click="memRecall()">MR</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="÷" @click="inputText('÷')">/</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear" @click="clear()">AC</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="×" @click="inputText('×')">×</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="-" @click="inputText('-')">−</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="calculate" @click="calculate()">=</button>

        <button class="module-calculator__key module-calculator__key--num module-calculator__key--wide" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="+" @click="inputText('+')">+</button>
      </div>
    </div>

    <!-- STATISTICS -->
    <div data-panel="stats" :class="model.mode !== 'stats' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__data-panel">
        <label class="module-calculator__data-label" x-text="t('datasetLabel')"></label>
        <div class="module-calculator__data-display" data-ref="data-display">
          <template x-if="model.dataset.length === 0">
            <span class="module-calculator__val--empty" x-text="t('noData')"></span>
          </template>
          <template x-for="(v, i) in model.dataset">
            <span class="module-calculator__val" :key="i" x-text="v"></span>
          </template>
        </div>
        <div class="module-calculator__data-count" data-ref="data-count" x-text="'n = ' + model.dataset.length"></div>
      </div>
      <div class="module-calculator__grid module-calculator__grid--4col">
        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="add-data" @click="addData()" x-text="t('addValue')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear-data" @click="clearData()" x-text="t('clearData')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="-" @click="inputText('-')">-</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="remove-last" @click="removeLast()" x-text="t('removeLast')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="mean" @click="calcStat('mean')" x-text="'x̄ ' + t('statMean')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="median" @click="calcStat('median')" x-text="'x̃ ' + t('statMedian')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="mode" @click="calcStat('mode')" x-text="t('statMode')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="range" @click="calcStat('range')" x-text="t('statRange')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="stdS" @click="calcStat('stdS')" x-text="'s (' + t('statSample') + ')'"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="stdP" @click="calcStat('stdP')" x-text="'σ (' + t('statPopulation') + ')'"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="varS" @click="calcStat('varS')" x-text="'s² ' + t('statVariance')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="varP" @click="calcStat('varP')" x-text="'σ² ' + t('statVariance')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="sum" @click="calcStat('sum')" x-text="'Σ ' + t('statSum')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="min" @click="calcStat('min')">Min</button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="max" @click="calcStat('max')">Max</button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="count" @click="calcStat('count')" x-text="'n ' + t('statCount')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="q1" @click="calcStat('q1')">Q1</button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="q3" @click="calcStat('q3')">Q3</button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="iqr" @click="calcStat('iqr')">IQR</button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="skew" @click="calcStat('skew')" x-text="t('statSkewness')"></button>
      </div>
    </div>

    <!-- SIX SIGMA -->
    <div data-panel="sixsigma" :class="model.mode !== 'sixsigma' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__data-panel">
        <label class="module-calculator__data-label" x-text="t('processDataLabel')"></label>
        <div class="module-calculator__data-display" data-ref="ss-data-display">
          <template x-if="model.ssDataset.length === 0">
            <span class="module-calculator__val--empty" x-text="t('noData')"></span>
          </template>
          <template x-for="(v, i) in model.ssDataset">
            <span class="module-calculator__val" :key="i" x-text="v"></span>
          </template>
        </div>
        <div class="module-calculator__data-count" data-ref="ss-data-count" x-text="'n = ' + model.ssDataset.length"></div>
      </div>
      <div class="module-calculator__cpk-inputs">
        <input type="number" class="field field--num" data-ref="lsl" x-model="model.lsl" :placeholder="t('lslPlaceholder')">
        <input type="number" class="field field--num" data-ref="usl" x-model="model.usl" :placeholder="t('uslPlaceholder')">
      </div>
      <div class="module-calculator__grid module-calculator__grid--4col">
        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="add-ss-data" @click="addSSData()" x-text="t('addValue')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear-ss-data" @click="clearSSData()" x-text="t('clearData')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="-" @click="inputText('-')">-</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="remove-last-ss" @click="removeLastSS()" x-text="t('removeLast')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="cp" @click="calcSS('cp')">Cp</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="cpk" @click="calcSS('cpk')">Cpk</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="pp" @click="calcSS('pp')">Pp</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="ppk" @click="calcSS('ppk')">Ppk</button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="sigma" @click="calcSS('sigma')">Sigma-Level</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="dpmo" @click="calcSS('dpmo')">DPMO</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="yield" @click="calcSS('yield')">Yield %</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="zscore" @click="calcSS('zscore')">Z-Score</button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="mean" @click="calcSS('mean')" x-text="'x̄ ' + t('statMean')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="std" @click="calcSS('std')" x-text="'σ ' + t('statStdDev')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="ucl" @click="calcSS('ucl')">UCL</button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="lcl" @click="calcSS('lcl')">LCL</button>
      </div>
    </div>

  </div>
</div>
