<div class="module-calculator" x-data="calculator">
  <div class="module-calculator__wrap">

    <div class="dmike-tabs" role="tablist" x-tablist data-help-key="modules.calculator.actions.switchMode.help">
      <button class="dmike-tab" type="button" role="tab" data-tab="sci" :class="model.mode === 'sci' ? 'dmike-tab--active' : ''"
              :aria-selected="model.mode === 'sci' ? 'true' : 'false'" :tabindex="model.mode === 'sci' ? 0 : -1"
              @mousedown="preventFocus($event)" @click="switchMode('sci')" x-text="t('modeSci')"></button>
      <button class="dmike-tab" type="button" role="tab" data-tab="stats" :class="model.mode === 'stats' ? 'dmike-tab--active' : ''"
              :aria-selected="model.mode === 'stats' ? 'true' : 'false'" :tabindex="model.mode === 'stats' ? 0 : -1"
              @mousedown="preventFocus($event)" @click="switchMode('stats')" x-text="t('modeStats')"></button>
      <button class="dmike-tab" type="button" role="tab" data-tab="sixsigma" :class="model.mode === 'sixsigma' ? 'dmike-tab--active' : ''"
              :aria-selected="model.mode === 'sixsigma' ? 'true' : 'false'" :tabindex="model.mode === 'sixsigma' ? 0 : -1"
              @mousedown="preventFocus($event)" @click="switchMode('sixsigma')" x-text="t('modeSixSigma')"></button>
    </div>

    <div class="module-calculator__display">
      <div class="module-calculator__expr" data-ref="expr" x-text="exprText"></div>
      <div class="module-calculator__result" data-ref="display" :class="isError ? 'module-calculator__result--error' : ''">
        <span class="icon icon--sm icon--text" :data-icon="resultIcon" aria-hidden="true" x-show="resultIcon"></span>
        <span x-text="resultText"></span>
      </div>
      <div class="module-calculator__info">
        <span data-ref="angle-mode" x-text="model.angleMode"></span>
        <span class="module-calculator__mem" data-ref="mem-ind" x-text="model.memory !== 0 ? 'M' : ''"></span>
      </div>
    </div>

    <!-- SCIENTIFIC -->
    <div data-panel="sci" :class="model.mode !== 'sci' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__grid module-calculator__grid--5col">
        <button class="module-calculator__key module-calculator__key--fn" data-fn="sin(" @click="inputFn('sin(')">sin</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="cos(" @click="inputFn('cos(')">cos</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="tan(" @click="inputFn('tan(')">tan</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="log(" @click="inputFn('log(')">log</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="ln(" @click="inputFn('ln(')">ln</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="asin(" @click="inputFn('asin(')">sin⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="acos(" @click="inputFn('acos(')">cos⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="atan(" @click="inputFn('atan(')">tan⁻¹</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="sqrt(" @click="inputFn('sqrt(')">√</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="cbrt(" @click="inputFn('cbrt(')">∛</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="exp(" @click="inputFn('exp(')">eˣ</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="π" @click="inputText('π')">π</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="e" @click="inputText('e')">e</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="^" @click="inputText('^')">xʸ</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn="fact(" @click="inputFn('fact(')">n!</button>

        <button class="module-calculator__key module-calculator__key--fn" data-fn="(" @click="inputText('(')">(</button>
        <button class="module-calculator__key module-calculator__key--fn" data-fn=")" @click="inputText(')')">)</button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="toggle-angle" data-help-key="modules.calculator.actions.setAngleMode.help" @click="toggleAngle()" x-text="t('degRad')"></button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="mem-store" data-help-key="modules.calculator.actions.memStore.help" @click="memStore()" x-text="t('keyMs')"></button>
        <button class="module-calculator__key module-calculator__key--fn" data-action="mem-recall" data-help-key="modules.calculator.actions.memRecall.help" @click="memRecall()" x-text="t('keyMr')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="÷" @click="inputText('÷')">/</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear" data-help-key="modules.calculator.actions.clear.help" @click="clear()" x-text="t('keyAc')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="×" @click="inputText('×')">×</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" data-help-key="modules.calculator.actions.backspace.help" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="-" @click="inputText('-')">−</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="calculate" data-help-key="modules.calculator.actions.calculate.help" @click="calculate()">=</button>

        <button class="module-calculator__key module-calculator__key--num module-calculator__key--wide" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--op" data-text="+" @click="inputText('+')">+</button>
      </div>
    </div>

    <!-- STATISTICS -->
    <div data-panel="stats" :class="model.mode !== 'stats' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__data-panel">
        <label class="module-calculator__data-label" data-help-key="modules.calculator.fields.dataset.help" x-text="t('datasetLabel')"></label>
        <div class="module-calculator__data-display" data-ref="data-display">
          <template x-if="model.dataset.length === 0">
            <span class="module-calculator__val--empty" x-text="t('noData')"></span>
          </template>
          <template x-for="(v, i) in model.dataset">
            <span class="module-calculator__val" :key="i" x-text="v"></span>
          </template>
        </div>
        <div class="module-calculator__data-count" data-ref="data-count" x-text="'n = ' + model.dataset.length"></div>
      </div>
      <div class="module-calculator__grid module-calculator__grid--4col">
        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" data-help-key="modules.calculator.actions.backspace.help" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="add-data" data-help-key="modules.calculator.actions.addData.help" @click="addData()" x-text="t('addValue')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear-data" data-help-key="modules.calculator.actions.clearData.help" @click="clearData()" x-text="t('clearData')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="-" @click="inputText('-')">-</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="remove-last" data-help-key="modules.calculator.actions.removeLast.help" @click="removeLast()" x-text="t('removeLast')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="mean" data-help-key="modules.calculator.types.StatKey.mean" @click="calcStat('mean')" x-text="'x̄ ' + t('statMean')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="median" data-help-key="modules.calculator.types.StatKey.median" @click="calcStat('median')" x-text="'x̃ ' + t('statMedian')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="mode" data-help-key="modules.calculator.types.StatKey.mode" @click="calcStat('mode')" x-text="t('statMode')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="range" data-help-key="modules.calculator.types.StatKey.range" @click="calcStat('range')" x-text="t('statRange')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="stdS" data-help-key="modules.calculator.types.StatKey.stdS" @click="calcStat('stdS')" x-text="'s (' + t('statSample') + ')'"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="stdP" data-help-key="modules.calculator.types.StatKey.stdP" @click="calcStat('stdP')" x-text="'σ (' + t('statPopulation') + ')'"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="varS" data-help-key="modules.calculator.types.StatKey.varS" @click="calcStat('varS')" x-text="'s² ' + t('statVariance')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="varP" data-help-key="modules.calculator.types.StatKey.varP" @click="calcStat('varP')" x-text="'σ² ' + t('statVariance')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="sum" data-help-key="modules.calculator.types.StatKey.sum" @click="calcStat('sum')" x-text="'Σ ' + t('statSum')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="min" data-help-key="modules.calculator.types.StatKey.min" @click="calcStat('min')" x-text="t('keyMin')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="max" data-help-key="modules.calculator.types.StatKey.max" @click="calcStat('max')" x-text="t('keyMax')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="count" data-help-key="modules.calculator.types.StatKey.count" @click="calcStat('count')" x-text="'n ' + t('statCount')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-stat="q1" data-help-key="modules.calculator.types.StatKey.q1" @click="calcStat('q1')" x-text="t('keyQ1')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="q3" data-help-key="modules.calculator.types.StatKey.q3" @click="calcStat('q3')" x-text="t('keyQ3')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="iqr" data-help-key="modules.calculator.types.StatKey.iqr" @click="calcStat('iqr')" x-text="t('keyIqr')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-stat="skew" data-help-key="modules.calculator.types.StatKey.skew" @click="calcStat('skew')" x-text="t('statSkewness')"></button>
      </div>
    </div>

    <!-- SIX SIGMA -->
    <div data-panel="sixsigma" :class="model.mode !== 'sixsigma' ? 'module-calculator__panel--hidden' : ''">
      <div class="module-calculator__data-panel">
        <label class="module-calculator__data-label" data-help-key="modules.calculator.fields.ssDataset.help" x-text="t('processDataLabel')"></label>
        <div class="module-calculator__data-display" data-ref="ss-data-display">
          <template x-if="model.ssDataset.length === 0">
            <span class="module-calculator__val--empty" x-text="t('noData')"></span>
          </template>
          <template x-for="(v, i) in model.ssDataset">
            <span class="module-calculator__val" :key="i" x-text="v"></span>
          </template>
        </div>
        <div class="module-calculator__data-count" data-ref="ss-data-count" x-text="'n = ' + model.ssDataset.length"></div>
      </div>
      <div class="module-calculator__cpk-inputs">
        <input type="number" class="field field--num" data-ref="lsl" x-model="model.lsl" :placeholder="t('lslPlaceholder')" :aria-label="t('lslPlaceholder')">
        <input type="number" class="field field--num" data-ref="usl" x-model="model.usl" :placeholder="t('uslPlaceholder')" :aria-label="t('uslPlaceholder')">
      </div>
      <div class="module-calculator__grid module-calculator__grid--4col">
        <button class="module-calculator__key module-calculator__key--num" data-text="7" @click="inputText('7')">7</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="8" @click="inputText('8')">8</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="9" @click="inputText('9')">9</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="backspace" data-help-key="modules.calculator.actions.backspace.help" @click="backspace()">⌫</button>

        <button class="module-calculator__key module-calculator__key--num" data-text="4" @click="inputText('4')">4</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="5" @click="inputText('5')">5</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="6" @click="inputText('6')">6</button>
        <button class="module-calculator__key module-calculator__key--act" data-action="add-ss-data" data-help-key="modules.calculator.actions.addSSData.help" @click="addSSData()" x-text="t('addValue')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="1" @click="inputText('1')">1</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="2" @click="inputText('2')">2</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="3" @click="inputText('3')">3</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="clear-ss-data" data-help-key="modules.calculator.actions.clearSSData.help" @click="clearSSData()" x-text="t('clearData')"></button>

        <button class="module-calculator__key module-calculator__key--num" data-text="0" @click="inputText('0')">0</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="." @click="inputText('.')">.</button>
        <button class="module-calculator__key module-calculator__key--num" data-text="-" @click="inputText('-')">-</button>
        <button class="module-calculator__key module-calculator__key--danger" data-action="remove-last-ss" data-help-key="modules.calculator.actions.removeLastSS.help" @click="removeLastSS()" x-text="t('removeLast')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="cp" data-help-key="modules.calculator.types.CapabilityKey.cp" @click="calcSS('cp')" x-text="t('keyCp')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="cpk" data-help-key="modules.calculator.types.CapabilityKey.cpk" @click="calcSS('cpk')" x-text="t('keyCpk')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="pp" data-help-key="modules.calculator.types.CapabilityKey.pp" @click="calcSS('pp')" x-text="t('keyPp')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="ppk" data-help-key="modules.calculator.types.CapabilityKey.ppk" @click="calcSS('ppk')" x-text="t('keyPpk')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="sigma" data-help-key="modules.calculator.types.CapabilityKey.sigma" @click="calcSS('sigma')" x-text="t('keySigma')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="dpmo" data-help-key="modules.calculator.types.CapabilityKey.dpmo" @click="calcSS('dpmo')" x-text="t('keyDpmo')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="yield" data-help-key="modules.calculator.types.CapabilityKey.yield" @click="calcSS('yield')" x-text="t('keyYield')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="zscore" data-help-key="modules.calculator.types.CapabilityKey.zscore" @click="calcSS('zscore')" x-text="t('keyZscore')"></button>

        <button class="module-calculator__key module-calculator__key--stat" data-ss="mean" data-help-key="modules.calculator.types.CapabilityKey.mean" @click="calcSS('mean')" x-text="'x̄ ' + t('statMean')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="std" data-help-key="modules.calculator.types.CapabilityKey.std" @click="calcSS('std')" x-text="'σ ' + t('statStdDev')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="ucl" data-help-key="modules.calculator.types.CapabilityKey.ucl" @click="calcSS('ucl')" x-text="t('keyUcl')"></button>
        <button class="module-calculator__key module-calculator__key--stat" data-ss="lcl" data-help-key="modules.calculator.types.CapabilityKey.lcl" @click="calcSS('lcl')" x-text="t('keyLcl')"></button>
      </div>
    </div>

  </div>
</div>
