<div class="module-process-capability dmike-split dmike-split--input-lg" x-data="processCapability"
     :aria-busy="analysisPending">
  <div class="module-process-capability__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionParams')"></div>

    <div class="field-group">
      <label x-text="t('featureName')"></label>
      <input type="text" class="field" data-ref="inp-name"
             :placeholder="t('featureNamePh')"
             :value="model.params.name" @input="setParam('name', $event.target.value)">
    </div>

    <div class="pc__row-3">
      <div class="field-group">
        <label x-text="t('lsl')"></label>
        <input type="text" class="field field--num" data-ref="inp-lsl"
               placeholder="49.800" inputmode="decimal"
               :value="model.params.lsl" @input="setParam('lsl', $event.target.value)" @change="runAnalysis()">
      </div>
      <div class="field-group">
        <label x-text="t('target')"></label>
        <input type="text" class="field field--num" data-ref="inp-target"
               placeholder="50.000" inputmode="decimal"
               :value="model.params.target" @input="setParam('target', $event.target.value)" @change="runAnalysis()">
      </div>
      <div class="field-group">
        <label x-text="t('usl')"></label>
        <input type="text" class="field field--num" data-ref="inp-usl"
               placeholder="50.200" inputmode="decimal"
               :value="model.params.usl" @input="setParam('usl', $event.target.value)" @change="runAnalysis()">
      </div>
    </div>

    <div class="pc__hint" x-text="t('specHint')"></div>

    <div class="pc__row-3">
      <div class="field-group">
        <label x-text="t('unit')"></label>
        <input type="text" class="field" data-ref="inp-unit"
               placeholder="mm"
               :value="model.params.unit" @input="setParam('unit', $event.target.value)">
      </div>
      <div class="field-group">
        <label><span x-text="t('confidenceLabel')"></span> (%)</label>
        <input type="text" class="field field--num" data-ref="inp-confidence"
               placeholder="95" inputmode="decimal"
               :value="model.params.confidence" @input="setParam('confidence', $event.target.value)" @change="runAnalysis()">
      </div>
    </div>

    <div class="field-group">
      <label x-text="t('subgroupModeLabel')"></label>
      <div class="pc__mode">
        <template x-for="mode in subgroupModeOptions()" :key="mode.value">
          <label class="pc__mode-option">
            <input type="radio" name="pc-subgroup-mode"
                   :value="mode.value" :data-ref="'inp-subgroup-mode-' + mode.value"
                   :checked="model.params.subgroupMode === mode.value"
                   :disabled="mode.value === 'column' && !!model.embeddedValues"
                   @change="setParam('subgroupMode', mode.value)">
            <span x-text="mode.label"></span>
          </label>
        </template>
      </div>
    </div>

    <div class="field-group" x-show="showSubgroupSize()">
      <label x-text="t('subgroupSizeLabel')"></label>
      <input type="text" class="field field--num" data-ref="inp-subgroup-size"
             placeholder="1" inputmode="numeric"
             :value="model.params.subgroupSize" @change="onWholeNumberInput('subgroupSize', $event)">
      <div class="pc__hint" x-text="model.embeddedValues ? t('subgroupEmbeddedHint') : t('subgroupHint')"></div>
    </div>

    <div class="field-group" x-show="showSubgroupColumn()">
      <label x-text="t('subgroupColumnLabel')"></label>
      <div class="pc__col-select-wrap" data-ref="subgroup-col-wrap"></div>
      <div class="pc__hint" x-text="t('subgroupColumnHint')"></div>
    </div>

    <div class="pc__row-3">
      <div class="field-group pc__span-2">
        <label x-text="t('withinMethodLabel')"></label>
        <select class="field" data-ref="inp-within-method" @change="setParam('withinMethod', $event.target.value)">
          <template x-for="key in methodKeys">
            <option :key="key" :value="key" :selected="key === activeMethod" x-text="methodName(key)"></option>
          </template>
        </select>
      </div>
      <div class="field-group" x-show="showMrSpan()">
        <label x-text="t('mrSpanLabel')"></label>
        <input type="text" class="field field--num" data-ref="inp-mr-span"
               placeholder="2" inputmode="numeric"
               :value="model.params.mrSpan" @change="onWholeNumberInput('mrSpan', $event)">
      </div>
    </div>

    <label class="pc__check" x-show="showUnbiased()">
      <input type="checkbox" data-ref="inp-unbiased"
             :checked="model.params.unbiased" @change="setParam('unbiased', $event.target.checked)">
      <span x-text="t('unbiasedLabel')"></span>
    </label>

    <div class="pc__hint pc__hint--warn" data-ref="within-hint" x-show="withinHint" x-text="withinHint"></div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <div class="field-group">
      <label x-text="t('columnSelectLabel')"></label>

      <!-- Embedded example data: a "remove" pill instead of the column picker. -->
      <template x-if="model.embeddedValues">
        <div class="pc__embedded">
          <span class="pc__embedded-label" x-text="(model.embeddedLabel || t('exampleData')) + ' (n=' + model.embeddedValues.length + ')'"></span>
          <button class="btn btn--sm btn--ghost" data-ref="btn-clear-embedded" type="button"
                  :title="removeTitle()" @click="clearEmbedded()"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
        </div>
      </template>

      <!-- No worksheet at all: actionable orange warning info-box. -->
      <template x-if="!model.embeddedValues && _colState === 'noWorksheet'">
        <div class="pc__no-worksheet">
          <span class="icon icon--sm" data-icon="status.info" aria-hidden="true"></span>
          <span x-text="t('noWorksheet')"></span>
        </div>
      </template>

      <!-- Worksheet exists but has no numeric columns: muted info-box. -->
      <template x-if="!model.embeddedValues && _colState === 'noNumericColumns'">
        <div class="pc__no-worksheet pc__no-worksheet--empty">
          <span class="icon icon--sm" data-icon="status.info" aria-hidden="true"></span>
          <span x-text="t('noNumericColumns')"></span>
        </div>
      </template>

      <!-- Worksheet column picker (shared ColumnPicker, select-mode). -->
      <div class="pc__col-select-wrap" data-ref="col-select-wrap"
           x-show="!model.embeddedValues && _colState === 'ok'"></div>
    </div>

    <div class="pc__error" data-ref="error-box"></div>
  </div>

  <div class="module-process-capability__output dmike-split__output">
    <div data-ref="results">
      <template x-if="result">
        <div>
          <!-- Status bar -->
          <div class="pc__status-bar" :class="'pc__status-bar--' + result.overall">
            <span class="pc__status-label" x-text="statusLabel(result.overall)"></span>
            <span class="pc__status-detail">— <span x-text="featureName()"></span> — n = <span x-text="result.n"></span></span>
          </div>

          <!-- KPI strip — main indices -->
          <div class="dmike-kpi-strip" data-ref="kpi-main">
            <template x-for="kpi in mainKpis()">
              <div class="dmike-kpi" :key="kpi.key" :data-kpi="kpi.key" :class="kpi.mod">
                <div class="dmike-kpi-label" x-text="kpi.label"></div>
                <div class="dmike-kpi-value" x-text="kpi.value"></div>
                <div class="dmike-kpi-sub" x-text="kpi.sub"></div>
              </div>
            </template>
          </div>

          <!-- Long-term (Pp/Ppk) + PPM + Sigma strip -->
          <div class="dmike-kpi-strip" data-ref="kpi-perf">
            <template x-for="kpi in perfKpis()">
              <div class="dmike-kpi" :key="kpi.key" :data-kpi="kpi.key">
                <div class="dmike-kpi-label" x-text="kpi.label"></div>
                <div class="dmike-kpi-value" x-text="kpi.value"></div>
                <div class="dmike-kpi-sub" x-text="kpi.sub"></div>
              </div>
            </template>
          </div>

          <!-- Stats panel -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
          <div class="pc__stats-panel">
            <table class="dmike-table pc__stats-table">
              <thead><tr>
                <template x-for="col in statCols()"><th :key="col.label" x-text="col.label"></th></template>
              </tr></thead>
              <tbody><tr>
                <template x-for="col in statCols()"><td :key="col.label" x-text="col.value"></td></template>
              </tr></tbody>
            </table>
          </div>

          <!-- Nonconforming parts (PPM), Minitab-style -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('ppmTitle')"></span></div>
          <div class="pc__stats-panel">
            <table class="dmike-table pc__ppm-table">
              <thead><tr>
                <th x-text="t('ppmColKind')"></th><th>&lt; LSL</th><th>&gt; USL</th><th x-text="t('ppmColTotal')"></th>
              </tr></thead>
              <tbody>
                <template x-for="row in ppmRows()">
                  <tr :key="row.key" :data-row="row.key">
                    <td x-text="row.label"></td><td x-text="row.below"></td><td x-text="row.above"></td><td x-text="row.total"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Chart -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('histTitle')"></span></div>
          <div class="pc__chart-plot" data-ref="chart-hist"></div>

          <!-- Interpretation -->
          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('formulasTitle')"></span></div>
          <div class="pc__interpretation">
            <p><strong x-text="t('sigmaWithinSym')"></strong> (<span x-text="methodName(result.withinMethod)"></span>) = <strong x-text="fmt(result.sigmaWithin)"></strong>, ν = <span x-text="fmtDf(result.withinDf)"></span></p>
            <template x-if="result.twoSided">
              <div>
                <p><strong>Cp</strong> = (USL − LSL) / (6 · <span x-text="t('sigmaWithinSym')"></span>) = <span x-text="fmt(result.T)"></span> / (6 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.Cp)"></strong></p>
                <p><strong>Cpk</strong> = min(CPU, CPL) = min(<span x-text="fmt(result.CPU)"></span>, <span x-text="fmt(result.CPL)"></span>) = <strong x-text="fmt(result.Cpk)"></strong></p>
                <p><strong>Pp</strong> = (USL − LSL) / (6 · s) = <span x-text="fmt(result.T)"></span> / (6 · <span x-text="fmt(result.s)"></span>) = <strong x-text="fmt(result.Pp)"></strong></p>
              </div>
            </template>
            <template x-if="!result.twoSided && result.hasUsl">
              <p><strong>CPU</strong> = (USL − x̄) / (3 · <span x-text="t('sigmaWithinSym')"></span>) = (<span x-text="fmt(result.usl)"></span> − <span x-text="fmt(result.xbar)"></span>) / (3 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.CPU)"></strong></p>
            </template>
            <template x-if="!result.twoSided && !result.hasUsl">
              <p><strong>CPL</strong> = (x̄ − LSL) / (3 · <span x-text="t('sigmaWithinSym')"></span>) = (<span x-text="fmt(result.xbar)"></span> − <span x-text="fmt(result.lsl)"></span>) / (3 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.CPL)"></strong></p>
            </template>

            <p><strong x-text="zBenchLine()"></strong></p>
            <p x-text="t('zBenchNote')"></p>
            <div style="height:12px"></div>
            <p><span class="pc__tag pc__tag--pass">Cpk ≥ 1.33</span> <span x-text="t('interpPass')"></span></p>
            <p><span class="pc__tag pc__tag--warn">1.00 ≤ Cpk &lt; 1.33</span> <span x-text="t('interpWarn')"></span></p>
            <p><span class="pc__tag pc__tag--fail">Cpk &lt; 1.00</span> <span x-text="t('interpFail')"></span></p>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
