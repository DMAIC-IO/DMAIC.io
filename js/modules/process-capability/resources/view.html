<div class="module-process-capability dmike-split dmike-split--input-lg" x-data="processCapability">
  <!-- data-help-key="" an Wirten von x-field/x-set ist gewollt: der Satz steht an der Beschriftung darüber. -->
  <div class="module-process-capability__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionParams')"></div>

    <div class="field-group">
      <label data-help-key="modules.process-capability.types.Params.name" x-text="t('featureName')"></label>
      <input type="text" class="field" data-ref="inp-name"
             :placeholder="t('featureNamePh')" x-model="model.params.name">
    </div>

    <div class="field-grid field-grid--3">
      <div class="field-group">
        <label data-help-key="modules.process-capability.types.Params.lsl" x-text="t('lsl')"></label>
        <input class="field field--num" data-ref="inp-lsl" data-help-key="" placeholder="49.800" inputmode="decimal"
               x-field="model.params.lsl">
      </div>
      <div class="field-group">
        <label data-help-key="modules.process-capability.types.Params.target" x-text="t('target')"></label>
        <input class="field field--num" data-ref="inp-target" data-help-key="" placeholder="50.000" inputmode="decimal"
               x-field="model.params.target">
      </div>
      <div class="field-group">
        <label data-help-key="modules.process-capability.types.Params.usl" x-text="t('usl')"></label>
        <input class="field field--num" data-ref="inp-usl" data-help-key="" placeholder="50.200" inputmode="decimal"
               x-field="model.params.usl">
      </div>
    </div>

    <div class="field-hint" x-text="t('specHint')"></div>

    <div class="field-grid field-grid--3">
      <div class="field-group">
        <label data-help-key="modules.process-capability.types.Params.unit" x-text="t('unit')"></label>
        <input type="text" class="field" data-ref="inp-unit" placeholder="mm" x-model="model.params.unit">
      </div>
      <div class="field-group">
        <label data-help-key="modules.process-capability.types.Params.confidence"><span x-text="t('confidenceLabel')"></span> (%)</label>
        <input class="field field--num" data-ref="inp-confidence" data-help-key="" placeholder="95" inputmode="decimal"
               x-field="model.params.confidence">
      </div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.process-capability.types.Params.subgroupMode" x-text="t('subgroupModeLabel')"></label>
      <div class="field-radios field-radios--inline" role="radiogroup" data-help-key=""
           :aria-label="t('subgroupModeLabel')" x-set="model.params.subgroupMode">
        <template x-for="mode in subgroupModeOptions" :key="mode.value">
          <label>
            <input type="radio" :value="mode.value" :data-ref="mode.ref" :disabled="mode.disabled">
            <span x-text="mode.label"></span>
          </label>
        </template>
      </div>
    </div>

    <div class="field-group" x-show="showSubgroupSize">
      <label data-help-key="modules.process-capability.types.Params.subgroupSize" x-text="t('subgroupSizeLabel')"></label>
      <input class="field field--num" data-ref="inp-subgroup-size" data-help-key="" placeholder="1" inputmode="numeric"
             x-field="model.params.subgroupSize">
      <div class="field-hint" x-text="subgroupSizeHint"></div>
    </div>

    <template x-if="showSubgroupColumn">
      <div class="field-group">
        <label data-help-key="modules.process-capability.fields.subgroupColumnRef.help" x-text="t('subgroupColumnLabel')"></label>
        <div data-ref="subgroup-picker-wrap" data-help-key="" x-field="model.subgroupColumnRef"
             x-widget-exclude="excludeForSubgroup" x-widget-same-sheet-as="model.columnRef"></div>
        <div class="field-hint" x-text="t('subgroupColumnHint')"></div>
      </div>
    </template>

    <div class="field-grid field-grid--3">
      <div class="field-group field-group--span-2">
        <label data-help-key="modules.process-capability.types.Params.withinMethod" x-text="t('withinMethodLabel')"></label>
        <select class="field" data-ref="inp-within-method" @change="withinMethodChanged($event)">
          <template x-for="o in methodOptions" :key="o.value">
            <option :value="o.value" :selected="o.selected" x-text="o.label"></option>
          </template>
        </select>
      </div>
      <div class="field-group" x-show="showMrSpan">
        <label data-help-key="modules.process-capability.types.Params.mrSpan" x-text="t('mrSpanLabel')"></label>
        <input class="field field--num" data-ref="inp-mr-span" data-help-key="" placeholder="2" inputmode="numeric"
               x-field="model.params.mrSpan">
      </div>
    </div>

    <label class="field-check" data-help-key="modules.process-capability.types.Params.unbiased" data-help-anchor="box" x-show="showUnbiased">
      <input type="checkbox" data-ref="inp-unbiased" x-model="model.params.unbiased">
      <span x-text="t('unbiasedLabel')"></span>
    </label>

    <div class="field-hint field-hint--warn" data-ref="within-hint" x-show="withinHint" x-text="withinHint"></div>

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>

    <div class="field-group">
      <label data-help-key="modules.process-capability.fields.columnRef.help" x-text="t('columnSelectLabel')"></label>

      <template x-if="model.embeddedValues">
        <div class="pc__embedded">
          <span class="pc__embedded-label" x-text="embeddedText"></span>
          <button class="btn btn--sm btn--ghost" data-ref="btn-clear-embedded" type="button"
                  data-help-key="modules.process-capability.actions.clearEmbedded.help"
                  :title="removeTitle" x-command="clearEmbedded"><span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span></button>
        </div>
      </template>

      <template x-if="showNoWorksheet">
        <div class="pc__no-worksheet">
          <span class="icon icon--sm" data-icon="status.info" aria-hidden="true"></span>
          <span x-text="t('noWorksheet')"></span>
        </div>
      </template>

      <template x-if="showNoNumericColumns">
        <div class="pc__no-worksheet pc__no-worksheet--empty">
          <span class="icon icon--sm" data-icon="status.info" aria-hidden="true"></span>
          <span x-text="t('noNumericColumns')"></span>
        </div>
      </template>

      <template x-if="!model.embeddedValues">
        <div data-ref="col-select-wrap" data-help-key="" x-show="hasNumericColumns" x-field="model.columnRef"></div>
      </template>
    </div>
  </div>

  <div class="module-process-capability__output dmike-split__output">
    <div data-ref="results">
      <template x-if="result">
        <div>
          <div class="pc__status-bar" data-help-key="modules.process-capability.types.Result.overall" :class="statusBarClass">
            <span class="pc__status-label" x-text="statusLabel"></span>
            <span class="pc__status-detail">— <span x-text="featureName"></span> — n = <span x-text="result.n"></span></span>
          </div>

          <div class="dmike-kpi-strip" data-ref="kpi-main">
            <template x-for="kpi in mainKpis" :key="kpi.key">
              <div class="dmike-kpi" :data-kpi="kpi.key" :class="kpi.mod">
                <div class="dmike-kpi-label" :data-help-key="kpi.help" x-text="kpi.label"></div>
                <div class="dmike-kpi-value" x-text="kpi.value"></div>
                <div class="dmike-kpi-sub" x-text="kpi.sub"></div>
              </div>
            </template>
          </div>

          <div class="dmike-kpi-strip" data-ref="kpi-perf">
            <template x-for="kpi in perfKpis" :key="kpi.key">
              <div class="dmike-kpi" :data-kpi="kpi.key">
                <div class="dmike-kpi-label" :data-help-key="kpi.help" x-text="kpi.label"></div>
                <div class="dmike-kpi-value" x-text="kpi.value"></div>
                <div class="dmike-kpi-sub" x-text="kpi.sub"></div>
              </div>
            </template>
          </div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
          <div class="pc__stats-panel">
            <table class="dmike-table pc__stats-table">
              <thead><tr>
                <template x-for="(col, i) in statCols" :key="col.label + ':' + i"><th><span :data-help-key="col.help" x-text="col.label"></span></th></template>
              </tr></thead>
              <tbody><tr>
                <template x-for="(col, i) in statCols" :key="col.label + ':' + i"><td x-text="col.value"></td></template>
              </tr></tbody>
            </table>
          </div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('ppmTitle')"></span></div>
          <div class="pc__stats-panel">
            <table class="dmike-table pc__ppm-table">
              <thead><tr>
                <th x-text="t('ppmColKind')"></th><th><span data-help-key="modules.process-capability.types.Result.ppmBelowLsl">&lt; LSL</span></th><th><span data-help-key="modules.process-capability.types.Result.ppmAboveUsl">&gt; USL</span></th><th><span data-help-key="modules.process-capability.types.Result.ppmTotal" x-text="t('ppmColTotal')"></span></th>
              </tr></thead>
              <tbody>
                <template x-for="row in ppmRows" :key="row.key">
                  <tr :data-row="row.key">
                    <td x-text="row.label"></td><td x-text="row.below"></td><td x-text="row.above"></td><td x-text="row.total"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('histTitle')"></span></div>
          <div class="pc__chart-plot" data-ref="chart-hist" x-widget="histogram-chart" x-widget-config="chart"
               x-widget-value="model.histogramChart" x-widget-legacy-edit-key="legacyEditKey"></div>

          <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('formulasTitle')"></span></div>
          <div class="pc__interpretation">
            <p><strong x-text="t('sigmaWithinSym')"></strong> (<span x-text="methodName(result.withinMethod)"></span>) = <strong x-text="fmt(result.sigmaWithin)"></strong>, ν = <span x-text="fmtDf(result.withinDf)"></span></p>
            <template x-if="result.twoSided">
              <div>
                <p><strong>Cp</strong> = (USL − LSL) / (6 · <span x-text="t('sigmaWithinSym')"></span>) = <span x-text="fmt(result.T)"></span> / (6 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.Cp)"></strong></p>
                <p><strong>Cpk</strong> = min(CPU, CPL) = min(<span x-text="fmt(result.CPU)"></span>, <span x-text="fmt(result.CPL)"></span>) = <strong x-text="fmt(result.Cpk)"></strong></p>
                <p><strong>Pp</strong> = (USL − LSL) / (6 · s) = <span x-text="fmt(result.T)"></span> / (6 · <span x-text="fmt(result.s)"></span>) = <strong x-text="fmt(result.Pp)"></strong></p>
              </div>
            </template>
            <template x-if="!result.twoSided && result.hasUsl">
              <p><strong>CPU</strong> = (USL − x̄) / (3 · <span x-text="t('sigmaWithinSym')"></span>) = (<span x-text="fmt(result.usl)"></span> − <span x-text="fmt(result.xbar)"></span>) / (3 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.CPU)"></strong></p>
            </template>
            <template x-if="!result.twoSided && !result.hasUsl">
              <p><strong>CPL</strong> = (x̄ − LSL) / (3 · <span x-text="t('sigmaWithinSym')"></span>) = (<span x-text="fmt(result.xbar)"></span> − <span x-text="fmt(result.lsl)"></span>) / (3 · <span x-text="fmt(result.sigmaWithin)"></span>) = <strong x-text="fmt(result.CPL)"></strong></p>
            </template>

            <p><strong x-text="zBenchLine"></strong></p>
            <p x-text="t('zBenchNote')"></p>
            <div class="pc__spacer"></div>
            <p><span class="pc__tag pc__tag--pass" x-text="interpGoodText"></span> <span x-text="t('interpPass')"></span></p>
            <p><span class="pc__tag pc__tag--warn" x-text="interpOkText"></span> <span x-text="t('interpWarn')"></span></p>
            <p><span class="pc__tag pc__tag--fail" x-text="interpPoorText"></span> <span x-text="t('interpFail')"></span></p>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
