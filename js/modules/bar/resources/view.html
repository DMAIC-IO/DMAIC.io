<div class="bar-module dmike-split dmike-split--input-sm" x-data="bar">
  <!-- data-help-key="" am Auswahl-Host ist gewollt: die Hilfe hängt an den Slots des Pickers (fields.datasets.*). -->
  <div class="bar-module__input dmike-split__input">
    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div class="bar-module__picker" data-ref="picker-wrap" data-help-key="" x-field="model.datasets"></div>

    <div class="bar-module__options" data-ref="options-wrap" x-show="showOptions">
      <template x-if="showAggregation">
        <label class="bar-module__opt-row">
          <span data-help-key="modules.bar.fields.aggregation.help" x-text="t('aggregation')"></span>
          <select class="field" data-action="set-agg" data-help-key="" x-field="model.aggregation">
            <template x-for="o in aggregationOptions" :key="o.value">
              <option :value="o.value" :selected="o.selected" x-text="o.label"></option>
            </template>
          </select>
        </label>
      </template>

      <template x-if="showStacked">
        <label class="field-check" data-help-anchor="box" data-help-key="modules.bar.fields.stacked.help">
          <input type="checkbox" data-action="set-stacked" x-model="model.stacked">
          <span x-text="t('stacked')"></span>
        </label>
      </template>
    </div>
  </div>

  <div class="bar-module__output dmike-split__output">
    <div data-ref="placeholder" class="bar-module__placeholder" x-show="!hasData" x-text="t('placeholderPickX')"></div>
    <template x-if="hasData">
      <div class="bar-module__chart-area" data-ref="chart-area">
        <div class="bar-module__chart-wrap" data-ref="chart-wrap" x-widget="bar-chart" x-widget-config="barChart" x-widget-value="model.chart" x-widget-legacy-edit-key="legacyEditKey"></div>
        <div class="bar-module__stats-panel" data-ref="stats-panel">
          <div>
            <div class="dmike-split__output-section"><span class="icon icon--sm" data-icon="nav.expand-down" aria-hidden="true"></span><span x-text="t('statsTitle')"></span></div>
            <table class="dmike-table bar-module__stats-table">
              <thead><tr>
                <th><span data-help-key="modules.bar.types.BarStats.categories" x-text="t('statCategory')"></span></th>
                <template x-if="showGroupCol">
                  <th><span data-help-key="modules.bar.types.BarGroup.name" x-text="t('statGroup')"></span></th>
                </template>
                <th><span class="context-help-anchor--overlay" data-help-key="modules.bar.types.BarGroup.values" x-text="statsValueHeader"></span></th>
              </tr></thead>
              <tbody>
                <template x-for="(r, i) in statsRows" :key="i">
                  <tr>
                    <td><span class="bar-module__stats-color" :style="swatchStyle(r)"></span><span x-text="rowLabel(r)"></span></td>
                    <template x-if="showGroupCol">
                      <td x-text="r.group"></td>
                    </template>
                    <td x-text="r.value"></td>
                  </tr>
                </template>
                <template x-if="showTotal">
                  <tr class="bar-module__stats-total">
                    <td><span data-help-key="modules.bar.types.BarStats.total" x-text="t('statTotal')"></span></td>
                    <template x-if="showGroupCol">
                      <td></td>
                    </template>
                    <td x-text="statsTotal"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
