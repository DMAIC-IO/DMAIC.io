<div class="run-chart dmike-split dmike-split--input-sm" x-data="runChart">
  <!-- data-help-key="" an Picker-Wirt und α-Feld ist gewollt: die Beschriftungen tragen die Anker fields.columnRef und fields.alpha. -->
  <div class="run-chart__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionData')"></div>
    <div class="field-group">
      <label data-help-key="modules.run-chart.fields.columnRef.help" x-text="t('dataColumn')"></label>
      <div data-ref="col-picker-wrap" data-help-key="" x-field="model.columnRef"></div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionSettings')"></div>
    <div class="field-group">
      <label data-help-key="modules.run-chart.fields.alpha.help" x-text="t('alpha')"></label>
      <input class="field field--num" data-ref="alpha" data-help-key="" x-field="model.alpha">
      <span class="field-hint" x-text="t('alphaHint')"></span>
    </div>

  </div>

  <div class="run-chart__output dmike-split__output">
    <div data-ref="stats-bar">
      <template x-if="hasResult">
        <div class="dmike-kpi-strip">
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="kpi.medianText"></div>
            <div class="dmike-kpi-label" data-help-key="modules.run-chart.types.Result.median" x-text="t('statMedian')"></div>
            <div class="dmike-kpi-sub" x-text="kpi.nText"></div>
          </div>
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="kpi.runsAbout"></div>
            <div class="dmike-kpi-label" data-help-key="modules.run-chart.types.Result.runsAboutMedian" x-text="t('statRunsAbout')"></div>
            <div class="dmike-kpi-sub" x-text="kpi.runsUpDownText"></div>
          </div>
          <div class="dmike-kpi" :class="kpi.flaggedClass">
            <div class="dmike-kpi-value" x-text="kpi.flagged"></div>
            <div class="dmike-kpi-label" data-help-key="modules.run-chart.types.Result.flagged" x-text="t('statFlagged')"></div>
            <div class="dmike-kpi-sub" x-text="kpi.alphaText"></div>
          </div>
        </div>
      </template>
    </div>

    <div data-ref="chart-wrap">
      <template x-if="hasResult">
        <div class="run-chart__chart-section">
          <div class="run-chart__chart-header">
            <span class="run-chart__chart-title" x-text="chartTitle"></span>
          </div>
          <div class="run-chart__plot-wrap" data-ref="plot" x-widget="run-chart" x-widget-config="plot" x-widget-value="model.chart" x-widget-legacy-edit-key="legacyEditKey"></div>
        </div>
      </template>
    </div>

    <div data-ref="tests-wrap">
      <template x-if="hasResult">
        <div class="run-chart__tests-panel">
          <div class="run-chart__tests-header" x-text="t('testsTitle')"></div>
          <div class="run-chart__tests-grid">
            <template x-for="row in testRows" :key="row.id">
              <div class="run-chart__test-row">
                <div class="run-chart__test-name">
                  <strong x-text="row.name"></strong>
                  <span class="run-chart__test-desc" x-text="row.desc"></span>
                </div>
                <div class="run-chart__test-pvalue" x-text="row.pText"></div>
                <div class="run-chart__test-status" :class="row.statusClass">
                  <template x-if="row.flagged">
                    <span class="icon icon--sm icon--text" data-icon="status.warning" aria-hidden="true"></span>
                  </template>
                  <span x-text="row.statusText"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
