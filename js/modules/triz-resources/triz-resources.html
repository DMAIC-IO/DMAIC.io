<section class="module-container triz-res" x-data="trizResources">
  <div class="module-container__body triz-res__body">
    <section class="triz-res__topbar">
      <label class="triz-res__label" x-text="t('systemLabel')"></label>
      <input class="field triz-res__system-input" type="text" data-role="system"
        x-model="model.system"
        :placeholder="t('systemPlaceholder')">
    </section>

    <section class="triz-res__grid" :aria-label="t('gridAriaLabel')">
      <div class="triz-res__corner">
        <span x-text="t('cornerTipRows')"></span>
        <span class="icon icon--sm" data-icon="nav.arrow-down" aria-hidden="true"></span>
        <span> / </span>
        <span x-text="t('cornerTipCols')"></span>
        <span class="icon icon--sm" data-icon="nav.arrow-right" aria-hidden="true"></span>
      </div>
      <div class="triz-res__col-head" x-text="t('level.sub')"></div>
      <div class="triz-res__col-head" x-text="t('level.sys')"></div>
      <div class="triz-res__col-head" x-text="t('level.super')"></div>

      <template x-for="(catVal, catKey) in model.cells">
        <div class="triz-res__row">
          <div class="triz-res__row-head">
            <span class="icon icon--sm" :data-icon="catIcon(catKey)" aria-hidden="true"></span>
            <span class="triz-res__row-title" x-text="catName(catKey)"></span>
          </div>

          <template x-for="(cell, lvlKey) in catVal">
            <div class="triz-res__cell"
              :data-cat="catKey" :data-lvl="lvlKey">
              <button class="triz-res__status" type="button" data-role="status"
                :data-cat="catKey" :data-lvl="lvlKey"
                :aria-label="cell.status"
                :class="statusSuffix(cell.status)"
                @click="cycleStatus(catKey, lvlKey)">
                <span class="icon icon--sm" :data-icon="fillIcon(cell.status)" aria-hidden="true"></span>
              </button>
              <textarea class="field triz-res__notes" rows="3" data-role="notes"
                :data-cat="catKey" :data-lvl="lvlKey"
                :placeholder="catPrompt(catKey)"
                x-model="cell.notes"></textarea>
            </div>
          </template>
        </div>
      </template>
    </section>

    <p class="triz-res__legend">
      <span class="icon icon--sm" data-icon="fill.0" aria-hidden="true"></span>
      <span x-text="t('legendUnknown')"></span>
      <span> · </span>
      <span class="icon icon--sm" data-icon="fill.25" aria-hidden="true"></span>
      <span x-text="t('legendUnused')"></span>
      <span> · </span>
      <span class="icon icon--sm" data-icon="fill.50" aria-hidden="true"></span>
      <span x-text="t('legendPartial')"></span>
      <span> · </span>
      <span class="icon icon--sm" data-icon="fill.100" aria-hidden="true"></span>
      <span x-text="t('legendFull')"></span>
      <span> — </span>
      <span x-text="t('legendHint')"></span>
    </p>
  </div>
</section>
