<section class="worksheet worksheet-module" x-data="worksheet">

  <!-- ═══ Toolbar ═══ -->
  <div class="worksheet-toolbar">
    <button class="toolbar__btn" data-action="undo" :title="t('undo')" :disabled="!canUndo" @click="undo()">
      <span class="icon icon--sm" data-icon="action.undo" aria-hidden="true"></span>
    </button>
    <button class="toolbar__btn" data-action="redo" :title="t('redo')" :disabled="!canRedo" @click="redo()">
      <span class="icon icon--sm" data-icon="action.redo" aria-hidden="true"></span>
    </button>
    <div class="toolbar__sep"></div>
    <button class="toolbar__btn" data-action="add-col" :title="t('addColumn')" @click="addColumn()">
      <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span>
      <span x-text="t('column')"></span>
    </button>
    <button class="toolbar__btn" data-action="add-rows" :title="t('addRows')" @click="addRows()">
      <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span>
      <span x-text="t('rows')"></span>
    </button>
    <div class="toolbar__sep"></div>
    <button class="toolbar__btn toolbar__btn--accent" data-action="import" :title="t('importFile')" @click="triggerImport()">
      <span class="icon icon--sm" data-icon="action.upload" aria-hidden="true"></span>
      Import
    </button>
    <div class="toolbar__dropdown" data-action="export-dropdown">
      <button class="toolbar__btn" :title="t('export')" @click="toggleExport($event)">
        <span class="icon icon--sm" data-icon="action.download" aria-hidden="true"></span>
        <span x-text="t('export')"></span>
        <span class="icon icon--sm toolbar__chevron" data-icon="nav.expand-down" aria-hidden="true"></span>
      </button>
      <div class="toolbar__dropdown-menu" :class="exportOpen ? 'open' : ''">
        <button class="toolbar__dropdown-item" data-action="export-xlsx" @click="exportAs('xlsx')">Excel (.xlsx)</button>
        <button class="toolbar__dropdown-item" data-action="export-csv" @click="exportAs('csv')">CSV (.csv)</button>
        <button class="toolbar__dropdown-item" data-action="export-json" @click="exportAs('json')">JSON (.json)</button>
      </div>
    </div>
    <div class="toolbar__sep"></div>
    <button class="toolbar__btn" data-action="delete" :title="t('deleteSelection')" @click="deleteSelection()">
      <span class="icon icon--sm" data-icon="action.delete" aria-hidden="true"></span>
    </button>
    <div class="toolbar__sep"></div>
    <button class="toolbar__btn toolbar__btn--accent" data-action="formula-editor" :title="formulaBtnTitle()" @click="openFormulaEditor()">
      <span class="icon icon--sm" data-icon="module.model-data-generator" aria-hidden="true"></span>
      <span x-text="t('formula')"></span>
    </button>
    <div class="toolbar__sep"></div>
    <button class="toolbar__btn" data-action="suggest-chart" :title="suggestBtnTitle()" :disabled="!canSuggest" @click="suggestChart()">
      <span class="icon icon--sm" data-icon="module.chart-suggestion" aria-hidden="true"></span>
      <span x-text="t('suggestChart')"></span>
    </button>
    <div class="toolbar__spacer"></div>
  </div>

  <!-- ═══ DataGrid (imperative) — mounted into this anchor ═══ -->
  <div class="datagrid dmike-embedded-grid dmike-embedded-grid--fill" data-ref="grid-wrap">
    <div class="datagrid__dropzone" data-ref="dropzone">
      <div class="datagrid__dropzone-text" x-text="t('dropzoneText')"></div>
    </div>
  </div>

  <!-- ═══ Sheet tabs + status bar ═══ -->
  <div class="sheet-tabs" data-ref="sheet-tabs"
       @contextmenu="onTabContextMenu($event)"
       @dblclick="onTabDblClick($event)">
    <template x-for="sheet in model.sheets" :key="sheet.id">
      <button class="sheet-tab" :class="sheet.id === model.activeSheetId ? 'active' : ''"
              :data-sheet-id="sheet.id" @click="switchSheet(sheet.id)">
        <template x-if="renamingId === sheet.id">
          <input class="sheet-tab__editor" :value="renameValue"
                 @input="renameValue = $event.target.value"
                 @blur="commitRename()"
                 @keydown="onRenameKeydown($event)">
        </template>
        <template x-if="renamingId !== sheet.id">
          <span class="sheet-tab__name" x-text="sheet.name"></span>
        </template>
      </button>
    </template>
    <button class="sheet-tab-add" :title="t('addSheet')" @click="addSheet()">+</button>
    <span class="sheet-tabs__spacer"></span>
    <span class="sheet-tabs__status" data-ref="status-selection" x-text="statusSelection()"></span>
    <span class="sheet-tabs__status" data-ref="status-dims" x-text="statusDims()"></span>
  </div>

  <!-- ═══ Formula editor overlay shell (declarative x-show) ═══
       The body is built and wired imperatively by the FormulaEditor class
       (formula parsing/preview/cell-commit + drag stay imperative); it is
       injected into the [data-ref="fe-body"] anchor on init. -->
  <div class="dmike-chart-popout-overlay" data-ref="fe-overlay" role="dialog" aria-modal="true"
       x-show="feOpen" style="display:none">
    <div data-ref="fe-body"></div>
  </div>

  <!-- Hidden file input -->
  <input type="file" accept=".csv,.tsv,.xlsx,.xls" style="display:none" data-ref="file-input" @change="onFileChange($event)">

</section>
