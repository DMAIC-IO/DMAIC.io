<div class="gage-run-chart dmike-split" x-data="gageRunChart">
  <div class="gage-run-chart__input dmike-split__input">

    <div class="dmike-split__section-title" x-text="t('sectionColumns')"></div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.actions.setColumn.help" x-text="t('partColumn')"></label>
      <div data-ref="col-part-wrap"></div>
    </div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.actions.setColumn.help" x-text="t('operatorColumn')"></label>
      <div data-ref="col-operator-wrap"></div>
      <span class="field-hint" x-text="t('operatorHint')"></span>
    </div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.actions.setColumn.help" x-text="t('measurementColumn')"></label>
      <div data-ref="col-measurement-wrap"></div>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionSettings')"></div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.refValue" x-text="t('refValue')"></label>
      <input type="text" class="field field--num" data-ref="inp-ref-value"
        inputmode="decimal" :value="model.refValue" @change="refValueChanged($event)">
      <span class="field-hint" x-text="t('refValueHint')"></span>
    </div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.partsPerRow" x-text="t('partsPerRow')"></label>
      <input type="number" class="field field--num" data-ref="inp-parts-per-row"
        min="1" max="20" :value="model.partsPerRow" @change="partsPerRowChanged($event)">
    </div>

    <div class="field-checks">
      <label data-help-anchor="box" data-help-key="modules.gage-run-chart.types.Params.connectWithin" class="field-check">
        <input type="checkbox" data-ref="chk-connect"
          :checked="model.connectWithin" @change="setParam('connectWithin', $event.target.checked)">
        <span x-text="t('connectWithin')"></span>
      </label>
      <label data-help-anchor="box" data-help-key="modules.gage-run-chart.types.Params.showOperatorMean" class="field-check">
        <input type="checkbox" data-ref="chk-operator-mean"
          :checked="model.showOperatorMean" @change="setParam('showOperatorMean', $event.target.checked)">
        <span x-text="t('showOperatorMean')"></span>
      </label>
    </div>

    <div class="dmike-split__section-title" x-text="t('sectionGageInfo')"></div>

    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.gageInfo.name" x-text="t('gageInfo_name')"></label>
      <input type="text" class="field" data-ref="inp-gage-name" :value="model.gageInfo.name" @input="setParam('gageInfo.name', $event.target.value)">
    </div>
    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.gageInfo.date" x-text="t('gageInfo_date')"></label>
      <input type="text" class="field" data-ref="inp-gage-date" :value="model.gageInfo.date" @input="setParam('gageInfo.date', $event.target.value)">
    </div>
    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.gageInfo.reporter" x-text="t('gageInfo_reporter')"></label>
      <input type="text" class="field" data-ref="inp-gage-reporter" :value="model.gageInfo.reporter" @input="setParam('gageInfo.reporter', $event.target.value)">
    </div>
    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.gageInfo.tolerance" x-text="t('gageInfo_tolerance')"></label>
      <input type="text" class="field" data-ref="inp-gage-tolerance" :value="model.gageInfo.tolerance" @input="setParam('gageInfo.tolerance', $event.target.value)">
    </div>
    <div class="field-group">
      <label data-help-key="modules.gage-run-chart.types.Params.gageInfo.misc" x-text="t('gageInfo_misc')"></label>
      <input type="text" class="field" data-ref="inp-gage-misc" :value="model.gageInfo.misc" @input="setParam('gageInfo.misc', $event.target.value)">
    </div>

    <div class="field-error" data-ref="error-box" x-text="errorMsg"></div>
  </div>

  <div class="gage-run-chart__output dmike-split__output">
    <template x-if="result">
      <div class="gage-run-chart__result">

        <div class="gage-run-chart__gage-info" data-ref="gage-info"
          x-show="model.hasGageInfo()">
          <div class="gage-run-chart__gage-row" x-show="gageInfoValue('name')">
            <span class="gage-run-chart__gage-label" x-text="gageInfoLabel('name')"></span>
            <span class="gage-run-chart__gage-value" x-text="gageInfoValue('name')"></span>
          </div>
          <div class="gage-run-chart__gage-row" x-show="gageInfoValue('date')">
            <span class="gage-run-chart__gage-label" x-text="gageInfoLabel('date')"></span>
            <span class="gage-run-chart__gage-value" x-text="gageInfoValue('date')"></span>
          </div>
          <div class="gage-run-chart__gage-row" x-show="gageInfoValue('reporter')">
            <span class="gage-run-chart__gage-label" x-text="gageInfoLabel('reporter')"></span>
            <span class="gage-run-chart__gage-value" x-text="gageInfoValue('reporter')"></span>
          </div>
          <div class="gage-run-chart__gage-row" x-show="gageInfoValue('tolerance')">
            <span class="gage-run-chart__gage-label" x-text="gageInfoLabel('tolerance')"></span>
            <span class="gage-run-chart__gage-value" x-text="gageInfoValue('tolerance')"></span>
          </div>
          <div class="gage-run-chart__gage-row" x-show="gageInfoValue('misc')">
            <span class="gage-run-chart__gage-label" x-text="gageInfoLabel('misc')"></span>
            <span class="gage-run-chart__gage-value" x-text="gageInfoValue('misc')"></span>
          </div>
        </div>

        <div class="dmike-kpi-strip" data-ref="stats-bar">
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="result.n"></div>
            <div class="dmike-kpi-label" data-help-key="modules.gage-run-chart.types.Result.n" x-text="t('statMeasurements')"></div>
            <div class="dmike-kpi-sub" x-text="t('statParts', { count: result.partCount })"></div>
          </div>
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="result.operatorCount"></div>
            <div class="dmike-kpi-label" data-help-key="modules.gage-run-chart.types.Result.operatorCount" x-text="t('statOperators')"></div>
            <div class="dmike-kpi-sub" x-text="t('statRows', { count: result.rows.length })"></div>
          </div>
          <div class="dmike-kpi">
            <div class="dmike-kpi-value" x-text="fmt(result.refValue)"></div>
            <div class="dmike-kpi-label" data-help-key="modules.gage-run-chart.types.Result.refValue" x-text="refLabel()"></div>
            <div class="dmike-kpi-sub" x-text="refSubText()"></div>
          </div>
        </div>

        <div class="gage-run-chart__warnings" data-ref="warnings" x-show="hasWarnings()">
          <template x-for="code in result.warnings">
            <div class="gage-run-chart__warning" :key="code" x-text="warningText(code)"></div>
          </template>
        </div>

        <div class="gage-run-chart__chart-header">
          <span class="gage-run-chart__chart-title" x-text="chartTitle()"></span>
        </div>

        <div class="gage-run-chart__strips" data-ref="strips">
          <template x-for="row in result.rows">
            <div class="gage-run-chart__strip" :key="row.idx" :data-strip="row.idx"></div>
          </template>
        </div>

      </div>
    </template>
  </div>
</div>
