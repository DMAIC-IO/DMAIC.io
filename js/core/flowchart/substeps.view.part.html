<!--
  D.Mike — Flowchart: Unterschritte in der Zielform (substeps.view.part.html)

  Aufklappleiste und Liste der Unterschritte eines Schritts für Module mit
  deklarativem Model. Einbinden mit einer `@include`-Direktive auf diese Datei
  in einem eigenen HTML-Kommentar; der Template-Build setzt sie ein.

  NOTE: never write a literal comment-close marker inside this header — it
  would end the comment early and the rest would render as visible text.

  Erwartet im Scope:
    step, i          — Schritt und sein Index aus dem x-for der Kette
    model            — Model mit view.expanded und den Kommandos setExpanded,
                       addSubstep, removeSubstep
  Die folgenden Glieder liefert substepsView() aus
  core/flowchart/substeps-view.js; das Modul nimmt es als Teil in die Liste
  seines view-Blocks auf (view: [eigenerTeil, substepsView]):
    isExpanded(id)         — steht die id im Ansichtsfeld expanded? (x-if, x-show)
    substepsBarClass(step) — Klasse der Leiste: 'fc-substeps-bar--has', wenn der
                             Schritt Unterschritte hat, sonst ''
    expandArg(id)          — Argument expanded für setExpanded als Text:
                             'false', wenn aufgeklappt, sonst 'true'
    ariaExpanded(id)       — 'true' bzw. 'false' für aria-expanded
    substepsBarLabel(step) — "Detail-Schritte (2)", ohne Unterschritte ohne Zahl
    substepNum(i, j)       — Nummer des Unterschritts ("2.3")
    substepItemClass(step, j) — Zielmarke der Geste am Zielplatz (Linie
                             darüber oder darunter, liest state.substepPreview)
  Dazu t() mit den Schlüsseln des Moduls substepsLabel (für die Leiste),
  substepPlaceholder, addSubstep, substepGrip.

  Hilfe-Anker setzen die Direktiven aus der Modul-id der Komponente:
  x-command an der Leiste und am Anlegen-Knopf
  (modules.<id>.actions.setExpanded.help, ….addSubstep.help), x-field am
  Titel (modules.<id>.fields.steps.substeps.title.help).

  Geste: substepGesture aus core/flowchart/interaction/substeps.js mit dem
  Griff .fc-substep-grip; Gruppe = Schritt-id, Vorschau in state.substepPreview.
-->
<button type="button" class="fc-substeps-bar" :class="substepsBarClass(step)"
        x-command="setExpanded" :data-arg-id="step.id"
        :data-arg-expanded="expandArg(step.id)"
        :aria-expanded="ariaExpanded(step.id)">
  <span class="fc-substeps-bar-icon">
    <span class="icon icon--sm" x-show="isExpanded(step.id)" data-icon="nav.expand-down" aria-hidden="true"></span>
    <span class="icon icon--sm" x-show="!isExpanded(step.id)" data-icon="nav.expand-right" aria-hidden="true"></span>
  </span>
  <span class="fc-substeps-bar-label" x-text="substepsBarLabel(step)"></span>
</button>
<template x-if="isExpanded(step.id)">
  <div class="fc-substeps" :data-step-id="step.id">
    <div class="fc-substeps-list" :data-reorder-group="step.id" data-reorder-closed>
      <template x-for="(sub, j) in step.substeps" :key="sub.id">
        <div class="fc-substep-item" :class="substepItemClass(step, j)" :data-id="sub.id" :data-substep-id="sub.id" :data-reorder-index="j">
          <button type="button" class="dmike-table__grip fc-substep-grip" :aria-label="t('substepGrip')"></button>
          <span class="fc-substep-number" x-text="substepNum(i, j)"></span>
          <input class="fc-substep-title" type="text" x-field="sub.title" :placeholder="t('substepPlaceholder')">
          <button type="button" class="fc-substep-remove" x-command="removeSubstep"
                  :data-arg-step-id="step.id" :data-arg-substep-id="sub.id" :title="t('common.delete')" :aria-label="t('common.delete')">
            <span class="icon icon--sm" data-icon="action.close" aria-hidden="true"></span>
          </button>
        </div>
      </template>
    </div>
    <button type="button" class="fc-substep-add" x-command="addSubstep" :data-arg-step-id="step.id">
      <span class="icon icon--sm" data-icon="action.add" aria-hidden="true"></span>
      <span x-text="t('addSubstep')"></span>
    </button>
  </div>
</template>
