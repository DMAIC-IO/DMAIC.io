<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D.Mike — Test Runner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
           font-size: 14px; color: #1d1d1f; background: #f5f5f7; }
    header { background: #1d1d1f; color: #f5f5f7; padding: 12px 20px;
             display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; }
    #run-btn { margin-left: auto; padding: 6px 16px; border-radius: 6px;
               background: #0066cc; color: #fff; border: none; cursor: pointer; font-size: 13px; }
    #stats-bar { display: flex; gap: 20px; padding: 12px 20px; background: #fff;
                 border-bottom: 1px solid #d2d2d7; font-size: 13px; }
    .stat { font-weight: 600; }
    .stat--passed  { color: #34c759; }
    .stat--failed  { color: #ff3b30; }
    .stat--skipped { color: #ff9500; }
    .stat--todo    { color: #6e6e73; }
    main { padding: 20px; max-width: 900px; }
    .suite { background: #fff; border-radius: 8px; margin-bottom: 12px;
             border: 1px solid #d2d2d7; overflow: hidden; }
    .suite__header { padding: 10px 16px; font-weight: 600; cursor: pointer;
                     display: flex; align-items: center; gap: 8px; }
    .suite--passed .suite__header { border-left: 4px solid #34c759; }
    .suite--failed .suite__header { border-left: 4px solid #ff3b30; }
    .suite__badge { font-size: 11px; padding: 1px 6px; border-radius: 10px;
                    font-weight: 500; margin-left: auto; }
    .badge-pass { background: #d4f4dd; color: #34c759; }
    .badge-fail { background: #ffe5e5; color: #ff3b30; }
    .tests { display: none; border-top: 1px solid #e8e8ec; }
    .tests--open { display: block; }
    .test { display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 24px;
            font-size: 13px; border-bottom: 1px solid #f5f5f7; }
    .test:last-child { border-bottom: none; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-passed  { background: #34c759; }
    .dot-failed  { background: #ff3b30; }
    .dot-skipped { background: #ff9500; }
    .dot-todo    { background: #aeaeb2; }
    .test__error { font-size: 12px; color: #ff3b30; margin-left: 16px; font-family: monospace; }
    #progress { height: 4px; background: #e8e8ec; }
    #progress-bar { height: 100%; background: #0066cc; width: 0; transition: width 0.3s; }
  </style>
</head>
<body>

<header>
  <h1>D.Mike — Test Runner</h1>
  <button id="run-btn">Run All Tests</button>
</header>

<div id="progress"><div id="progress-bar"></div></div>

<div id="stats-bar">
  <span class="stat stat--passed">✓ <span id="count-passed">0</span> passed</span>
  <span class="stat stat--failed">✗ <span id="count-failed">0</span> failed</span>
  <span class="stat stat--skipped">⊘ <span id="count-skipped">0</span> skipped</span>
  <span class="stat stat--todo">○ <span id="count-todo">0</span> todo</span>
</div>

<main id="results"></main>

<!-- Bare specifiers used transitively by js/ source modules. Prod bundles them

     vendored ESM build, xlsx/katex from their node_modules ESM builds (present
     under ddev/CI). Without this, any suite importing such a module fails to load
     and is counted as a real failure by the loader below. -->

    "katex": "../node_modules/katex/dist/katex.mjs",
    "opentype.js": "../node_modules/opentype.js/dist/opentype.module.js"

}
</script>

  // UMD/browser-global deps that ship only inside the esbuild bundle (app.min.js)
  // and have no ESM build to map in the import-map above. Suites reaching them
  // can't run unbundled — tracked in ROADMAP for E2E migration. Only THESE are
  // allowed to fail to load silently; any other import error is a real
  // regression and must surface as a failure instead of vanishing from counts.
  const BUNDLER_ONLY = ['papaparse', 'tiny-inflate'];

  async function loadTests() {
    for (const file of testFiles) {
      try { await import(file); }
      catch (e) {
        console.error(`Could not load ${file}:`, e.message);
        const knownUnmappable = BUNDLER_ONLY.some(s => e.message.includes(`"${s}"`));
        if (!knownUnmappable) {
          suite(`load error: ${file}`, () => {
            test('module imports without error', () => { throw e; });
          });
        }
      }
    }
  }

  async function run() {
    document.getElementById('results').innerHTML = '';
    document.getElementById('progress-bar').style.width = '0';

    await loadTests();
    const results = await runAll();

    document.getElementById('count-passed').textContent  = results.passed;
    document.getElementById('count-failed').textContent  = results.failed;
    document.getElementById('count-skipped').textContent = results.skipped;
    document.getElementById('count-todo').textContent    = results.todo;

    const total = results.passed + results.failed + results.skipped + results.todo;
    document.getElementById('progress-bar').style.width =
      total ? `${((results.passed) / total) * 100}%` : '0';
    document.getElementById('progress-bar').style.background =
      results.failed ? '#ff3b30' : '#34c759';

    const container = document.getElementById('results');
    for (const suite of results.suites) {
      const hasFail = suite.failed > 0;
      const el = document.createElement('div');
      el.className = `suite ${hasFail ? 'suite--failed' : 'suite--passed'}`;

      const label = hasFail
        ? `<span class="suite__badge badge-fail">${suite.failed} failed</span>`
        : `<span class="suite__badge badge-pass">${suite.passed} passed</span>`;

      el.innerHTML = `
        <div class="suite__header">
          ${suite.name} ${label}
        </div>
        <div class="tests ${hasFail ? 'tests--open' : ''}">
          ${suite.tests.map(t => `
            <div class="test">
              <span class="status-dot dot-${t.status}"></span>
              <span>${t.name}</span>
              ${t.error ? `<span class="test__error">${t.error}</span>` : ''}
            </div>
          `).join('')}
        </div>
      `;

      el.querySelector('.suite__header').addEventListener('click', () => {
        el.querySelector('.tests').classList.toggle('tests--open');
      });

      container.append(el);
    }
  }

  document.getElementById('run-btn').addEventListener('click', run);
  run(); // Auto-run on load
</script>
