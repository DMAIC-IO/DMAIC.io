<body>

  <!-- ── Pre-JS loading overlay (removed by app.js on bootstrap) ── -->
  <div id="app-loading" role="status" aria-live="polite" data-i18n-aria-label="app.loading">
    <div class="app-loading__spinner"></div>
  </div>

  <!-- ── Viewport guard (desktop-only) ─────────────────────── -->
  <div id="viewport-guard" role="alert">
    <p data-i18n="app.desktopOnly">
      D.Mike ist für Desktop-Monitore konzipiert.
      Bitte verwenden Sie einen Bildschirm mit mindestens 1280 px Breite.
    </p>
  </div>

  <!-- ── Header ────────────────────────────────────────────── -->
  <header class="app-header" role="banner">
    <h1 class="app-header__logo">DMAIC.io</h1>

    <div class="app-header__project-switcher" id="project-switcher">
      <button class="app-header__project-btn" id="project-switcher-btn"
              data-i18n-title="app.projectSwitcher">
        <span id="project-name-display" class="app-header__project-name"></span>
        <svg class="app-header__project-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
      </button>
      <input
        id="project-name-input"
        class="app-header__project-input"
        type="text"
        maxlength="100"
        style="display:none"
        data-i18n-aria-label="app.projectName"
      >
      <div class="app-header__project-dropdown" id="project-dropdown" style="display:none"></div>
    </div>

    <!-- ── Inline DMAIC tiles ── -->
    <div id="dmaic-tiles" role="navigation" data-i18n-aria-label="app.phaseNav"></div>

    <div class="app-header__spacer"></div>

    <div class="app-header__actions">
      <!-- Dashboard -->
      <button
        id="dashboard-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Dashboard"
        data-i18n-title="app.dashboard"
        data-i18n-aria-label="app.dashboard"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></button>

      <!-- Fullscreen -->
      <button
        id="fullscreen-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Vollbild"
        data-i18n-title="app.fullscreen"
        data-i18n-aria-label="app.fullscreen"
      ><svg id="fullscreen-icon-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg><svg id="fullscreen-icon-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>

      <!-- Export -->
      <button
        id="export-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Exportieren"
        data-i18n-title="app.export"
        data-i18n-aria-label="app.export"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>

      <!-- Import -->
      <button
        id="import-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Importieren"
        data-i18n-title="app.import"
        data-i18n-aria-label="app.import"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <input id="import-file-input" type="file" accept=".json" style="display:none" aria-hidden="true">

      <!-- Algorithm Lab -->
      <button
        id="dev-area-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Algorithm Lab"
        data-i18n-title="devArea.title"
        data-i18n-aria-label="devArea.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>

      <!-- Module Help / Info -->
      <button
        id="module-help-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Modul-Hilfe"
        data-i18n-title="moduleHelp.title"
        data-i18n-aria-label="moduleHelp.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>

      <!-- Training -->
      <button
        id="training-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Schulungen"
        data-i18n-title="training.title"
        data-i18n-aria-label="training.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></button>

      <!-- Settings -->
      <button
        id="settings-btn"
        class="btn btn--icon btn--ghost"
        aria-label="Einstellungen"
        data-i18n-title="settings.title"
        data-i18n-aria-label="settings.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>

    <!-- Settings Panel (mounted by pages/settings) -->
    <div id="settings-overlay" class="dmike-chart-popout-overlay" style="display:none"></div>
    <!-- /Settings Panel -->

    <!-- Licenses Panel (mounted by pages/licenses) -->
    <div id="licenses-overlay" class="dmike-chart-popout-overlay" style="display:none"></div>
    <!-- /Licenses Panel -->

  </header>

  <!-- ── Dev Area (full-size, hidden by default) ──────────── -->
  <div id="dev-area" class="dev-area" style="display:none"></div>

  <!-- ── Dashboard Area (full-size, hidden by default) ────── -->
  <div id="dashboard-area" class="dashboard-area" style="display:none"></div>

  <!-- ── Training Area (full-size, hidden by default) ─────── -->
  <div id="training-area" class="training-area" style="display:none"></div>

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <aside id="app-sidebar" aria-label="Modul-Katalog"></aside>

  <!-- ── Workspace + Help Panel ────────────────────────────── -->
  <main id="app-workspace" aria-label="Arbeitsbereich">
    <!-- Rendered by workspace.js — help panel injected as sibling inside main -->
    <div id="help-panel"></div>
  </main>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer class="app-footer" role="contentinfo">
    <span id="footer-last-saved"></span>
    <span id="footer-tip" class="app-footer__tip" hidden>
      <svg class="app-footer__tip-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>
      </svg>
      <span class="app-footer__tip-text"></span>
      <button type="button" class="app-footer__tip-dismiss" data-i18n-title="tips.dismissTitle" aria-label="Nicht mehr zeigen">&times;</button>
    </span>
    <div class="app-footer__spacer"></div>
    <span id="footer-storage"></span>
    <button
      id="footer-licenses"
      type="button"
      class="app-footer__licenses"
      data-i18n="footer.licenses"
      data-i18n-title="footer.licenses"
    ></button>
    <a
      id="footer-version"
      class="app-footer__version"
      href="/versions.html"
      target="_blank"
      rel="noopener"
      aria-label="Alle Versionen anzeigen"
      data-i18n-title="footer.versionsLink"
      data-i18n-aria-label="footer.versionsLink"
    ></a>
  </footer>

  <!-- ── Dialog host (borrow "home" for createDialog form dialogs) ── -->
  <div id="app-dialogs" style="display:none"></div>

  <!-- ── Toast container ───────────────────────────────────── -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- TEMPLATES:END -->

  <!-- SCRIPTS:START -->
  <!-- ── Application bootstrap ─────────────────────────────── -->
  <script type="module" src="js/app.js"></script>
