<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>DMAIC.io</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="js/core/datagrid/datagrid.css">
  <link rel="stylesheet" href="js/core/tips/tip-engine.css">
  <link rel="stylesheet" href="js/modules/worksheet/worksheet.css">
  <link rel="stylesheet" href="js/modules/sipoc/sipoc.css">
  <link rel="stylesheet" href="js/modules/process-map/process-map.css">
  <link rel="stylesheet" href="js/modules/project-charter/project-charter.css">
  <link rel="stylesheet" href="js/modules/stakeholder-analysis/stakeholder-analysis.css">
  <link rel="stylesheet" href="js/modules/voc-ctx-tree/voc-ctx-tree.css">
  <link rel="stylesheet" href="js/modules/five-why/five-why.css">
  <link rel="stylesheet" href="js/modules/raci-matrix/raci-matrix.css">
  <link rel="stylesheet" href="js/modules/ce-matrix/ce-matrix.css">
  <link rel="stylesheet" href="js/modules/ishikawa/ishikawa.css">
  <link rel="stylesheet" href="js/ui/dataset-picker.css">
  <link rel="stylesheet" href="js/core/stats-panel.css">
  <link rel="stylesheet" href="js/core/chart/chart.css">
  <link rel="stylesheet" href="js/modules/xy-plot/xy-plot.css">
  <link rel="stylesheet" href="js/modules/histogram/histogram.css">
  <link rel="stylesheet" href="js/modules/fmea/fmea.css">
  <link rel="stylesheet" href="js/modules/doe-planner/doe-planner.css">
  <link rel="stylesheet" href="js/modules/doe-advisor/doe-advisor.css">
  <link rel="stylesheet" href="js/modules/distribution-fit/distribution-fit.css">
  <link rel="stylesheet" href="js/modules/hypothesis-test/hypothesis-test.css">
  <link rel="stylesheet" href="js/modules/sample-size/sample-size.css">
  <link rel="stylesheet" href="js/modules/pairwise-comparison/pairwise-comparison.css">
  <link rel="stylesheet" href="js/modules/contour-plot/contour-plot.css">
  <link rel="stylesheet" href="js/modules/rest-api/rest-api.css">
  <link rel="stylesheet" href="js/modules/lessons-learned/lessons-learned.css">
  <link rel="stylesheet" href="js/modules/triz-contradiction-matrix/triz-contradiction-matrix.css">
  <link rel="stylesheet" href="js/modules/triz-9-windows/triz-9-windows.css">
  <link rel="stylesheet" href="js/algorithm-lab/lab.css">
</head>
<body>

  <!-- ── Viewport guard (desktop-only) ─────────────────────── -->
  <div id="viewport-guard" role="alert">
    <p data-i18n="app.desktopOnly">
      D.Mike ist für Desktop-Monitore konzipiert.
      Bitte verwenden Sie einen Bildschirm mit mindestens 1280 px Breite.
    </p>
  </div>

  <!-- ── Header ────────────────────────────────────────────── -->
  <header class="app-header" role="banner">
    <span class="app-header__logo">DMAIC.io</span>

    <div class="app-header__project-switcher" id="project-switcher">
      <button class="app-header__project-btn" id="project-switcher-btn"
              data-i18n-title="app.projectSwitcher"
              data-i18n-aria-label="app.projectSwitcher">
        <span id="project-name-display" class="app-header__project-name"></span>
        <svg class="app-header__project-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
      </button>
      <input
        id="project-name-input"
        class="app-header__project-input"
        type="text"
        maxlength="100"
        style="display:none"
        data-i18n-aria-label="app.projectName"
      >
      <div class="app-header__project-dropdown" id="project-dropdown" style="display:none"></div>
    </div>

    <!-- ── Inline DMAIC tiles ── -->
    <div id="dmaic-tiles" role="navigation" data-i18n-aria-label="app.phaseNav"></div>

    <div class="app-header__spacer"></div>

    <div class="app-header__actions">
      <!-- Dashboard -->
      <button
        id="dashboard-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="app.dashboard"
        data-i18n-aria-label="app.dashboard"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></button>

      <!-- Fullscreen -->
      <button
        id="fullscreen-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="app.fullscreen"
        data-i18n-aria-label="app.fullscreen"
      ><svg id="fullscreen-icon-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg><svg id="fullscreen-icon-exit" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>

      <!-- Export -->
      <button
        id="export-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="app.export"
        data-i18n-aria-label="app.export"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>

      <!-- Import -->
      <button
        id="import-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="app.import"
        data-i18n-aria-label="app.import"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <input id="import-file-input" type="file" accept=".json" style="display:none" aria-hidden="true">

      <!-- Algorithm Lab -->
      <button
        id="dev-area-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="devArea.title"
        data-i18n-aria-label="devArea.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>

      <!-- Module Help / Info -->
      <button
        id="module-help-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="moduleHelp.title"
        data-i18n-aria-label="moduleHelp.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>

      <!-- Training -->
      <button
        id="training-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="training.title"
        data-i18n-aria-label="training.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></button>

      <!-- Settings -->
      <button
        id="settings-btn"
        class="btn btn--icon btn--ghost"
        data-i18n-title="settings.title"
        data-i18n-aria-label="settings.title"
      ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>

    <!-- Settings Panel (overlay) -->
    <div id="settings-overlay" class="settings-overlay" style="display:none"></div>
    <div id="settings-panel" class="settings-panel" style="display:none">
      <div class="settings-panel__header">
        <h3 class="settings-panel__title" data-i18n="settings.title">Einstellungen</h3>
        <button id="settings-close" class="btn btn--icon btn--ghost settings-panel__close" aria-label="Schließen">&times;</button>
      </div>
      <div class="settings-panel__tabs" role="tablist">
        <button class="settings-tab settings-tab--active" data-tab="appearance" role="tab" data-i18n="settings.tabAppearance">Ansicht</button>
        <button class="settings-tab" data-tab="charts" role="tab" data-i18n="settings.tabCharts">Diagramme</button>
        <button class="settings-tab" data-tab="statistics" role="tab" data-i18n="settings.tabStatistics">Statistik</button>
      </div>
      <div class="settings-panel__body">
        <!-- Tab: Appearance -->
        <div class="settings-tab-content settings-tab-content--active" data-tab-content="appearance">
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.language">Sprache</label>
            <div class="lang-toggle" role="group" aria-label="Sprache / Language">
              <button class="lang-toggle__option" data-lang="de" aria-label="Deutsch">DE</button>
              <button class="lang-toggle__option" data-lang="en" aria-label="English">EN</button>
            </div>
          </div>
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.theme">Erscheinungsbild</label>
            <div class="settings-theme-toggle">
              <button id="theme-toggle-light" class="settings-theme-btn" data-theme="light">
                <span class="settings-theme-icon">☀</span>
                <span data-i18n="settings.themeLight">Hell</span>
              </button>
              <button id="theme-toggle-dark" class="settings-theme-btn" data-theme="dark">
                <span class="settings-theme-icon">🌙</span>
                <span data-i18n="settings.themeDark">Dunkel</span>
              </button>
            </div>
          </div>
          <div class="settings-section">
            <label class="settings-section__label">
              <input type="checkbox" id="settings-show-algo-links" checked>
              <span data-i18n="settings.showAlgoLabLinks">Code-Symbole anzeigen</span>
            </label>
          </div>
          <div class="settings-section">
            <label class="settings-section__label">
              <input type="checkbox" id="settings-tips-enabled" checked>
              <span data-i18n="settings.tipsEnabled">Tipps anzeigen</span>
            </label>
            <button class="btn btn--sm btn--ghost" id="settings-tips-reset" data-i18n="settings.tipsResetDismissed">Abgehakte Tipps zurücksetzen</button>
          </div>
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.exportReminderTitle">Export-Erinnerung</label>
            <label class="settings-checkbox-row">
              <input type="checkbox" id="settings-export-reminder-enabled" checked>
              <span data-i18n="settings.exportReminderEnabled">Erinnerung aktivieren</span>
            </label>
            <div class="settings-stat-row">
              <div class="settings-stat-field">
                <label class="settings-stat-field__label" for="settings-export-reminder-minutes" data-i18n="settings.exportReminderMinutesLabel">Nach Netto-Arbeitszeit</label>
                <div class="settings-stat-input-group">
                  <input type="number" id="settings-export-reminder-minutes" class="field settings-stat-input" min="1" max="1440" step="1" value="60">
                  <span class="settings-stat-unit" data-i18n="settings.minutesUnit">min</span>
                </div>
              </div>
            </div>
            <p class="settings-hint" data-i18n="settings.exportReminderHint">Nur sichtbare, fokussierte Zeit mit Datenänderungen wird gezählt. Jeder Export setzt den Zähler zurück.</p>
          </div>
        </div>
        <!-- Tab: Charts -->
        <div class="settings-tab-content" data-tab-content="charts">
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.chartFontSizes">Schriftgrößen</label>

            <!-- Title font size -->
            <div class="settings-font-row">
              <span class="settings-font-preview" data-preview="chartTitleSize" data-i18n="settings.chartPreviewTitle">Titel</span>
              <input type="range" class="dmike-slider settings-font-slider" data-font="chartTitleSize" min="8" max="28" step="1" value="15">
              <span class="settings-font-value" data-font-value="chartTitleSize">15</span>
            </div>

            <!-- Axis label font size -->
            <div class="settings-font-row">
              <span class="settings-font-preview" data-preview="chartLabelSize" data-i18n="settings.chartPreviewLabel">Achse</span>
              <input type="range" class="dmike-slider settings-font-slider" data-font="chartLabelSize" min="8" max="24" step="1" value="12">
              <span class="settings-font-value" data-font-value="chartLabelSize">12</span>
            </div>

            <!-- Tick font size -->
            <div class="settings-font-row">
              <span class="settings-font-preview" data-preview="chartTickSize" data-i18n="settings.chartPreviewTick">Skala</span>
              <input type="range" class="dmike-slider settings-font-slider" data-font="chartTickSize" min="7" max="20" step="1" value="11">
              <span class="settings-font-value" data-font-value="chartTickSize">11</span>
            </div>
          </div>

          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.chartBgColor">Hintergrundfarbe</label>
            <div class="settings-bg-color-row">
              <div class="settings-bg-color-swatch" id="settings-bg-color-swatch" title="Hintergrundfarbe wählen"></div>
              <button class="btn btn--sm btn--ghost" id="settings-bg-color-reset" data-i18n="settings.chartBgColorReset">Zurücksetzen</button>
            </div>
          </div>

          <div class="settings-section">
            <label class="settings-checkbox-row">
              <input type="checkbox" id="settings-show-legend" checked>
              <span data-i18n="settings.chartShowLegend">Legende einblenden</span>
            </label>
          </div>

          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.chartSeriesColors">Farben der Datengruppen</label>
            <div class="settings-color-grid" id="settings-color-grid"></div>
            <button class="btn btn--sm btn--ghost settings-color-reset" id="settings-color-reset" data-i18n="settings.chartColorsReset">Standardfarben</button>
          </div>
        </div>
        <!-- Tab: Statistics -->
        <div class="settings-tab-content" data-tab-content="statistics">
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.statConfidence">Konfidenzniveau</label>
            <div class="settings-stat-row">
              <div class="settings-stat-field">
                <label class="settings-stat-field__label" data-i18n="settings.statConfidenceLevel">Konfidenzniveau</label>
                <div class="settings-stat-input-group">
                  <input type="number" id="settings-confidence" class="field settings-stat-input" min="50" max="99.99">
                  <span class="settings-stat-unit">%</span>
                </div>
              </div>
              <span class="settings-stat-link">&harr;</span>
              <div class="settings-stat-field">
                <label class="settings-stat-field__label" data-i18n="settings.statAlpha">&alpha;-Risiko</label>
                <div class="settings-stat-input-group">
                  <input type="number" id="settings-alpha" class="field settings-stat-input" min="0.01" max="50">
                  <span class="settings-stat-unit">%</span>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-section">
            <label class="settings-section__label" data-i18n="settings.statPowerSection">Trennschärfe</label>
            <div class="settings-stat-row">
              <div class="settings-stat-field">
                <label class="settings-stat-field__label" data-i18n="settings.statPower">Power (1 &minus; &beta;)</label>
                <div class="settings-stat-input-group">
                  <input type="number" id="settings-power" class="field settings-stat-input" min="50" max="99.99">
                  <span class="settings-stat-unit">%</span>
                </div>
              </div>
              <span class="settings-stat-link">&harr;</span>
              <div class="settings-stat-field">
                <label class="settings-stat-field__label" data-i18n="settings.statBeta">&beta;-Risiko</label>
                <div class="settings-stat-input-group">
                  <input type="number" id="settings-beta" class="field settings-stat-input" min="0.01" max="50">
                  <span class="settings-stat-unit">%</span>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-section">
            <button class="btn btn--sm btn--ghost" id="settings-stat-reset" data-i18n="settings.statReset">Standardwerte</button>
          </div>
        </div>
      </div>
    </div>

  </header>

  <!-- ── Dev Area (full-size, hidden by default) ──────────── -->
  <div id="dev-area" class="dev-area" style="display:none"></div>

  <!-- ── Dashboard Area (full-size, hidden by default) ────── -->
  <div id="dashboard-area" class="dashboard-area" style="display:none"></div>

  <!-- ── Training Area (full-size, hidden by default) ─────── -->
  <div id="training-area" class="training-area" style="display:none"></div>

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <aside id="app-sidebar" aria-label="Modul-Katalog"></aside>

  <!-- ── Workspace + Help Panel ────────────────────────────── -->
  <main id="app-workspace" aria-label="Arbeitsbereich">
    <!-- Rendered by workspace.js — help panel injected as sibling inside main -->
    <div id="help-panel"></div>
  </main>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer class="app-footer" role="contentinfo">
    <span
      id="footer-project-name"
      class="app-footer__project-name"
      title="Zum Projektname springen"
    ></span>
    <span id="footer-last-saved"></span>
    <span id="footer-tip" class="app-footer__tip" hidden>
      <svg class="app-footer__tip-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>
      </svg>
      <span class="app-footer__tip-text"></span>
      <button type="button" class="app-footer__tip-dismiss" data-i18n-title="tips.dismissTitle" aria-label="Nicht mehr zeigen">&times;</button>
    </span>
    <div class="app-footer__spacer"></div>
    <span id="footer-storage"></span>
    <a
      id="footer-version"
      class="app-footer__version"
      href="/versions.html"
      target="_blank"
      rel="noopener"
      data-i18n-title="footer.versionsLink"
    ></a>
  </footer>

  <!-- ── Toast container ───────────────────────────────────── -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ── Application bootstrap ─────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
